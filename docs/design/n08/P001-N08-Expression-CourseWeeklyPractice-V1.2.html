function thisWeek(r,prev=state.weekPrev){let q=weekRange(prev);return r.created>=q.start&&r.created<=q.end}
function inPeriod(date,prev=state.weekPrev){const q=weekRange(prev);return date>=q.start&&date<=q.end}function queriedInPeriod(r,prev=state.weekPrev){return (r.queryEvents||Array.from({length:r.queries||0},()=>r.created)).some(d=>inPeriod(d,prev))}function queryCountInPeriod(r,prev=state.weekPrev){return (r.queryEvents||Array.from({length:r.queries||0},()=>r.created)).filter(d=>inPeriod(d,prev)).length}function weakReason(r){return [r.queries>=2?'反复查询 '+r.queries+' 次':r.queries?'查询 '+r.queries+' 次':null,r.fav?'主动收藏':null,r.status==='weak'?'练习薄弱':r.status==='mastered'?'已掌握':r.correctDays?.length?'独立答对 '+r.correctDays.length+'/2 天':null].filter(Boolean).join(' · ')}
function score(r){return r.queries*2+(r.fav?4:0)+(r.status==='weak'?6:r.status==='candidate'?2:-15)+(r.practice.some(x=>x.result==='不会')?4:0)}
function priorityRecords(){const q=weekRange(state.weekPrev);return db.records.filter(r=>r.en?.trim()&&r.cn?.trim()&&r.status!=='mastered'&&r.created<=q.end&&(thisWeek(r)||queriedInPeriod(r)||(r.created<q.start&&(r.status==='weak'||r.fav||(r.practice||[]).length>0)))).sort((a,b)=>score(b)-score(a)||b.created.localeCompare(a.created))}

function lookupChinese(s){const t=s.replace(/\s+/g,'').trim();if(t===exampleZh.replace(/\s+/g,'')||t==='我很喜欢傍晚在湖边散步，吹着微风，整个人都放松了。')return{cn:s,en:'I love taking a walk by the lake in the evening. The breeze feels nice, and it really helps me unwind.',alternatives:['I like walking by the lake in the evening. The gentle breeze makes me feel relaxed.','I love taking a walk by the lake in the evening. The breeze feels nice, and it really helps me unwind.'],pairs:[['在湖边散步','take a walk by the lake'],['微风','the breeze'],['放松下来','unwind']],scene:'你想告诉朋友，傍晚在湖边散步让你放松下来。'};if(t==='我想下次跟你一起去试试。')return{cn:s,en:'I’d love to give it a try with you sometime.',alternatives:['I want to try it with you next time.','I’d love to give it a try with you sometime.'],pairs:[['试试看','give it a try'],['下次某个时候','sometime']],scene:'朋友介绍了一项运动，你想说下次一起试试。'};return null}
function savePreview(){const v=state.pendingRecord;if(!v)return;v.cn=$('#previewCn').value.trim();v.en=$('#previewEn').value.trim();v.pairs=$('#previewPairs').value.split('\n').map(x=>x.split('|').map(z=>z.trim())).filter(x=>x.length===2&&x[0]&&x[1]);if(!v.cn)return toast('中文不能空');const match=db.records.find(r=>r.kind===v.kind&&(r.context|| (r.kind==='查询'?r.pairs?.[0]?.[1]:''))?.trim().toLowerCase()===v.context?.trim().toLowerCase()&&v.context?.trim());if(match){match.queries=(match.queries||0)+1;match.queryEvents=[...(match.queryEvents||Array.from({length:match.queries-1},()=>match.created)),offsetDay(0)];match.updated=offsetDay(0);if(v.en&&!match.en){match.en=v.en;match.pairs=v.pairs;match.cn=v.cn;}persist();closeSheet();render();return toast('相同内容再次查询，已累计次数；原表达未被覆盖')}db.records.unshift(v);persist();closeSheet();$('#main').scrollTop=0;render();toast(v.en?'已保存到表达记录与本周候选':'已保存待完善草稿；补齐英文后才能生成练习包')}
function saveBulk(){for(const v of state.previewBulk||[]){db.records.unshift({id:newId(),kind:'表达',cn:v.cn,en:v.en,pairs:v.pairs,queries:0,fav:false,status:'candidate',created:offsetDay(0),updated:offsetDay(0),scene:'请把这段话自然地说成英语：'+v.cn,places:[],context:'整篇粘贴',practice:[],correctDays:[],queryEvents:[],source:'已粘贴'})}persist();closeSheet();render();toast('多段内容已导入；可批量关联地点')}
function saveEdit(){let r=db.records.find(x=>x.id===state.editing);if(!r)return;r.cn=$('#editCn').value.trim();r.en=$('#editEn').value.trim();r.pairs=$('#editPairs').value.split('\n').map(x=>x.split('|').map(z=>z.trim())).filter(x=>x[0]&&x[1]);r.scene=$('#editScene').value.trim();r.updated=offsetDay(0);persist();closeSheet();render();toast('已保存修改')}
function toggleFavorite(id){let r=db.records.find(x=>x.id===id);if(!r)return;r.fav=!r.fav;r.updated=offsetDay(0);persist();if(!$('#sheet').hidden&&state.editing===id)recordSheet(id);else render(true);toast(r.fav?'已加入重点候选，周复习会优先考虑':'已取消收藏，查询历史仍保留')}
function statusChange(id,status){let r=db.records.find(x=>x.id===id);if(!r)return;r.status=status;r.updated=offsetDay(0);persist();recordSheet(id);toast(status==='mastered'?'标记已掌握，下周默认降低优先级':'学习状态已更新')}

function enSentences(text){return(text.match(/[^.!?]+(?:[.!?]+|$)/g)||[]).map(x=>x.trim()).filter(Boolean)}
function sentenceSheet(id){const r=db.records.find(x=>x.id===id);if(!r||!r.en)return;const list=enSentences(r.en);if(!list.length)return toast('没有可单独收藏的英文句子');state.sentenceParent=id;openSheet('收藏其中一句',`<p class="guide">从英文段落中选一句，补充这句对应的<strong>中文意思或情境</strong>。不能把原来整段中文冒充这句话的译文。</p><label class="fieldlabel">要练的英文句子</label><select id="sentenceEn" class="clearinput">${list.map((t,i)=>`<option value="${i}">${H(t)}</option>`).join('')}</select><label class="fieldlabel">对应中文（自己核实后填写）</label><textarea class="clearinput" id="sentenceCn" placeholder="例如：湖边的微风让我放松下来。" style="min-height:72px"></textarea><button class="btn primary full" style="margin-top:10px" data-do="saveSentence">收藏为独立练习句</button>`)}
function saveSentence(){const r=db.records.find(x=>x.id===state.sentenceParent);if(!r)return;const i=Number($('#sentenceEn')?.value),en=enSentences(r.en)[i],cn=$('#sentenceCn')?.value.trim();if(!en||!cn)return toast('请补充这一句准确的中文意思');if(db.records.some(x=>x.parentId===r.id&&x.en===en))return toast('这一句已收藏过，不重复添加');db.records.unshift({id:newId(),kind:'表达',cn,en,pairs:[],queries:0,fav:true,status:'weak',created:offsetDay(0),updated:offsetDay(0),scene:'请根据中文情境说一句自然英文：'+cn,places:[...r.places],context:'来自 '+r.id,practice:[],correctDays:[],queryEvents:[],source:'单句收藏',parentId:r.id});persist();closeSheet();render();toast('已把这一句加入重点巩固，原段落未修改')}
let synthesis=window.speechSynthesis;function speak(id){const r=db.records.find(x=>x.id===id);if(!r||!r.en){toast('暂无英文，请先补充');return}if(!synthesis||!('SpeechSynthesisUtterance'in window)){toast('该浏览器不支持语音演示');return}synthesis.cancel();const u=new SpeechSynthesisUtterance(r.en);u.lang='en-US';u.rate=.88;u.onerror=()=>toast('浏览器朗读不可用；正式 APP 使用现有豆包');synthesis.speak(u);toast('浏览器朗读示例；正式 APP 复用豆包')}
function updateWeek(){state.weekSelected=new Set();state.weekPickInitialized=false;render()}
function doGenerate(){const ids=[...state.weekSelected];if(!ids.length)return toast('先勾选至少一条');const wr=weekRange(state.weekPrev);const pid='PK-'+Date.now();state.packageActiveId=pid;state.packageIds=ids;state.packageText=buildPackage(ids,wr);db.packages.unshift({id:pid,title:wr.title+' 周练习',when:offsetDay(0),ids,markdown:state.packageText});db.packages=db.packages.slice(0,24);persist();state.page='package';render()}
async function copy(t){if(!t)return toast('没有可复制内容');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);toast('已复制，可以粘贴到 GPT 或豆包');return}}catch{}const a=document.createElement('textarea');a.value=t;a.style.cssText='position:absolute;left:-9999px;top:0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();if(ok)toast('已复制，可以粘贴给 GPT 或豆包');else{openSheet('手动复制练习包',`<textarea class="clearinput" style="min-height:240px" readonly id="manualCopy">${H(t)}</textarea><p class="guide">当前浏览器未授权剪贴板。长按上方文本选择并复制即可。</p>`);$('#manualCopy')?.focus();toast('请长按选中练习包内容复制')}}
function download(name,body,type='text/markdown'){const blob=new Blob([body],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('文件已生成')}
function receiptSheet(){if(!state.packageIds.length)return toast('请先生成或打开练习包，再回填对应成绩');const example=state.packageIds.slice(0,3).map((id,i)=>`${id} | ${i===0?'不会':i===1?'提示后答对':'独立答对'} | 独立答对 | ${i===2?'独立答对':'提示后答对'}`).join('\n');openSheet('回填语音考试结果',`<p class="guide">只接收<strong>当前练习包</strong>的题目 ID。每条依次填写模式一、二、三的结果，错题会延续到下次巩固。重复粘贴同一天的成绩不会重复累计。</p><textarea class="clearinput" id="receiptText" style="min-height:180px" placeholder="[训练复盘]\n${H(example)}\n[/训练复盘]"></textarea><div class="row between" style="margin-top:7px"><button class="link" data-do="receiptExample">填入格式示例</button><span class="xs">其余记录不会被改动</span></div><div class="sheetfoot"><button class="btn" data-do="closeSheet">取消</button><button class="btn primary" data-do="applyReceipt">回填本次成绩</button></div>`)}
function applyReceipt(){const s=$('#receiptText')?.value||'';if(!state.packageActiveId||!state.packageIds.length)return toast('请先打开原练习包');const allowed=new Set(state.packageIds),entries=[],seen=new Set(),unexpected=[],invalid=[];const valid=['独立答对','提示后答对','不会'];for(const raw of s.split(/\r?\n/)){const line=raw.trim();if(!line||/^\[\/?训练复盘\]$/.test(line)||line.startsWith('最后总结'))continue;if(!line.includes('EX-'))continue;const parts=line.split('|').map(x=>x.trim());const id=parts[0];if(!/^EX-\d+$/.test(id)||!allowed.has(id)){unexpected.push(id||line.slice(0,24));continue}if(seen.has(id)){invalid.push(id+' 出现多次');continue}seen.add(id);if(parts.length!==4){invalid.push(id+' 列数不正确');continue}const modes=parts.slice(1).map(x=>x==='答对'?'独立答对':x==='错了'||x==='不熟练'?'不会':x);if(!modes.every(x=>valid.includes(x))){invalid.push(id+' 包含无效成绩');continue}const r=db.records.find(x=>x.id===id);if(!r){unexpected.push(id);continue}const date=offsetDay(0);if((r.practice||[]).some(x=>x.packageId===state.packageActiveId&&x.date===date)){invalid.push(id+' 已在今天回填过');continue}const result=modes.includes('不会')?'不会':modes.includes('提示后答对')?'提示后答对':'独立答对';entries.push({r,date,result,modes})}if(unexpected.length||invalid.length){const msg=[unexpected.length?'不属于本练习包：'+unexpected.join('、'):'',invalid.join('；')].filter(Boolean).join('；');toast(msg.slice(0,110));return}if(!entries.length)return toast('没有识别到有效成绩，请按四列格式粘贴');for(const {r,date,result,modes} of entries){r.practice.push({date,result,modes,packageId:state.packageActiveId});if(result==='独立答对'){if(!r.correctDays.includes(date))r.correctDays.push(date);r.status=r.correctDays.length>=2?'mastered':'candidate'}else{r.status='weak';r.correctDays=[]}r.updated=date}db.lastReview={date:offsetDay(0),packageId:state.packageActiveId,n:entries.length,success:entries.filter(x=>x.result==='独立答对').length};persist();closeSheet();state.weekSelected=new Set();state.weekPickInitialized=false;render();toast(`已回填 ${entries.length} 条；任一模式没掌握的继续列入薄弱点`)}
function newPlaceView(id){let p=PLACES.find(x=>x.id===id);if(!p)return;const items=db.records.filter(r=>r.places.includes(id));openSheet(p.name,`<p class="guide">从「表达」关联到这里的记录直接引用同一条原始数据，修改后自动保持一致。</p><div class="stack" style="margin-top:10px">${items.length?items.map(r=>`<div class="card"><div class="item-cn">${H(r.cn)}</div><div class="item-en">${H(r.en)}</div><button class="link" data-do="openRecord" data-id="${r.id}">查看原记录</button></div>`).join(''):'<div class="empty">暂无关联表达，返回「表达」可以多选添加</div>'}</div>`)}
let recognizer=null;function stopMic(){if(recognizer){try{recognizer.stop()}catch{}recognizer=null}state.micOn=false}
function mic(){if(state.captureMode==='bulk'){toast('批量内容建议直接粘贴');return}if(state.micOn){stopMic();$('#capture .mic')?.classList.remove('recording');toast('录音输入已停止');return}const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){toast('当前浏览器不支持语音识别，可直接输入；正式 APP 使用腾讯 ASR');return}try{const r=new API();r.lang=state.captureMode==='term'?'en-US':'zh-CN';r.interimResults=false;r.continuous=false;r.onresult=e=>{let value=Array.from(e.results).map(x=>x[0].transcript).join('');let ta=$('#captureText');if(ta)ta.value=(ta.value.trim()+' '+value).trim();toast('语音已填入，请检查识别结果')};r.onerror=e=>toast('语音不可用：'+e.error);r.onend=()=>{state.micOn=false;$('#capture .mic')?.classList.remove('recording')};r.start();recognizer=r;state.micOn=true;$('#capture .mic')?.classList.add('recording');toast('浏览器语音输入演示，未连接正式 ASR')}catch{toast('无法启动浏览器语音输入')}}
function switchTab(t){stopMic();state.tab=t;state.page='home';state.selection=false;state.selected.clear();closeSheet();render()}
function back(){if(state.page==='package'){state.page='week'}else if(state.page==='allweeks'){state.page='week'}else state.page='home';render()}
function doAction(a,dataset={}){const id=dataset.id;if(a==='back')return back();if(a==='toggleTheme'){state.theme=state.theme==='light'?'dark':'light';$('#app').dataset.theme=state.theme;try{localStorage.setItem(THEME,state.theme)}catch{}render(true);return}if(a==='more')return openSheet('更多操作',`<div class="stack"><button class="btn full" data-do="toggleTheme">${I(state.theme==='light'?'moon':'sun')} 切换${state.theme==='light'?'深色':'浅色'}模式</button><button class="btn full" data-do="exportData">${I('download')} 导出演示数据 JSON</button><button class="btn full" data-do="history">${I('clock')} 历次练习包</button><button class="btn full" data-do="resetDemo">${I('repeat')} 恢复示例内容</button></div><p class="notice" style="margin-top:10px">本原型数据仅保存在当前浏览器；正式 APP 的数据库、腾讯 ASR、DeepSeek 和豆包尚未接入。</p>`);if(a==='closeSheet')return closeSheet();if(a==='newInput'){state.tab='expression';state.page='home';render();$('#captureText')?.focus();return}if(a==='focusSearch'){state.tab='expression';state.page='home';render();$('#query')?.focus();return}if(a==='courses'){state.tab='expression';state.page='courses';render();return}if(a==='openWeek'){state.tab='expression';state.page='week';state.weekPrev=false;state.weekSelected=new Set();state.weekPickInitialized=false;render();return}if(a==='thisWeek'){state.weekPrev=false;updateWeek();return}if(a==='lastWeek'){state.weekPrev=true;updateWeek();return}if(a==='history'){closeSheet();state.tab='expression';state.page='allweeks';render();return}if(a==='toggleBatch'){state.selection=!state.selection;state.selected=new Set();render(true);return}if(a==='selectAll'){let ids=[...$('#main').querySelectorAll('[data-record]')].map(x=>x.dataset.record);ids.forEach(x=>state.selected.add(x));render(true);return}if(a==='batchLink'){if(!state.selected.size)return;return linkSheet(state.selected)}if(a==='singleLink')return linkSheet([id]);if(a==='unlinkPlace'){const r=db.records.find(x=>x.id===id);if(!r)return;r.places=r.places.filter(x=>x!==dataset.place);persist();return recordSheet(id)}if(a==='saveLinks'){const places=[...$('#sheet').querySelectorAll('[data-placecheck]:checked')].map(x=>x.dataset.placecheck);for(let rid of linkIds){let r=db.records.find(x=>x.id===rid);if(r)r.places=[...new Set([...(r.places||[]),...places])]}persist();closeSheet();state.selection=false;state.selected.clear();render(true);toast(`已关联 ${linkIds.length} 条记录`);return}if(a==='openRecord')return recordSheet(id);if(a==='editRecord')return editSheet(id);if(a==='sentenceSheet')return sentenceSheet(id);if(a==='saveSentence')return saveSentence();if(a==='saveEdit')return saveEdit();if(a==='toggleFav')return toggleFavorite(id);if(a==='speak')return speak(id);if(a==='mic')return mic();if(a==='example'){const t=$('#captureText');if(t)t.value=state.captureMode==='zh'?exampleZh:state.captureMode==='term'?exampleTerm:exampleBulk;return}if(a==='makeRecord')return buildFromInput();if(a==='savePreview')return savePreview();if(a==='saveBulk')return saveBulk();if(a==='autoPick'){state.weekSelected=new Set(weekCandidates().slice(0,state.limit).map(x=>x.id));render(true);return}if(a==='generatePackage')return doGenerate();if(a==='copyPackage')return copy(state.packageText);if(a==='downloadPackage')return download('SocialMate-每周口语练习-'+offsetDay(0)+'.md',state.packageText);if(a==='showReceipt')return receiptSheet();if(a==='receiptExample'){const ids=state.packageIds.slice(0,3);$('#receiptText').value='[训练复盘]\n'+ids.map((id,i)=>`${id} | ${i===0?'不会':i===1?'提示后答对':'独立答对'} | 独立答对 | 提示后答对`).join('\n')+'\n[/训练复盘]';return}if(a==='applyReceipt')return applyReceipt();if(a==='openOldPackage'){let p=db.packages[Number(dataset.index)];if(!p)return;state.packageText=p.markdown;state.packageIds=p.ids;state.packageActiveId=p.id;state.page='package';render();return}if(a==='exportData')return download('SocialMate-N08-演示数据.json',JSON.stringify(db,null,2),'application/json');if(a==='resetDemo'){if(!window.confirm('这会清空本原型里新增的全部记录、周练习包和成绩。确定恢复示例？'))return;db=seed();persist();closeSheet();state.weekSelected.clear();state.weekPickInitialized=false;state.tab='expression';state.page='home';render();toast('演示数据已恢复');return}}
$('#app').addEventListener('click',e=>{if(e.target.id==='scrim')return closeSheet();const course=e.target.closest('[data-course]');if(course){toggleCourse(course.dataset.course,course.checked);return}const tab=e.target.closest('[data-tab]');if(tab)return switchTab(tab.dataset.tab);const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;return render(true)}const mode=e.target.closest('[data-mode]');if(mode){state.captureMode=mode.dataset.mode;render(true);return}const act=e.target.closest('[data-do]');if(act){e.preventDefault();return doAction(act.dataset.do,act.dataset)}const r=e.target.closest('[data-record]');if(r){if(state.selection){state.selected.has(r.dataset.record)?state.selected.delete(r.dataset.record):state.selected.add(r.dataset.record);render(true)}else recordSheet(r.dataset.record)} });
$('#app').addEventListener('input',e=>{if(e.target.id==='query'){state.search=e.target.value;const sel=e.target.selectionStart||state.search.length;render(true);const q=$('#query');q?.focus();q?.setSelectionRange(sel,sel)}});
$('#app').addEventListener('change',e=>{if(e.target.matches('[data-envariant]')){const t=state.pendingRecord?.alternatives?.[Number(e.target.dataset.envariant)];if(t&&$('#previewEn'))$('#previewEn').value=t;return}if(e.target.id==='limit'){state.limit=Number(e.target.value);state.weekSelected=new Set(weekCandidates().slice(0,state.limit).map(x=>x.id));render(true);return}if(e.target.matches('[data-week-select]')){const id=e.target.dataset.weekSelect;if(e.target.checked)state.weekSelected.add(id);else state.weekSelected.delete(id);render(true);return}if(e.target.matches('[data-select]')){let id=e.target.dataset.select;if(e.target.checked)state.selected.add(id);else state.selected.delete(id);render(true);return}if(e.target.matches('[data-status]')){return statusChange(e.target.dataset.id,e.target.dataset.status)}});
$('#app').addEventListener('click',e=>{const st=e.target.closest('[data-status]');if(st){e.stopPropagation();statusChange(st.dataset.id,st.dataset.status)}const pv=e.target.closest('[data-placeview]');if(pv)newPlaceView(pv.dataset.placeview)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
render();
})();
</script></body></html>
