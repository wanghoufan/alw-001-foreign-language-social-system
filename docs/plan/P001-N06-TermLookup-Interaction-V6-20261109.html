/* V4: dense utility header with no brand or duplicate tab name */
.topbar{height:calc(48px + env(safe-area-inset-top));padding-left:10px;padding-right:10px;gap:7px}
:root{--top:48px}
.top-action{height:34px;border:1px solid var(--strongline);background:var(--paper);border-radius:9px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:750;white-space:nowrap}
.top-action.chat-start{background:var(--green);border-color:var(--green);color:white;min-width:72px}
.top-action.ghost{border-color:var(--line);background:var(--quiet);color:var(--secondary)}
.top-left{gap:6px}.top-right{gap:3px}
/* Restore the *existing* chat information hierarchy: dialogue above, suggestions below, reference chips at the bottom. */
.view.chat-view{overflow:hidden;padding:0 10px 0}
.chat-workspace{height:100%;min-height:0;display:flex;flex-direction:column;gap:0}
.chat-transcript{flex:1.05 1 51%;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding:6px 0 5px}
.chat-zone-head{flex:none;display:flex;justify-content:space-between;gap:6px;align-items:center;padding:2px 3px 7px}
.chat-zone-head strong{font-size:13px;font-weight:800}
.chat-zone-head .dim{font-size:10px;white-space:nowrap}
.chat-lines{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;padding:0 2px 4px}
.chat-turn{max-width:94%;padding:8px 10px;margin:4px 0 8px;border-radius:11px;background:var(--paper2);font-size:13px;line-height:1.58}
.chat-turn.mine{margin-left:auto;background:var(--green2)}
.chat-speaker{font-size:11px;font-weight:800;color:var(--greenText);margin-bottom:3px}
.chat-speaker span{font-weight:500;color:var(--secondary);margin-left:3px}
.chat-turn p{margin:0}
.chat-trans{font-size:12px;color:var(--secondary);margin-top:4px!important}
.chat-inputrow{flex:none;display:flex;gap:6px;align-items:center;padding:5px 3px 1px}
.chat-mic{border:1px solid var(--line);background:var(--paper2);border-radius:9px;height:34px;width:35px;display:grid;place-items:center;color:var(--greenText)}
.chat-inputrow input{flex:1;min-width:0;height:34px;padding:0 9px;background:var(--paper);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:12px}
.chat-send{border:0;border-radius:9px;background:var(--green);color:#fff;font-size:12px;font-weight:750;height:34px;padding:0 11px}
.chat-assist{flex:.9 1 43%;min-height:0;display:flex;flex-direction:column;padding-top:7px}
.chat-assist-tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:0 2px 6px;flex:none}
.chat-assist-tab{flex:1;white-space:nowrap;min-height:31px;border:1px solid transparent;background:transparent;border-radius:9px;color:var(--secondary);font-size:12px;font-weight:700}
.chat-assist-tab.active{background:var(--green2);border-color:var(--strongline);color:var(--greenText)}
.chat-hints{flex:1;min-height:0;overflow:auto;padding:5px 0;scrollbar-width:thin}
.chat-hint{border:1px solid var(--line);border-radius:10px;margin-bottom:5px;background:var(--paper)}
.chat-hint.selected{border-color:var(--green)}
.chat-hint-main{background:none;text-align:left;width:100%;border:0;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.chat-hint-title{font-size:11px;color:var(--secondary)}
.chat-hint-en{font-size:13px;line-height:1.48;font-weight:580}
.chat-hint-zh{font-size:12px;line-height:1.46;color:var(--greenText)}
.chat-hint-actions{display:flex;gap:5px;padding:0 8px 7px}
.chat-hint-actions button{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--quiet);border-radius:7px;padding:5px 8px;font-size:11px}
.chat-references{flex:none;display:flex;gap:6px;align-items:center;padding:7px 2px 6px;border-top:1px solid var(--line);min-height:39px}
.chat-references-label{font-size:10px;color:var(--secondary);font-weight:700;white-space:nowrap}
.chat-chiprow{display:flex;gap:5px;overflow:auto;white-space:nowrap;min-width:0;scrollbar-width:none}
.chat-chiprow::-webkit-scrollbar{display:none}
.chat-refchip{border:1px solid var(--strongline);background:var(--green2);color:var(--greenText);border-radius:30px;padding:5px 8px;font-size:11px;font-weight:600;white-space:nowrap}
@media(max-width:355px){.chat-zone-head .dim{display:none}.chat-inputrow input{font-size:11px}}
/* V5: 人物详情，真实档案的结构与中文/英文接话优先；其它四个 Tab 保留 V4。 */
.person-page{padding:8px 0 30px;display:grid;gap:10px}
.person-summary{display:flex;align-items:center;gap:11px;padding:8px 3px 9px;border-bottom:1px solid var(--line)}
.person-avatar{height:45px;width:45px;min-width:45px;border-radius:14px;background:var(--green2);color:var(--greenText);display:grid;place-items:center;font-weight:800;font-size:24px}
.person-primary{font-size:14px;line-height:1.5;font-weight:650}
.person-recent{font-size:12px;color:var(--secondary);line-height:1.5;margin-top:2px}
.person-sheet{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.person-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.person-head h2{font-size:14px;line-height:1.35;font-weight:800}
.person-head .counter{font-size:11px}
.person-facts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.person-fact{padding:8px 10px;border-radius:9px;background:var(--quiet);min-width:0;line-height:1.4}
.person-fact .person-label{display:block;font-size:11px;color:var(--secondary);margin-bottom:2px}
.person-fact strong{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.person-fact .person-value-en{display:block;font-size:12px;color:var(--greenText);margin-top:2px;overflow-wrap:anywhere}
.person-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.person-tag{font-size:12px;padding:6px 9px;border-radius:50px;background:var(--green2);color:var(--greenText);font-weight:630;line-height:1.4}
.person-tag em{font-style:normal;font-weight:500;color:var(--secondary);margin-left:3px}
.person-question-list{display:grid;gap:7px}
.person-question{padding:10px 11px;border:1px solid var(--strongline);border-radius:11px;background:var(--paper);line-height:1.55}
.person-question-label{font-size:11px;color:var(--secondary);margin-bottom:5px;font-weight:650}
.person-question-cn{font-size:13px;color:var(--ink);line-height:1.65}
.person-question-en{font-size:15px;line-height:1.55;color:var(--greenText);font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.person-question-actions{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.person-question-actions button{min-height:28px;font-size:11px}
.person-timeline{display:grid;gap:9px}

.term-panel{position:absolute;z-index:22;left:3px;right:3px;bottom:46px;border-radius:13px;border:1px solid var(--strongline);background:var(--paper);box-shadow:0 10px 38px rgba(15,44,40,.24);padding:11px 12px 10px;max-height:min(72%,240px);overflow:auto}

.term-actions button{font-size:12px;min-height:30px;padding:5px 9px;border-radius:8px;border:1px solid var(--strongline);background:var(--paper);color:var(--greenText);font-weight:700}
.term-actions .term-primary{background:var(--green2)}
.term-empty{font-size:12px;color:var(--secondary);line-height:1.5}

.term-inputbar button{height:32px;border:0;border-radius:8px;background:var(--green);color:#fff;padding:0 10px;font-size:12px}

 places:[{id:'hongcheng',name:'红城湖公园',en:'Hongcheng Lake Park',address:'海口 · 琼山区',kind:'公园散步',palette:'park',emoji:'🌿',cn:'晚上在湖边散步很舒服，有微风，天气凉爽。适合慢跑、散步，也适合带朋友来随便聊聊天。',english:'Hongcheng Lake is a lovely spot for an evening walk. There’s usually a nice breeze, and it’s a great place to jog or just hang out with friends.'},{id:'longxing',name:'龙兴路',en:'Longxing Road',address:'海口 · 龙华区',kind:'城市街拍',palette:'street',emoji:'☕',cn:'有咖啡馆、小店和适合街拍的角落。下午来坐一坐、看看街景，和朋友聊天挺舒服。',english:'Longxing Road has little cafés and shops, plus some great corners for street photos. It’s a nice place to hang out in the afternoon.'},{id:'bay',name:'海口湾滨海步道',en:'Haikou Bay Promenade',address:'海口 · 龙华区',kind:'海边散步',palette:'sea',emoji:'🌊',cn:'沿海散步可以看到海面和城市夜景。晚风比较舒服，适合跑步和跟朋友散步聊天。',english:'You can walk along the water and enjoy the skyline. The evening breeze makes it great for a run or a relaxed chat.'},{id:'qilou',name:'骑楼老街',en:'Qilou Old Street',address:'海口 · 龙华区',kind:'文化体验',palette:'street',emoji:'🏘️',cn:'这里有南洋风格的骑楼建筑，边走边吃海南粉和传统小吃，挺适合带外国朋友逛。',english:'It’s a historic neighborhood with old arcade buildings, local food and plenty to explore on foot.'},{id:'wanlv',name:'万绿园',en:'Evergreen Park',address:'海口 · 龙华区',kind:'运动社交',palette:'park',emoji:'🌳',cn:'公园空间很大，草坪、跑道和海风都很舒服，适合散步、跑步和跟朋友野餐。',english:'It’s a spacious park with big lawns and walking paths. Great for jogging, picnics, and relaxing with friends.'}],

 records:{hongcheng:[{id:'hc-01',date:'11月3日 · 07:20',title:'湖边散步',raw:'晚上在红城湖湖边散散步，还是非常愉悦的。有微风，很凉爽。',blocks:[{cn:'晚上在红城湖边散步很舒服。吹着微风，天气凉爽，整个人都放松了。',en:'It feels great to walk around Hongcheng Lake in the evening. There’s a nice breeze, and it’s cool and relaxing.',expressions:[['很舒服','feels great'],['微风','a nice breeze'],['很放松','relaxing']],reports:[{date:'11月3日',result:'已练习',note:'记住 a nice breeze 这个说法。'},{date:'11月3日',result:'需复习',note:'注意 in the evening 的位置。'}]},{cn:'我经常绕着湖边跑步，累了就慢慢走一会儿。',en:'I often go for a run around the lake, and when I get tired, I just slow down and walk for a bit.',expressions:[['绕着湖跑步','go for a run around the lake'],['慢慢走一会儿','walk for a bit']],reports:[]},{cn:'晚上湖边的灯亮起来，特别适合跟朋友散步聊天。',en:'Once the lights come on at night, it’s a really nice place to take a walk and catch up with friends.',expressions:[['灯亮起来','the lights come on'],['跟朋友聊聊天','catch up with friends']],reports:[]}]}],longxing:[{id:'lx-01',date:'11月8日 · 18:14',title:'街边音乐与跳舞',raw:'我跟着他们跳过好几次，反正很开心，没有什么烦恼，就是跟着跳就对了，又简单又不会累。',blocks:[{cn:'我跟着他们跳过好几次，反正很开心，没什么烦恼，跟着跳就对了，又简单又不会累。跳半个小时就感觉挺有趣，不烦躁。',en:"I've danced along with them a bunch of times — it's just plain fun, no worries, you just follow the moves, it's easy and doesn't wear you out. Half an hour in, it's actually pretty fun and not annoying at all.",expressions:[['很嗨的酒吧','super hyped'],['很嗨的酒吧','lit bar'],['喊麦','hyping up the crowd'],['喊麦','MCing'],['带劲','go hard'],['带劲','really bring it']],reports:[]}]}]}

function personData(obj){
 if(!obj.detail){const template=PERSON_DEMOS[obj.id];obj.detail=template?structuredClone(template):{cnName:'',where:'未记录',job:'未记录',language:'未记录',known:'未记录',interests:[],talked:[],questions:[]};}
 const d=obj.detail;
 if(!Array.isArray(d.interests))d.interests=[];
 if(!Array.isArray(d.talked))d.talked=[];
 if(!Array.isArray(d.questions))d.questions=[];
 return d;
}
const STORE='socialmate_redesign_demo_v3';function loadData(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&x.software&&x.places&&x.records)return x}catch{}return structuredClone(sample)}
let data=loadData();const app=document.getElementById('shell'), view=document.getElementById('view');
const state={tab:'chat',chatActive:false,chatAssistTab:'reply',chatSelected:-1,chatTopic:'海口湾',chatRounds:1,screen:'main',placeId:null,recordId:null,block:0,detailTab:'records',search:'',searchOn:false,filter:'全部',theme:(()=>{try{return localStorage.getItem(STORE+'_theme')||'light'}catch{return'light'}})(),more:false,modal:'',exprOpen:false,reportsOpen:false,inlineEdit:false,playing:false,ttsRate:'1',ttsLoop:1,phrase:null,importMode:'single'};
app.dataset.theme=state.theme;
const tabs=[['software','软件','software'],['hainan','海南','hainan'],['chat','聊天','chat'],['self','关于我','self'],['people','人物','people']];
function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch{toast('当前浏览器限制本地保存；建议用浏览器直接打开或导出原型数据')}}let toTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toTimer);toTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function getPlace(){return data.places.find(x=>x.id===state.placeId)||data.places[0]}function getRec(){return(data.records[state.placeId]||[]).find(x=>x.id===state.recordId)||null}
function currentBlock(){const rec=getRec();return rec?.blocks?.[state.block]||null}
function iconButton(name,action,aria,extra=''){return `<button class="icon-btn ${extra}" type="button" data-action="${action}" aria-label="${esc(aria)}" title="${esc(aria)}">${ico(name)}</button>`}
function renderTop(){
 const nested=state.screen!=='main';
  const personKey=state.screen==='detail'&&String(state.detailKey||'').startsWith('people:');
  const current=personKey?(data.people.find(x=>x.id===state.detailKey.split(':')[1])?.name||'人物'):state.screen==='place'?getPlace().name:state.screen==='record'?'游玩记录':state.screen==='detail'?'详情':'';
 const left=document.getElementById('topLeft');
 const right=document.getElementById('topRight');
  if(nested){left.innerHTML=`${iconButton('left','back','返回','back')}<span class="context-title">${esc(current)}</span>`;right.innerHTML=personKey?`${iconButton('plus','personAddMemory','补充聊天记录')}${iconButton('dots','more','更多操作')}`:iconButton('dots','more','更多操作');return}
 // 全部一级 Tab 取消左上角品牌名、大标题。顶部用于真实操作，一级导航只在底部。
 if(state.tab==='chat'){
  left.innerHTML=`<button class="top-action chat-start" data-action="chatStart">${ico(state.chatActive?'stop':'play',15)} ${state.chatActive?'结束':'开始'}</button>`;
  right.innerHTML=iconButton('dots','more','更多操作');
 }else{
  left.innerHTML=`<button class="top-action" data-action="add">${ico('plus',15)} 新建</button><button class="top-action ghost" data-action="trashModal">回收站</button>`;
  right.innerHTML=(state.tab==='self'?'':iconButton('search','searchToggle','搜索'))+iconButton('dots','more','更多操作');

/* AI 文本分段协议：每段 0~N 行中英词组对 → 中文段落 → 英文段落；下段出现词组/中文时自动关闭上一段。
   空行仅为排版，不是段落边界。整篇亦可用独占一行的 --- 显式分隔。 */
function parsePair(line){
  const m=String(line).match(/^([\u3400-\u9fff][\u3400-\u9fff\s，、！？!?·（）()“”‘’—-]{0,27}?)\s+([A-Za-z][^\u3400-\u9fff]{0,180})$/);
  if(!m)return null;
  const zh=m[1].trim(),en=m[2].trim();
  if(!zh||!en||/[。；：]/.test(zh)||/[.!?]\s+[A-Z]/.test(en))return null;
  return [zh,en];
}
function parseTranslatedArticle(raw){
  const lines=String(raw||'').replace(/\r/g,'').split('\n').map(x=>x.trim());
  let cur={pairs:[],cn:[],en:[]},phase='pairs',blocks=[],warnings=[];
  function finish(){
    if(!cur.pairs.length&&!cur.cn.length&&!cur.en.length)return;
    const zh=cur.cn.join(''),en=cur.en.join(' ').replace(/\s+/g,' ').trim();
    if(!zh||!en){warnings.push('有一段缺少完整中文或英文，未导入。请检查段落边界。');}
    else blocks.push({cn:zh,en,pairs:cur.pairs,numberedTime:/\b\d{1,2}[:：]\d{2}\b/.test(en)});
    cur={pairs:[],cn:[],en:[]};phase='pairs';
  }
  for(let rawLine of lines){
    if(!rawLine)continue;
    if(/^(?:-{3,}|—{3,}|第\s*[0-9一二三四五六七八九十]+\s*段\s*[:：]?|段落\s*\d+\s*[:：]?)$/.test(rawLine)){finish();continue;}
    let line=rawLine;
    if(/^(?:常见表达|常用表达|关键词组)(?:\s*[:：])?$/.test(line))continue;
    line=line.replace(/^(?:整理后的中文|整理中文|翻译后的英文|英文翻译|唯一英文)(?:\s*[:：]\s*|\s*$)/,'').trim();
    if(!line)continue;
    const pair=parsePair(line);
    if(pair){
      if(phase==='en')finish();
      if(phase==='cn')warnings.push('某段中文之后出现词组，建议检查格式或加 --- 分段。');
      cur.pairs.push(pair);phase='pairs';continue;
    }
    if(/[\u3400-\u9fff]/.test(line)){
      if(phase==='en')finish();
      cur.cn.push(line);phase='cn';continue;
    }
    if(/[A-Za-z]/.test(line)){
      if(phase==='pairs'){warnings.push('中文正文之前发现单独英文：'+line.slice(0,26));continue;}
      cur.en.push(line);phase='en';continue;
    }
    warnings.push('无法识别的内容：'+line.slice(0,26));
  }
  finish();
  return blocks.length?{ok:true,blocks,warnings}:{ok:false,blocks:[],warnings,error:'没有识别到完整段落。每段需要「表达中英对照（可选） → 中文正文 → 英文正文」。'};
}

  ${r.blocks.map((b,i)=>`<div class="import-summary"><div class="section-meta" style="font-weight:800">第 ${i+1} 段 · ${b.pairs.length} 条表达</div>${b.pairs.length?`<div class="pairs compact-pairs">${b.pairs.slice(0,3).map(([c,e])=>`<div class="pair"><span>${esc(c)}</span><span>${esc(e)}</span></div>`).join('')}${b.pairs.length>3?`<div class="dim">其余 ${b.pairs.length-3} 条已识别，保存后可展开查看</div>`:''}</div>`:''}<div class="langline" style="margin-top:8px">整理中文</div><p class="cn-preview">${esc(b.cn)}</p><div class="langline" style="margin-top:8px">唯一英文</div><p class="en-preview">${esc(b.en)}</p>${b.numberedTime?'<p class="notice">英文仍有数字时间，请先改为英文单词。</p>':''}</div>`).join('')}
  ${r.warnings.length?`<p class="notice">${r.warnings.map(esc).join('；')}</p>`:''}</div>`;

 p.name=val('pName')||p.name;d.cnName=val('pCnName');p.area=val('pArea')||'未记录';d.where=val('pWhere')||'未记录';d.job=val('pJob')||'未记录';d.language=val('pLang')||'未记录';d.known=val('pKnown')||'未记录';p.note=val('pNote');d.interests=val('pInterests').split('\n').map(t=>t.split('|').map(v=>v.trim())).filter(pair=>pair[0]);save();closeModal();render();toast('人物档案已保存')}
function personAddMemory(){if(!activePerson())return;showModal('补充聊天记录',`
 <label class="fieldlabel">这次聊了什么</label><input class="field" id="pmTitle" placeholder="例如：周末徒步路线">

 ${footer('保存记录','personSaveMemory')}`)}
function personSaveMemory(){const p=activePerson();if(!p)return;const title=document.getElementById('pmTitle')?.value.trim()||'';const zh=document.getElementById('pmZh')?.value.trim()||'';const en=document.getElementById('pmEn')?.value.trim()||'';if(!title||!zh)return toast('请填写话题和中文要点');const d=personData(p);d.talked.unshift({id:'talk-'+Date.now().toString(36),title,time:new Date().toLocaleDateString('zh-CN'),zh,en});p.last='聊过'+title;save();closeModal();renderMain();toast('已补充聊天记录')}

 <label class="fieldlabel">话题</label><input class="field" id="pqTopic" placeholder="例如：接着聊上次的咖啡馆">

 ${footer('保存话题','personSaveQuestion')}`)}
function personSaveQuestion(){const p=activePerson();if(!p)return;const topic=document.getElementById('pqTopic')?.value.trim()||'继续聊';const zh=document.getElementById('pqZh')?.value.trim()||'';const en=document.getElementById('pqEn')?.value.trim()||'';if(!zh||!en)return toast('中文和英文都要填写，才方便直接跟朋友说');personData(p).questions.unshift({id:'q-'+Date.now().toString(36),topic,zh,en});save();closeModal();renderMain();toast('接续话题已保存')}
function personCopySummary(){const p=activePerson();if(!p)return;const d=personData(p);return copyText([p.name+' '+(d.cnName||''),p.area+' · '+(p.note||''),d.talked.map(t=>'聊过：'+t.title+'\n'+t.zh+'\n'+(t.en||'')).join('\n'),d.questions.map(q=>q.zh+'\n'+q.en).join('\n\n')].join('\n\n'))}
function personQuestionById(id){const p=activePerson();return p?personData(p).questions.find(q=>q.id===id):null}
function personSayQuestion(id){const q=personQuestionById(id);if(!q)return;if(!('speechSynthesis'in window))return toast('浏览器不支持语音演示');window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.en);u.lang='en-US';window.speechSynthesis.speak(u);toast('浏览器语音演示；正式 APP 仍用现有豆包朗读')}
function editDetail(){const [typ,id]=state.detailKey.split(':');if(typ==='people')return personEdit();const obj=data[typ==='software'?'software':typ==='self'?'self':'people'].find(x=>x.id===id);if(!obj)return;showModal('编辑内容',`<label class="fieldlabel">中文</label><textarea class="field" id="detailCn">${esc(obj.cn||obj.note||'')}</textarea><label class="fieldlabel">英文</label><textarea class="field" id="detailEn">${esc(obj.english||obj.en||'')}</textarea>${typ==='self'?`<label class="fieldlabel">分类</label><select id="editSelfCategory" class="field">${SELF_CATS.filter(x=>x!=='全部').map(x=>`<option value="${x}" ${selfCategory(obj)===x?'selected':''}>${x}</option>`).join('')}</select>`:''}`+footer('保存','saveDetail'))}
function saveDetail(){const [typ,id]=state.detailKey.split(':');const obj=data[typ==='software'?'software':typ==='self'?'self':'people'].find(x=>x.id===id);if(typ==='people'){obj.note=document.getElementById('detailCn').value;obj.fav=document.getElementById('detailEn').value}else{obj.cn=document.getElementById('detailCn').value;obj[typ==='software'?'english':'en']=document.getElementById('detailEn').value;if(typ==='self')obj.category=document.getElementById('editSelfCategory')?.value||selfCategory(obj)}save();closeModal();renderMain();toast('已保存')}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}function fallbackCopy(text){const e=document.createElement('textarea');e.value=text;e.style.cssText='position:fixed;left:-9999px';document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('已复制')}catch{toast('浏览器未允许复制')}e.remove()}
let speech=null;function stopVoice(){if('speechSynthesis'in window)window.speechSynthesis.cancel();state.playing=false;speech=null}
function speakBlock(){const b=currentBlock();if(!b)return;if(state.playing){stopVoice();renderMain();toast('已暂停');return}if(!('speechSynthesis'in window)){toast('浏览器不支持示范朗读；正式 APP 使用豆包');return}const phrase=b.en||b.cn;if(!phrase||phrase.startsWith('还未'))return toast('请先填入英文');stopVoice();let loops=state.ttsLoop;speech={loops};function once(){if(!speech||speech.loops<=0){state.playing=false;renderMain();return}const utterance=new SpeechSynthesisUtterance(phrase);utterance.lang=b.en?'en-US':'zh-CN';utterance.rate=Number(state.ttsRate);utterance.onend=()=>{if(!speech)return;speech.loops--;if(speech.loops>0)once();else{speech=null;state.playing=false;renderMain()}};utterance.onerror=()=>{speech=null;state.playing=false;renderMain();toast('浏览器示范朗读不可用，正式 APP 需测试豆包')};window.speechSynthesis.speak(utterance)}state.playing=true;renderMain();toast('正在使用浏览器语音示范，并非豆包');once()}
function goBlock(delta){const rec=getRec();if(!rec)return;stopVoice();state.block=Math.max(0,Math.min(rec.blocks.length-1,state.block+delta));state.exprOpen=false;state.reportsOpen=false;renderMain();view.scrollTop=0}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='socialmate-ui-preview-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出原型演示数据')}

/* V6 主动点词查询：仅 final 英文字幕可点击；不标注/扫描全部字幕，卡片不触发录音停止。 */
const TERM_DEMO={
 capoeira:{zh:'卡波耶拉，也常称巴西战舞。',desc:'源自巴西、融合武术、舞蹈、节奏与音乐的传统运动文化。',askZh:'你练这个多久了？',askEn:'How long have you been doing capoeira?'},
 jiujitsu:{zh:'柔术。',desc:'强调控制、缠斗和地面技术的格斗运动；巴西柔术常称 Brazilian jiu-jitsu。',askZh:'你是从什么时候开始练柔术的？',askEn:'When did you start training jiu-jitsu?'},
 berimbau:{zh:'巴西单弦弓形乐器。',desc:'卡波耶拉表演和练习中常用来引导节奏的一种乐器。',askZh:'你们练习的时候也会用这种乐器吗？',askEn:'Do you use a berimbau when you practice?'},
 pickleball:{zh:'匹克球。',desc:'一种使用球拍和有孔塑料球的运动，结合了网球、羽毛球和乒乓球的某些特点。',askZh:'你平时会去打匹克球吗？',askEn:'Do you play pickleball very often?'},
 martial:{zh:'武术；格斗相关的。',desc:'martial arts 通常指各种武术或格斗项目。',askZh:'你更喜欢哪一种格斗运动？',askEn:'What kind of martial arts are you into?'}
};
let termContext='',termSelected='';
function termClean(x){return String(x||'').replace(/^[\s.,!?():;\u201c\u201d\u2018\u2019]+|[\s.,!?():;\u201c\u201d\u2018\u2019]+$/g,'').slice(0,90)}
function termKey(x){return String(x||'').toLowerCase().replace(/[^a-z]/g,'')}
function pickedEnglishWord(el,event){
 // 长按选择多词时优先采用真实选区；否则计算本次点击光标所在词。
 const selection=window.getSelection?.();
 const highlighted=selection?.toString()?.trim()||'';
 if(highlighted && selection && el.contains(selection.anchorNode))return termClean(highlighted);
 let range=null;
 try{
  if(document.caretRangeFromPoint)range=document.caretRangeFromPoint(event.clientX,event.clientY);
  else if(document.caretPositionFromPoint){const pos=document.caretPositionFromPoint(event.clientX,event.clientY);if(pos){range=document.createRange();range.setStart(pos.offsetNode,pos.offset);range.collapse(true)}}
 }catch{}
 if(range && el.contains(range.startContainer) && range.startContainer.nodeType===3){
  const txt=range.startContainer.textContent||'';let pos=Math.min(txt.length,range.startOffset);
  const letter=c=>/[a-zA-Z\u00c0-\u017f'-]/.test(c||'');
  if(!letter(txt[pos]) && pos>0 && letter(txt[pos-1]))pos--;
  let l=pos,r=pos;while(l>0&&letter(txt[l-1]))l--;while(r<txt.length&&letter(txt[r]))r++;
  const value=termClean(txt.slice(l,r));if(value)return value;
 }
 // 不猜测用户想查询哪个词：点到了空白时请用选词输入框自行调整。
 return '';
}
function termLookup(query,context){
 const panel=document.getElementById('termPanel');if(!panel)return;
 const q=termClean(query);if(!q)return;
 termSelected=q;termContext=String(context||termContext||'').slice(0,400);
 const known=TERM_DEMO[termKey(q)];
 const ask=known?`<div class="term-ask"><div class="term-label">可以顺势问</div><p>${esc(known.askZh)}</p><p class="term-en">${esc(known.askEn)}</p></div>`:'';
 panel.innerHTML=`<div class="term-head"><span class="term-title">${esc(q)}</span><button class="term-close" data-action="termClose" title="关闭解释" aria-label="关闭解释">×</button></div>
 ${known?`<div class="term-meaning"><b>${esc(known.zh)}</b> ${esc(known.desc)}</div>`:`<div class="term-empty">这是交互原型，未连接 AI。正式 APP 仅在你主动查询时，通过现有 DeepSeek 结合当前句子解释这个词。</div>`}
 ${ask}<div class="term-actions">${known?`<button class="term-primary" data-action="termCopyAsk">复制英文问句</button>`:''}<button data-action="termCopyWord">复制术语</button></div>
 <details class="term-extra"><summary>修改查询词 / 查看原句</summary><div class="term-inputbar"><input id="termInput" value="${esc(q)}" aria-label="要查的英文词或短语" spellcheck="false"><button type="button" data-action="termSearch">查询</button></div>${termContext?`<div class="term-context">原句：${esc(termContext)}</div>`:''}</details>`;
 panel.classList.remove('hide');
}
function termClose(){const panel=document.getElementById('termPanel');if(panel)panel.classList.add('hide');if(window.getSelection)window.getSelection().removeAllRanges()}
function termClick(event,el){
 const selection=window.getSelection?.();
 const word=pickedEnglishWord(el,event);
 if(word)termLookup(word,el.textContent?.trim()||'');
 if(selection && selection.toString())selection.removeAllRanges();
}
function doAction(a){
 if(a==='termClose')return termClose();
 if(a==='termSearch')return termLookup(document.getElementById('termInput')?.value||'',termContext);
 if(a==='termCopyAsk'){const known=TERM_DEMO[termKey(termSelected)];if(known)return copyText(known.askEn);return}
 if(a==='termCopyWord')return copyText(termSelected);
 if(a==='chatStart'){
  closePop();state.chatActive=!state.chatActive;
  if(state.chatActive){state.chatRounds+=1;toast('界面演示已开始；真实麦克风需在 OPPO 正式 APP 中使用')}
  else toast('演示对话已结束');
  render();return;
 }
 if(a==='chatReplies'||a==='chatFollowups'||a==='chatShares'){
  state.chatAssistTab=a==='chatReplies'?'reply':a==='chatFollowups'?'followup':'share';state.chatSelected=-1;renderMain();return;
 }
 if(a==='chatCopyHint'||a==='chatSayHint'){
  const hint=(CHAT_HINTS[state.chatAssistTab]||[])[state.chatSelected];if(!hint)return toast('请先选择一条建议');
  if(a==='chatCopyHint')return copyText(hint.en);
  if('speechSynthesis'in window){window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(hint.en);utterance.lang='en-US';window.speechSynthesis.speak(utterance);return toast('浏览器语音演示，不是豆包')};return toast('当前浏览器不支持朗读');
 }
 if(a==='chatRefBay')return openPlace('bay');
 if(a==='chatRefPark')return openPlace('wanlv');
 if(a==='chatRefSelf')return openDetail('self:s2');
 if(a==='chatPerson')return showModal('选择聊天人物','<p class="minihelp">正式 APP 延用现有人物关联界面；本原型不修改人物关系或 AI 逻辑。</p>'+footer('关闭','closeModal'));
 if(a==='chatHistory')return showModal('本轮记录','<p class="minihelp">正式 APP 保留历史原文与复盘；本原型仅展示布局，不写入真实会话。</p>'+footer('关闭','closeModal'));
  if(a==='personEdit')return personEdit();if(a==='personSave')return personSave();if(a==='personAddMemory')return personAddMemory();if(a==='personSaveMemory')return personSaveMemory();if(a==='personAddQuestion')return personAddQuestion();if(a==='personSaveQuestion')return personSaveQuestion();if(a==='personCopySummary')return personCopySummary();
 if(a==='back')return back();if(a==='more'||a==='recordMenu')return moreMenu();if(a==='searchToggle'){if(state.tab==='self'&&state.screen==='main'){view.querySelector('#searchInput')?.focus();return}state.searchOn=!state.searchOn;state.search='';renderMain();if(state.searchOn)view.querySelector('#searchInput')?.focus();return}if(a==='add')return newGeneral();if(a==='themeToggle')return toggleTheme();if(a==='trashModal')return trashModal();if(a==='exportDemo')return exportData();if(a==='helpModal')return showHelp();if(a==='resetDemo'){data=structuredClone(sample);save();closeModal();setTab('hainan');return toast('原型示例已恢复')}if(a==='closeModal')return closeModal();if(a==='newRecord')return newRecordModal();if(a==='createRecord')return createRecord();if(a==='saveGeneral')return saveGeneral();if(a==='pasteOpen')return pasteModal('single');if(a==='pasteSingle')return switchPasteMode('single');if(a==='pasteBatch')return switchPasteMode('batch');if(a==='importWhole')return pasteModal('new');if(a==='fillExample'){const el=document.getElementById('pasteRaw');if(el){el.value=state.importMode==='single'?examplePaste:(examplePaste+'\n\n---\n\n'+examplePaste2);parsePreview()}return}if(a==='parsePaste')return parsePreview();if(a==='savePaste')return savePaste();if(a==='editBlock')return editBlock();if(a==='saveBlock')return saveBlock();if(a==='addBlock')return addBlock();if(a==='manageRecord')return manageRecord();if(a==='copyBlock'){const b=currentBlock();return copyText((b?.cn||'')+'\n'+(b?.en||''))}if(a==='exprToggle'){state.exprOpen=!state.exprOpen;renderMain();return}if(a==='reportToggle'){closePop();state.reportsOpen=!state.reportsOpen;renderMain();return}if(a==='rawToggle')return rawModal();if(a==='addReport')return addReport();if(a==='saveReport')return saveReport();if(a==='togglePlay')return speakBlock();if(a==='stopAudio'){stopVoice();renderMain();return toast('朗读已停止')}if(a==='loopToggle'){state.ttsLoop=state.ttsLoop===1?2:state.ttsLoop===2?4:1;renderMain();return}if(a==='blockPicker')return blockPicker();if(a==='prevBlock')return goBlock(-1);if(a==='nextBlock')return goBlock(1);if(a==='editDetail')return editDetail();if(a==='saveDetail')return saveDetail();if(a==='copyDetail'){const [typ,id]=state.detailKey.split(':');if(typ==='people')return personCopySummary();const x=data[typ==='software'?'software':typ==='self'?'self':'people'].find(v=>v.id===id);return copyText((x?.cn||x?.note||'')+'\n'+(x?.english||x?.en||''))}if(a==='copyChat')return copyText('I like going for walks along Haikou Bay, and I work out sometimes, too.');if(a==='sayChat'){if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('I like going for walks along Haikou Bay, and I work out sometimes, too.');u.lang='en-US';window.speechSynthesis.speak(u);return toast('浏览器语音示范，不是豆包')}return toast('浏览器不支持朗读')}if(a==='micDemo')return toast('这是界面原型：真实录音和 ASR 在正式 OPPO APP 中验证');if(a==='chatSend'){const input=document.getElementById('chatInput');const msg=input?.value.trim();if(!msg)return toast('请输入一句话');return showModal('已输入的文字',`<div class="parsepreview">${esc(msg)}</div><p class="minihelp">演示原型不调用云端 AI；正式 APP 走你已配置的 DeepSeek。</p><button class="secondary full" data-action="closeModal">关闭</button>`)} }
app.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const subtitle=e.target.closest('[data-english-subtitle]');if(!subtitle)return;const sel=window.getSelection?.();if(sel && sel.toString().trim() && subtitle.contains(sel.anchorNode)){const picked=termClean(sel.toString());if(picked)termLookup(picked,subtitle.textContent?.trim()||'')}});
app.addEventListener('click',e=>{if(e.target.id==='scrim')return closeModal();const subtitle=e.target.closest('[data-english-subtitle]');if(subtitle){termClick(e,subtitle);return}const hint=e.target.closest('[data-chat-hint]');if(hint){const n=Number(hint.dataset.chatHint);state.chatSelected=state.chatSelected===n?-1:n;renderMain();return}const jump=e.target.closest('[data-jump]');if(jump){closeModal();state.block=Number(jump.dataset.jump)||0;state.exprOpen=false;state.reportsOpen=false;stopVoice();renderMain();view.scrollTop=0;return}const pc=e.target.closest('[data-person-copy]');if(pc){const q=personQuestionById(pc.dataset.personCopy);if(q)copyText(q.en);return}const ps=e.target.closest('[data-person-say]');if(ps){personSayQuestion(ps.dataset.personSay);return}const button=e.target.closest('[data-action]');if(button){e.preventDefault();doAction(button.dataset.action);return}const tab=e.target.closest('[data-tab]');if(tab)return setTab(tab.dataset.tab);const place=e.target.closest('[data-place]');if(place)return openPlace(place.dataset.place);const rec=e.target.closest('[data-record]');if(rec)return openRec(rec.dataset.record);const detail=e.target.closest('[data-detail]');if(detail)return openDetail(detail.dataset.detail);const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;return renderMain()}const dtab=e.target.closest('[data-detailtab]');if(dtab){state.detailTab=dtab.dataset.detailtab;return renderMain()}});
app.addEventListener('input',e=>{if(e.target.id==='searchInput'){state.search=e.target.value;const scroll=view.scrollTop;renderMain();view.scrollTop=scroll;const inp=document.getElementById('searchInput');inp?.focus();inp?.setSelectionRange?.(state.search.length,state.search.length)}});
app.addEventListener('change',e=>{if(e.target.id==='rateSel')state.ttsRate=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='termInput'){e.preventDefault();termLookup(e.target.value,termContext);return}if(e.key==='Escape'){if(state.modal)closeModal();else if(state.more)closePop();else if(document.getElementById('termPanel')&&!document.getElementById('termPanel').classList.contains('hide'))termClose();else if(state.screen!=='main')back()}});
render();
})();
