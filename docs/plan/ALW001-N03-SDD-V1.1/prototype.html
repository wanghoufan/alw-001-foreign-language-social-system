<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SocialMate N03 交互原型</title><style>
:root{--bg:#f5f7f3;--card:#fff;--fg:#1e3c54;--dim:#647681;--line:#dce6e6;--green:#0c7766;--shade:#e9f5f1}html[data-theme=dark]{--bg:#192d35;--card:#233d46;--fg:#eff8f7;--dim:#afc2c6;--line:#44616b;--green:#5bd0b8;--shade:#31524c}*{box-sizing:border-box}body{margin:0;background:#dfe8e9;color:var(--fg);font:15px/1.5,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.phone{margin:0 auto;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}.header{position:sticky;top:0;z-index:2;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:var(--dim);font-size:10px;font-weight:400}.body{padding:15px 14px 25px;flex:1}.nav{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--dim);font-size:11px}.nav button.active{color:var(--green);font-weight:700}.nav b{display:block;font-size:20px}.card{padding:16px;margin:12px 0;border:1px solid var(--line);border-radius:16px;background:var(--card)}h1{font-size:23px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}p{margin:8px 0}.sub{color:var(--dim);font-size:13px}.tiny{font-size:12px;color:var(--dim)}.simulate{background:#fff3d9;text-align:center;padding:8px;font-size:12px;color:#66542e}.btn{background:var(--green);color:white;border:0;border-radius:12px;padding:12px 16px;min-height:44px;font-weight:600}.soft{background:var(--shade);color:var(--green);border:0;border-radius:11px;padding:10px 12px;min-height:40px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.check{display:flex;gap:8px;align-items:flex-start;padding:9px 0}.check input{width:18px;height:18px;accent-color:var(--green)}.quote{padding:12px;background:var(--shade);border-radius:12px;margin:8px 0}.quote strong{display:block;color:var(--green);font-size:15px}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--fg)}.block{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}.badge{color:var(--green);font-size:11px;background:var(--shade);padding:3px 8px;border-radius:30px}.gap{margin-top:11px}.hr{border-top:1px solid var(--line);margin:12px 0}button:disabled{opacity:.45;cursor:default}@media(min-width:700px){body{padding:25px}.phone{border-radius:24px;min-height:850px;overflow:hidden;box-shadow:0 10px 38px #81939a55}}
</style></head><body><div class="phone"><div class="simulate">可交互视觉原型 · 虚构数据 · 不连接录音/付费AI</div><header class="header"><span class="brand">SocialMate<small>Better conversations · N03 V1.1</small></span><button class="soft" data-action="theme">◐ 主题</button></header><div class="body" id="content"></div><nav class="nav" id="nav"></nav></div><script>
const s={tab:"chat",screen:"",theme:"light",consent:false,retain:false,rec:false,generated:false,selected:false,saved:false,search:"",person:"Anna",favorites:[],people:[{name:"Anna",facts:["喜欢海边徒步","喜欢海南菜"],last:"2026-11-01"},{name:"David",facts:["在咖啡店工作"],last:"2026-10-30"}]};
const t=[["chat","◉","聊天"],["software","▦","软件"],["hainan","⌖","海南"],["self","♧","关于我"],["people","♧","人物"]],esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el=document.getElementById("content"),nav=document.getElementById("nav");
function chat(){return '<h1>聊天与接话</h1><p class="sub">字幕清楚，接话简短，停止按钮始终可见</p><div class="card"><div class="between"><h2>本轮会话</h2><span class="badge">'+(s.rec?"正在模拟识别":"尚未录音")+'</span></div><label class="check"><input type="checkbox" id="consent" '+(s.consent?"checked":"")+'>我已征得对方录音知情同意</label><label class="check"><input type="checkbox" id="retain" '+(s.retain?"checked":"")+'>允许保存本轮原文（默认关闭）</label><div class="row"><button class="btn" data-action="start" '+(s.rec?"disabled":"")+'>● 开始录音</button><button class="soft" data-action="stop" '+(!s.rec?"disabled":"")+'>■ 停止录音</button></div><p class="tiny">'+(s.rec?"原文仅在授权后留存":"录音、留存、云端文字上传分别授权")+'</p></div><div class="card"><h2>实时字幕</h2><div class="quote">'+(s.rec?"Anna: I enjoy hiking near the beach.":"开始后显示真实识别字幕")+'</div></div><div class="card"><div class="between"><h2>快速接话</h2><span class="badge">本地规则示例</span></div><div class="quote"><small>自然接话</small><strong>That sounds fun!</strong><div>听起来很有意思！</div><button class="soft gap" data-action="savephrase" data-phrase="That sounds fun!">☆ 收藏</button></div><div class="quote"><small>继续追问</small><strong>Where do you usually go hiking?</strong><div>你通常在哪里徒步？</div><button class="soft gap" data-action="savephrase" data-phrase="Where do you usually go hiking?">☆ 收藏</button></div></div><button class="block" data-action="history">📖 查看历史会话与复盘　›</button>'}
function history(){let records=[{id:"demo-1",person:"Anna",date:"2026-11-01",text:"I enjoy hiking near the beach."},{id:"demo-2",person:"David",date:"2026-10-30",text:"I work in a cafe."}];return '<h1>历史会话</h1><p class="sub">按朋友、日期或关键词查找</p><button class="soft" data-action="back">← 返回</button><div class="card"><input class="input" id="search" value="'+esc(s.search)+'" placeholder="搜索 Anna / hiking / 日期">'+records.filter(r=>(r.person+" "+r.date+" "+r.text).toLowerCase().includes(s.search.toLowerCase())).map(r=>'<button class="block" data-action="review"><b>'+r.person+'</b> · '+r.date+'<div class="tiny">'+r.text+'</div></button>').join("")+'<p class="tiny">完整原文需有私有鉴权；当前均是模拟数据</p></div>'}
function review(){return '<h1>会后复盘</h1><p class="sub">原文只读，事实需明确勾选确认</p><button class="soft" data-action="history">← 历史</button><div class="card"><h2>原始转写 · final</h2><div class="quote">I enjoy hiking near the beach.</div><p class="tiny">第1段 · 说话人身份待确认 · MOCK</p></div><div class="card"><h2>复盘与确认</h2><button class="soft" data-action="generate">生成本地复盘 · 0 AI 请求</button>'+(s.generated?'<div class="hr"></div><p>聊到了：徒步和海边</p><label class="check"><input id="candidate" type="checkbox" '+(s.selected?"checked":"")+'>候选：Anna 喜欢海边徒步（来源：第1段）</label><p class="tiny">归属人物</p><select class="input" id="target"><option>Anna</option><option>David</option></select><button class="btn gap" data-action="confirm">人工确认保存</button>':'')+'<p class="tiny">'+(s.saved?"已模拟保存到人物已确认资料；重复点击不会新增":"未确认候选绝不自动写人物档案")+'</p></div>'}
function people(){return '<h1>人物</h1><p class="sub">私有在线模式以 Mac 已确认人物主档为准</p><div class="card"><h2>朋友档案</h2>'+s.people.map(p=>'<button class="block" data-action="person" data-person="'+esc(p.name)+'"><b>'+esc(p.name)+'</b><div class="tiny">上次联系 '+p.last+' · '+p.facts.length+' 条已确认</div></button>').join("")+'</div><button class="soft" data-action="history">查找聊天记录</button>'}
function person(){let p=s.people.find(x=>x.name===s.person);return '<button class="soft" data-action="backpeople">← 人物列表</button><h1 class="gap">'+esc(p.name)+'</h1><div class="card"><h2>已确认信息</h2>'+p.facts.map(x=>'<div class="quote">'+esc(x)+'</div>').join("")+'<p class="tiny">正式版附带具体会话来源，不推测身份</p></div><div class="card"><h2>见面前快速准备</h2><p class="tiny">最多3条，默认本地规则，不传私人资料上云</p><div class="quote"><strong>Have you been hiking recently?</strong>你最近去徒步了吗？</div><div class="quote"><strong>Do you prefer the beach or the mountains?</strong>你更喜欢海边还是山上？</div><div class="quote"><strong>Any plans for the weekend?</strong>周末有什么计划吗？</div><button class="btn" data-action="chat">进入聊天</button></div>'}
function self(){return '<h1>关于我</h1><p class="sub">个人资料只使用本人已确认事实</p><div class="card"><h2>我的收藏表达</h2>'+(s.favorites.length?s.favorites.map(x=>'<div class="quote between"><b>'+esc(x)+'</b><button class="soft" data-action="removephrase" data-phrase="'+esc(x)+'">取消</button></div>').join(""):'<p>尚无收藏。可在聊天建议卡点击收藏。</p>')+'</div><div class="card"><h2>隐私状态</h2><p>录音、原文留存和AI文字上传分开授权。</p><p class="tiny">本原型不使用麦克风、不发出网络请求。</p></div>'}
function simple(a,b){return '<h1>'+a+'</h1><div class="card">'+b+'<p class="tiny">保持现有正式功能，本轮不重建。</p></div>'}
function render(){document.documentElement.setAttribute("data-theme",s.theme);nav.innerHTML=t.map(a=>'<button data-tab="'+a[0]+'" class="'+(s.tab===a[0]?"active":"")+'"><b>'+a[1]+'</b>'+a[2]+'</button>').join("");el.innerHTML=s.screen==="history"?history():s.screen==="review"?review():s.screen==="person"?person():s.tab==="chat"?chat():s.tab==="people"?people():s.tab==="self"?self():s.tab==="hainan"?simple("海南","保留115地点的现有浏览与分享功能。"):simple("软件","保留原有个人软件作品集。")}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.tab){s.tab=b.dataset.tab;s.screen="";render();return}let a=b.dataset.action;if(!a)return;if(a==="theme")s.theme=s.theme==="light"?"dark":"light";if(a==="start"){if(!s.consent){alert("需要先确认录音同意");return}s.rec=true}if(a==="stop"){s.rec=false;if(s.retain){s.screen="review";s.generated=false}else alert("未授权留存原文，结束录音后不会保存")}if(a==="history")s.screen="history";if(a==="review"){s.screen="review";s.generated=false}if(a==="generate")s.generated=true;if(a==="confirm"){if(!s.selected){alert("请先勾选候选事实");return}let name=document.getElementById("target").value,p=s.people.find(x=>x.name===name);if(p&&!p.facts.includes("喜欢海边徒步"))p.facts.push("喜欢海边徒步");s.saved=true}if(a==="person"){s.person=b.dataset.person;s.screen="person"}if(a==="backpeople"){s.tab="people";s.screen=""}if(a==="back"){s.screen="";s.tab="chat"}if(a==="chat"){s.screen="";s.tab="chat"}if(a==="savephrase"&&!s.favorites.includes(b.dataset.phrase))s.favorites.push(b.dataset.phrase);if(a==="removephrase")s.favorites=s.favorites.filter(x=>x!==b.dataset.phrase);render()});
document.addEventListener("change",e=>{if(e.target.id==="consent")s.consent=e.target.checked;if(e.target.id==="retain")s.retain=e.target.checked;if(e.target.id==="candidate")s.selected=e.target.checked});
document.addEventListener("input",e=>{if(e.target.id==="search"){let n=e.target.selectionStart;s.search=e.target.value;render();let i=document.getElementById("search");i.focus();i.setSelectionRange(n,n)}});render();
</script></body></html>
