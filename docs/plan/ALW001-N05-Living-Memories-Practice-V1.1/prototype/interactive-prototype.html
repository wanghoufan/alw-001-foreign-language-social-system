ill.gold{background:#f7eddc;color:#8f6c3d}.pill.gray{background:#f1f3f0;color:#6d7772}.btn{padding:11px 15px;border-radius:12px;font-size:13px;font-weight:750;background:#eff3ed;color:var(--deep);display:inline-flex;align-items:center;justify-content:center;gap:5px;text-align:center}.btn.primary{background:var(--main);color:white}.btn.outline{background:#fff;border:1px solid #d7e5dc;color:var(--deep)}.btn.ghost{background:transparent;color:var(--main);padding:8px}.btn.danger{color:var(--red);background:#fff0ef}.btn.block{display:flex;width:100%}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row>*{flex:1}.input,.textarea,.select{width:100%;background:#fafbf9;color:var(--ink);border:1px solid #dfe6df;border-radius:12px;padding:10px 12px;outline:none}.textarea{min-height:110px;resize:vertical;line-height:1.7}.input:focus,.textarea:focus,.select:focus{border-color:var(--main)}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.hero{border-radius:22px;background:linear-gradient(120deg,#225b4c,#347d65);color:white;padding:20px 18px;margin:5px 0 16px}.hero h2{font-size:20px;line-height:1.4;margin:0 0 6px}.hero p{opacity:.83;font-size:12px;margin:0}.hero .btn{background:white;color:#255f4e;margin-top:13px}.back{background:none;color:var(--main);padding:6px 4px;font-size:13px;font-weight:750;margin-bottom:10px}.fact{border-left:3px solid #8bbd9f;padding:7px 10px;background:#f7f9f6;margin:9px 0;border-radius:0 9px 9px 0}.source{color:#87958c;font-size:11px}.num{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:8px;background:#e8f3ed;color:#30795a;font-size:12px;font-weight:780}.note{border-left:3px solid #d8ae6a;background:#fffdf7;padding:12px;border-radius:0 12px 12px 0;margin:9px 0}.paragraph{border:1px solid var(--line);border-radius:16px;background:white;padding:15px;margin:12px 0}.paragraph h4{font-size:13px;margin:0 0 9px}.zh{font-size:14px;margin:3px 0 9px}.en{font-size:14px;color:var(--deep);line-height:1.72;margin:6px 0}.en.secondary{color:#687d72}.phrase{display:inline-block;background:#edf3ef;border-radius:7px;padding:2px 7px;font-size:12px;margin:3px 4px 3px 0}.tinytitle{font-size:12px;font-weight:800;color:#607168;margin:12px 0 7px;text-transform:uppercase;letter-spacing:.3px}.progress{display:flex;height:7px;gap:4px;margin:13px 0}.progress i{flex:1;background:#e7eee8;border-radius:3px}.progress i.done{background:#5b9b7a}.modal-bg{position:absolute;inset:0;background:rgba(15,33,27,.48);z-index:40;display:flex;justify-content:center;align-items:flex-end}.modal{background:#fff;width:100%;max-height:83%;overflow:auto;padding:20px;border-radius:25px 25px 0 0;box-shadow:0 -10px 40px #12251c35}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modal-head h3{margin:0;font-size:20px}.notechip{font-size:11px;color:#8b6c38;background:#f9efdf;padding:3px 8px;border-radius:8px}.empty{text-align:center;padding:34px 14px;color:#76837b;background:#fff;border-radius:18px}.tip{position:absolute;bottom:85px;left:20px;right:20px;text-align:center;color:white;background:#254e42e8;padding:11px;border-radius:12px;z-index:55;box-shadow:0 6px 20px #254d3d33;font-size:13px}.toggle{width:40px;height:23px;border-radius:20px;background:#baccc1;position:relative;display:inline-flex;align-items:center;padding:3px;cursor:pointer}.toggle.on{background:#29916b}.toggle:after{content:"";display:block;width:17px;height:17px;border-radius:50%;background:white;transition:transform .2s}.toggle.on:after{transform:translateX(17px)}.caption-detail{font-size:11px;color:#a4afa8}.level{background:#f8f0e4;border-radius:7px;padding:3px 8px;color:#906940;font-size:11px}body.host-small .about{font-size:13px}@media(max-width:820px){.stage{padding:0;display:block;background:var(--bg)}.about{display:none}.device{height:100dvh;min-height:0;width:100%;min-width:0;border:0;border-radius:0;box-shadow:none}.status{height:25px;flex-basis:25px </style></head><body><div class="stage"><aside class="about"><div class="eyebrow">SOCIALMATE / ANDROID</div><h1>把每次相遇<br>变成下一次<br>更好的交流。</h1><p>可点击的交互原型。将人物档案、海南地点、双语听读与 GPT 口语练习连成一条自然流程。</p><div class="bullet"><b>01</b> 选朋友 → 文字或语音记录 → AI 核对入档</div><div class="bullet"><b>02</b> 海南地点 → 追加感悟 → 自动匹配与人工确认</div><div class="bullet"><b>03</b> 段落循环听 → 复制 GPT 练习 → 回贴复盘</div><p class="small">这是独立可操作的设计原型，James/Emily 为预览样例，不是正式朋友；语音录入和 AI 分析目前用示例模拟，朗读使用浏览器语音引擎。未连接真实档案或付费服务。</p></aside><main class="device" aria-label="SocialMate Android 手机交互原型"><div class="status"><span>9:41</span><span>◕ ▂▃▅ 92%</span></div><div class="appbar"><span class="appbrand">Social<em>Mate</em></span><div class="topright"><span class="pill gray" id="pageLabel">人物档案</span><button class="circle" id="settingsBtn" aria-label="设置">⚙</button></div></div><section id="screen" class="screen" aria-live="polite"></section><nav id="tabs" class="tabbar" aria-label="应用主导航"></nav><div id="modalRoot"></div><div id="toastRoot"></div></main></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=()=>new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
const defaultPeople=[{id:'oliver',demo:true,name:'Oliver Reed',where:'英国·伦敦',interest:'健身 · 力量训练',facts:['每周三次晨练力量训练','正在练标准引体向上'],notes:2,tone:'具体、直接，喜欢聊运动计划',last:'上次聊到引体向上',history:[{date:'10月27日',text:'上次聊过健身房与引体向上'}]},{id:'maya',demo:true,name:'Maya Torres',where:'美国·奥斯汀',interest:'设计 · 现场音乐',facts:['为本地乐队设计海报','喜欢小型现场音乐演出'],tone:'热情，喜欢开放式话题',last:'上次聊到乐队设计',history:[{date:'10月20日',text:'聊过海报设计和小型演出'}]}];
const previewPeople=[{id:'preview-james',demo:false,preview:true,name:'James',where:'英国·伦敦',interest:'健身 · 旅行',facts:['喜欢健身和户外运动','正在探索周末短途旅行'],tone:'自然、具体',last:'上次聊到健身计划',history:[]},{id:'preview-emily',demo:false,preview:true,name:'Emily',where:'美国·加州',interest:'旅行 · 美食',facts:['喜欢旅行','对海南美食感兴趣'],tone:'开放式聊天',last:'上次聊到海南',history:[]}];
const defaultNotes=[{id:'note-1',demo:true,placeId:1,place:'龙兴路',title:'第一次街头散步的感受',date:'10月26日',blocks:[{cn:'龙兴路其实不长，但我喜欢它慢慢逛的感觉。',en1:'Longxing Road isn’t very long, but I love taking my time there.',en2:'It’s a short street, but it’s nice to wander around at your own pace.',phrases:['take my time','wander around','at your own pace'],reviews:[]},{cn:'我喜欢下午的光线，特别适合随手拍几张照片。',en1:'I really like the afternoon light there. It’s great for casual photos.',en2:'The light looks lovely in the afternoon, so it’s easy to get nice shots.',phrases:['afternoon light','casual photos','get nice shots'],reviews:[]}]}];
const getSaved=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('sm-proto-'+k));return v??structuredClone(d)}catch{return JSON.parse(JSON.stringify(d))}};
const state={tab:'people',page:'list',place:'龙兴路',person:'oliver',note:'note-1',block:0,modal:null, draft:null,personInput:'',importText:'',matched:'龙兴路',parsed:[],people:getSaved('people',[...previewPeople,...defaultPeople]),notes:getSaved('notes',defaultNotes),sampleMode:getSaved('sampleMode',false),currentPrompt:'',ttsOn:false,practiceFilter:'all'};
const save=()=>{for(const key of ['people','notes','sampleMode'])localStorage.setItem('sm-proto-'+key,JSON.stringify(state[key]))};
const toast=txt=>{const r=$('#toastRoot');r.innerHTML=`<div class="tip">${esc(txt)}</div>`;setTimeout(()=>r.innerHTML='',2600)};
const btn=(label,fn,cl='')=>`<button class="btn ${cl}" data-action="${fn}">${label}</button>`;
const navig=(p,pg)=>{stopTTS();state.tab=p;state.page=pg||'list';state.modal=null;render()};
const people=()=>state.people.filter(p=>state.sampleMode||!p.demo);const currentPerson=()=>state.people.find(x=>x.id===state.person);
const placeBlurb={龙兴路:{area:'海口·国贸片区',cn:'龙兴路是海口国贸片区一条不长的小街。咖啡店、绿植、复古门头和街边座位都挺适合散步和街拍，下午的光线尤其好。',en:'Longxing Road is a short street in Haikou with lovely cafés, greenery and vintage-looking shops. I like wandering there in the afternoon, when the light makes it easy to take nice photos.'},万绿园:{area:'海口·滨海大道',cn:'万绿园是一大片海边草坪。平时可以来散步、跑步或者野餐，傍晚吹着海风看日落，感觉很放松。',en:'Wanlüyuan is a big seaside park in Haikou. It is great for walks, runs and picnics, especially when the evening breeze comes in.'}};
function render(){document.querySelector('#pageLabel').textContent=state.tab==='people'?'人物档案':state.tab==='hainan'?'海南介绍':state.tab==='settings'?'偏好与设置':state.tab==='chat'?'聊天':'我的内容';$('#settingsBtn').style.display=state.tab==='settings'?'none':'';$('#tabs').style.display=state.tab==='settings'?'none':'grid';$('#tabs').innerHTML=[['software','作品','▤'],['hainan','海南','⌖'],['chat','聊天','◉'],['self','关于我','♙'],['people','人物','♧']].map(([k,txt,i])=>`<button class="tab ${k===state.tab?'active':''}" data-tab="${k}"><span class="ico">${i}</span><span>${txt}</span></button>`).join('');let html=state.tab==='people'?peopleView():state.tab==='hainan'?hainanView():state.tab==='settings'?settingsView():state.tab==='chat'?genericView('聊天','在真实产品里，这里保留当前实时字幕与交流建议。'):state.tab==='self'?genericView('关于我','这里保留你已有的个人经历与内容。'):genericView('我的软件','保持现有软件展示功能不变。');$('#screen').innerHTML=html; $('#modalRoot').innerHTML=state.modal?modalView():'';$('#screen').scrollTop=0;}
function genericView(title,desc){return `<h2>${title}</h2><p class="sub">${desc}</p><div class="hero"><h2>SocialMate 陪你准备下一次交流</h2><p>这几个 Tab 的已有功能不在本次原型改动范围内。</p>${btn('查看人物档案','goPeople','')}</div>`}
function peopleView(){if(state.page==='detail')return personDetail();if(state.page==='capture')return personCapture();if(state.page==='review')return personReview();return `<div class="section-head"><h2>我的人物</h2>${btn('＋ 新建','newPerson','primary')}</div><p class="sub">随时补充你已经认识的朋友，不必每次从零开始。</p><div class="card accent"><div class="row between"><div><div class="item-title">随时记录新认识</div><div class="item-sub">文字 / 语音 → AI 整理 → 你确认</div></div><span style="font-size:28px">✍</span></div><div style="margin-top:12px">${btn('选择人物并补充信息','pickCapture','primary block')}</div></div><div class="field"><input class="input" id="peopleSearch" placeholder="搜索姓名、国家或共同兴趣…" oninput="filterCards(this.value)"></div><div id="peopleCards">${peopleCards()}</div>`}
function peopleCards(query=''){let matches=people().filter(p=>(p.name+p.where+p.interest+p.facts.join('')).toLowerCase().includes(query.toLowerCase()));return matches.map((p,i)=>`<div class="card" data-person="${esc(p.id)}" role="button" tabindex="0"><div class="row"><div class="avatar ${i%2?'gold':''}">${esc(p.name[0])}</div><div class="grow"><div class="item-title">${esc(p.name)}</div><div class="item-sub">${esc(p.where)} · ${esc(p.interest)}</div></div><span class="muted">›</span></div><div class="divider"></div><div class="row between"><span class="small muted">${esc(p.last||'最近新建')}</span><span class="pill">${p.facts.length} 条记忆</span></div></div>`).join('')||'<div class="empty">没有匹配的人物，试试其他关键词。</div>'}
function personDetail(){const p=currentPerson();if(!p)return '<div class="empty">人物不存在</div>';return `${btn('‹ 返回人物','backPeople','ghost')}<div class="row" style="margin:5px 0 17px"><div class="avatar" style="width:58px;height:58px;font-size:24px">${esc(p.name[0])}</div><div class="grow"><h2 style="font-size:22px;margin:0">${esc(p.name)}</h2><div class="item-sub">${esc(p.where)} · ${esc(p.interest)}</div></div></div>${btn('＋ 补充我知道的信息','capturePerson','primary block')}<div class="card"><div class="section-head"><strong>已确认的记忆</strong><span class="pill">${p.facts.length} 条</span></div>${p.facts.map((f,i)=>`<div class="fact">${esc(f)}<div class="source">已由你确认 · 资料 ${i+1}</div></div>`).join('')||'<div class="muted">还没有记录，点击上方添加。</div>'}</div><div class="card soft"><strong>下次见面聊什么？</strong><p class="small muted">结合已确认事实生成，不把猜测当成事实。</p><div class="note">${esc(p.facts.at(-1)||'你最近有没有发现什么有趣的事情？')}<div class="source">个性化话题 · 来源于该人物的记忆</div></div><div class="note">最近有什么新鲜事可以分享？<div class="source">通用破冰</div></div></div><div class="card"><strong>时间线</strong><div class="small muted">保留每次补充的来源与确认时间</div>${p.history.map(h=>`<div class="fact"><div class="small muted">${esc(h.date)}</div>${esc(h.text)}</div>`).join('')}</div>`}
function personCapture(){const p=currentPerson();return `${btn('‹ 返回 '+esc(p.name),'detailBack','ghost')}<h2 style="margin:4px 0 6px">补充 ${esc(p.name)} 的资料</h2><p class="sub">已有信息可以直接粘贴，不需要等下一次录音。</p><div class="card"><div class="field"><label>你了解到什么？</label><textarea class="textarea" id="personInput" placeholder="例如：他是英国人，喜欢健身，每周去三次健身房。最近正在练引体向上。">${esc(state.personInput)}</textarea></div><div class="btn-row">${btn('🎙 语音录入','mockVoice','outline')}${btn('AI 整理信息','analyzePerson','primary')}</div><p class="caption-detail" style="margin-bottom:0">原型中的语音录入与 AI 整理为模拟；正式 APP 应调用授权的 Android 语音输入及现有私有 AI 网关。</p></div><div class="card soft"><strong>整理原则</strong><p class="small muted" style="margin-bottom:0">保留原文、识别多个事实、自动建议分类。每条都需要你确认，不会偷偷覆盖原有记录。</p></div>`}

function parseBlocks(txt){return txt.trim().split(/\n\s*\n/g).filter(Boolean).map((chunk,i)=>{const find=(key)=>{let a=chunk.match(new RegExp('(?:^|\\n)'+key+'\\s*[：:]\\s*([^\\n]+)','i'));return a?.[1]?.trim()||''};return {cn:find('中文')||chunk.split('\n')[0].trim(),en1:find('英文1|English A'),en2:find('英文2|English B'),phrases:(find('表达|搭配').split(/[;,，；]/).map(x=>x.trim()).filter(Boolean)),reviews:[]}})}

function studyView(){const n=state.notes.find(x=>x.id===state.note);if(!n)return '<div class="empty">学习记录不存在</div>';const b=n.blocks[state.block];return `${btn('‹ 返回'+esc(n.place),'backPlace','ghost')}<div class="row between"><div><h2 style="margin:3px 0">${esc(n.title)}</h2><div class="sub" style="margin:0">${esc(n.place)} · ${esc(n.date)}</div></div><span class="pill gold">${state.block+1} / ${n.blocks.length}</span></div><div class="progress">${n.blocks.map((_,i)=>`<i class="${i<=state.block?'done':''}"></i>`).join('')}</div><div class="card"><div class="section-head"><strong>第 ${state.block+1} 段 · 听读练习</strong><span class="pill">双语</span></div><div class="tinytitle">中文感悟</div><p class="zh">${esc(b.cn)}</p><div class="tinytitle">英语表达 A</div><p class="en">${esc(b.en1||'此段待补充英文表达')}</p><div class="tinytitle">英语表达 B</div><p class="en secondary">${esc(b.en2||'未提供第二种表达')}</p><div class="tinytitle">地道词组</div><div>${b.phrases.length?b.phrases.map(x=>`<span class="phrase">${esc(x)}</span>`).join(''):'<span class="muted small">还没有提取表达</span>'}</div></div><div class="card accent"><strong>反复听 · 熟悉这一段</strong><div class="btn-row" style="margin:13px 0 9px">${btn('▶ 中文','speakZh','outline')}${btn('▶ 英文 A','speakEn1','outline')}${btn('▶ 英文 B','speakEn2','outline')}</div><div class="btn-row">${btn(state.ttsOn?'■ 停止循环':'↻ 循环听这一段','loopSpeak','primary')}${btn('▶ 常用搭配','speakPhrases','outline')}</div><div class="small muted" style="margin-top:10px">此处使用浏览器语音，仅为交互预览；正式安卓版按原生TTS的中英文声线及队列实现。</div></div><div class="btn-row">${btn('‹ 上一段','prevBlock','outline')}${btn('下一段 ›','nextBlock','outline')}</div><div style="margin:14px 0">${btn('我听熟了 · 去 GPT 语音练习','openPractice','primary block')}</div>${b.reviews?.length?`<div class="card soft"><strong>已存练习复盘（${b.reviews.length}）</strong>${b.reviews.map(x=>`<div class="note">${esc(x.text)}<div class="source">${esc(x.date)}</div></div>`).join('')}</div>`:''}`}
function makePrompt(n,b,k){return `你是我的英语口语陪练。我要练的是 SocialMate 的「${n.place}｜${n.title}」第 ${k+1} 段（recordId=${n.id}；blockId=${n.id}-b${k+1}；revision=${n.contentRevision||1}）。请使用语音互动，按以下严格顺序进行：\n\n第一轮【常用表达】：你用中文依次问我下列英语词组的意思或如何表达。不要提前告诉我英文答案；听到我回答后判断是否自然，必要时让我重答。\n目标表达：${b.phrases.join('；')||'从下文两种英文表达中挑选3个短语'}。\n\n第二轮【整段翻译】：你只说下面这段中文，等我用英语口头表达。\n中文：${b.cn}\n\n参考英文 A：${b.en1}\n参考英文 B：${b.en2}\n\n参考英文A/B仅用作你内部评分，绝不能在问答前说出来。不要要求我逐字背参考答案；意思准确、表达自然即可。如果我可以用两种不同而自然的表达方式讲出来，视为表现优秀。如果不流畅，针对出错的词组给我一两次提示，不直接公布答案。\n\n第三轮【反馈与复盘】：练习结束后，用中文生成可复制的简短报告，格式必须为：\n【recordId】${n.id}\n【blockId】${n.id}-b${k+1}\n【revision】${n.contentRevision||1}\n【练习地点】${n.place}\n【段落】第${k+1}段\n【通过状态】通过/需复习\n【掌握表达】…\n【薄弱表达】…\n【我的原话与建议改写】…\n【下次重点复习】…\n\n我会复制这份报告回 SocialMate 保存。开始时先问第一个常用表达，不要直接朗读全部参考答案。`}
function practiceView(){const n=state.notes.find(x=>x.id===state.note);const b=n.blocks[state.block];state.currentPrompt=makePrompt(n,b,state.block);return `${btn('‹ 返回听读','backStudy','ghost')}<h2 style="margin:4px 0">GPT Voice 口语练习</h2><p class="sub">先练常用搭配，再口译整段，最后把薄弱点带回来。</p><div class="card accent"><div class="row"><span class="num">1</span><div><strong>复制本段练习 Prompt</strong><div class="item-sub">包含目标表达、两种参考英文与反馈格式</div></div></div><div style="margin-top:12px">${btn('复制完整练习 Prompt','copyPrompt','primary block')}</div><details style="margin-top:12px"><summary class="small muted">查看提示词内容</summary><pre style="white-space:pre-wrap;font-size:11px;line-height:1.5">${esc(state.currentPrompt)}</pre></details></div><div class="card"><div class="row"><span class="num">2</span><div><strong>打开 ChatGPT 开始语音练习</strong><div class="item-sub">粘贴刚复制的内容，然后点击 ChatGPT 语音</div></div></div><a href="https://chatgpt.com/" target="_blank" rel="noopener" class="btn outline block" style="margin-top:12px;text-decoration:none">在浏览器打开 ChatGPT ↗</a></div><div class="card soft"><div class="row"><span class="num">3</span><div><strong>把练习复盘保存回来</strong><div class="item-sub">在 GPT 复制报告，粘贴下面，关联到这一段</div></div></div><div class="field"><textarea class="textarea" id="reviewInput" placeholder="【通过状态】需复习\n【掌握表达】...\n【薄弱表达】...\n【下次重点复习】..."></textarea></div>${btn('保存这段练习复盘','saveReview','primary block')}</div>`}
function settingsView(){return `${btn('‹ 返回应用','backSettings','ghost')}<h2 style="margin:4px 0">设置</h2><p class="sub">日常界面只保留日常功能；演示、诊断和开发工具全部收纳在这里。</p><div class="card"><div class="item-title">外观</div><div class="row between"><span>主题（默认浅色）</span><button type="button" class="btn outline" data-action="toggleTheme" id="protoThemeButton">切换浅色 / 深色</button></div></div><div class="card"><div class="item-title">朗读偏好</div><div class="field"><label>英语声线</label><select class="select"><option>系统英语声线（跟随设备）</option><option>英语（美式）· 可用时</option><option>英语（英式）· 可用时</option></select></div><div class="field"><label>常用朗读速度</label><select class="select"><option>0.9× 舒适</option><option>0.75× 慢速</option><option>1.0× 正常</option></select></div></div><div class="card"><div class="row between"><div><strong>演示与测试工具</strong><div class="small muted">仅在这里查看示例、重置、测试</div></div><span class="pill gray">高级</span></div><div class="divider"></div><div class="row between"><span>展示示例人物（预览模式）</span><button id="demoToggle" class="toggle ${state.sampleMode?'on':''}" aria-label="展示示例人物"></button></div><div class="small muted" style="margin:10px 0">正式产品默认只展示真实人物；演示数据及清空/恢复集中于此，不出现在 People 首页。</div><div class="btn-row">${btn('恢复示例内容','resetSamples','outline')}${btn('清空示例内容','clearSamples','danger')}</div></div><div class="card"><strong>安全与数据</strong><div class="small muted">人物与个人地点记录仅存在私有 Mac mini 数据区。原始海南地点和公开 PWA 不改写，敏感信息需用户确认后保存。</div></div>`}

function stopTTS(){state.ttsOn=false;if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speakText(text,lang,loop=false){stopTTS();if(!('speechSynthesis'in window)){toast('当前浏览器不提供朗读引擎，安卓正式版将用系统 TTS');return}if(!text){toast('这部分还没有文字');return}state.ttsOn=loop;const go=()=>{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.87;u.onend=()=>{if(state.ttsOn&&loop)go()};window.speechSynthesis.speak(u)};go();if(loop)render()}
function speakSequence(items,loop=false){stopTTS();if(!('speechSynthesis'in window)){toast('设备缺少系统语音引擎');return}const seq=items.filter(x=>x.text);if(!seq.length)return;state.ttsOn=loop;let i=0;const next=()=>{if(i>=seq.length){if(!loop){state.ttsOn=false;return}i=0}if(!loop&&i>0&&state.tab!=='hainan')return;let row=seq[i++];let u=new SpeechSynthesisUtterance(row.text);u.lang=row.lang;u.rate=.87;u.onend=()=>{if(loop&&!state.ttsOn)return;next()};window.speechSynthesis.speak(u)};next();if(loop)render()}

const act={toggleTheme:togglePreviewTheme,goPeople:()=>navig('people'),backPeople:()=>navig('people'),detailBack:()=>{state.page='detail';render()},capturePerson:()=>{state.page='capture';state.personInput='';render()},backCapture:()=>{state.page='capture';render()},backPlace:()=>{state.page='detail';render()},backHainan:()=>navig('hainan'),backStudy:()=>{state.page='study';render()},backSettings:()=>navig('people'),pickCapture:()=>showModal('选择要补充的人物',people().map(p=>`<div class="card" data-select-person="${p.id}"><div class="row"><div class="avatar">${esc(p.name[0])}</div><div class="grow"><strong>${esc(p.name)}</strong><div class="small muted">${esc(p.where)}</div></div><span>›</span></div></div>`).join('')+btn('＋ 新建人物','newPerson','outline block')),newPerson:()=>showModal('新建人物',`<p class="sub">先建立姓名，信息可以之后再补充。</p><div class="field"><label>姓名 / 称呼</label><input id="newPersonName" class="input" placeholder="例如：Sam"></div><div class="field"><label>地区（可选）</label><input id="newPersonWhere" class="input" placeholder="例如：英国·伦敦"></div>${btn('建立人物档案','saveNewPerson','primary block')}`),saveNewPerson:()=>{let name=$('#newPersonName')?.value.trim();if(!name)return toast('请先填写姓名');let p={id:'person-'+Date.now(),name,where:$('#newPersonWhere')?.value.trim()||'地区未填写',interest:'待补充',facts:[],history:[],last:'刚刚建立'};state.people.unshift(p);save();state.person=p.id;state.modal=null;state.page='detail';render();toast('人物档案已建立')},mockVoice:()=>{const e=$('#personInput');e.value='上次聊天得知，Oliver 每周去三次健身房，最近在准备人生第一次10公里跑步比赛，喜欢比较有计划地训练。';state.personInput=e.value;toast('已填入示例语音转写，正式版将调用语音输入')},analyzePerson:()=>{state.personInput=$('#personInput')?.value.trim()||'';if(!state.personInput)return toast('请先输入一段信息');let text=state.personInput;let parts=text.split(/[，,。；;\n]/).map(s=>s.trim()).filter(x=>x.length>=4);state.draft=parts.map(s=>({text:s,category:/健身|跑步|足球|运动|muscle|gym|训练/.test(s)?'兴趣与计划':/来自|英国|美国|国籍|住在/.test(s)?'基本情况':'沟通与生活',checked:true}));state.page='review';render()},savePersonDraft:()=>{let p=currentPerson();let d=state.draft||[];let selected=d.map((x,i)=>({...x,text:document.querySelector(`[data-draft="${i}"]`)?.value.trim(),checked:document.querySelector(`[data-confirm="${i}"]`)?.checked})).filter(x=>x.checked&&x.text);if(!selected.length)return toast('请至少勾选一条事实');let kept=selected.filter(x=>!p.facts.includes(x.text));p.facts.push(...kept.map(x=>x.text));p.history.unshift({date:dateStr(),text:`手动补充并确认 ${kept.length} 条事实`});p.last='刚刚更新';save();state.page='detail';render();toast(`已确认保存 ${kept.length} 条资料`)},startImport:()=>{state.importText='';state.page='import';render()},importBack:()=>navig('hainan'),backImport:()=>{state.page='import';render()},analyzePlace:()=>{state.importText=$('#placeInput')?.value.trim()||'';if(!state.importText)return toast('先粘贴游玩感悟');state.matched=/万绿园|草坪|大公园/i.test(state.importText)?'万绿园':'龙兴路';state.parsed=parseBlocks(state.importText);if(!state.parsed.length)return toast('没有识别到段落');state.page='review';render()},savePlaceNote:()=>{const place=$('#placeSelect')?.value||state.matched;const title=$('#noteTitle')?.value.trim()||place+' · 新记录';let n={id:'note-'+Date.now(),place,title,date:dateStr(),blocks:state.parsed};n.placeId=place==='龙兴路'?1:2;n.rawInput=state.importText;n.contentRevision=1;state.notes.unshift(n);state.place=place;state.note=n.id;state.block=0;save();state.page='study';render();toast('已追加到地点档案，保留原始介绍')},prevBlock:()=>{const n=state.notes.find(x=>x.id===state.note);state.block=Math.max(0,state.block-1);stopTTS();render()},nextBlock:()=>{const n=state.notes.find(x=>x.id===state.note);state.block=Math.min(n.blocks.length-1,state.block+1);stopTTS();render()},speakZh:()=>{const b=state.notes.find(x=>x.id===state.note).blocks[state.block];speakText(b.cn,'zh-CN')},speakEn1:()=>{const b=state.notes.find(x=>x.id===state.note).blocks[state.block];speakText(b.en1,'en-US')},speakEn2:()=>{const b=state.notes.find(x=>x.id===state.note).blocks[state.block];speakText(b.en2,'en-US')},speakPhrases:()=>{const b=state.notes.find(x=>x.id===state.note).blocks[state.block];speakText(b.phrases.join('... '),'en-US')},loopSpeak:()=>{if(state.ttsOn){stopTTS();render()}else{const b=state.notes.find(x=>x.id===state.note).blocks[state.block];speakSequence([{text:b.cn,lang:'zh-CN'}, {text:b.en1,lang:'en-US'}, {text:b.en2,lang:'en-US'}, ...b.phrases.map(text=>({text,lang:'en-US'}))],true)}},openPractice:()=>{stopTTS();state.page='practice';render()},copyPrompt:()=>{const txt=state.currentPrompt;const fall=()=>{showModal('请手动复制练习提示词',`<textarea class="textarea" style="height:275px">${esc(txt)}</textarea>`)};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>toast('已复制，请到 ChatGPT 粘贴并打开语音')).catch(fall)}else fall()},saveReview:()=>{const s=$('#reviewInput')?.value.trim();if(!s)return toast('请先粘贴 GPT 练习复盘');const n=state.notes.find(x=>x.id===state.note);n.blocks[state.block].reviews=n.blocks[state.block].reviews||[];n.blocks[state.block].reviews.push({text:s,date:dateStr()});save();state.page='study';render();toast('薄弱点复盘已归档到本段')},resetSamples:()=>showModal('恢复示例内容',`<p>将把本原型的示例人物和龙兴路示例学习记录恢复到初始状态。仅影响这个预览中的示例数据。</p>${btn('确认恢复示例','doResetSamples','primary block')}`),doResetSamples:()=>{stopTTS();state.people=[...state.people.filter(p=>!p.demo),...structuredClone(defaultPeople)];state.notes=[...state.notes.filter(n=>!n.demo),...structuredClone(defaultNotes)];state.sampleMode=true;state.modal=null;save();navig('people');toast('示例内容已恢复')},clearSamples:()=>showModal('清空示例内容',`<p>只清除这个交互原型的示例数据，不会删除 Mac mini 的真实人物或地点档案。</p>${btn('确认清空示例','doClearSamples','danger block')}`),doClearSamples:()=>{state.people=state.people.filter(p=>!p.demo);state.notes=state.notes.filter(n=>!n.demo);state.sampleMode=false;state.modal=null;save();navig('settings');toast('示例内容已清空；可以随时恢复')},closeModal:()=>{state.modal=null;$('#modalRoot').innerHTML=''}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t){e.preventDefault();act[t.dataset.action]?.();return}const nav=e.target.closest('[data-tab]');if(nav){navig(nav.dataset.tab);return}const p=e.target.closest('[data-person]');if(p){state.person=p.dataset.person;state.tab='people';state.page='detail';render();return}const pick=e.target.closest('[data-select-person]');if(pick){state.person=pick.dataset.selectPerson;state.modal=null;state.tab='people';state.page='capture';state.personInput='';render();return}const place=e.target.closest('[data-place]');if(place){state.place=place.dataset.place;navig('hainan','detail');return}const note=e.target.closest('[data-note]');if(note){state.note=note.dataset.note;state.block=0;navig('hainan','study');return}if(e.target.id==='settingsBtn'){stopTTS();navig('settings');return}if(e.target.id==='demoToggle'){state.sampleMode=!state.sampleMode;save();render();toast('设置已保存')}if(e.target.id==='modalBg'){act.closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){act.closeModal();stopTTS()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-person],[data-place],[data-note]')){e.preventDefault();e.target.click()}});window.addEventListener('beforeunload',()=>stopTTS());render();
