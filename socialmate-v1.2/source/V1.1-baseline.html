async function copy(v){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(v);else{let t=document.createElement('textarea');t.value=v;t.style.position='fixed';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('clipboard');t.remove()}tip('已复制英文内容')}catch{tip('复制受浏览器限制，请长按选择文字')}}
function source(kind,id){return kind==='app'?D.apps.find(x=>x.id===id):kind==='place'?D.places.find(x=>String(x.id)===id):SAV.stories.find(x=>x.id===id)}
function pin(kind,id){let x=source(kind,id);if(!x)return;let title=kind==='app'?x.name:kind==='place'?x.cnName:x.title;SAV.pins=SAV.pins.filter(p=>p.kind!==kind||p.id!==id);SAV.pins.unshift({kind,id,title,en:x.en});SAV.pins=SAV.pins.slice(0,12);persist();tip('已加入聊天参考');}
function cardsFor(q){q=q.toLowerCase();let scored=[];let words=[...new Set(q.match(/[a-z]{3,}|[\u4e00-\u9fa5]{2,}/g)||[])];let aliases={'outdoors':['公园','海边','火山','自然','walk','volcano'],'coffee':['咖啡','coffee','café'],'software':['软件','app','project'],'beach':['海边','coast','sea'],'music':['live','夜市','音乐']};let kws=[...words];for(let w of words){if(aliases[w])kws.push(...aliases[w]);}for(let item of D.apps){let text=(item.name+item.en+item.cn).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'app',id:item.id,title:item.name,en:item.en,score})}for(let item of D.places){let text=(item.cnName+item.enName+item.cn+item.en).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'place',id:String(item.id),title:item.cnName,en:item.en,score:score+((q.includes('outdoor')&&item.id===9)?4:0)})}for(let item of SAV.stories){let text=(item.title+item.cn+item.en).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'story',id:item.id,title:item.title,en:item.en,score})}scored.sort((a,b)=>b.score-a.score);return scored.slice(0,5)}
function question(){let q=S.session?.messages.at(-1)?.text?.toLowerCase()||'';return /coffee|cafe/.test(q)?'Do you have a favorite café here in Haikou?':/nature|outdoor|walk|park|hike/.test(q)?'Do you like going for a walk by the sea?':/app|software|coding/.test(q)?'What kind of apps do you find useful?':'What brought you to Haikou?'}

function settingOptions(group,choices){
  return '<div class="setting-options" role="group" aria-label="'+({font:'整体字号',english:'英文阅读字号',density:'页面疏密'}[group])+'">'+
    choices.map(function(a){return '<button type="button" class="setting-option '+(SAV.display[group]===a[0]?'on':'')+'" data-display="'+group+'" data-value="'+a[0]+'" aria-pressed="'+(SAV.display[group]===a[0])+'">'+a[1]+'</button>';}).join('')+'</div>';
}
function openSettings(){
  modal('<div class="setting-head"><h2>显示与阅读设置</h2><button type="button" class="iconbutton" data-action="close" aria-label="关闭设置">×</button></div>'+
    '<p class="setting-hint">字号和疏密可以分别调整，修改立即生效，并保存到当前浏览器。</p>'+
    '<label class="formlabel">整体文字大小</label>'+settingOptions('font',[['normal','标准'],['large','较大'],['extra','大字'],['huge','超大']])+
    '<label class="formlabel">英文阅读字号</label>'+settingOptions('english',[['normal','标准'],['large','加大'],['extra','特大']])+
    '<label class="formlabel">卡片与页面间距</label>'+settingOptions('density',[['compact','紧凑'],['comfortable','舒适'],['relaxed','宽松']])+
    '<div class="setting-preview"><strong>即时阅读预览</strong><p>海口有很多适合散步的地方。</p><p class="english-reading" lang="en">Do you prefer running by the sea or walking in a park?</p></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="resetDisplay">恢复默认</button><button type="button" class="btn mainbtn" data-action="close">完成</button></div>');
}
function modal(inner){$('#modalcontent').innerHTML=inner;$('#modalbg').classList.add('open')};function closeModal(){$('#modalbg').classList.remove('open')}
function start(){modal('<h2>开始对话演示</h2><p>本页手动输入模拟字幕，不会打开麦克风。勾选云端同意并通过 Mac mini 私有网关打开页面后，会使用真实 AI 自动接话。</p>'+
 '<label class="formlabel" for="providerChoice">AI 线路</label><select class="field" id="providerChoice"><option value="deepseek/deepseek-flash">DeepSeek 官方 · Flash（默认）</option><option value="deepseek/deepseek-v4-pro">DeepSeek 官方 · V4 Pro</option><option value="opencode-go/deepseek-v4.1-flash">OpenCode Go · V4.1 Flash</option></select>'+
 '<label class="consent-line"><input type="checkbox" id="confirm">我知道本页为模拟字幕，真人录音须取得双方同意。</label>'+
 '<label class="consent-line"><input type="checkbox" id="cloudConsent">可选：允许将本轮对话文字发送至所选的 AI 服务商以生成建议。默认不发送；涉及朋友隐私需先征得同意。</label>'+
 '<div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="startok">进入演示</button></div>')}
function addMessage(text,who='friend'){if(!S.session){start();return};if(!text.trim())return tip('请输入英文原话');S.session.messages.push({who,text:text.trim(),time:new Date().toLocaleTimeString('zh-CN')});S.recs=automaticCards();S.ai=null;S.aiState='demo';render();requestRealAI()}
function review(){if(!S.session?.messages.length)return tip('先添加一句对话');let p=SAV.people.find(x=>x.id===S.person);let conversation=S.session.messages.map(x=>`${x.who==='me'?'我':'朋友（待核对）'}: ${x.text}`).join('\n\n');S.review=`# SocialMate · ${new Date().toLocaleString('zh-CN')}\n\n来源：手动模拟输入，非真实 ASR。\n\n${conversation}`;modal(`<h2>会后人工确认</h2><p>请核对原始句子、人物归属和下次值得记住的信息，不能把 AI 猜测写成事实。</p><label class="formlabel">可编辑的会话纪要</label><textarea class="field" style="min-height:135px" id="reviewText">${esc(S.review)}</textarea><label class="formlabel">对方确定说过的事实（可留空）</label><textarea class="field" id="factText" placeholder="例如：他告诉我他喜欢海边徒步。"></textarea><label style="display:flex;gap:9px;align-items:start;font-size:13px;margin-top:12px"><input type="checkbox" id="confirm">我已确认说话人和事实，可仅保存到本机演示档案。</label><div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="save">确认归档</button></div>`)}
function editStory(id){let s=SAV.stories.find(x=>x.id===id);modal(`<h2>${s?'编辑':'新增'}个人话题</h2><label class="formlabel">标题</label><input id="storyTitle" class="field" value="${esc(s?.title||'')}"><label class="formlabel">分类</label><input id="storyCategory" class="field" placeholder="例如：兴趣 / 家乡 / 工作" value="${esc(s?.cat||'生活')}"><label class="formlabel">标签（逗号分隔）</label><input id="storyTags" class="field" placeholder="例如：户外,跑步,英语角" value="${esc((s?.tags||[]).join(', '))}"><label class="formlabel">中文真实事实</label><textarea id="storyCn" class="field">${esc(s?.cn||'')}</textarea><label class="formlabel">自然英文</label><textarea id="storyEn" class="field">${esc(s?.en||'')}</textarea><div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="savestory" data-id="${esc(id||'new')}">保存</button></div>`)}
function addPerson(){modal('<h2>新建人物</h2><label class="formlabel">称呼</label><input id="personName" class="field" placeholder="如：周末认识的朋友"><label class="formlabel">已确认备注</label><textarea class="field" id="personNote" placeholder="只记录对方明确说过的事实"></textarea><div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="saveperson">保存人物</button></div>')}
function download(name,text){const blob=new Blob([text],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
document.addEventListener('click',e=>{
 let setting=e.target.closest('[data-display]');
 if(setting){
   const k=setting.dataset.display,v=setting.dataset.value;
   if(displayValid[k]?.includes(v)){
     SAV.display[k]=v;persist();applyDisplay();
     document.querySelectorAll('[data-display="'+k+'"]').forEach(b=>{
       const active=b.dataset.value===v;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active));
     });
   }
   return;
 }
 let nav=e.target.closest('[data-nav]');if(nav)return setTab(nav.dataset.nav);let f=e.target.closest('[data-filter]');if(f){S[f.dataset.filter]=f.dataset.value;render();return}let related=e.target.closest('[data-related]');
 if(related){let kind=related.dataset.related,id=related.dataset.id;
   setTab(kind==='place'?'hainan':kind==='app'?'software':'self');
   openDetail(kind,id);
   $('#drawerbody').insertAdjacentHTML('afterbegin','<div class="actions"><button class="btn tinted" data-act="backchat">← 返回聊天（会话保留）</button></div>');
   return;
 }
 let coached=e.target.closest('[data-coach]');
 if(coached){let pl=S.aiState==='ready'&&S.ai?{respond:S.ai.reply,ask:S.ai.questions,share:S.ai.share}:coachPlan(),key=coached.dataset.coach;
   if(pl)return copy(key==='respond'?pl.respond:key==='share'?pl.share:pl.ask[Number(key.split('-')[1])]);
 }
 let open=e.target.closest('[data-open]');if(open)return openDetail(open.dataset.open,open.dataset.id);let copyBtn=e.target.closest('[data-copy]');if(copyBtn){let x=source(copyBtn.dataset.copy,copyBtn.dataset.id);if(x)copy(x.en);return}let pinBtn=e.target.closest('[data-pin]');if(pinBtn)return pin(pinBtn.dataset.pin,pinBtn.dataset.id);let sa=e.target.closest('[data-sample]');if(sa){let demos={running:'I like running outdoors near the sea. Is there a nice park or running route in Haikou?',software:'What kind of software have you built?',coffee:'I love coffee. Do you know a good café around here?'};return addMessage(demos[sa.dataset.sample])}let sel=e.target.closest('[data-selectperson]');if(sel){S.person=sel.dataset.selectperson;closeDrawer();setTab('chat');return}let edt=e.target.closest('[data-editstory]');if(edt)return editStory(edt.dataset.editstory);let dow=e.target.closest('[data-download]');if(dow){let s=SAV.sessions.find(x=>x.id===dow.dataset.download);if(s)download('SocialMate-Conversation.md',s.review);return}let a=e.target.closest('[data-act]');if(a){switch(a.dataset.act){case 'resetDisplay':SAV.display={font:'normal',english:'normal',density:'comfortable'};persist();applyDisplay();openSettings();return;case 'connect-asr':return connectLiveASR();case 'disconnect-asr':return disconnectLiveASR();case 'start':return start();case 'backchat':closeDrawer();return setTab('chat');case 'addstory':return editStory();case 'addperson':return addPerson();case 'send':return addMessage($('#msg')?.value||'',$('#who')?.value||'friend');case 'review':return review();case 'discard':if(confirm('清空未保存的模拟会话？')){disconnectLiveASR();S.aiSeq++;S.ai=null;S.aiState='demo';S.session=null;S.recs=[];render()}return;case 'refsearch':S.recs=cardsFor($('#refq').value);return showRecs();case 'clearref':S.recs=automaticCards();return showRecs();case 'copyask':return copy(question());}}let m=e.target.closest('[data-action]');if(!m)return;switch(m.dataset.action){case 'close':closeModal();break;case 'startok':if(!$('#confirm').checked)return tip('请先确认演示说明');{let choice=$('#providerChoice').value.split('/');S.session={id:String(Date.now()),messages:[],date:new Date().toLocaleString('zh-CN'),cloudConsent:$('#cloudConsent').checked,provider:choice[0],model:choice[1],liveMode:false};S.ai=null;S.aiState='demo';S.aiError='';S.aiSeq++;S.lastLiveAiAt=0;S.asrSeen=new Set();closeModal();render();}break;case 'save':if(!$('#confirm').checked)return tip('请先人工确认');{let p=SAV.people.find(x=>x.id===S.person),ss=S.session;ss.review=$('#reviewText').value;ss.personName=p?.name||'未关联人物';ss.personId=p?.id||'';let notes=$('#factText').value.trim();if(notes&&p){p.notes??=[];p.notes.push({date:ss.date,text:notes})}SAV.sessions.push(ss);persist();disconnectLiveASR();S.session=null;S.recs=[];closeModal();setTab('people');tip('已保存到此浏览器')}break;case 'savestory':{let title=$('#storyTitle').value.trim(),cn=$('#storyCn').value.trim(),en=$('#storyEn').value.trim();if(!title||!cn||!en)return tip('请填写完整中英文');let s=SAV.stories.find(x=>x.id===m.dataset.id);let cat=($('#storyCategory')?.value||'生活').trim().slice(0,28)||'生活';let tags=($('#storyTags')?.value||'').split(/[,，、]/).map(v=>v.trim().slice(0,24)).filter(Boolean).slice(0,10);if(s)Object.assign(s,{title,cn,en,cat,tags});else SAV.stories.push({id:String(Date.now()),title,cn,en,cat,tags});S.storyTag='全部';S.q='';persist();closeModal();closeDrawer();render();tip('已保存本机话题');}break;case 'saveperson':{let name=$('#personName').value.trim();if(!name)return tip('请填写称呼');SAV.people.push({id:String(Date.now()),name,about:$('#personNote').value.trim(),notes:[]});persist();closeModal();render();tip('人物已保存本机');}break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.q=e.target.value;updateResults()}});document.addEventListener('change',e=>{if(e.target.id==='chatPerson')S.person=e.target.value;if(e.target.id==='liveCloudConsent'&&S.session){S.session.cloudConsent=e.target.checked;if(e.target.checked)requestRealAI();else{S.aiSeq++;S.aiState='demo';S.ai=null;S.aiError='';showRecs();render();}}});
$('#theme').onclick=()=>{SAV.theme=SAV.theme==='light'?'dark':'light';persist();theming()};$('#displaySettings').onclick=openSettings;$('#drawerbg').onclick=closeDrawer;$('#closeDrawer').onclick=closeDrawer;$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});theming();if(LIVE_MODE)autoStartLiveSession();else setTab('software');
