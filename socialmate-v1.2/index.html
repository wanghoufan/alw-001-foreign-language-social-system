冰淇淋店跑很远。", "en": "You can find it at A gelato shop in the Longxing Road area of Longhua District. A simple treat while walking around Longxing Road. Grab some gelato, take a break, and carry on exploring the cafés and pretty shopfronts.", "locationCn": "海口市龙华区龙兴路一带的冰淇淋小店", "locationEn": "A gelato shop in the Longxing Road area of Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Hippo%20Gelato%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Hippo%20Gelato%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 28, "cnName": "金盘夜市", "enName": "Jinpan Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区金盘路8号。这座夜市更有附近居民出来吃宵夜的感觉，摊位多，价格和选择比较接地气。晚上来试试烤串、海南小吃，比去商场吃饭更能感受本地生活。", "en": "It is at No. 8 Jinpan Road, Longhua District, Haikou. This night market feels like where nearby residents go for supper. Expect barbecue, local snacks, and a lively, everyday atmosphere rather than a polished tourist show.", "locationCn": "海口市龙华区金盘路8号", "locationEn": "No. 8 Jinpan Road, Longhua District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E7%9B%98%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E7%9B%98%E5%A4%9C%E5%B8%82"}, {"id": 29, "cnName": "寻尝里夜市", "enName": "Xunchangli Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市秀英区美俗路35号。这里是一片集中的夜市小吃区，适合几个人一起点不同的东西分着吃。比起只找一家餐厅，边走边选更有乐趣，尤其适合不知道要吃什么的时候。", "en": "It is at No. 35 Meisu Road, Xiuying District, Haikou. This is an easy place to sample different foods in one evening. Go with friends, pick a few stalls, share dishes, and see what you discover.", "locationCn": "海口市秀英区美俗路35号", "locationEn": "No. 35 Meisu Road, Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%AF%BB%E5%B0%9D%E9%87%8C%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%AF%BB%E5%B0%9D%E9%87%8C%E5%A4%9C%E5%B8%82"}, {"id": 30, "cnName": "福地夜巷", "enName": "Fudi Night Lane", "city": "海口", "category": "美食夜生活", "cn": "海口市琼山区忠介路86号，府城老城区内。这里把传统老城区和热闹夜市结合起来，逛完府城老街可以直接接着吃宵夜。附近有不少海南本地小吃，是晚上体验府城生活的方便一站。", "en": "It is at No. 86 Zhongjie Road in Qiongshan District, within old Fucheng. This night market is right in old Fucheng, so you can explore the older streets and then stay for snacks. It's a convenient way to experience the neighborhood after dark.", "locationCn": "海口市琼山区忠介路86号，府城老城区内", "locationEn": "No. 86 Zhongjie Road in Qiongshan District, within old Fucheng", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%A6%8F%E5%9C%B0%E5%A4%9C%E5%B7%B7", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%A6%8F%E5%9C%B0%E5%A4%9C%E5%B7%B7"}, {"id": 31, "cnName": "桂林洋大学城夜市", "enName": "Guilinyang University Town Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市美兰区桂林洋大学城一带。这里以学生为主，夜市的感觉比较年轻，常见各种实惠小吃和饮料。适合想看看海南大学城夜生活、顺便找点便宜好吃东西的人。", "en": "You can find it at The Guilinyang university district in Meilan District, Haikou. The crowd here is mostly students, and the food is casual and affordable. Visit for the lively university-night-market vibe and an easy late snack.", "locationCn": "海口市美兰区桂林洋大学城一带", "locationEn": "The Guilinyang university district in Meilan District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E5%A4%A7%E5%AD%A6%E5%9F%8E%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E5%A4%A7%E5%AD%A6%E5%9F%8E%E5%A4%9C%E5%B8%82"}, {"id": 32, "cnName": "丁村万人海鲜广场", "enName": "Dingcun Seafood Square", "city": "海口", "category": "美食夜生活", "cn": "海口市琼山区丁村一带的万人海鲜广场。和普通餐厅不同，这里可以先挑海鲜，再按自己的口味让店家加工。适合几个朋友一起点鱼、虾、蟹，体验海南人热热闹闹吃海鲜的方式。", "en": "You can find it at Dingcun Seafood Square in Qiongshan District, Haikou. You choose seafood first and then have it cooked the way you like. It's especially fun with a group, sharing fish, prawns, and crab around a big table.", "locationCn": "海口市琼山区丁村一带的万人海鲜广场", "locationEn": "Dingcun Seafood Square in Qiongshan District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%81%E6%9D%91%E4%B8%87%E4%BA%BA%E6%B5%B7%E9%B2%9C%E5%B9%BF%E5%9C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%81%E6%9D%91%E4%B8%87%E4%BA%BA%E6%B5%B7%E9%B2%9C%E5%B9%BF%E5%9C%BA"}, {"id": 33, "cnName": "东门市场", "enName": "Dongmen Market", "city": "海口", "category": "美食夜生活", "cn": "海口市美兰区博爱南路和东门市场周边。这里不是精致的网红打卡点，而是能看到海南人真实买菜生活的市场。鱼虾、热带水果、香料和各种食材都很有地方特色，早上来会更有意思。", "en": "It is around Dongmen Market and Bo'ai South Road in Meilan District. This is a real local market, not a polished photo attraction. Come in the morning to see seafood, tropical fruit, spices, and the bustle of everyday shopping.", "locationCn": "海口市美兰区博爱南路和东门市场周边", "locationEn": "Around Dongmen Market and Bo'ai South Road in Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E9%97%A8%E5%B8%82%E5%9C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E9%97%A8%E5%B8%82%E5%9C%BA"}, {"id": 34, "cnName": "观澜湖美食自助夜市", "enName": "Mission Hills Food Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区观澜湖新城石矿湖附近。它和传统夜市不同，走的是买票后集中尝多种风味小吃的模式，节假日和周末比较热闹。可能还有表演和游乐安排，去之前一定要确认当期有没有开场。", "en": "It is near Shikuang Lake in Mission Hills Centreville, Longhua District. Unlike a normal night market, this one has offered a ticketed all-you-can-try food experience. Entertainment and opening dates can change, so check the current event schedule first.", "locationCn": "海口市龙华区观澜湖新城石矿湖附近", "locationEn": "Near Shikuang Lake in Mission Hills Centreville, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%BE%9C%E6%B9%96%E7%BE%8E%E9%A3%9F%E8%87%AA%E5%8A%A9%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%BE%9C%E6%B9%96%E7%BE%8E%E9%A3%9F%E8%87%AA%E5%8A%A9%E5%A4%9C%E5%B8%82"}, {"id": 35, "cnName": "上邦百汇城", "enName": "Shangbang Baihuicheng", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区国贸片区的上邦百汇城。这是市中心比较方便约朋友的餐饮购物区，周围选择多。它不是必须专程旅游的地标，不过热得不想走户外时，来吃饭、看电影或喝咖啡很实用。", "en": "You can find it at Shangbang Baihuicheng in Haikou's Guomao district. A convenient central place for food, shopping, and meeting friends. It's not a must-see landmark, but it's handy when it's too hot to spend the whole day outdoors.", "locationCn": "海口市龙华区国贸片区的上邦百汇城", "locationEn": "Shangbang Baihuicheng in Haikou's Guomao district", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%8A%E9%82%A6%E7%99%BE%E6%B1%87%E5%9F%8E", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%8A%E9%82%A6%E7%99%BE%E6%B1%87%E5%9F%8E"}, {"id": 36, "cnName": "友谊阳光城", "enName": "Friendship Sunshine City", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区金龙路的友谊阳光城。国贸片区的大型商场，餐饮、娱乐和购物集中，最适合用来躲太阳或下雨天安排活动。想找一个集合地点再去附近逛街，也很方便。", "en": "You can find it at Youyi Sunshine City on Jinlong Road, Longhua District. A large shopping mall in the Guomao area, useful for food, entertainment, and escaping the midday heat. It's also an easy meeting point.", "locationCn": "海口市龙华区金龙路的友谊阳光城", "locationEn": "Youyi Sunshine City on Jinlong Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%8F%8B%E8%B0%8A%E9%98%B3%E5%85%89%E5%9F%8E", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%8F%8B%E8%B0%8A%E9%98%B3%E5%85%89%E5%9F%8E"}, {"id": 37, "cnName": "cdf海口国际免税城", "enName": "CDF Haikou International Duty Free City", "city": "海口", "category": "美食夜生活", "cn": "海口市秀英区滨海大道西段，新海港附近。这里最特别的是商场规模很大，适合喜欢国际品牌和免税购物的人。它和看风景的景区不一样，更适合把购物、吃饭和看大型室内空间安排在一起。", "en": "It is on western Binhai Avenue in Xiuying District, near Xinhai Port. This is a huge duty-free shopping complex near the port. Visit for international brands and indoor shopping rather than beaches or nature.", "locationCn": "海口市秀英区滨海大道西段，新海港附近", "locationEn": "On western Binhai Avenue in Xiuying District, near Xinhai Port", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3cdf%E6%B5%B7%E5%8F%A3%E5%9B%BD%E9%99%85%E5%85%8D%E7%A8%8E%E5%9F%8E", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3cdf%E6%B5%B7%E5%8F%A3%E5%9B%BD%E9%99%85%E5%85%8D%E7%A8%8E%E5%9F%8E"}, {"id": 38, "cnName": "海口湾演艺中心", "enName": "Haikou Bay Performing Arts Center", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区滨海大道海口湾一带。海口湾演艺中心适合有演出时专门来，音乐会、剧场节目才是重点。最好先看节目单和票务，别只为了打卡建筑跑一趟。", "en": "It is along Binhai Avenue near Haikou Bay, Longhua District. The real reason to visit is a concert or performance, not just the building. Check the program and tickets before planning your evening.", "locationCn": "海口市龙华区滨海大道海口湾一带", "locationEn": "Along Binhai Avenue near Haikou Bay, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BC%94%E8%89%BA%E4%B8%AD%E5%BF%83", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BC%94%E8%89%BA%E4%B8%AD%E5%BF%83"}, {"id": 39, "cnName": "万绿园", "enName": "Evergreen Park (Wanlüyuan)", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区滨海大道38号，海口湾边。万绿园是海口人经常去散步、跑步、野餐的大草坪，天气舒服时很有生活气。比起拍一个固定景点，更适合带朋友放松，看草地、椰树和海边城市风景。", "en": "It is at No. 38 Binhai Avenue, Longhua District, right by Haikou Bay. This is where locals picnic, run, and relax on big lawns near the bay. Come to slow down and see everyday Haikou life rather than chase a famous landmark.", "locationCn": "海口市龙华区滨海大道38号，海口湾边", "locationEn": "No. 38 Binhai Avenue, Longhua District, right by Haikou Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%87%E7%BB%BF%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%87%E7%BB%BF%E5%9B%AD"}, {"id": 40, "cnName": "世纪公园", "enName": "Century Park", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区世纪公园，靠近世纪大桥南端。这里最有代表性的画面就是高高的世纪大桥和海口湾放在一起。傍晚能看桥上的车灯、海面和城市建筑，特别适合拍海口夜景。", "en": "You can find it at Century Park in Longhua District, near the south end of Century Bridge. The best view combines Century Bridge, the bay, and Haikou's skyline. Come at dusk when the bridge lights and city reflections begin to appear.", "locationCn": "海口市龙华区世纪公园，靠近世纪大桥南端", "locationEn": "Century Park in Longhua District, near the south end of Century Bridge", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%96%E7%BA%AA%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%96%E7%BA%AA%E5%85%AC%E5%9B%AD"}, {"id": 41, "cnName": "海口湾滨海步道", "enName": "Haikou Bay Waterfront Walk", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区海口湾沿岸，世纪公园至云洞图书馆一带。这条路线适合边走边看现代海口，不需要门票，也不必专门安排项目。海风、桥梁、海边建筑和落日都能拍到，晚上散步也很舒服。", "en": "It is along Haikou Bay in Longhua District, around Century Park and Cloud Cave Library. This waterfront walk gives you bridges, modern buildings, and sea views in one easy route. It's free, relaxed, and especially pleasant toward sunset.", "locationCn": "海口市龙华区海口湾沿岸，世纪公园至云洞图书馆一带", "locationEn": "Along Haikou Bay in Longhua District, around Century Park and Cloud Cave Library", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BB%A8%E6%B5%B7%E6%AD%A5%E9%81%93", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BB%A8%E6%B5%B7%E6%AD%A5%E9%81%93"}, {"id": 42, "cnName": "西秀海滩", "enName": "Xixiu Beach", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区滨海大道173号附近。这里和一般海滩不同，能看到帆船帆板训练的场景，是海南海上运动很有代表性的地方。想体验帆船要找正规机构预约，光是海边看船也挺有意思。", "en": "It is around No. 173 Binhai Avenue, Xiuying District. This beach is known for sailing and windsurfing, so you might see boats and training activities. Book a proper operator if you want to try the sport yourself.", "locationCn": "海口市秀英区滨海大道173号附近", "locationEn": "Around No. 173 Binhai Avenue, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A5%BF%E7%A7%80%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A5%BF%E7%A7%80%E6%B5%B7%E6%BB%A9"}, {"id": 43, "cnName": "假日海滩", "enName": "Holiday Beach", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区滨海大道西段的假日海滩。这里是一条有椰树、沙滩和海风的城市海岸，适合傍晚散步或者坐着看落日。海口的海水条件和三亚不同，来这里主要是休闲看海，不要默认能安全游泳。", "en": "You can find it at Holiday Beach on western Binhai Avenue, Xiuying District. A classic city beach for coconut trees, sea breezes, and sunsets. Come mainly to relax by the water; swimming conditions are not the same as at every resort beach.", "locationCn": "海口市秀英区滨海大道西段的假日海滩", "locationEn": "Holiday Beach on western Binhai Avenue, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%81%87%E6%97%A5%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%81%87%E6%97%A5%E6%B5%B7%E6%BB%A9"}, {"id": 44, "cnName": "观海台", "enName": "Guanhaitai Seaside Viewpoint", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区西海岸滨海大道沿线的观海台。这是西海岸比较容易停下来欣赏海景的地方，海面开阔，适合看夕阳。可以和假日海滩、西秀海滩安排在同一趟路线上，不必单独开车来回折腾。", "en": "You can find it at Guanhaitai on the western coastal stretch of Binhai Avenue. A simple open-water viewpoint on Haikou's west coast, best around sunset. Combine it with nearby beaches instead of making a separate long trip.", "locationCn": "海口市秀英区西海岸滨海大道沿线的观海台", "locationEn": "Guanhaitai on the western coastal stretch of Binhai Avenue", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%B5%B7%E5%8F%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%B5%B7%E5%8F%B0"}, {"id": 45, "cnName": "白沙门公园", "enName": "Baishamen Park", "city": "海口", "category": "海滨日落", "cn": "海口市美兰区海甸六东路一带的白沙门公园。这里更像海口人的海边生活公园，草地、树荫和休闲步道都有。适合早晚散步或带朋友轻松运动，不是那种需要排队拍照的大景区。", "en": "You can find it at Baishamen Park near Haidian Sixth East Road, Meilan District. A local seaside park with lawns, shade, and walking paths. It's best for a relaxed stroll or light exercise rather than a big sightseeing itinerary.", "locationCn": "海口市美兰区海甸六东路一带的白沙门公园", "locationEn": "Baishamen Park near Haidian Sixth East Road, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%99%BD%E6%B2%99%E9%97%A8%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%99%BD%E6%B2%99%E9%97%A8%E5%85%AC%E5%9B%AD"}, {"id": 46, "cnName": "拾贝公园", "enName": "Shibei Park", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区西海岸沿线的拾贝公园。这片滨海公园的特点是空间开阔、路好走，适合吹风和拍海边散步的生活照。若本来就在西海岸，可以顺路停一停。", "en": "You can find it at Shibei Park on the west coast of Xiuying District. This is an open coastal park for an easy walk and breezy photos. It's worth a stop if you're already exploring Haikou's western shoreline.", "locationCn": "海口市秀英区西海岸沿线的拾贝公园", "locationEn": "Shibei Park on the west coast of Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%8B%BE%E8%B4%9D%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%8B%BE%E8%B4%9D%E5%85%AC%E5%9B%AD"}, {"id": 47, "cnName": "金沙湾滨海公园", "enName": "Jinsha Bay Coastal Park", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区金沙湾海岸一带。海面和沙滩比较开阔，天气好时适合野餐、拍日落和放空。这里的看点不是密集娱乐项目，而是能找块空地舒服地坐一会儿。", "en": "You can find it at The Jinshawan coast in Xiuying District, Haikou. The broad coastline is best for a picnic, an open sunset view, or simply sitting by the sea. It's about space and quiet rather than lots of attractions.", "locationCn": "海口市秀英区金沙湾海岸一带", "locationEn": "The Jinshawan coast in Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E6%B2%99%E6%B9%BE%E6%BB%A8%E6%B5%B7%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E6%B2%99%E6%B9%BE%E6%BB%A8%E6%B5%B7%E5%85%AC%E5%9B%AD"}, {"id": 48, "cnName": "桂林洋海滨", "enName": "Guilinyang Coast", "city": "海口", "category": "海滨日落", "cn": "海口市美兰区桂林洋海岸一带。这里离市中心有一段距离，海岸感觉相对自然，游客聚集程度低一些。适合喜欢安静海景和海岸摄影的人，但去之前要了解交通、天气和海浪情况。", "en": "You can find it at The Guilinyang coast in Meilan District. This stretch feels more natural and less crowded than the central bay. Go for quiet coastal scenery, but check access, weather, and sea conditions first.", "locationCn": "海口市美兰区桂林洋海岸一带", "locationEn": "The Guilinyang coast in Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E6%B5%B7%E6%BB%A8", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E6%B5%B7%E6%BB%A8"}, {"id": 49, "cnName": "东寨港红树林", "enName": "Dongzhai Harbor Mangroves", "city": "海口", "category": "自然体验", "cn": "海口市美兰区演丰镇红林路，东寨港湿地一带。这里不是普通森林，而是树根长在潮水里的红树林湿地。跟着正规观景路线看树根、滩涂和鸟类，很容易发现海南不只有椰树和沙滩。", "en": "You can find it at Honglin Road in Yanfeng Town, Meilan District, by Dongzhai Harbor. These trees grow in tidal water, creating a very different kind of forest. Follow the proper viewing route to see their roots, mudflats, and birds.", "locationCn": "海口市美兰区演丰镇红林路，东寨港湿地一带", "locationEn": "Honglin Road in Yanfeng Town, Meilan District, by Dongzhai Harbor", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%AF%A8%E6%B8%AF%E7%BA%A2%E6%A0%91%E6%9E%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%AF%A8%E6%B8%AF%E7%BA%A2%E6%A0%91%E6%9E%97"}, {"id": 50, "cnName": "三卿村", "enName": "Sanqing Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇，火山口地质公园附近。三卿村的石屋、石墙和小路很多都是用火山石砌成的，走进去有一种被黑色石头包围的感觉。很适合和火山口公园安排在同一天，看完自然地貌再看火山村落。", "en": "You can find it at Shishan Town, Xiuying District, close to the volcano park. Many houses, lanes, and walls here are built from volcanic stone. Pair it with the volcano park to see how the same rock shaped both the land and village life.", "locationCn": "海口市秀英区石山镇，火山口地质公园附近", "locationEn": "Shishan Town, Xiuying District, close to the volcano park", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%89%E5%8D%BF%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%89%E5%8D%BF%E6%9D%91"}, {"id": 51, "cnName": "美社村", "enName": "Meishe Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇美社村。这里最值得看的是火山岩石屋和海南乡村的老巷子，不是大型商业景点。适合慢慢走，看看当地人怎么在火山石环境里生活。", "en": "You can find it at Meishe Village in Shishan Town, Xiuying District. This village is known for traditional volcanic-stone buildings and old lanes. It's a quiet place to see how people have lived in Haikou's volcanic countryside.", "locationCn": "海口市秀英区石山镇美社村", "locationEn": "Meishe Village in Shishan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%BE%8E%E7%A4%BE%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%BE%8E%E7%A4%BE%E6%9D%91"}, {"id": 52, "cnName": "施茶村", "enName": "Shicha Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇施茶村。这里把火山石地貌和农业结合起来，石斛种植是比较有代表性的特色。喜欢乡村体验的人可以了解当地农场怎么利用火山岩环境种植物。", "en": "You can find it at Shicha Village in Shishan Town, Xiuying District. Shicha is interesting for its volcanic-stone farming, especially the way locals grow dendrobium orchids. It's more of a countryside experience than a typical tourist attraction.", "locationCn": "海口市秀英区石山镇施茶村", "locationEn": "Shicha Village in Shishan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%BD%E8%8C%B6%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%BD%E8%8C%B6%E6%9D%91"}, {"id": 53, "cnName": "荔枝花海·火山营地", "enName": "Lychee Blossom Volcanic Camp", "city": "海口", "category": "自然体验", "cn": "海口市秀英区永兴镇荔枝花海火山营地。荔枝季这里的看点不只是露营，还可以体验荔枝林和当地火山荔枝。采摘有季节限制，最好在活动开放时来，不要以为一年四季都能摘果子。", "en": "You can find it at Lychee Flower Sea Volcano Camp in Yongxing Town, Xiuying District. During lychee season, the orchards are the main attraction, and picking activities may be available. Camping and events vary by date, so check the season before coming.", "locationCn": "海口市秀英区永兴镇荔枝花海火山营地", "locationEn": "Lychee Flower Sea Volcano Camp in Yongxing Town, Xiuying District", "mapA me": "Haikou Bay Cruise (Dongpo Wharf)", "city": "海口", "category": "自然体验", "cn": "海口市美兰区碧海大道东坡老码头游船码头。这不是站在岸上看海，而是坐船从水上看世纪大桥、海口湾和城市灯光。夜游比较有氛围，但班次可能因天气调整，要先看当日船票和出航通知。", "en": "You can find it at The cruise pier at Dongpo Old Wharf on Bihai Avenue, Meilan District. See Haikou from the water instead of the shore. The evening cruise gives you views of Century Bridge and the skyline, but departures depend on tickets and weather.", "locationCn": "海口市美兰区碧海大道东坡老码头游船码头", "locationEn": "The cruise pier at Dongpo Old Wharf on Bihai Avenue, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%B8%B8%E8%88%B9%EF%BC%88%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4%E5%87%BA%E5%8F%91%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%B8%B8%E8%88%B9%EF%BC%88%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4%E5%87%BA%E5%8F%91%EF%BC%89"}, {"id": 61, "cnName": "铜鼓岭", "enName": "Tongguling Scenic Area", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭景区，靠近月亮湾。这里最大的卖点是登高后能同时看到绿色山坡、弯弯的月亮湾和蓝色大海。天气晴朗时层次特别漂亮，比站在普通海滩上看海更震撼。", "en": "You can find it at Tongguling in Longlou Town, Wenchang, above Moon Bay. The view is the star: green hills, the curved Moon Bay, and blue sea all in one panorama. On a clear day, it's much more dramatic than a regular beach view.", "locationCn": "文昌市龙楼镇铜鼓岭景区，靠近月亮湾", "locationEn": "Tongguling in Longlou Town, Wenchang, above Moon Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%9C%E9%BC%93%E5%B2%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%9C%E9%BC%93%E5%B2%AD"}, {"id": 62, "cnName": "石头公园", "enName": "Stone Park", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭附近的石头公园海岸。这里不是平整沙滩，而是一大片被海浪冲刷过的巨石，石头形状和浪花都很特别。适合拍气势比较强的海岸照片，但岩石湿滑，不要靠近危险浪区。", "en": "You can find it at Stone Park on the coast near Tongguling, Longlou Town, Wenchang. Huge weathered rocks and crashing waves make this coastline look dramatic. It's wonderful for landscape photos, but the rocks can be slippery and the surf dangerous.", "locationCn": "文昌市龙楼镇铜鼓岭附近的石头公园海岸", "locationEn": "Stone Park on the coast near Tongguling, Longlou Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%9F%B3%E5%A4%B4%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%9F%B3%E5%A4%B4%E5%85%AC%E5%9B%AD"}, {"id": 63, "cnName": "东郊椰林", "enName": "Dongjiao Coconut Grove", "city": "文昌", "category": "海南环岛", "cn": "文昌市东郊镇东郊椰林海岸。这里椰子树特别密，很多地方一抬头就是椰叶，走几步又能看到大海。想让外国朋友感受最典型的海南热带海岛画面，来这里很合适。", "en": "You can find it at Dongjiao Coconut Grove in Dongjiao Town, Wenchang. Tall coconut palms grow densely beside the sea here. If you want that classic tropical-island feeling—palm leaves overhead and the coast just steps away—this is the place.", "locationCn": "文昌市东郊镇东郊椰林海岸", "locationEn": "Dongjiao Coconut Grove in Dongjiao Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%9C%E9%83%8A%E6%A4%B0%E6%9E%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%9C%E9%83%8A%E6%A4%B0%E6%9E%97"}, {"id": 64, "cnName": "木兰湾风车海岸", "enName": "Mulan Bay Windmill Coast", "city": "文昌", "category": "海南环岛", "cn": "文昌市铺前镇木兰湾海岸和木兰灯塔附近。这一带很适合自驾，海边能看到风车、灯塔和长长的海岸线。不是那种店铺很多的热闹景区，重点是沿途风景和看海，天气好时很有电影感。", "en": "You can find it at Mulan Bay near Mulan Lighthouse in Puqian Town, Wenchang. The drive is part of the fun, with wind turbines, a lighthouse, and a wide coastal landscape. It's more about the scenery than shops or activities.", "locationCn": "文昌市铺前镇木兰湾海岸和木兰灯塔附近", "locationEn": "Mulan Bay near Mulan Lighthouse in Puqian Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%A8%E5%85%B0%E6%B9%BE%E9%A3%8E%E8%BD%A6%E6%B5%B7%E5%B2%B8", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%A8%E5%85%B0%E6%B9%BE%E9%A3%8E%E8%BD%A6%E6%B5%B7%E5%B2%B8"}, {"id": 65, "cnName": "淇水湾海滩", "enName": "Qishui Bay Beach", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇淇水湾，文昌航天发射场附近。这片海滩除了海景漂亮，还有一个很特别的理由：遇到合适的发射任务，有些观景位置能远远看到火箭升空。平时可以看海，想看发射必须提前查官方通告。", "en": "You can find it at Qishui Bay in Longlou Town, near the Wenchang Space Launch Site. This beach has a special claim to fame: during some launches, you may be able to watch a rocket rise in the distance. On normal days it's a scenic beach; always check official launch notices.", "locationCn": "文昌市龙楼镇淇水湾，文昌航天发射场附近", "locationEn": "Qishui Bay in Longlou Town, near the Wenchang Space Launch Site", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%B7%87%E6%B0%B4%E6%B9%BE%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%B7%87%E6%B0%B4%E6%B9%BE%E6%B5%B7%E6%BB%A9"}, {"id": 66, "cnName": "文昌航天发射场相关参观体验", "enName": "Wenchang Space Launch Visitor Experience", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇文昌航天发射场周边指定参观区域。这里最吸引人的不是普通展馆，而是能近距离了解中国航天发射基地的真实环境。参观范围受管理规定限制，不能想进哪里就进哪里，最好按正规渠道预约。", "en": "You can find it at Designated visitor areas near the Wenchang Space Launch Site in Longlou Town. This is one of China's major rocket-launch locations, so space fans will love learning about the real launch facilities. Access is controlled, and visits must follow approved arrangements.", "locationCn": "文昌市龙楼镇文昌航天发射场周边指定参观区域", "locationEn": "Designated visitor areas near the Wenchang Space Launch Site in Longlou Town", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%96%87%E6%98%8C%E8%88%AA%E5%A4%A9%E5%8F%91%E5%B0%84%E5%9C%BA%E7%9B%B8%E5%85%B3%E5%8F%82%E8%A7%82%E4%BD%93%E9%AA%8C", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%96%87%E6%98%8C%E8%88%AA%E5%A4%A9%E5%8F%91%E5%B0%84%E5%9C%BA%E7%9B%B8%E5%85%B3%E5%8F%82%E8%A7%82%E4%BD%93%E9%AA%8C"}, {"id": 67, "cnName": "瑶光火箭观礼平台", "enName": "Yaoguang Rocket Viewing Platform", "city": "文昌", "category": "海南环岛", "cn": "文昌市东郊镇X183附近的瑶光火箭观礼平台。它是专门为了看火箭发射而建的观礼平台，不是普通观海台。真正值得来的时候是有发射任务时，可以和大家一起倒数、感受火箭点火升空，座位和道路需要提前预约。", "en": "You can find it at Yaoguang Rocket Viewing Platform in Dongjiao Town, along X183, Wenchang. This platform is built for rocket launches, not ordinary sightseeing. On launch day, the countdown and liftoff are the main event. Book ahead and follow road-control instructions.", "locationCn": "文昌市东郊镇X183附近的瑶光火箭观礼平台", "locationEn": "Yaoguang Rocket Viewing Platform in Dongjiao Town, along X183, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%91%B6%E5%85%89%E7%81%AB%E7%AE%AD%E8%A7%82%E7%A4%BC%E5%B9%B3%E5%8F%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%91%B6%E5%85%89%E7%81%AB%E7%AE%AD%E8%A7%82%E7%A4%BC%E5%B9%B3%E5%8F%B0"}, {"id": 68, "cnName": "月亮湾", "enName": "Moon Bay", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭山脚的月亮湾海岸。从高处看，这片海湾像一条长长的弧线，海水颜色很漂亮。可以结合铜鼓岭一起玩：山上拍全景，来到海边再看沙滩与海浪。", "en": "You can find it at Moon Bay below Tongguling in Longlou Town, Wenchang. From above, the shoreline forms a beautiful long curve. Combine it with Tongguling—take wide shots from the hill and then enjoy the beach up close.", "locationCn": "文昌市龙楼镇铜鼓岭山脚的月亮湾海岸", "locationEn": "Moon Bay below Tongguling in Longlou Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%88%E4%BA%AE%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%88%E4%BA%AE%E6%B9%BE"}, {"id": 69, "cnName": "三婆与海·糟粕醋文化休闲庄园", "enName": "Sanpo & Sea Zaopocu Restaurant", "city": "文昌", "category": "海南环岛", "cn": "文昌市铺前镇木兰湾海岸、007乡道附近。这家近年挺火的海边餐厅，纯白建筑放在蓝天大海前面，很像热门旅拍取景地。除了拍照，还能尝文昌有特色的酸辣糟粕醋，属于既能吃又能出片的地方。", "en": "It is near County Road 007 on the Mulan Bay coast, Puqian Town, Wenchang. This seaside spot became popular for its white building against the blue sea, almost like a Mediterranean-style photo set. It's also a chance to try Wenchang's tangy, spicy zaopocu specialty.", "locationCn": "文昌市铺前镇木兰湾海岸、007乡道附近", "locationEn": "Near County Road 007 on the Mulan Bay coast, Puqian Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%89%E5%A9%86%E4%B8%8E%E6%B5%B7%C2%B7%E7%B3%9F%E7%B2%95%E9%86%8B%E6%96%87%E5%8C%96%E4%BC%91%E9%97%B2%E5%BA%84%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%89%E5%A9%86%E4%B8%8E%E6%B5%B7%C2%B7%E7%B3%9F%E7%B2%95%E9%86%8B%E6%96%87%E5%8C%96%E4%BC%91%E9%97%B2%E5%BA%84%E5%9B%AD"}, {"id": 70, "cnName": "铺前老街", "enName": "Puqian Old Street", "city": "文昌", "category": "海南环岛", "cn": "文昌市铺前镇老街区，铺前大桥东侧附近。这里的骑楼和海口老街有相似的南洋感觉，不过节奏更像一个安静的海边小镇。可以看老房子、找当地小吃，再把木兰湾一起安排成一趟短途自驾。", "en": "You can find it at The old streets of Puqian Town, Wenchang, near the eastern side of Puqian Bridge. The old arcaded buildings have a similar Southeast Asian feel to Haikou, but in a quieter seaside town. Explore the streets, try local snacks, and combine it with Mulan Bay.", "locationCn": "文昌市铺前镇老街区，铺前大桥东侧附近", "locationEn": "The old streets of Puqian Town, Wenchang, near the eastern side of Puqian Bridge", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%BA%E5%89%8D%E8%80%81%E8%A1%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%BA%E5%89%8D%E8%80%81%E8%A1%97"}, {"id": 71, "cnName": "潭门渔港", "enName": "Tanmen Fishing Harbor", "city": "琼海", "category": "海南环岛", "cn": "琼海市潭门镇潭门渔港。这里的特色是真正的渔港，不是专门摆出来给游客看的布景。能看到出海渔船、渔货交易和海鲜店，喜欢观察本地生活的人会觉得很有意思。", "en": "You can find it at Tanmen Fishing Port in Tanmen Town, Qionghai. This is a working fishing port, not a staged tourist village. Watch the boats, see the catch coming in, and enjoy fresh seafood nearby.", "locationCn": "琼海市潭门镇潭门渔港", "locationEn": "Tanmen Fishing Port in Tanmen Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%BD%AD%E9%97%A8%E6%B8%94%E6%B8%AF", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%BD%AD%E9%97%A8%E6%B8%94%E6%B8%AF"}, {"id": 72, "cnName": "博鳌海的故事", "enName": "Boao Story of the Sea", "city": "琼海", "category": "海南环岛", "cn": "琼海市博鳌镇海边的海的故事休闲区。这边最适合不赶时间地看海，餐桌、海边装饰和浪花放在一起很有度假感觉。找个靠海的位置喝饮料、聊聊天，比专程打卡一张照片更有意思。", "en": "You can find it at The Story of the Sea waterfront area in Bo'ao Town, Qionghai. This is a relaxed seaside hangout with drinks, coastal décor, and waves close by. Find a good table and enjoy the view without rushing.", "locationCn": "琼海市博鳌镇海边的海的故事休闲区", "locationEn": "The Story of the Sea waterfront area in Bo'ao Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8D%9A%E9%B3%8C%E6%B5%B7%E7%9A%84%E6%95%85%E4%BA%8B", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8D%9A%E9%B3%8C%E6%B5%B7%E7%9A%84%E6%95%85%E4%BA%8B"}, {"id": 73, "cnName": "玉带滩", "enName": "Jade Belt Beach", "city": "琼海", "category": "海南环岛", "cn": "琼海市博鳌镇万泉河入海口附近。这里最奇特的是长长的沙洲，一边是河水，一边是大海，两种水域在附近相遇。一般需要按景区安排乘船前往，别把它当成随时能自己走上去的普通沙滩。", "en": "It is near the mouth of the Wanquan River in Bo'ao Town, Qionghai. This narrow sandbar sits between the river and the sea, making it a very unusual landscape. Access normally follows the scenic area's boat arrangements, so plan ahead.", "locationCn": "琼海市博鳌镇万泉河入海口附近", "locationEn": "Near the mouth of the Wanquan River in Bo'ao Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%8E%89%E5%B8%A6%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%8E%89%E5%B8%A6%E6%BB%A9"}, {"id": 74, "cnName": "沙美村", "enName": "Shamei Village", "city": "琼海", "category": "海南环岛", "cn": "琼海市博鳌镇沙美村，靠近沙美内海。这里的画面很柔和：小村庄、湖面、湿地和远处的山连在一起。适合慢慢走、看看田园和水鸟，和热闹的海滩度假完全是两种感觉。", "en": "You can find it at Shamei Village in Bo'ao Town, beside Shamei Lagoon. Shamei is about peaceful countryside scenery—village lanes, wetlands, water, and distant hills. It's a slower and quieter break from crowded beaches.", "locationCn": "琼海市博鳌镇沙美村，靠近沙美内海", "locationEn": "Shamei Village in Bo'ao Town, beside Shamei Lagoon", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%B2%99%E7%BE%8E%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%B2%99%E7%BE%8E%E6%9D%91"}, {"id": 75, "cnName": "世界热带水果之窗", "enName": "World Tropical Fruit Window", "city": "琼海", "category": "海南环岛", "cn": "琼海市大路镇世界热带水果之窗景区。这里最有意思的是能认识来自不同地方、平时在超市不常见的热带水果。适合喜欢新鲜水果的人，看看果树长什么样，比只在水果店买水果更有趣。", "en": "You can find it at Window to the World of Tropical Fruits in Dalu Town, Qionghai. See tropical fruit growing on trees instead of only on supermarket shelves. It's fun for anyone curious about unusual fruit varieties and where they come from.", "locationCn": "琼海市大路镇世界热带水果之窗景区", "locationEn": "Window to the World of Tropical Fruits in Dalu Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E4%B8%96%E7%95%8C%E7%83%AD%E5%B8%A6%E6%B0%B4%E6%9E%9C%E4%B9%8B%E7%AA%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E4%B8%96%E7%95%8C%E7%83%AD%E5%B8%A6%E6%B0%B4%E6%9E%9C%E4%B9%8B%E7%AA%97"}, {"id": 76, "cnName": "白石岭", "enName": "Baishiling Mountain", "city": "琼海", "category": "海南环岛", "cn": "琼海市嘉积镇附近白石岭景区。想从平地换个视角看琼海，可以来这座山。登高以后能看到城市、田野和周围山景，适合喜欢爬山又不想跑太远的人。", "en": "You can find it at Baishiling Scenic Area near Jiaji Town, Qionghai. Climb above the surrounding fields and town for a different view of Qionghai. It's a good option if you want some elevation without traveling far inland.", "locationCn": "琼海市嘉积镇附近白石岭景区", "locationEn": "Baishiling Scenic Area near Jiaji Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%99%BD%E7%9F%B3%E5%B2%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%99%BD%E7%9F%B3%E5%B2%AD"}, {"id": 77, "cnName": "北仍村", "enName": "Beireng Village", "city": "琼海", "category": "海南环岛", "cn": "琼海市嘉积镇北仍村乡村旅游区。这里把乡村绿植、小路和咖啡休闲空间结合起来，感觉比较清静。适合喜欢慢生活、想在海南乡下坐一会儿的人，不是追求刺激项目的景点。", "en": "You can find it at Beireng Village near Jiaji Town, Qionghai. This green rural village is more about slow walks and quiet breaks than big attractions. It's nice for seeing the countryside at an easy pace.", "locationCn": "琼海市嘉积镇北仍村乡村旅游区", "locationEn": "Beireng Village near Jiaji Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8C%97%E4%BB%8D%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8C%97%E4%BB%8D%E6%9D%91"}, {"id": 78, "cnName": "日月湾", "enName": "Riyue Bay", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇日月湾，海南东线海岸。这里是海南非常有名的冲浪海湾，浪板、冲浪店和海边咖啡馆随处可见，年轻人特别多。就算不会冲浪，也可以找正规教练上体验课，或者坐着看高手追浪。", "en": "You can find it at Riyue Bay in Liji Town, Wanning, on Hainan's east coast. One of Hainan's best-known surf spots, with boards, surf schools, and beach cafés everywhere. Try a beginner lesson with a qualified instructor, or simply watch the surfers.", "locationCn": "万宁市礼纪镇日月湾，海南东线海岸", "locationEn": "Riyue Bay in Liji Town, Wanning, on Hainan's east coast", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE"}, {"id": 79, "cnName": "日月湾礼堂", "enName": "Riyue Bay Chapel", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇日月湾海边的日月湾礼堂。这栋海边建筑因为简洁的造型和海景背景很受情侣、摄影博主欢迎。真正吸引人的是建筑线条和海浪同框，适合在冲浪之外顺便拍一组漂亮的照片。", "en": "You can find it at The seaside chapel-like building at Riyue Bay in Liji Town, Wanning. This simple seaside building is popular for couple and influencer photos. Its clean lines against the waves make a lovely shot while you're visiting the surf bay.", "locationCn": "万宁市礼纪镇日月湾海边的日月湾礼堂", "locationEn": "The seaside chapel-like building at Riyue Bay in Liji Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE%E7%A4%BC%E5%A0%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE%E7%A4%BC%E5%A0%82"}, {"id": 80, "cnName": "石梅湾", "enName": "Shimei Bay", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇石梅湾海岸。这里和热闹的日月湾不同，海滩、椰林和度假酒店带来更安静的度假感觉。适合找个地方住一晚、早晨走沙滩，而不只是来拍照五分钟就走。", "en": "You can find it at Shimei Bay in Liji Town, Wanning. Quieter than the surf scene at Riyue Bay, Shimei Bay is about palm-lined beaches and relaxed resorts. It's a place to stay, slow down, and walk on the sand in the morning.", "locationCn": "万宁市礼纪镇石梅湾海岸", "locationEn": "Shimei Bay in Liji Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%9F%B3%E6%A2%85%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%9F%B3%E6%A2%85%E6%B9%BE"}, {"id": 81, "cnName": "神州半岛", "enName": "Shenzhou Peninsula", "city": "万宁", "category": "海南环岛", "cn": "万宁市东澳镇神州半岛海岸。半岛两侧都有海景，路边常能看到漂亮的海湾和度假建筑。适合自驾、住海边酒店，顺便把灯塔放进当天的拍照路线。", "en": "You can find it at Shenzhou Peninsula in Dong'ao Town, Wanning. This peninsula gives you coastal views from different angles, with beaches and resorts along the way. Combine a scenic drive with a visit to its lighthouse.", "locationCn": "万宁市东澳镇神州半岛海岸", "locationEn": "Shenzhou Peninsula in Dong'ao Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B"}, {"id": 82, "cnName": "神州半岛灯塔", "enName": "Shenzhou Peninsula Lighthouse", "city": "万宁", "category": "海南环岛", "cn": "万宁市东澳镇神州半岛海岸尽头附近的灯塔。这座红白相间的灯塔立在伸入海中的防波堤尽头，非常醒目。海水、堤岸和灯塔一起拍很有画面感，但要看清通行安排，不要冒险走到被封闭的区域。", "en": "You can find it at The lighthouse near the end of Shenzhou Peninsula in Dong'ao Town. The red-and-white striped lighthouse stands at the end of a breakwater reaching into the sea. It makes a striking photo with the blue water, but follow access signs and stay away from closed areas.", "locationCn": "万宁市东澳镇神州半岛海岸尽头附近的灯塔", "locationEn": "The lighthouse near the end of Shenzhou Peninsula in Dong'ao Town", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B%E7%81%AF%E5%A1%94", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B%E7%81%AF%E5%A1%94"}, {"id": 83, "cnName": "兴隆热带植物园", "enName": "Xinglong Tropical Botanical Garden", "city": "万宁", "category": "海南环岛", "cn": "万宁市兴隆华侨旅游经济区兴隆热带植物园。这里有很多平时很少见的香料和热带经济植物，咖啡、可可也能看到真实植物。适合对食物来源好奇的人，不是只有走马观花看花草。", "en": "You can find it at Xinglong Tropical Botanical Garden in Wanning's Xinglong Overseas C search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E5%A4%A7%E4%B8%9C%E6%B5%B7", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E5%A4%A7%E4%B8%9C%E6%B5%B7"}, {"id": 101, "cnName": "椰梦长廊", "enName": "Coconut Dream Corridor", "city": "三亚", "category": "海南环岛", "cn": "三亚市天涯区三亚湾路沿线的椰梦长廊。最适合来的时间是傍晚：夕阳慢慢落到海面上，椰树变成剪影，非常适合拍人像。这里也是市民和游客一起散步、跳舞、看日落的地方。", "en": "You can find it at The palm-lined coastal stretch along Sanya Bay Road, Tianya District. Sunset is the magic moment, when palm trees become silhouettes against the sea. Locals and visitors gather here to walk, dance, and take portraits in the golden light.", "locationCn": "三亚市天涯区三亚湾路沿线的椰梦长廊", "locationEn": "The palm-lined coastal stretch along Sanya Bay Road, Tianya District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E6%A4%B0%E6%A2%A6%E9%95%BF%E5%BB%8A", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E6%A4%B0%E6%A2%A6%E9%95%BF%E5%BB%8A"}, {"id": 102, "cnName": "鹿回头风景区", "enName": "Luhuitou Scenic Park", "city": "三亚", "category": "海南环岛", "cn": "三亚市吉阳区鹿回头风景区。这里不是普通海滩，而是能从山上俯瞰整个三亚湾和城市高楼。尤其晚上灯亮起来以后，可以拍到很漂亮的三亚夜景。", "en": "You can find it at Luhuitou Scenic Area in Jiyang District, Sanya. Come here for an elevated view of Sanya's bays and skyline rather than the beach itself. After dark, the city lights make a beautiful panorama.", "locationCn": "三亚市吉阳区鹿回头风景区", "locationEn": "Luhuitou Scenic Area in Jiyang District, Sanya", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E9%B9%BF%E5%9B%9E%E5%A4%B4%E9%A3%8E%E6%99%AF%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E9%B9%BF%E5%9B%9E%E5%A4%B4%E9%A3%8E%E6%99%AF%E5%8C%BA"}, {"id": 103, "cnName": "亚龙湾热带天堂森林公园", "enName": "Yalong Bay Tropical Paradise Forest Park", "city": "三亚", "category": "海南环岛", "cn": "三亚市吉阳区亚龙湾热带天堂森林公园。这个景区能同时看热带树林和远处的亚龙湾，站在高处拍出来特别有层次。适合喜欢山海同框、又不想整天只待在沙滩的人。", "en": "You can find it at Yalong Bay Tropical Paradise Forest Park in Jiyang District. This park combines lush tropical hills with distant views of Yalong Bay. It's great for layered mountain-and-sea photos and a change from beach time.", "locationCn": "三亚市吉阳区亚龙湾热带天堂森林公园", "locationEn": "Yalong Bay Tropical Paradise Forest Park in Jiyang District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E4%BA%9A%E9%BE%99%E6%B9%BE%E7%83%AD%E5%B8%A6%E5%A4%A9%E5%A0%82%E6%A3%AE%E6%9E%97%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E4%BA%9A%E9%BE%99%E6%B9%BE%E7%83%AD%E5%B8%A6%E5%A4%A9%E5%A0%82%E6%A3%AE%E6%9E%97%E5%85%AC%E5%9B%AD"}, {"id": 104, "cnName": "梅联社区海边渔村", "enName": "Meilian Coastal Art Village", "city": "三亚", "category": "海南环岛", "cn": "三亚市崖州区梅联社区，靠近乐东龙栖湾。这里原本是海边渔村，现在有蓝色海洋主题墙绘和有创意的街角装置。比热门打卡小镇安静，适合拍村落生活和海边艺术感的照片。", "en": "You can find it at Meilian Community in Yazhou District, near Ledong's Longqi Bay. This former fishing village now has blue ocean-themed murals and small creative installations. It's quieter than the big photo towns, with an appealing mix of village life and art.", "locationCn": "三亚市崖州区梅联社区，靠近乐东龙栖湾", "locationEn": "Meilian Community in Yazhou District, near Ledong's Longqi Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E6%A2%85%E8%81%94%E7%A4%BE%E5%8C%BA%E6%B5%B7%E8%BE%B9%E6%B8%94%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E6%A2%85%E8%81%94%E7%A4%BE%E5%8C%BA%E6%B5%B7%E8%BE%B9%E6%B8%94%E6%9D%91"}, {"id": 105, "cnName": "三亚国际免税城", "enName": "Sanya International Duty Free Mall", "city": "三亚", "category": "海南环岛", "cn": "三亚市海棠区海棠北路的三亚国际免税城。这是三亚大型免税购物地，适合买化妆品、国际品牌和伴手礼。它主要是购物体验，不必把它和海湾、雨林这类自然景点放在同一优先级。", "en": "Yo itted and never stand in the road for a photo.", "locationCn": "三亚市吉阳区太阳湾公路沿线的合法观景位置", "locationEn": "Officially accessible viewpoints along Sun Bay Road in Jiyang District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E5%A4%AA%E9%98%B3%E6%B9%BE%E5%85%AC%E8%B7%AF%E6%B2%BF%E7%BA%BF%E8%A7%82%E6%99%AF%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%89%E4%BA%9A%E5%A4%AA%E9%98%B3%E6%B9%BE%E5%85%AC%E8%B7%AF%E6%B2%BF%E7%BA%BF%E8%A7%82%E6%99%AF%E5%8C%BA"}, {"id": 108, "cnName": "保亭呀诺达雨林文化旅游区", "enName": "Yanoda Rainforest Cultural Tourism Zone", "city": "其他地区", "category": "海南环岛", "cn": "保亭黎族苗族自治县三道镇呀诺达景区。这里最大的特色是热带雨林的湿润感：大叶植物、溪流、山谷和雨林步道都很有海南中部的味道。适合想离开海滩，到真正热带森林里走一走的人。", "en": "You can find it at Yanoda Rainforest Scenic Area in Sandao Town, Baoting. Step away from the beach into lush rainforest, streams, and valley trails. The dense greenery and humid forest air make it feel like a different part of Hainan.", "locationCn": "保亭黎族苗族自治县三道镇呀诺达景区", "locationEn": "Yanoda Rainforest Scenic Area in Sandao Town, Baoting", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%BF%9D%E4%BA%AD%E5%91%80%E8%AF%BA%E8%BE%BE%E9%9B%A8%E6%9E%97%E6%96%87%E5%8C%96%E6%97%85%E6%B8%B8%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%BF%9D%E4%BA%AD%E5%91%80%E8%AF%BA%E8%BE%BE%E9%9B%A8%E6%9E%97%E6%96%87%E5%8C%96%E6%97%85%E6%B8%B8%E5%8C%BA"}, {"id": 109, "cnName": "保亭槟榔谷", "enName": "Binglanggu Li & Miao Cultural Park", "city": "其他地区", "category": "海南环岛", "cn": "保亭黎族苗族自治县三道镇槟榔谷景区。这里比较有意思的是能看到海南黎族传统织锦、服饰和民俗技艺，不只是看一场表演。想让外国朋友了解海南本地少数民族文化，这里比较直观。", "en": "You can find it at Binglanggu Scenic Area in Sandao Town, Baoting. This is a good place to learn about Hainan's Li culture, including traditional textiles, clothing, and crafts. There's more to see than just staged performances.", "locationCn": "保亭黎族苗族自治县三道镇槟榔谷景区", " function currentTopic(){
 let text=(S.session?.messages||[]).slice(-4).map(m=>m.text).join(' ').toLowerCase();
 if(/running|jog|runner|outdoor|hiking|walk|park|跑步|慢跑|户外|散步|徒步/.test(text))return 'running';
 if(/coffee|cafe|latte|espresso|咖啡|拿铁/.test(text))return 'coffee';
 if(/app|software|coding|编程|软件/.test(text))return 'software';
 if(/beach|sea|sunset|海滩|海边|日落/.test(text))return 'beach';
 return text?'other':'none';
}

function disconnectLiveASR(){
  S.asrWanted=false;S.asrRetry=0;
  if(S.asrRetryTimer){clearTimeout(S.asrRetryTimer);S.asrRetryTimer=null;}
  try{S.asrStream?.close();}catch{}
  S.asrStream=null;S.asrState='off';S.asrInterim='';
  if(S.tab==='chat')render();
}
function handleLiveAsrEvent(event){
  if(!S.session||S.asrState==='off'||!event||typeof event!=='object')return;
  if(event.type==='session'){
    if(event.mock===true)S.asrState='mock';
    else if(event.status==='ready')S.asrState='ready';
    if(event.status==='error')S.asrState='error';
    if(event.status==='ended'){S.asrState='waiting';S.asrInterim='';}
    if(S.tab==='chat')render();
    return;
  }
  if(event.type==='error'){
    S.asrState='error';S.asrInterim=String(event.text||'识别服务出错').slice(0,300);
    if(S.tab==='chat')render();return;
  }
  if(!['interim','final'].includes(event.type))return;
  const text=String(event.text||'').trim().slice(0,700);
  if(!text)return;
  S.asrState=event.mock===true?'mock':'ready';
  if(event.type==='interim' || event.final!==true){
    S.asrInterim=(event.mock===true?'[MOCK] ':'实时：')+text;
    const target=document.querySelector('#asrInterim');
    if(target)target.textContent=S.asrInterim;
    return;
  }
  const key=[event.sessionId,event.track,event.index,event.startMs,event.endMs,text].join(':');
  if(S.asrSeen.has(key))return;
  S.asrSeen.add(key);
  if(S.asrSeen.size>250)S.asrSeen.clear();
  S.asrInterim='';
  // A/B and spk_N are NOT a verified identity mapping. Never label a mixed speaker as "friend".
  const who=event.speaker==='self'?'me':event.speaker==='friend'?'friend':'unknown';
  const source=event.mock===true?'mock':'tencent';
  S.session.messages.push({
    who,text,time:new Date().toLocaleTimeString('zh-CN'),source,
    speaker:String(event.speaker||'unknown'),sessionId:String(event.sessionId||'')
  });
  S.recs=automaticCards();
  if(S.tab==='chat')render();
  // Only verified final Tencent subtitles can automatically trigger a paid cloud request.
  // No paid AI calls for mock ASR or interim, and a 2.5s anti-spend throttle.
  if(source==='tencent'&&S.session.cloudConsent&&S.aiState!=='loading'){
    const now=Date.now();
    if(now-S.lastLiveAiAt>=2500){S.lastLiveAiAt=now;requestRealAI();}
  }
}
function connectLiveASR(){
  if(!S.session)return tip('请先开始会话，并在手机上取得录音同意');
  const origin=window.location?.origin||'';
  if(!['http://127.0.0.1:8791','http://localhost:8791'].includes(origin)||!window.EventSource){
    return tip('需要通过 Mac mini 私有 /v12 页面连接实时字幕');
  }
  if(S.asrStream)return;
  S.asrWanted=true;S.asrState='connecting';render();
  let source;
  try{
    source=new window.EventSource('/api/asr/live');
  }catch(error){
    S.asrState='error';S.asrInterim='无法连接实时字幕。';render();
    scheduleAsrReconnect();
    return;
  }
  S.asrStream=source;
  source.addEventListener('ready',()=>{
    if(S.asrStream!==source)return;
    S.asrRetry=0;S.asrState='ready';if(S.tab==='chat')render();
  });
  source.addEventListener('asr',e=>{
    if(S.asrStream!==source)return;
    try{handleLiveAsrEvent(JSON.parse(e.data));}catch{}
  });
  source.onerror=()=>{
    if(S.asrStream!==source)return;
    source.close();S.asrStream=null;S.asrState='error';
    S.asrInterim='实时字幕连接中断；正在自动重连（录音页保持打开即可）。';
    if(S.tab==='chat')render();
    scheduleAsrReconnect();
  };
}
function scheduleAsrReconnect(){
  if(!S.asrWanted||S.asrRetryTimer)return;
  S.asrRetry=(S.asrRetry||0)+1;
  if(S.asrRetry>10){S.asrInterim='实时字幕多次重连失败；检查 Mac mini 服务后点「连接实时字幕」。';render();return;}
  const delay=Math.min(8000,500*Math.pow(2,S.asrRetry-1));
  S.asrRetryTimer=setTimeout(()=>{
    S.asrRetryTimer=null;
    if(S.asrWanted&&!S.asrStream)connectLiveASR();
  },delay);
}
function autoStartLiveSession(){
  if(!LIVE_MODE||S.session)return;
  S.session={id:String(Date.now()),messages:[],date:new Date().toLocaleString('zh-CN'),
    cloudConsent:false,provider:'deepseek',model:'deepseek-flash',liveMode:true};
  S.ai=null;S.aiState='demo';S.aiError='';S.asrSeen=new Set();S.lastLiveAiAt=0;
  setTab('chat');
  connectLiveASR();
}
function requestRealAI(){
 const session=S.session,seq=++S.aiSeq;
 if(!session||!session.messages.length)return;
 if(!session.cloudConsent){S.aiState='demo';return;}
 const origin=window.location?.origin||'';
 if(!['http://127.0.0.1:8791','http://localhost:8791'].includes(origin)||!window.fetch){
   S.aiState='blocked';S.aiError='需要从 Mac mini 的私有网关打开 http://127.0.0.1:8791/v12';showRecs();return;
 }
 S.aiState='loading';S.aiError='';if(S.tab==='chat')showRecs();
 window.fetch('/api/ai/analyze',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({consent:true,provider:session.provider,model:session.model,includePersonal:false,
     messages:session.messages.slice(-6).map(m=>({speaker:m.who==='me'?'self':m.who==='friend'?'friend':'unknown',text:m.text}))})
 }).then(async resp=>{
   const answer=await resp.json();
   if(!resp.ok)throw Error(answer.error||answer.code||'模型服务不可用');
   return answer;
 }).then(answer=>{
   if(seq!==S.aiSeq||S.session!==session)return;
   if(answer.mode!=='real-ai'||!answer.reply)throw Error('未返回真实 AI 结果');
   S.ai=answer;S.aiState='ready';S.aiError='';
   S.recs=(answer.references||[]).map(ref=>{
     const kind=ref.kind,id=String(ref.id);
     const x=kind==='place'?D.places.find(p=>String(p.id)===id):
       kind==='app'?D.apps.find(a=>a.id===id):SAV.stories.find(a=>a.id===id);
     return x?{kind,id,title:kind==='place'?x.cnName:kind==='app'?x.name:x.title,en:x.en}:null;
   }).filter(Boolean);
   if(S.tab==='chat')render();
 }).catch(err=>{
   if(seq!==S.aiSeq||S.session!==session)return;
   S.ai=null;S.aiState='error';S.aiError=String(err.message||'模型连接失败').slice(0,180);if(S.tab==='chat')render();
 });
}

   <span class="reccall">打开中英详情、地图及分享 ›</span></button>`).join(''):
 '<div class="stateempty">例如提到户外跑步，会自动关联万绿园、海口湾滨海步道和白沙门公园。</div>';

function openDrawer(content){$('#drawerbody').innerHTML=content;$('#drawer').classList.add('open');$('#drawerbg').classList.add('open')}
function buttons(kind,id,en){return `<div class="actions"><button class="btn tinted" data-copy="${kind}" data-id="${esc(id)}">复制英文</button><button class="btn mainbtn" data-pin="${kind}" data-id="${esc(id)}">加入聊天参考</button></div>`}
function openDetail(kind,id){let a=kind==='app'?D.apps.find(x=>x.id===id):kind==='place'?D.places.find(x=>String(x.id)===id):kind==='story'?SAV.stories.find(x=>x.id===id):kind==='person'?SAV.people.find(x=>x.id===id):SAV.sessions.find(x=>x.id===id);if(!a)return;let content='';if(kind==='app'){content=`<h2>${esc(a.name)}</h2><p class="sub">${esc(a.id)} · ${a.cat==='A'?'APP / PWA':'其他场景'}</p><div class="detailbox"><div class="boxhead">中文简介</div><p>${esc(a.cn)}</p></div><div class="detailbox"><div class="boxhead">自然英语介绍</div><p class="english-reading" lang="en">${esc(a.en)}</p></div>${buttons(kind,id,a.en)}<div class="sectiontitle"><strong>按编号演示</strong><small>${a.steps.length} 步</small></div><div class="steps">${a.steps.map(st=>`<div class="step"><b>${st.n}. ${esc(st.cn)}</b><p>${esc(st.detail)}</p><p lang="en">${esc(st.en)}</p></div>`).join('')}</div><p class="footnote">${esc(a.status)}；请以实际安装的 APP 页面为准。</p>`;}else if(kind==='place'){content=`<h2>${esc(a.cnName)}</h2><p class="sub">${esc(a.enName)} · ${esc(a.city)} · ${esc(a.category)}</p><div class="detailbox"><div class="boxhead">中文介绍</div><p>${esc(a.cn)}</p></div><div class="detailbox"><div class="boxhead">English — 可以这样跟朋友说</div><p class="english-reading" lang="en">${esc(a.en)}</p></div>${buttons(kind,id,a.en)}<div class="actions"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.cnName+' '+a.city)}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a><a class="btn" href="https://uri.amap.com/search?keyword=${encodeURIComponent(a.cnName+' '+a.city)}" target="_blank" rel="noopener noreferrer">高德地图 ↗</a></div>`;}else if(kind==='story'){content=`<h2>${esc(a.title)}</h2><p class="sub">${esc(a.cat)} · 可编辑</p><div class="detailbox"><div class="boxhead">中文</div><p>${esc(a.cn)}</p></div><div class="detailbox"><div class="boxhead">English</div><p>${esc(a.en)}</p></div>${buttons(kind,id,a.en)}<div class="actions"><button class="btn" data-editstory="${esc(id)}">编辑这段话</button></div>`;}else if(kind==='person'){content=`<h2>${esc(a.name)}</h2><p class="sub">私人演示资料</p><div class="detailbox"><div class="boxhead">已记录备注</div><p>${esc(a.about)}</p></div><div class="sectiontitle"><strong>本地确认后的信息</strong></div>${(a.notes||[]).map(n=>`<div class="detailbox"><p>${esc(n.text)}</p><small>${esc(n.date)}</small></div>`).join('')||'<p class="footnote">暂无已确认的内容。</p>'}<div class="actions"><button class="btn mainbtn" data-selectperson="${esc(a.id)}">设为聊天对象</button></div>`;}else{content=`<h2>会话记录</h2><p class="sub">${esc(a.date)}</p><div class="detailbox"><p>${esc(a.review)}</p></div><div class="actions"><button class="btn" data-download="${esc(id)}">下载 Markdown</button></div>`;}openDrawer(content)}
async function copy(v){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(v);else{let t=document.createElement('textarea');t.value=v;t.style.position='fixed';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('clipboard');t.remove()}tip('已复制英文内容')}catch{tip('复制受浏览器限制，请长按选择文字')}}
function source(kind,id){return kind==='app'?D.apps.find(x=>x.id===id):kind==='place'?D.places.find(x=>String(x.id)===id):SAV.stories.find(x=>x.id===id)}
function pin(kind,id){let x=source(kind,id);if(!x)return;let title=kind==='app'?x.name:kind==='place'?x.cnName:x.title;SAV.pins=SAV.pins.filter(p=>p.kind!==kind||p.id!==id);SAV.pins.unshift({kind,id,title,en:x.en});SAV.pins=SAV.pins.slice(0,12);persist();tip('已加入聊天参考');}
function cardsFor(q){q=q.toLowerCase();let scored=[];let words=[...new Set(q.match(/[a-z]{3,}|[\u4e00-\u9fa5]{2,}/g)||[])];let aliases={'outdoors':['公园','海边','火山','自然','walk','volcano'],'coffee':['咖啡','coffee','café'],'software':['软件','app','project'],'beach':['海边','coast','sea'],'music':['live','夜市','音乐']};let kws=[...words];for(let w of words){if(aliases[w])kws.push(...aliases[w]);}for(let item of D.apps){let text=(item.name+item.en+item.cn).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'app',id:item.id,title:item.name,en:item.en,score})}for(let item of D.places){let text=(item.cnName+item.enName+item.cn+item.en).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'place',id:String(item.id),title:item.cnName,en:item.en,score:score+((q.includes('outdoor')&&item.id===9)?4:0)})}for(let item of SAV.stories){let text=(item.title+item.cn+item.en).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'story',id:item.id,title:item.title,en:item.en,score})}scored.sort((a,b)=>b.score-a.score);return scored.slice(0,5)}
function question(){let q=S.session?.messages.at(-1)?.text?.toLowerCase()||'';return /coffee|cafe/.test(q)?'Do you have a favorite café here in Haikou?':/nature|outdoor|walk|park|hike/.test(q)?'Do you like going for a walk by the sea?':/app|software|coding/.test(q)?'What kind of apps do you find useful?':'What brought you to Haikou?'}

function settingOptions(group,choices){
  return '<div class="setting-options" role="group" aria-label="'+({font:'整体字号',english:'英文阅读字号',density:'页面疏密'}[group])+'">'+
    choices.map(function(a){return '<button type="button" class="setting-option '+(SAV.display[group]===a[0]?'on':'')+'" data-display="'+group+'" data-value="'+a[0]+'" aria-pressed="'+(SAV.display[group]===a[0])+'">'+a[1]+'</button>';}).join('')+'</div>';
}
function openSettings(){
  modal('<div class="setting-head"><h2>显示与阅读设置</h2><button type="button" class="iconbutton" data-action="close" aria-label="关闭设置">×</button></div>'+
    '<p class="setting-hint">字号和疏密可以分别调整，修改立即生效，并保存到当前浏览器。</p>'+
    '<label class="formlabel">整体文字大小</label>'+settingOptions('font',[['normal','标准'],['large','较大'],['extra','大字'],['huge','超大']])+
    '<label class="formlabel">英文阅读字号</label>'+settingOptions('english',[['normal','标准'],['large','加大'],['extra','特大']])+
    '<label class="formlabel">卡片与页面间距</label>'+settingOptions('density',[['compact','紧凑'],['comfortable','舒适'],['relaxed','宽松']])+
    '<div class="setting-preview"><strong>即时阅读预览</strong><p>海口有很多适合散步的地方。</p><p class="english-reading" lang="en">Do you prefer running by the sea or walking in a park?</p></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="resetDisplay">恢复默认</button><button type="button" class="btn mainbtn" data-action="close">完成</button></div>');
}
function modal(inner){$('#modalcontent').innerHTML=inner;$('#modalbg').classList.add('open')};function closeModal(){$('#modalbg').classList.remove('open')}
function start(){modal('<h2>开始对话演示</h2><p>本页手动输入模拟字幕，不会打开麦克风。勾选云端同意并通过 Mac mini 私有网关打开页面后，会使用真实 AI 自动接话。</p>'+
 '<label class="formlabel" for="providerChoice">AI 线路</label><select class="field" id="providerChoice"><option value="deepseek/deepseek-flash">DeepSeek 官方 · Flash（默认）</option><option value="deepseek/deepseek-v4-pro">DeepSeek 官方 · V4 Pro</option><option value="opencode-go/deepseek-v4.1-flash">OpenCode Go · V4.1 Flash</option></select>'+
 '<label class="consent-line"><input type="checkbox" id="confirm">我知道本页为模拟字幕，真人录音须取得双方同意。</label>'+
 '<label class="consent-line"><input type="checkbox" id="cloudConsent">可选：允许将本轮对话文字发送至所选的 AI 服务商以生成建议。默认不发送；涉及朋友隐私需先征得同意。</label>'+
 '<div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="startok">进入演示</button></div>')}
function addMessage(text,who='friend'){if(!S.session){start();return};if(!text.trim())return tip('请输入英文原话');S.session.messages.push({who,text:text.trim(),time:new Date().toLocaleTimeString('zh-CN')});S.recs=automaticCards();S.ai=null;S.aiState='demo';render();requestRealAI()}
function review(){if(!S.session?.messages.length)return tip('先添加一句对话');let p=SAV.people.find(x=>x.id===S.person);let conversation=S.session.messages.map(x=>`${x.who==='me'?'我':'朋友（待核对）'}: ${x.text}`).join('\n\n');S.review=`# SocialMate · ${new Date().toLocaleString('zh-CN')}\n\n来源：手动模拟输入，非真实 ASR。\n\n${conversation}`;modal(`<h2>会后人工确认</h2><p>请核对原始句子、人物归属和下次值得记住的信息，不能把 AI 猜测写成事实。</p><label class="formlabel">可编辑的会话纪要</label><textarea class="field" style="min-height:135px" id="reviewText">${esc(S.review)}</textarea><label class="formlabel">对方确定说过的事实（可留空）</label><textarea class="field" id="factText" placeholder="例如：他告诉我他喜欢海边徒步。"></textarea><label style="display:flex;gap:9px;align-items:start;font-size:13px;margin-top:12px"><input type="checkbox" id="confirm">我已确认说话人和事实，可仅保存到本机演示档案。</label><div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="save">确认归档</button></div>`)}
function editStory(id){let s=SAV.stories.find(x=>x.id===id);modal(`<h2>${s?'编辑':'新增'}个人话题</h2><label class="formlabel">标题</label><input id="storyTitle" class="field" value="${esc(s?.title||'')}"><label class="formlabel">分类</label><input id="storyCategory" class="field" placeholder="例如：兴趣 / 家乡 / 工作" value="${esc(s?.cat||'生活')}"><label class="formlabel">标签（逗号分隔）</label><input id="storyTags" class="field" placeholder="例如：户外,跑步,英语角" value="${esc((s?.tags||[]).join(', '))}"><label class="formlabel">中文真实事实</label><textarea id="storyCn" class="field">${esc(s?.cn||'')}</textarea><label class="formlabel">自然英文</label><textarea id="storyEn" class="field">${esc(s?.en||'')}</textarea><div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="savestory" data-id="${esc(id||'new')}">保存</button></div>`)}
function addPerson(){modal('<h2>新建人物</h2><label class="formlabel">称呼</label><input id="personName" class="field" placeholder="如：周末认识的朋友"><label class="formlabel">已确认备注</label><textarea class="field" id="personNote" placeholder="只记录对方明确说过的事实"></textarea><div class="actions"><button class="btn" data-action="close">取消</button><button class="btn mainbtn" data-action="saveperson">保存人物</button></div>')}
function download(name,text){const blob=new Blob([text],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
document.addEventListener('click',e=>{
 let setting=e.target.closest('[data-display]');
 if(setting){
   const k=setting.dataset.display,v=setting.dataset.value;
   if(displayValid[k]?.includes(v)){
     SAV.display[k]=v;persist();applyDisplay();
     document.querySelectorAll('[data-display="'+k+'"]').forEach(b=>{
       const active=b.dataset.value===v;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active));
     });
   }
   return;
 }
 let nav=e.target.closest('[data-nav]');if(nav)return setTab(nav.dataset.nav);let f=e.target.closest('[data-filter]');if(f){S[f.dataset.filter]=f.dataset.value;render();return}let related=e.target.closest('[data-related]');
 if(related){let kind=related.dataset.related,id=related.dataset.id;
   if(S.tab!=='chat')setTab(kind==='place'?'hainan':kind==='app'?'software':'self');
   openDetail(kind,id);
   $('#drawerbody').insertAdjacentHTML('afterbegin','<div class="actions"><button class="btn tinted" data-act="backchat">← 返回聊天（会话保留）</button></div>');
   return;
 }
 let coached=e.target.closest('[data-coach]');
 if(coached){let pl=S.aiState==='ready'&&S.ai?{respond:S.ai.reply,ask:S.ai.questions,share:S.ai.share}:coachPlan(),key=coached.dataset.coach;
   if(pl)return copy(key==='respond'?pl.respond:key==='share'?pl.share:pl.ask[Number(key.split('-')[1])]);
 }
 let open=e.target.closest('[data-open]');if(open)return openDetail(open.dataset.open,open.dataset.id);let copyBtn=e.target.closest('[data-copy]');if(copyBtn){let x=source(copyBtn.dataset.copy,copyBtn.dataset.id);if(x)copy(x.en);return}let pinBtn=e.target.closest('[data-pin]');if(pinBtn)return pin(pinBtn.dataset.pin,pinBtn.dataset.id);let sa=e.target.closest('[data-sample]');if(sa){let demos={running:'I like running outdoors near the sea. Is there a nice park or running route in Haikou?',software:'What kind of software have you built?',coffee:'I love coffee. Do you know a good café around here?'};return addMessage(demos[sa.dataset.sample])}let sel=e.target.closest('[data-selectperson]');if(sel){S.person=sel.dataset.selectperson;closeDrawer();setTab('chat');return}let edt=e.target.closest('[data-editstory]');if(edt)return editStory(edt.dataset.editstory);let dow=e.target.closest('[data-download]');if(dow){let s=SAV.sessions.find(x=>x.id===dow.dataset.download);if(s)download('SocialMate-Conversation.md',s.review);return}let a=e.target.closest('[data-act]');if(a){switch(a.dataset.act){case 'resetDisplay':SAV.display={font:'normal',english:'normal',density:'comfortable'};persist();applyDisplay();openSettings();return;case 'connect-asr':return connectLiveASR();case 'disconnect-asr':return disconnectLiveASR();case 'start':return start();case 'backchat':closeDrawer();return setTab('chat');case 'addstory':return editStory();case 'addperson':return addPerson();case 'send':return addMessage($('#msg')?.value||'',$('#who')?.value||'friend');case 'review':return review();case 'discard':if(confirm('清空未保存的模拟会话？')){disconnectLiveASR();S.aiSeq++;S.ai=null;S.aiState='demo';S.session=null;S.recs=[];render()}return;case 'refsearch':S.recs=cardsFor($('#refq').value);return showRecs();case 'clearref':S.recs=automaticCards();return showRecs();case 'copyask':return copy(question());}}let m=e.target.closest('[data-action]');if(!m)return;switch(m.dataset.action){case 'close':closeModal();break;case 'startok':if(!$('#confirm').checked)return tip('请先确认演示说明');{let choice=$('#providerChoice').value.split('/');S.session={id:String(Date.now()),messages:[],date:new Date().toLocaleString('zh-CN'),cloudConsent:$('#cloudConsent').checked,provider:choice[0],model:choice[1],liveMode:false};S.ai=null;S.aiState='demo';S.aiError='';S.aiSeq++;S.lastLiveAiAt=0;S.asrSeen=new Set();closeModal();render();}break;case 'save':if(!$('#confirm').checked)return tip('请先人工确认');{let p=SAV.people.find(x=>x.id===S.person),ss=S.session;ss.review=$('#reviewText').value;ss.personName=p?.name||'未关联人物';ss.personId=p?.id||'';let notes=$('#factText').value.trim();if(notes&&p){p.notes??=[];p.notes.push({date:ss.date,text:notes})}SAV.sessions.push(ss);persist();disconnectLiveASR();S.session=null;S.recs=[];closeModal();setTab('people');tip('已保存到此浏览器')}break;case 'savestory':{let title=$('#storyTitle').value.trim(),cn=$('#storyCn').value.trim(),en=$('#storyEn').value.trim();if(!title||!cn||!en)return tip('请填写完整中英文');let s=SAV.stories.find(x=>x.id===m.dataset.id);let cat=($('#storyCategory')?.value||'生活').trim().slice(0,28)||'生活';let tags=($('#storyTags')?.value||'').split(/[,，、]/).map(v=>v.trim().slice(0,24)).filter(Boolean).slice(0,10);if(s)Object.assign(s,{title,cn,en,cat,tags});else SAV.stories.push({id:String(Date.now()),title,cn,en,cat,tags});S.storyTag='全部';S.q='';persist();closeModal();closeDrawer();render();tip('已保存本机话题');}break;case 'saveperson':{let name=$('#personName').value.trim();if(!name)return tip('请填写称呼');SAV.people.push({id:String(Date.now()),name,about:$('#personNote').value.trim(),notes:[]});persist();closeModal();render();tip('人物已保存本机');}break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.q=e.target.value;updateResults()}});document.addEventListener('change',e=>{if(e.target.id==='chatPerson')S.person=e.target.value;if(e.target.id==='liveCloudConsent'&&S.session){S.session.cloudConsent=e.target.checked;if(e.target.checked)requestRealAI();else{S.aiSeq++;S.aiState='demo';S.ai=null;S.aiError='';showRecs();render();}}});
$('#theme').onclick=()=>{SAV.theme=SAV.theme==='light'?'dark':'light';persist();theming()};$('#displaySettings').onclick=openSettings;$('#drawerbg').onclick=closeDrawer;$('#closeDrawer').onclick=closeDrawer;$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});theming();if(LIVE_MODE)autoStartLiveSession();else setTab('software');
</script><script src="/profile-sync.js" defer></script></body></html>
