h roommates right now?"},{"cn":"找房子时你最看重什么？","en":"What matters most to you when you are looking for a place?"},{"cn":"你遇到过最难沟通的房东问题是什么？","en":"What is the hardest thing you have had to sort out with a landlord?"}],"holidayType":"topic","sourceUrls":["https://www.gov.uk/private-renting"],"sourceNote":"GOV.UK 私人租房指南页，2026-11-10 实抓 HTTP 200，标题 Private renting: Tenancy types，含租约与押金说明。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-neighbours","cn":"邻里关系","en":"Neighbours","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"和邻居的关系微妙：见面打不打招呼、晚上几点后算吵、公共区域怎么用。各地对“保持距离”和“互相照应”的期待差别大，聊具体小事更易聊出真实态度。","briefEn":"Neighbour relationships are a careful balance: whether people say hello, what counts as too much noise at night, and how shared spaces get used. Expectations vary a lot between places, so concrete examples work better than asking whether they get along with neighbours in general.","questions":[{"cn":"你和邻居平时会打招呼吗？","en":"Do you say hello to your neighbours?"},{"cn":"你遇到过噪音问题吗？怎么处理的？","en":"Have you ever dealt with a noise problem? How did you handle it?"},{"cn":"你觉得邻居之间应该保持距离，还是互相照应？","en":"Should neighbours keep to themselves, or look out for each other?"}],"holidayType":"topic","sourceUrls":["https://www.citizensadvice.org.uk/housing/problems-with-neighbours/"],"sourceNote":"Citizens Advice 邻里纠纷指南页，2026-11-10 实抓 HTTP 200，标题 Problems with neighbours。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-smartphone","cn":"手机使用","en":"Smartphone habits","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"手机几乎跟着人一整天。可以聊每天屏幕时间多少、起床先看还是睡前最后看、吃饭时放不放桌上。这些细节很容易聊出“离不开但又想少用”的矛盾感。","briefEn":"Phones are with us all day, so the details are easy to compare: daily screen time, whether they check it first thing in the morning or last thing at night, and whether it sits on the table during meals. Most people have a love-hate relationship with theirs.","questions":[{"cn":"你每天大概花多少时间在手机上？","en":"How much time do you spend on your phone each day?"},{"cn":"你早上醒来第一件事是看手机吗？","en":"Is checking your phone the first thing you do when you wake up?"},{"cn":"吃饭的时候你会把手机放桌上吗？","en":"Do you keep your phone on the table during meals?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/businessindustryandtrade/itandinternetindustry"],"sourceNote":"ONS 数字经济主题页，2026-11-10 实抓 HTTP 200，标题 Digital economy，含上网与设备使用统计入口。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-social-media","cn":"社交媒体","en":"Social media","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"用哪些平台、发什么、看什么，差别很大。有人只看不发，有人习惯记录日常。可以聊会不会因别人的动态感到压力、会不会定期清理关注。","briefEn":"How people use social media varies a lot. Some post constantly, others only watch. Ask which platforms they actually use, whether other people's updates ever make them feel behind, and if they ever clean up who they follow. It is also a natural way into talking about staying in touch online versus in person.","questions":[{"cn":"你最常用哪个社交平台？","en":"Which social platform do you use most?"},{"cn":"你更常发内容还是只看？","en":"Do you post more, or mostly just scroll?"},{"cn":"看到别人的动态，你会不会有比较的压力？","en":"Do other people's posts ever make you feel like you are falling behind?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/householdcharacteristics/homeinternetandsocialmediausage"],"sourceNote":"ONS 家庭上网与社交媒体使用主题页，2026-11-10 实抓 HTTP 200，标题 Home internet and social media usage。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-tv-series","cn":"追剧","en":"TV series","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"看剧是最省力的共同话题：最近在追什么、一次看几集、会不会快进或边看边刷手机。“一口气看完”和“一周一集”差别很大，很容易聊出各自偏好。","briefEn":"TV is one of the easiest things to talk about. Ask what they are watching now, whether they binge several episodes at once, and if they skip ahead or scroll while watching. Some people finish a whole season in a weekend; others prefer one episode a week.","questions":[{"cn":"你最近在追什么剧？","en":"What are you watching right now?"},{"cn":"你会一口气看完，还是一周看一集？","en":"Do you binge a whole season, or watch one episode a week?"},{"cn":"你看剧的时候会刷手机吗？","en":"Do you scroll on your phone while watching?"}],"holidayType":"topic","sourceUrls":["https://www.barb.co.uk/viewing-data/"],"sourceNote":"BARB 英国电视观众测量机构收视数据页，2026-11-10 实抓 HTTP 200，标题 Viewing data Barb。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-reading","cn":"阅读习惯","en":"Reading habits","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"读什么、什么时候读、纸质还是电子，都能聊。有人通勤读几页，有人书买了不少却没翻。聊聊最近放下的书，看不下去会不会硬撑，也能聊“没时间读”。","briefEn":"Reading habits are easy to compare: what they read, when they squeeze it in, and whether they prefer paper or a screen. Some people get through a few pages on the commute; others buy books they never open. Ask about the last book they gave up on and whether they force themselves to finish.","questions":[{"cn":"你最近在读什么？","en":"What are you reading at the moment?"},{"cn":"你更喜欢纸质书还是电子书？","en":"Do you prefer paper books or e-books?"},{"cn":"一本书看不下去，你会硬着头皮读完吗？","en":"If a book is not working for you, do you push through or stop?"}],"holidayType":"topic","sourceUrls":["https://literacytrust.org.uk/research/"],"sourceNote":"National Literacy Trust 阅读研究报告页，2026-11-10 实抓 HTTP 200，标题 Research reports。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-pets","cn":"养宠物","en":"Pets","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"养宠物的人通常很愿意聊：猫还是狗、每天遛几次、出门谁来照顾。也能聊花销、掉毛、租房能不能养。没养过的可聊小时候家里有没有宠物，话题也接得上。","briefEn":"Pet owners usually love talking about this: cats or dogs, how often they walk them, and who looks after them when they travel. It is also a good way to get into the practical side — cost, shedding, and whether rentals even allow pets. If they have never had one, ask about pets growing up.","questions":[{"cn":"你养过宠物吗？","en":"Have you ever had a pet?"},{"cn":"养宠物最麻烦的部分是什么？","en":"What is the most annoying part of having a pet?"},{"cn":"你会为了宠物改变居住或出行安排吗？","en":"Would you change where you live or how you travel for a pet?"}],"holidayType":"topic","sourceUrls":["https://www.rspca.org.uk/adviceandwelfare/pets"],"sourceNote":"RSPCA 宠物饲养建议页，2026-11-10 实抓 HTTP 200，标题 Pet Advice & Tips - RSPCA。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-decluttering","cn":"收纳整理","en":"Decluttering","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"整理房间是很多人反复开始又放弃的事。可以聊多久清理一次、有没有“舍不得扔”的东西、收纳让家变舒服还是变成新负担，也能聊搬家时才发现东西太多。","briefEn":"Decluttering is something many people start and then abandon. Ask how often they clear things out, what they cannot bring themselves to throw away, and whether organising makes their home feel better or just adds another task. Moving house is a common moment when everyone realises how much they own.","questions":[{"cn":"你多久整理一次房间或衣柜？","en":"How often do you sort out your room or wardrobe?"},{"cn":"你有没有明明不用却舍不得扔的东西？","en":"Is there anything you keep even though you never use it?"},{"cn":"整理完你会觉得轻松，还是更累？","en":"Does decluttering leave you feeling lighter or more tired?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/mental-health/conditions/hoarding-disorder/"],"sourceNote":"NHS 囤积障碍科普页，2026-11-10 实抓 HTTP 200，标题 Hoarding disorder - NHS，涉及杂物堆积与清理困难。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-weather-seasons","cn":"天气与季节","en":"Weather and seasons","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"天气是最实用的开场话题。可以聊四季明不明显、最受不了哪种天气、下雨天怎么通勤。各地冷热标准差别很大，聊具体温度比说“今天天气不错”更有内容。","briefEn":"Weather is the safest small-talk topic for a reason. Ask whether the place they live has clear seasons, which weather they cannot stand, and how they get around when it rains. Ideas of cold and hot vary hugely, so talking about actual temperatures is more interesting than nice weather today.","questions":[{"cn":"你住的地方四季明显吗？","en":"Does the place you live have distinct seasons?"},{"cn":"你最受不了哪种天气？","en":"Which kind of weather do you really dislike?"},{"cn":"下雨天你还会照常出门吗？","en":"Do you still go out as usual when it rains?"}],"holidayType":"topic","sourceUrls":["https://www.metoffice.gov.uk/weather/learn-about/weather/seasons"],"sourceNote":"英国气象局 Met Office 四季成因科普页，2026-11-10 实抓 HTTP 200，标题 The four seasons。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-family-check-ins","cn":"家庭联系","en":"Family check-ins","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"怎么和家人联系很能看出生活节奏：多久通一次电话、视频还是发消息、会不会专门问候。有人每天，有人每月，没有哪种更好，聊具体做法更容易聊开。","briefEn":"How people keep in touch with family says a lot about their daily rhythm. Ask how often they call, whether they use video or just messages, and if they check in on ordinary days rather than only holidays. Some talk every day, others once a month — neither is automatically better.","questions":[{"cn":"你一般多久和家人联系一次？","en":"How often do you keep in touch with your family?"},{"cn":"你更喜欢打电话、视频还是发消息？","en":"Do you prefer calls, video, or messages?"},{"cn":"你们会聊日常小事，还是只在有事时联系？","en":"Do you talk about everyday things, or mostly when something comes up?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/families"],"sourceNote":"ONS 家庭统计主题页，2026-11-10 实抓 HTTP 200，标题 Families，含家庭结构与联系相关统计入口。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-recycling","cn":"垃圾分类","en":"Recycling and waste sorting","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"垃圾分类规则各地差别很大：分几类、哪天收、瓶子要不要洗。可以聊是否搞得清、有没有被提醒过。聊具体规则比评价环保态度更自然，也不易变成说教。","briefEn":"Recycling rules differ a lot from place to place: how many bins, which day they are collected, and whether containers need rinsing. Ask if they find it confusing and whether a neighbour or landlord has ever corrected them. Concrete rules make a safer conversation than judging anyone's environmental values.","questions":[{"cn":"你住的地方垃圾分类严格吗？","en":"Is recycling strict where you live?"},{"cn":"你有没有因为分错被提醒过？","en":"Has anyone ever told you off for sorting something wrong?"},{"cn":"你觉得哪些规则最麻烦？","en":"Which rules do you find most confusing?"}],"holidayType":"topic","sourceUrls":["https://www.epa.gov/recycle"],"sourceNote":"美国环保署 EPA 减量、重复使用与回收指南页，2026-11-10 实抓 HTTP 200，标题 Reduce, Reuse, Recycle。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-queuing","cn":"排队习惯","en":"Queuing habits","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"排队最容易看出礼貌差异：会不会自觉排、能不能帮人占位、前面的人慢怎么办。各地对“插队”和“保持距离”的敏感度不同，聊具体经历比泛泛评价安全。","briefEn":"Queues are a small window into manners: whether people line up without being told, if it is okay to hold a spot for a friend, and what everyone does when the person ahead is slow. Tolerance for cutting in and personal space varies, so a specific story works better than generalising.","questions":[{"cn":"你排队时最受不了什么？","en":"What bothers you most when you are waiting in a queue?"},{"cn":"你会帮朋友占位吗？","en":"Would you hold a place in line for a friend?"},{"cn":"有人插队你会说吗？","en":"Would you say something if someone cut in?"}],"holidayType":"topic","sourceUrls":["https://www.caa.co.uk/passengers/","https://www.postoffice.co.uk/"],"sourceNote":"英国民航局旅客服务页与英国邮局服务页，2026-11-10 实抓均为 HTTP 200；两个页面分别覆盖机场安检与邮局柜台办理的等待场景。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-tipping","cn":"小费","en":"Tipping","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"小费最容易踩坑：给不给、给多少、服务费有没有算进账单。各地差别很大，有的必须给，有的已包含。聊聊自己怎么判断，以及刚到陌生地方的尴尬经历。","briefEn":"Tipping is one of the easiest things to get wrong: whether to tip, how much, and whether service is already on the bill. Norms vary a lot, from expected to included. Ask how they decide, and whether they have ever misread the rules somewhere new.","questions":[{"cn":"你一般会给多少小费？","en":"How much do you usually tip?"},{"cn":"结账前你会先看服务费有没有算进去吗？","en":"Do you check whether service is already included?"},{"cn":"你有没有在别的国家因为小费搞错过？","en":"Have you ever got tipping wrong in another country?"}],"holidayType":"topic","sourceUrls":["https://emilypost.com/advice/general-tipping-guide"],"sourceNote":"Emily Post Institute 小费礼仪指南页，2026-11-10 实抓 HTTP 200，标题 Tipping Etiquette 101。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-coffee-tea","cn":"咖啡与茶","en":"Coffee and tea","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"咖啡还是茶，几乎是每个地方都有的日常仪式。可以聊早上第一杯、在家做还是买、加不加奶糖，也能聊“喝茶的人怎么看咖啡”。聊一天喝几杯最不易冷场。","briefEn":"Coffee or tea is a daily ritual almost everywhere. Ask about the first cup of the day, whether they make it at home or buy it out, and how they take it. The mild disagreement between tea people and coffee people is usually good for a laugh. Talking about how many cups they have keeps it concrete.","questions":[{"cn":"你每天的第一杯是咖啡还是茶？","en":"Is your first drink of the day coffee or tea?"},{"cn":"你在家做还是习惯在外面买？","en":"Do you make it at home or buy it out?"},{"cn":"你能接受不加奶不加糖吗？","en":"Can you drink it without milk or sugar?"}],"holidayType":"topic","sourceUrls":["https://www.hsph.harvard.edu/nutritionsource/food-features/coffee/","https://www.hsph.harvard.edu/nutritionsource/food-features/tea/"],"sourceNote":"哈佛大学陈曾熙公共卫生学院 The Nutrition Source 的咖啡与茶专题页，2026-11-10 实抓均为 HTTP 200，标题分别为 Coffee 与 Tea。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-walking","cn":"日常散步","en":"Everyday walks","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"不为了健身、只是出门走走的习惯，比想象中更能聊：饭后散步、遛狗顺路走一圈、住的地方适不适合走，也能聊“边走边聊”比坐着更容易开口。","briefEn":"Walking that is not a workout is surprisingly good to talk about: an after-dinner stroll, a loop around the block with the dog, or whether their area is even walkable. Many people also find it easier to talk honestly while walking side by side rather than sitting face to face.","questions":[{"cn":"你平时会专门出门散步吗？","en":"Do you go for walks just to walk?"},{"cn":"你住的地方适合走路吗？","en":"Is the area you live in walkable?"},{"cn":"你更喜欢一个人走，还是有人一起？","en":"Do you prefer walking alone or with someone?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/walking-for-health/"],"sourceNote":"NHS 步行与健康指南页，2026-11-10 实抓 HTTP 200，标题 Walking for health - NHS。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-address","cn":"称呼与辈分","en":"Addressing elders and relatives","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"中文里亲戚称呼分得很细，爸爸的哥哥、妈妈的哥哥、姑妈的丈夫各有叫法。长辈和同事常用职务加姓来称呼。各地叫法差别很大，别默认对方家也这么排。","briefEn":"Chinese has a separate word for almost every relative: your father's brother, your mother's brother and your aunt's husband are all addressed differently. People also use job titles plus a surname for colleagues and elders. Families and regions vary a lot, so ask rather than assume.","questions":[{"cn":"你家怎么称呼爸爸的兄弟和妈妈的兄弟？","en":"How do you address your father's brother and your mother's brother?"},{"cn":"第一次见长辈，你会怎么叫？","en":"What do you call an elder you're meeting for the first time?"}],"holidayType":"topic","sourceUrls":["https://www.cnr.cn/yuleguangbo/lzye/20161221/t20161221_523373118.shtml","https://www.chinahighlights.com/travelguide/guidebook/etiquette.htm"],"sourceNote":"央广网《中国人不该叫错的三个称呼》与 China Highlights 中国礼仪指南，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-first-visit","cn":"第一次做客带什么","en":"First visit to someone's home","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"第一次去别人家，很多地方会带点水果、点心或酒，空手上门不太合适。进门换鞋、先问候长辈也常见。各地规矩不一样，送礼前最好先问一句主人的习惯。","briefEn":"In many parts of China, showing up empty-handed for a first visit feels awkward, so people bring fruit, snacks or a bottle of something. Taking off your shoes at the door and greeting the elders first is also common. Customs differ by region and family, so it's fine to ask your host what they prefer.","questions":[{"cn":"第一次去朋友家，你一般会带什么？","en":"What do you usually bring when you visit a friend's home for the first time?"},{"cn":"在你们那边，进门要换鞋吗？","en":"Do people take off their shoes when entering a home where you're from?"}],"holidayType":"topic","sourceUrls":["https://www.chinahighlights.com/travelguide/guidebook/etiquette.htm"],"sourceNote":"China Highlights 中国礼仪指南（含初次拜访与带礼习惯），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-dining-shared","cn":"公筷与敬酒","en":"Shared chopsticks and toasts","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"现在不少餐厅会主动给公筷公勺，给人夹菜也更讲究卫生。敬酒图个热闹，但不喝也能说清楚。劝酒这件事各地各桌差别很大，别默认对方一定要喝。","briefEn":"Many restaurants now bring shared chopsticks and serving spoons, and people are more careful about using them when taking food for others. Toasting is a big part of a gathering, but it's fine to say you're not drinking. How much people push a drink varies hugely between tables and regions, so don't assume.","questions":[{"cn":"你们聚餐会用公筷吗？","en":"Do you use shared chopsticks when you eat together?"},{"cn":"别人给你敬酒，你不喝酒会怎么处理？","en":"What do you do when someone toasts you and you don't drink?"},{"cn":"你们那边饭桌上会劝酒吗？","en":"Do people at the table urge each other to drink where you're from?"}],"holidayType":"topic","sourceUrls":["http://www.xinhuanet.com/politics/2020-05/11/c_1125966548.htm","http://health.people.com.cn/n1/2020/0309/c14739-31622921.html","http://politics.people.com.cn/n/2013/0910/c70731-22869476.html"],"sourceNote":"新华网《各地出台政策大力推行分餐制——公筷“夹”出餐桌新文明》、人民网《让公筷公勺分餐进食成为文明标配》与人民网《84.0%的人直言反感当下酒桌文化》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-split-bill","cn":"买单与 AA","en":"Who pays and splitting the bill","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"朋友吃饭，有人习惯抢着买单，有人习惯各付各的。请客和 AA 都能表达心意，关键看关系和场合。各地做法不同，别默认对方一定想被请或一定想 AA。","briefEn":"With friends, some people insist on paying for the whole meal, while others split the bill. Both treating and going Dutch can be a friendly gesture; it depends on the relationship and the occasion. Practice varies across regions and friend groups, so don't assume which one the other person expects.","questions":[{"cn":"和朋友吃饭，你们一般谁买单？","en":"When you eat with friends, who usually pays?"},{"cn":"你怎么看 AA 制？","en":"What do you think of splitting the bill?"}],"holidayType":"topic","sourceUrls":["http://opinion.people.com.cn/n1/2017/0209/c1003-29070108.html","https://www.chinahighlights.com/travelguide/chinese-food/dining-etiquette.htm"],"sourceNote":"人民网评论《“走亲戚吃饭AA制”，社会变迁带来的变与不变》与 China Highlights 中国餐桌礼仪，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-gift","cn":"送礼讲究","en":"Gift-giving customs","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"送礼常避开钟表、伞和梨，谐音不太吉利；双数成双更讨喜。礼物不必贵，包装和心意更重要。各地讲究不同，送前先问一句更稳妥。","briefEn":"People often avoid clocks, umbrellas and pears as gifts because the sounds suggest bad luck, and even numbers are usually preferred. The gift doesn't need to be expensive; wrapping and thought matter more. Local habits differ, so asking or choosing something edible or useful is a safe bet.","questions":[{"cn":"你们那边送礼会避开哪些东西？","en":"Are there gifts people avoid where you're from?"},{"cn":"收到礼物时，你会当场打开吗？","en":"Do you open a gift right away when you receive it?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/shipin/2014/01-29/news371449.shtml","https://www.chinahighlights.com/festivals/things-not-give-chinese-new-year.htm","https://www.chinahighlights.com/travelguide/special-report/chinese-new-year/new-year-gift.htm"],"sourceNote":"中新网视频《送礼禁忌：“礼”多人真的不怪吗？》与 China Highlights 送礼禁忌、推荐礼品两页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-red-envelope","cn":"红包与婚礼","en":"Red envelopes and weddings","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"婚礼、春节常送红包，金额图双数吉利，朋友间会提前说好大概数。现在不少地方提倡简办，份子钱压力也被讨论。各地风俗差别大，随礼前先问清当地习惯。","briefEn":"Red envelopes show up at weddings and Chinese New Year, usually with an even amount for good luck, and friends often agree on a rough figure in advance. Many places now encourage simpler celebrations, and the pressure of cash gifts is openly discussed. Customs vary a lot, so check what's normal locally.","questions":[{"cn":"你们参加婚礼一般随多少份子钱？","en":"How much do people usually give at a wedding where you're from?"},{"cn":"红包金额会特意选吉利数字吗？","en":"Do people pick lucky numbers for red envelope amounts?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/sh/2023/10-11/10091974.shtml","https://www.chinanews.com.cn/hr/2024/08-10/10266787.shtml","https://www.chinahighlights.com/travelguide/festivals/red-envelop.htm"],"sourceNote":"中新网《国庆节忙着参加婚礼 “份子钱”成沉重负担》《海外华文媒体山西晋城“喜镇苏庄” 探秘中国婚俗文化》与 China Highlights 红包指南，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-birthday","cn":"生日怎么过","en":"How birthdays are celebrated","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"过生日常吃长寿面，图个长长久久；蛋糕和吹蜡烛这几年也很普遍。有人按农历过，有人按公历过。各地习惯不同，问一句对方怎么过最保险。","briefEn":"Longevity noodles are a traditional birthday dish, and cake with candles has become common too. Some people follow the lunar date and others the solar date, and even one family may do both. Customs differ from place to place, so asking how someone usually celebrates is the safest way.","questions":[{"cn":"你生日按农历还是公历过？","en":"Do you celebrate your birthday by the lunar or solar calendar?"},{"cn":"你们家过生日一定会吃长寿面吗？","en":"Does your family always have longevity noodles on birthdays?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/hwjy/2011/04-08/2960735.shtml","http://www.xj.chinanews.com.cn/dizhou/2023-11-01/detail-ihcuqerk7381071.shtml"],"sourceNote":"中新网《中国民间庆生习俗》与中新网·新疆《若羌：吃一碗长寿面 许一份美好未来》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-tea","cn":"茶与待客","en":"Tea and hosting guests","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"客人进门先沏茶是很多地方的待客方式，倒茶讲七分满，续水也有礼数。不同地区爱喝绿茶、红茶或功夫茶。茶桌规矩各地差别不小，不确定就跟着主人做。","briefEn":"Offering tea is a common way to welcome a guest, and cups are usually filled about seven-tenths so they're easy to hold. People in different regions favor green tea, black tea or gongfu-style brewing. Tea table habits vary, so when you're unsure, just follow your host.","questions":[{"cn":"客人来了，你们家会先倒茶吗？","en":"Does your family serve tea when guests arrive?"},{"cn":"你平时更爱喝哪种茶？","en":"Which kind of tea do you usually drink?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/gn/2025/05-23/10420583.shtml","http://culture.people.com.cn/n1/2018/1116/c1013-30405749.html"],"sourceNote":"中新网《时政“留声机”·总书记的“待客茶”》与人民网《中国茶文化传承传播活动在故宫举办》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-chopsticks","cn":"筷子使用习惯","en":"Using chopsticks","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"筷子别直插在饭碗里，也别用筷子敲碗，这些在老一辈看来不吉利。夹菜用公筷、给人递筷子也有讲究。各家各地说法不一，注意观察主人怎么做就行。","briefEn":"Don't stick chopsticks upright in a bowl of rice or tap them on the bowl; older people often see that as bad luck. Using shared chopsticks for serving and how you hand chopsticks to someone also have their own rules. Habits differ by family and region, so watch what your host does.","questions":[{"cn":"你们家用筷子有什么忌讳？","en":"Are there things you avoid doing with chopsticks in your family?"},{"cn":"你会用筷子夹菜给别人吗？","en":"Do you use your chopsticks to serve food to other people?"}],"holidayType":"topic","sourceUrls":["https://reader.gmw.cn/2023-03/06/content_36410389.htm","https://www.chinahighlights.com/travelguide/chinese-food/chopsticks.htm"],"sourceNote":"光明网《筷子里的中国故事》与 China Highlights 筷子用法与忌讳，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-queue-seat","cn":"排队与让座","en":"Queuing and giving up a seat","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"坐公交地铁给老人、孕妇让座很常见，排队也讲先来后到。城市大小、场合不同，做法会有差别，有人赶时间会比较急。别把个别行为当成所有人的习惯。","briefEn":"Giving up a seat to an elderly person or a pregnant woman on public transport is common, and queues generally go first come, first served. Practice differs between big cities, small towns and different situations, and some people are simply in a hurry. Don't treat one person's behaviour as everyone's habit.","questions":[{"cn":"在公交上你会主动让座吗？","en":"Do you usually give up your seat on public transport?"},{"cn":"你们那边排队插队常见吗？","en":"Is cutting in line common where you're from?"}],"holidayType":"topic","sourceUrls":["http://opinion.people.com.cn/n1/2016/0505/c1003-28328280.html","https://www.chinanews.com.cn/sh/2011/10-15/3391071.shtml"],"sourceNote":"人民网评论《让座美德应提倡，“道德绑架”已“越位”！》与中新网《老人大声要求孩子让座 公交礼让美德遭遇尴尬事》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-punctuality","cn":"时间观念与迟到","en":"Punctuality and being late","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"上班开会一般讲究准时，朋友聚会常宽松些，迟到几分钟不算大事。重要场合最好提前到，私人邀约可以先问清楚。各地节奏不同，别默认对方也一样。","briefEn":"Work and meetings usually call for being on time, while casual meetups with friends can be looser and a few minutes late is often no big deal. For anything important, arrive early, and when you're unsure about a personal invitation, just ask. Pace varies between places and social circles, so don't assume.","questions":[{"cn":"朋友聚会迟到多久你会介意？","en":"How late can a friend be before it bothers you?"},{"cn":"你上班或上学一般提前到吗？","en":"Do you usually arrive early for work or class?"}],"holidayType":"topic","sourceUrls":["http://opinion.people.com.cn/n1/2016/0705/c1003-28525182.html","https://www.chinahighlights.com/travelguide/guidebook/etiquette.htm"],"sourceNote":"人民网《人民日报金台视线：守时，人际交往最基本的教养》与 China Highlights 中国礼仪指南，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-polite-refusal","cn":"婉拒与客气话","en":"Saying no politely","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"很多场合不直接说“不”，而用“再看看”“下次吧”这类客气话，听懂话外音很重要。请客时主人也常先推辞一下。各地表达不同，拿不准就直接问清楚。","briefEn":"In many situations people don't say no directly; they use softer phrases like 'let me think about it' or 'maybe next time', so reading between the lines matters. Hosts may also decline once before accepting. Ways of being polite differ across regions, so when it's unclear, just ask.","questions":[{"cn":"你会怎么委婉地拒绝别人的邀请？","en":"How do you politely turn down an invitation?"},{"cn":"你们那边请客时，主人会先客气推辞吗？","en":"Where you're from, does the host first decline politely before accepting?"}],"holidayType":"topic","sourceUrls":["https://www.chinahighlights.com/travelguide/guidebook/etiquette.htm"],"sourceNote":"China Highlights 中国礼仪指南（含面子、委婉表达与拒绝方式），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-family-contact","cn":"和家人联系","en":"Staying in touch with family","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人每天给父母打电话，有人一周一次；家里建个群报平安、发照片也很常见。工作忙时可能只在周末或节日联系。各家习惯差别很大，别默认对方家也这样。","briefEn":"Some people call their parents every day, others once a week, and many families keep a group chat for quick updates and photos. When work gets busy, contact may shrink to weekends or holidays. Every family is different, so don't assume yours is the norm.","questions":[{"cn":"你多久会和家里人通一次电话？","en":"How often do you call your family?"},{"cn":"你们家有固定的家庭群吗？","en":"Does your family have a group chat?"},{"cn":"忙起来的时候，你会怎么跟父母报平安？","en":"When you're busy, how do you let your parents know you're okay?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/sh/2013/09-18/5299891.shtml","https://www.chinanews.com.cn/sh/2023/04-30/9999944.shtml"],"sourceNote":"中新网《常回家看看父母入法后 甘肃中秋节探亲人并不多》与《因分享无人回应，爸爸退了家庭群！你的家庭群还热闹吗？》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-neighbours","cn":"邻里关系与社区活动","en":"Neighbours and community life","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"老小区里邻居常互相照应，借工具、收快递也顺手；新小区可能住几年还不熟。社区会办邻里节、志愿活动，帮大家认识彼此。各地差别很大，别默认对方和邻居很熟。","briefEn":"In older neighbourhoods, neighbours often help each other out with tools or deliveries, while in newer buildings people may live side by side for years without speaking. Many communities run festivals and volunteer events to get residents talking. It varies a lot, so don't assume how close someone is with their neighbours.","questions":[{"cn":"你和邻居熟吗？会互相帮忙吗？","en":"Are you close with your neighbours? Do you help each other out?"},{"cn":"你们社区有邻里节之类的活动吗？","en":"Does your community hold events like a neighbours' festival?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/sh/2020/09-11/9288931.shtml","https://www.chinanews.com.cn/gn/2021/12-15/9629898.shtml"],"sourceNote":"中新网《北京启动“社区邻里节”系列活动 聚焦社区抗疫、冬奥等内容》与《社区志愿服务 邻里贴心互助》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-visiting-sick","cn":"探病与慰问","en":"Visiting someone who is sick","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"住院探视常有时段、人数和登记规定，去之前先问清楚；带水果、炖汤或给点心意都常见。有人不爱听“加油”，更想被安静陪着。各家各地差别很大，别默认对方愿意被探望。","briefEn":"Hospitals often limit visiting hours and the number of visitors, and may ask you to sign in, so check the rules first. People commonly bring fruit, a home-made soup or a little money to help out. Some patients dislike being told to 'stay strong' and would rather have quiet company. Customs vary a lot, so ask rather than assume.","questions":[{"cn":"去看病人，你一般会带什么？","en":"What do you usually bring when you visit someone in hospital?"},{"cn":"安慰生病的朋友，你会怎么说？","en":"What do you say to comfort a friend who is ill?"},{"cn":"你们那边探病有时间或人数限制吗？","en":"Where you're from, are there limits on visiting hours or how many people can come?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/gn/news/2010/06-08/2329822.shtml","https://www.chinanews.com.cn/sh/2013/12-04/5580982.shtml","https://www.chinanews.com.cn/hr/2018/07-14/8566940.shtml"],"sourceNote":"中新网《江苏探视住院病人“限时”新规引发社会热议》《医院设门禁刷卡探视 回应称为保障安全和康复环境》与《广东侨乡台山有一款爱心鸡汤叫“炖鸡汁”》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-moving-house","cn":"搬家与乔迁","en":"Moving into a new home","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"搬新家有的地方会挑日子、请亲友吃乔迁宴，也有的先搬锅碗进门，图个好意头。现在不少地方提倡简办，放鞭炮怕扰邻也会收敛。各地讲究差别很大，别默认对方一定要办。","briefEn":"Moving into a new home may involve picking an auspicious date, hosting a housewarming meal for relatives, or carrying the rice pot in first for good luck. Firecrackers used to be common but are now often dropped to avoid annoying neighbours, and many places encourage simpler celebrations. Customs differ widely, so don't assume everyone holds a big housewarming.","questions":[{"cn":"搬新家，你们那边会办乔迁宴吗？","en":"Where you're from, do people hold a housewarming party when they move?"},{"cn":"搬家会挑日子或者放鞭炮吗？","en":"Do people pick a date or set off firecrackers when they move?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/sh/2014/07-01/6336749.shtml","https://www.chinanews.com.cn/sh/2021/02-10/9409646.shtml"],"sourceNote":"中新网《业主半夜搬家放鞭炮 乔迁旧俗惹众怒》与《拒绝“人情变成债” 江苏宿迁大力践行文明新风“宿9条”》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-borrowing","cn":"借东西与还人情","en":"Borrowing things and returning favours","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"邻居之间借个工具、葱姜蒜很随意，还的时候常顺手带点东西；朋友借钱则容易尴尬。有人觉得人情要记着还，有人更愿意算清楚。各家做法差别很大，别默认对方不在意。","briefEn":"Neighbours borrow tools, spring onions or a bit of soy sauce without much fuss, and often hand something small back as a thank-you. Lending money to friends is more sensitive: some people keep a mental account of favours, others prefer to keep things even. Habits differ from family to family, so don't assume.","questions":[{"cn":"你会向邻居借东西吗？还的时候会带点什么吗？","en":"Do you borrow things from neighbours? Do you give something back as thanks?"},{"cn":"朋友向你借钱，你一般怎么处理？","en":"How do you usually handle it when a friend asks to borrow money?"},{"cn":"欠了人情，你会想着尽快还上吗？","en":"If someone does you a favour, do you try to return it soon?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/sh/2017/05-10/8220583.shtml","https://www.chinanews.com.cn/sh/2017/02-21/8155098.shtml","https://www.chinanews.com.cn/sh/2013/06-08/4911176.shtml"],"sourceNote":"中新网《成都一社区搭建闲置物共享平台 邻里关系更亲密》《调查显示56.4％受访者感觉私人之间借钱难》与《评论：莫把“人情往来”变成了“人情消费”》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-office-address","cn":"上班怎么称呼人","en":"What to call people at work","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"公司里常用姓加职务，比如“王经理”；对不熟的前辈叫“老师”也很普遍，互联网公司直呼名字的更多。新人常为怎么开口发愁。各地各行业差别很大，别默认对方喜欢某种叫法。","briefEn":"At work people often use a surname plus a job title, like 'Manager Wang', and calling a senior colleague 'teacher' is common in many fields, while tech companies are more relaxed. New hires often worry about how to address people. Practice varies a lot, so don't assume one form is always right.","questions":[{"cn":"你们公司怎么称呼同事和领导？","en":"How do people address colleagues and managers at your company?"},{"cn":"第一次上班，你会怎么称呼前辈？","en":"On your first job, how did you address senior colleagues?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/life/2024/05-11/10215092.shtml","https://www.chinanews.com.cn/sh/2017/08-04/8295738.shtml"],"sourceNote":"中新网《叫谁都叫“老师”？合适的职场称呼怎么选》与《九成职场菜鸟都遇“开口难” 职场称呼也需磨合》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-phone-speaker","cn":"公共场所外放声音","en":"Phone speaker volume in public","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"地铁、公交上外放视频或打电话声音大，常被当成不礼貌；上海、广州等地已明文禁止外放。戴耳机、把音量调低是更稳妥的做法。各地规定和风气不一样，别默认哪边都一样。","briefEn":"Playing videos or taking calls on speaker in a crowded subway is widely seen as rude, and cities like Shanghai and Guangzhou have made it an official rule. Headphones or a lower volume are the safer move. Rules and everyday habits vary, so don't assume everyone shares the same expectation.","questions":[{"cn":"在地铁上有人外放视频，你会怎么办？","en":"What do you do when someone plays videos out loud on the subway?"},{"cn":"你们那儿公共场所对外放有规定吗？","en":"Are there rules about phone speaker volume in public where you're from?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/sh/2020/12-01/9351988.shtml","https://www.chinanews.com.cn/sh/2019/10-30/8993947.shtml"],"sourceNote":"中新网《上海地铁1日起禁止手机外放声音，能管得住吗？》与《车内进食、手机外放上了“黑名单” 地铁新规为文明出行“导航”》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"culture-family-meals","cn":"一家人多久吃一次饭","en":"How often families eat together","region":"中国","theme":"文化习俗","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人天天回家吃晚饭，有人周末才凑齐；加班多时，一家人同桌并不容易。有人觉得一起吃饭是必需，有人更看重各自安排。各家节奏差别很大，别默认对方家天天开饭。","briefEn":"Some families sit down for dinner every night, while others only manage a shared meal at weekends; late hours make it hard for everyone to gather. Some people see eating together as essential, others are fine with separate schedules. Every household runs differently, so don't assume how often another family eats together.","questions":[{"cn":"你们家多久会一起坐下来吃顿饭？","en":"How often does your family sit down to eat together?"},{"cn":"平时工作忙，你们会各吃各的吗？","en":"When work is busy, do people in your family eat separately?"},{"cn":"一起吃饭对你们家重要吗？","en":"Is eating together important in your family?"}],"holidayType":"topic","sourceUrls":["https://www.chinanews.com.cn/life/2017/07-18/8280841.shtml","https://www.chinanews.com.cn/sh/2015/07-30/7436148.shtml"],"sourceNote":"中新网《“回家吃饭日”倡导关注家人 近四成网友看重卫生健康》与《调查显示：北上广深仅不到一半人准时回家吃饭》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"fitness-running","cn":"跑步习惯","en":"Running habits","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"跑步是最容易开始的运动之一。有人喜欢清晨空旷的街道，有人更享受夜跑后的放松。可以聊配速、路线、跑鞋，也可以聊当初为什么开始跑。","briefEn":"Running is one of the easiest ways to start moving. Some people love empty streets at dawn, while others prefer the calm of a night run. You can talk about pace, favourite routes, shoes, or what first got them started.","questions":[{"cn":"你一般一周跑几次？","en":"How often do you run in a normal week?"},{"cn":"你更喜欢晨跑还是夜跑？","en":"Do you prefer running in the morning or at night?"},{"cn":"你是怎么开始跑步的？","en":"What made you start running?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/knee-pain-and-other-running-injuries/","https://worldathletics.org/news"],"sourceNote":"NHS 跑步损伤科普页与 World Athletics 新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-weekly-activity","cn":"每周运动量","en":"Weekly activity targets","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"世界卫生组织建议成年人每周 150 至 300 分钟中等强度有氧活动，并在一周里至少两天做力量练习。可以聊各自怎么把这些时间拆进忙碌的一周。","briefEn":"The WHO suggests adults get 150 to 300 minutes of moderate aerobic activity a week, plus muscle-strengthening work on at least two days. A good chat is how people fit that into a busy week, and what actually counts.","questions":[{"cn":"你一周大概有多少时间在运动？","en":"About how much time do you spend exercising in a week?"},{"cn":"你觉得每周的目标好完成吗？","en":"Is a weekly target easy for you to hit?"}],"holidayType":"topic","sourceUrls":["https://www.who.int/news-room/fact-sheets/detail/physical-activity","https://www.nhs.uk/live-well/exercise/physical-activity-guidelines-for-adults-aged-19-to-64/"],"sourceNote":"WHO 身体活动实况报道与 NHS 19–64 岁成人活动指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-gym-strength","cn":"健身房力量训练","en":"Strength training at the gym","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"力量训练不只是练大块肌肉，也帮助日常搬东西和保持骨骼健康。可以聊训练计划、器械和自由重量，以及第一次进健身房的紧张感。","briefEn":"Strength training is not just about big muscles. It also helps with everyday lifting and bone health. People enjoy talking about their routines, machines versus free weights, and how nervous they felt on their first gym visit.","questions":[{"cn":"你在健身房主要练什么？","en":"What do you usually work on at the gym?"},{"cn":"你更喜欢器械还是自由重量？","en":"Do you prefer machines or free weights?"},{"cn":"第一次去健身房紧张吗？","en":"Were you nervous the first time you went to a gym?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/strength-and-resistance/","https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/"],"sourceNote":"NHS 力量与抗阻训练视频页、力量柔韧改善指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-swimming","cn":"游泳","en":"Swimming","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"游泳对关节友好，也是少数能同时练到全身的运动。可以聊泳姿、泳池和开放水域的差别，以及小时候是怎么学会的。","briefEn":"Swimming is gentle on the joints and works the whole body at once. Good topics are stroke styles, the difference between a pool and open water, and how people learned to swim as kids. It is also a good way to switch off after a long day at work.","questions":[{"cn":"你会游哪种泳姿？","en":"Which swimming stroke can you do?"},{"cn":"你更喜欢泳池还是开放水域？","en":"Do you prefer a pool or open water?"},{"cn":"你是什么时候学会游泳的？","en":"When did you learn to swim?"}],"holidayType":"topic","sourceUrls":["https://www.worldaquatics.com/news","https://www.usaswimming.org/news"],"sourceNote":"World Aquatics 与 USA Swimming 官方新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"板类与户外"},{"id":"fitness-football","cn":"足球","en":"Football","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"足球既是运动也是共同语言。可以聊周末踢球、支持哪支球队、看球的习惯，也可以聊规则差异和第一次上场的感受。","briefEn":"Football is both a sport and a shared language. You can talk about weekend games, which team someone supports, how they watch matches, or how the rules differ where they grew up. Many people also follow leagues in other countries.","questions":[{"cn":"你平时会踢球吗？","en":"Do you play football yourself?"},{"cn":"你有支持的球队吗？","en":"Do you support a particular team?"},{"cn":"你更愿意踢球还是看球？","en":"Do you prefer playing or watching?"}],"holidayType":"topic","sourceUrls":["https://www.premierleague.com/news"],"sourceNote":"Premier League 官方新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"球类"},{"id":"fitness-basketball","cn":"篮球","en":"Basketball","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"篮球节奏快、场地多，很容易变成朋友间的固定活动。可以聊三对三、投篮练习、喜欢的球员，也可以聊看比赛时的气氛。","briefEn":"Basketball is fast and easy to find a court for, so it often becomes a regular thing among friends. People like talking about three-on-three games, shooting practice, favourite players, and the atmosphere at live matches.","questions":[{"cn":"你打过三对三吗？","en":"Have you played three-on-three basketball?"},{"cn":"你更喜欢打球还是看比赛？","en":"Do you rather play or watch basketball?"},{"cn":"你最喜欢的球员是谁？","en":"Who is your favourite player?"}],"holidayType":"topic","sourceUrls":["https://www.fiba.basketball/news"],"sourceNote":"FIBA 官方新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"球类"},{"id":"fitness-hiking","cn":"徒步","en":"Hiking","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"徒步的乐趣一半在路线，一半在同行的人。可以聊周末短途、长线穿越、装备和天气，也可以聊路上遇到过的意外风景。","briefEn":"Half the fun of hiking is the route and half is the company. Good things to ask about are weekend walks, long-distance trails, gear, weather, and the unexpected views people found along the way. Some go alone and others join a group.","questions":[{"cn":"你最近一次徒步去了哪里？","en":"Where did you last go hiking?"},{"cn":"你更喜欢一天的短途还是多天的路线？","en":"Do you prefer a day hike or a multi-day trail?"},{"cn":"徒步时你最难忘的风景是什么？","en":"What is the most memorable view you have seen while hiking?"}],"holidayType":"topic","sourceUrls":["https://www.ramblers.org.uk/"],"sourceNote":"英国徒步慈善机构 Ramblers 官网，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"板类与户外"},{"id":"fitness-cycling","cn":"骑行","en":"Cycling","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"骑行可以是通勤、锻炼，也可以是周末探索城市外的方式。可以聊路线、爬坡、通勤安全，以及自行车在各自城市里的地位。","briefEn":"Cycling can be a commute, a workout, or a way to explore outside the city at weekends. People enjoy talking about routes, climbing hills, safety on the road, and how bikes fit into daily life where they live.","questions":[{"cn":"你骑车主要是为了什么？","en":"What do you mainly use a bike for?"},{"cn":"你更喜欢平路还是爬坡？","en":"Do you prefer flat roads or hill climbs?"},{"cn":"你住的地方骑车方便吗？","en":"Is cycling easy where you live?"}],"holidayType":"topic","sourceUrls":["https://www.sustrans.org.uk/","https://www.uci.org/news"],"sourceNote":"英国步行骑行慈善机构 Sustrans 官网、国际自行车联盟 UCI 新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"板类与户外"},{"id":"fitness-yoga","cn":"瑜伽","en":"Yoga","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"瑜伽把呼吸、平衡和力量放在一起，适合不同基础的人。可以聊喜欢的流派、在家练还是去课室，以及练完之后身体和心情的变化。","briefEn":"Yoga brings breathing, balance and strength together, and it works for very different levels. Nice topics are favourite styles, practising at home or in a studio, and how people feel after a session. Beginners often worry about not being flexible enough.","questions":[{"cn":"你练过瑜伽吗？","en":"Have you tried yoga?"},{"cn":"你更喜欢在家练还是去上课？","en":"Do you prefer practising at home or in a class?"},{"cn":"练完瑜伽后你有什么感觉？","en":"How do you feel after yoga?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/pilates-and-yoga/"],"sourceNote":"NHS 普拉提与瑜伽练习视频页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-stretching","cn":"拉伸","en":"Stretching","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"拉伸不需要器械，几分钟就能做。可以聊运动后的放松、久坐后的肩颈，以及哪些动作对各自最有效。注意缓慢进入，不要弹振。","briefEn":"Stretching needs no equipment and only a few minutes. People talk about post-workout cool-downs, tight shoulders after sitting, and which moves help them most. The key is to move in slowly rather than bounce. A few minutes after a walk already helps.","questions":[{"cn":"你平时会拉伸吗？","en":"Do you stretch regularly?"},{"cn":"你哪个部位最容易紧张？","en":"Which part of your body gets tight most often?"},{"cn":"你更喜欢运动前还是运动后拉伸？","en":"Do you prefer stretching before or after exercise?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/how-to-stretch-after-exercising/"],"sourceNote":"NHS 运动后拉伸指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-warmup","cn":"热身","en":"Warming up","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"热身能让身体逐步进入状态。一般从几分钟轻度活动开始，再做和当天运动相关的动态动作。可以聊聊各自的热身习惯和曾经忽略热身吃的亏。","briefEn":"A warm-up helps the body ease into exercise. It usually starts with a few minutes of light movement, then some dynamic moves related to what you are about to do. People can share their routines and times they skipped it.","questions":[{"cn":"你运动前一般怎么热身？","en":"How do you usually warm up before exercise?"},{"cn":"热身要花多长时间？","en":"How long does your warm-up take?"},{"cn":"你有没有因为没热身而吃过亏？","en":"Have you ever regretted skipping a warm-up?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/how-to-warm-up-before-exercising/"],"sourceNote":"NHS 运动前热身指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-injury-prevention","cn":"运动损伤预防","en":"Preventing sports injuries","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"多数运动损伤和突然加量、动作变形、恢复不足有关。可以聊循序渐进、交叉训练和休息日。持续疼痛应找专业教练或医生，而不是硬扛。","briefEn":"Many sports injuries come from sudden jumps in training, poor form, or too little recovery. Good topics are building up gradually, cross-training, and rest days. If pain continues, the sensible move is to see a coach or doctor rather than push through.","questions":[{"cn":"你受过什么运动伤？","en":"Have you ever had a sports injury?"},{"cn":"你会安排休息日吗？","en":"Do you plan rest days?"},{"cn":"你是怎么避免重复受伤的？","en":"How do you avoid getting the same injury again?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/conditions/sprains-and-strains/","https://www.nhs.uk/live-well/exercise/knee-pain-and-other-running-injuries/"],"sourceNote":"NHS 扭伤与拉伤说明页、跑步膝痛与损伤页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-sitting","cn":"久坐与活动","en":"Sitting less","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"久坐对身体的负担常常被低估。把长时间坐着切成几段、每小时起身活动一下，是很实用的办法。可以聊各自的工作姿势和小动作。","briefEn":"Sitting for long stretches is easy to underestimate. Breaking it up and standing every hour is a simple fix. People can compare their desk setups and the small movements they do during the day. Short walk breaks often count more than people expect.","questions":[{"cn":"你一天大概坐多久？","en":"About how long do you sit each day?"},{"cn":"你会不会每小时起来活动一下？","en":"Do you get up and move every hour?"},{"cn":"你有什么在办公桌边做的小动作？","en":"What small exercises do you do at your desk?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/why-sitting-too-much-is-bad-for-us/","https://www.nhs.uk/live-well/exercise/sitting-exercises/"],"sourceNote":"NHS 久坐影响页与坐姿练习页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-aerobic","cn":"有氧运动","en":"Cardio","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"快走、慢跑、游泳、跳舞都算有氧。判断强度的一个简单办法是能说话但唱不了歌。可以聊各自喜欢的有氧方式和坚持下来的窍门。","briefEn":"Brisk walking, jogging, swimming and dancing all count as aerobic exercise. A simple way to judge the effort is that you can talk but not sing. People like sharing what they enjoy and how they keep it going.","questions":[{"cn":"你最喜欢哪种有氧运动？","en":"What kind of aerobic exercise do you enjoy most?"},{"cn":"你怎么判断强度够不够？","en":"How do you know if the effort is hard enough?"},{"cn":"你一般在哪里做有氧？","en":"Where do you usually do your cardio?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/aerobic-exercises/"],"sourceNote":"NHS 有氧运动视频页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-walking","cn":"步行","en":"Walking","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"步行门槛低，也容易变成每天的固定时间。可以聊通勤步行、饭后散步、计步目标，以及走路时听什么、看什么。","briefEn":"Walking is easy to start and easy to make part of a daily routine. Good topics are walking to work, after-dinner strolls, step goals, and what people listen to or notice on the way. It is also an easy way to spend time with someone.","questions":[{"cn":"你每天大概走多少步？","en":"About how many steps do you walk a day?"},{"cn":"你喜欢一个人走还是和朋友一起？","en":"Do you prefer walking alone or with friends?"},{"cn":"你走路时会听什么吗？","en":"Do you listen to anything while you walk?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/walking-for-health/"],"sourceNote":"NHS 步行与健康指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-watching-sports","cn":"观赛","en":"Watching live sport","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"看比赛是很多人共同的周末安排。可以聊支持的队伍、看球的地方、解说风格，也可以聊第一次现场看比赛的记忆。","briefEn":"Watching sport is a weekend ritual for many people. You can talk about teams, where they watch, how commentary sounds, and the first time they saw a match live. Some follow several leagues at once, and others only watch big events.","questions":[{"cn":"你平时看什么比赛？","en":"What sports do you watch?"},{"cn":"你更喜欢在家看还是去现场？","en":"Do you prefer watching at home or at the venue?"},{"cn":"你第一次现场看比赛是什么感觉？","en":"What was your first live match like?"}],"holidayType":"topic","sourceUrls":["https://worldathletics.org/news","https://www.premierleague.com/news"],"sourceNote":"World Athletics 新闻页、Premier League 官方新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"观赛与赛事"},{"id":"fitness-race-events","cn":"路跑赛事","en":"Road races","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"路跑赛事把训练、城市路线和人群气氛放在一起。可以聊五公里、十公里、半马的准备，也可以聊赛道补给和终点线的心情。","briefEn":"Road races combine training, city routes and crowd energy. People enjoy talking about preparing for a 5K, a 10K or a half marathon, what is handed out on the course, and how the finish line feels.","questions":[{"cn":"你跑过比赛吗？","en":"Have you ever run a race?"},{"cn":"你更想挑战十公里还是半马？","en":"Would you rather take on a 10K or a half marathon?"},{"cn":"比赛当天你最紧张的是什么？","en":"What makes you most nervous on race day?"}],"holidayType":"topic","sourceUrls":["https://worldathletics.org/news"],"sourceNote":"World Athletics 官方新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"观赛与赛事"},{"id":"fitness-water-safety","cn":"游泳安全","en":"Water safety","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"游泳安全比速度更重要。结伴下水、留意水域标志和救生员位置，是很多地方反复强调的常识。可以聊各自水域的习惯和规则。","briefEn":"Water safety matters more than speed. Swimming with someone else, checking signs and knowing where the lifeguards are is basic advice in many places. People can compare local rules and habits. It is a topic where small details really matter.","questions":[{"cn":"你去开放水域会做哪些准备？","en":"What do you check before swimming in open water?"},{"cn":"你更放心有救生员的泳池吗？","en":"Do you feel safer in a pool with lifeguards?"},{"cn":"你那边有哪些游泳安全规则？","en":"What water safety rules apply where you swim?"}],"holidayType":"topic","sourceUrls":["https://www.worldaquatics.com/news"],"sourceNote":"World Aquatics 官方新闻页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"板类与户外"},{"id":"fitness-flexibility","cn":"柔韧训练","en":"Flexibility training","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"柔韧不是越软越好，而是关节在需要的时候能舒服地活动。可以聊日常活动范围、久坐后的紧绷，以及力量与柔韧怎么一起练。","briefEn":"Flexibility is not about being as bendy as possible. It is about joints moving comfortably when you need them. People can talk about everyday range of motion, tightness after sitting, and training strength and mobility together.","questions":[{"cn":"你觉得自己身体柔韧吗？","en":"Do you consider yourself flexible?"},{"cn":"你哪个动作做起来最吃力？","en":"Which movement is hardest for you?"},{"cn":"你会专门练柔韧吗？","en":"Do you train flexibility on purpose?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/"],"sourceNote":"NHS 力量与柔韧改善指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"fitness-exercise-mood","cn":"运动与情绪","en":"Exercise and mood","region":"国际","theme":"健身运动","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"很多人运动后会感觉心情更稳、睡得更踏实。原因不只是体力消耗，也和规律、社交与户外时间有关。可以聊各自运动后的真实感受。","briefEn":"Many people feel steadier and sleep better after exercise. It is not only about burning energy; routine, company and time outdoors matter too. A good chat is what exercise actually changes in someone's day. Some notice the effect right away and others over weeks.","questions":[{"cn":"运动之后你的心情会变好吗？","en":"Does your mood change after exercise?"},{"cn":"你运动是为了身体还是心情？","en":"Do you exercise more for your body or your mood?"},{"cn":"哪天没运动你会觉得不舒服吗？","en":"Do you feel off on days you do not move?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/exercise/exercise-health-benefits/"],"sourceNote":"NHS 运动健康益处页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"体能与日常"},{"id":"more-travel-style","cn":"旅行方式","en":"Travel styles","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人喜欢把行程排满，有人只订一张车票就出发。可以聊自由行、跟团、慢旅行和短途周末的差别，以及各自最舒服的节奏。","briefEn":"Some people plan every hour, while others just book a ticket and go. You can compare independent travel, group tours, slow travel and weekend trips, and talk about the pace that suits each person best.","questions":[{"cn":"你更喜欢自由行还是跟团？","en":"Do you prefer travelling independently or with a tour?"},{"cn":"你旅行时会把行程排满吗？","en":"Do you plan every hour when you travel?"},{"cn":"你理想的一次旅行有多长？","en":"How long would your ideal trip be?"}],"holidayType":"topic","sourceUrls":["https://www.lonelyplanet.com/","https://www.lonelyplanet.com/articles/guide-to-trip-planning"],"sourceNote":"Lonely Planet 首页与行程规划指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-travel-packing","cn":"旅行打包","en":"Packing for a trip","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"打包能看出一个人的旅行习惯。有人只带随身行李，有人箱子永远塞满。可以聊必带的东西、忘带的经历和轻装出行的技巧。","briefEn":"Packing says a lot about how someone travels. Some people live out of a carry-on, while others always fill a big suitcase. Good topics are essentials, things people forgot, and tips for packing light. Everyone seems to have one item they never leave behind.","questions":[{"cn":"你旅行一般带多大的箱子？","en":"What size bag do you usually take?"},{"cn":"你有什么必带的东西？","en":"What is one thing you always pack?"},{"cn":"你有没有忘带过很重要的东西？","en":"Have you ever forgotten something important?"}],"holidayType":"topic","sourceUrls":["https://www.lonelyplanet.com/articles/how-to-pack-light-for-a-long-trip"],"sourceNote":"Lonely Planet 轻装长途旅行打包指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-solo-travel","cn":"独自旅行","en":"Travelling solo","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"独自旅行自由度高，也考验安排和应变。可以聊一个人的路线、吃饭和安全感，也可以聊路上认识新朋友的方式。","briefEn":"Travelling alone brings freedom but also asks you to plan and adapt. People talk about routes, eating alone, feeling safe, and the easy ways they meet new people on the road. Some love it from the first day and others need a few days to settle in.","questions":[{"cn":"你一个人旅行过吗？","en":"Have you ever travelled alone?"},{"cn":"独自旅行最吸引你的是什么？","en":"What appeals to you about travelling alone?"},{"cn":"一个人吃饭会觉得别扭吗？","en":"Does eating alone feel awkward to you?"}],"holidayType":"topic","sourceUrls":["https://www.lonelyplanet.com/articles/where-to-go-solo-travel"],"sourceNote":"Lonely Planet 独自旅行目的地指南，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-travel-food","cn":"旅行中的当地美食","en":"Local food while travelling","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"很多旅行记忆是围绕吃展开的。可以聊市场、街边摊、家常菜馆，也可以聊口味差异和不敢尝试的食物。重点不是评价高低，而是各自的经验。","briefEn":"Many travel memories centre on food. People love talking about markets, street stalls, family restaurants, different flavours, and dishes they were nervous to try. It is less about ranking food and more about sharing the experience.","questions":[{"cn":"你旅行时会专门找当地市场吗？","en":"Do you seek out local markets when you travel?"},{"cn":"你吃过最难忘的一道当地菜是什么？","en":"What local dish do you remember most?"},{"cn":"你有什么不敢尝试的食物吗？","en":"Is there any food you avoid trying?"}],"holidayType":"topic","sourceUrls":["https://www.lonelyplanet.com/articles/what-to-eat-and-drink-in-thailand","https://www.unesco.org/en/creative-cities"],"sourceNote":"Lonely Planet 泰国饮食指南、UNESCO 创意城市网络（美食之都）页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-home-cooking","cn":"家常做饭","en":"Home cooking","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"家常菜最能看出一个人的生活节奏。有人每天做，有人只在周末下厨。可以聊拿手菜、常做的快手菜和厨房里的失败经历。","briefEn":"Home cooking shows how someone's week actually works. Some cook every day, others only at weekends. Good topics are signature dishes, quick meals, and the kitchen failures everyone remembers. It is also a nice way to talk about family recipes.","questions":[{"cn":"你平时自己做饭吗？","en":"Do you cook for yourself often?"},{"cn":"你的拿手菜是什么？","en":"What is your signature dish?"},{"cn":"你最常做的快手菜是什么？","en":"What is your go-to quick meal?"}],"holidayType":"topic","sourceUrls":["https://www.bbcgoodfood.com/"],"sourceNote":"BBC Good Food 官网，2026-11-09 实抓 HTTP 200；站内子页对爬虫返回 406，故只引用首页。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-coffee","cn":"咖啡","en":"Coffee","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"咖啡在不同城市有不同的日常角色。可以聊手冲和意式、加不加奶、在家做还是买，以及一天里第一杯咖啡的时间习惯。","briefEn":"Coffee plays a different daily role in different cities. People enjoy talking about filter versus espresso, milk or no milk, making it at home or buying it, and when they have their first cup. Some drink it to wake up and others mainly for the taste.","questions":[{"cn":"你每天喝咖啡吗？","en":"Do you drink coffee every day?"},{"cn":"你更喜欢手冲还是意式？","en":"Do you prefer filter coffee or espresso?"},{"cn":"你在家做咖啡吗？","en":"Do you make coffee at home?"}],"holidayType":"topic","sourceUrls":["https://ico.org/what-we-do/about-us/"],"sourceNote":"国际咖啡组织 ICO 官方介绍页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-tea","cn":"茶","en":"Tea","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"茶可以是早晨的一杯，也可以是招待朋友的仪式。可以聊绿茶、红茶、花草茶，以及加奶、加糖或清饮的不同习惯。","briefEn":"Tea can be a quick morning cup or something you share with guests. People like talking about green, black and herbal teas, and whether they take it with milk, sugar or nothing at all. Serving tea is also a small everyday ritual in many homes.","questions":[{"cn":"你平时喝什么茶？","en":"What kind of tea do you usually drink?"},{"cn":"你喝茶会加奶或糖吗？","en":"Do you take milk or sugar in your tea?"},{"cn":"你那边有特别的喝茶习惯吗？","en":"Are there any special tea habits where you are from?"}],"holidayType":"topic","sourceUrls":["https://www.tea.co.uk/tea-facts"],"sourceNote":"英国茶与花草茶协会 Tea Facts 页面，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-music","cn":"听什么音乐","en":"Music taste","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"音乐口味比语言更容易拉近距离。可以聊最近循环的歌、通勤时的歌单、喜欢的现场，也可以聊各自家里长辈听的音乐。","briefEn":"Music taste can connect people faster than language. Good topics are songs on repeat, commute playlists, favourite live shows, and the music older family members had on at home. A single song can bring back a whole year for someone.","questions":[{"cn":"你最近在循环哪首歌？","en":"What song have you had on repeat lately?"},{"cn":"你通勤时听什么？","en":"What do you listen to on your commute?"},{"cn":"你会听你父母那代的音乐吗？","en":"Do you listen to music from your parents' generation?"}],"holidayType":"topic","sourceUrls":["https://www.billboard.com/c/music/"],"sourceNote":"Billboard 音乐频道页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-live-music","cn":"现场演出","en":"Live music","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"现场演出的魅力在于气氛和不可复制。可以聊第一次看的演出、喜欢的场地，以及音乐节和小场地演出的差别。","briefEn":"Live music is about atmosphere and the fact that nothing repeats. People enjoy talking about their first show, favourite venues, and how festivals differ from small club gigs. Some go for the band and others mainly for the night out with friends.","questions":[{"cn":"你看过现场演出吗？","en":"Have you been to a live show?"},{"cn":"你更喜欢音乐节还是小场地？","en":"Do you prefer festivals or small venues?"},{"cn":"你最近想看谁的演出？","en":"Who would you like to see live?"}],"holidayType":"topic","sourceUrls":["https://www.npr.org/music/"],"sourceNote":"NPR Music 频道页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-movies","cn":"电影","en":"Movies","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"电影是很好的聊天入口，因为每个人都有自己的片单。可以聊最近看的片子、喜欢的类型、去影院还是在家看，以及字幕和配音的偏好。","briefEn":"Films are an easy way into conversation because everyone has their own list. People talk about what they saw recently, favourite genres, cinema versus home viewing, and subtitles versus dubbing. A film someone loved as a teenager often says a lot about them.","questions":[{"cn":"你最近看了什么电影？","en":"What film did you watch recently?"},{"cn":"你更喜欢去影院还是在家看？","en":"Do you prefer the cinema or watching at home?"},{"cn":"你看外语片会看字幕吗？","en":"Do you use subtitles for foreign films?"}],"holidayType":"topic","sourceUrls":["https://www.bfi.org.uk/features"],"sourceNote":"英国电影协会 BFI 影评专题页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-books","cn":"阅读","en":"Reading habits","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"阅读习惯差异很大，有人每天读几页，有人一年读几十本。可以聊最近在读的书、纸质和电子书，以及怎么找到下一本。","briefEn":"Reading habits vary a lot. Some read a few pages a day, others finish dozens of books a year. Good topics are what someone is reading now, paper versus e-books, and how they choose the next book.","questions":[{"cn":"你最近在读什么书？","en":"What are you reading at the moment?"},{"cn":"你更喜欢纸质书还是电子书？","en":"Do you prefer paper books or e-books?"},{"cn":"你怎么找到下一本想读的书？","en":"How do you find your next book?"}],"holidayType":"topic","sourceUrls":["https://www.npr.org/books/"],"sourceNote":"NPR Books 书评与作者访谈频道页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-games","cn":"电子游戏","en":"Video games","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"游戏已经是很多人的主要娱乐方式。可以聊手游和主机、单机和联机、玩多久，也可以聊小时候最早玩的游戏。","briefEn":"Games are a main form of entertainment for many people. You can talk about mobile versus console, single-player versus online, how long they play, and the first game they remember. Some play to relax alone and others mainly to keep up with friends.","questions":[{"cn":"你平时玩什么游戏？","en":"What games do you play?"},{"cn":"你更喜欢单机还是联机？","en":"Do you prefer single-player or online games?"},{"cn":"你小时候最早玩的游戏是什么？","en":"What was the first game you played?"}],"holidayType":"topic","sourceUrls":["https://www.theesa.com/"],"sourceNote":"美国娱乐软件协会 ESA 官网，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-learning-language","cn":"学外语","en":"Learning a language","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"学语言的方法因人而异。有人靠课堂，有人靠看剧和聊天。可以聊现在在学什么、最难的部分，以及有没有在真实场景里用上。","briefEn":"Language learning looks different for everyone. Some rely on classes, others on shows and conversation. People can talk about what they are learning, the hardest part, and times they used it for real. Making mistakes in front of someone is often the turning point.","questions":[{"cn":"你在学什么语言？","en":"What language are you learning?"},{"cn":"你觉得听说读写哪项最难？","en":"Which is hardest for you: listening, speaking, reading or writing?"},{"cn":"你用过什么方法练口语？","en":"What have you tried to practise speaking?"}],"holidayType":"topic","sourceUrls":["https://blog.duolingo.com/hub/language/"],"sourceNote":"Duolingo 官方博客语言学习栏目，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"工作学习"},{"id":"more-online-courses","cn":"在线课程","en":"Online courses","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"在线课程让人可以按自己的时间学新东西。可以聊学过的课、完成的证书、半途而废的经历，以及线上和线下课堂的差别。","briefEn":"Online courses let people learn on their own schedule. Good topics are courses they finished, certificates they earned, ones they dropped, and how online classes compare with being in a room. Finishing a course often matters more than the certificate itself.","questions":[{"cn":"你上过在线课程吗？","en":"Have you taken an online course?"},{"cn":"你学完了吗？","en":"Did you finish it?"},{"cn":"你更喜欢线上还是线下上课？","en":"Do you prefer learning online or in person?"}],"holidayType":"topic","sourceUrls":["https://www.coursera.org/","https://www.edx.org/"],"sourceNote":"Coursera 与 edX 官网，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"工作学习"},{"id":"more-remote-work","cn":"远程办公","en":"Remote work","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"远程办公改变了工作和生活的边界。可以聊在家工作的效率、视频会议、通勤时间怎么用，以及团队怎么保持联系。","briefEn":"Remote work has changed where the line between job and life sits. People talk about focus at home, video calls, what they do with the saved commute, and how teams stay in touch. Some love the quiet and others miss the office more than expected.","questions":[{"cn":"你能接受远程办公吗？","en":"Would remote work suit you?"},{"cn":"在家工作效率更高还是更低？","en":"Are you more or less productive at home?"},{"cn":"你们团队怎么保持联系？","en":"How does your team stay in touch?"}],"holidayType":"topic","sourceUrls":["https://www.gallup.com/workplace/"],"sourceNote":"Gallup 职场研究栏目，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"工作学习"},{"id":"more-city-parks","cn":"城市公园","en":"City parks","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"公园是城市里最容易到达的放松空间。可以聊晨练、野餐、遛狗和带孩子，也可以聊各自城市里最喜欢的公园和它的变化。","briefEn":"Parks are the easiest escape in a city. People talk about morning exercise, picnics, dog walks, time with kids, and the park they like most in their city and how it has changed. A good park often becomes part of someone's weekly routine.","questions":[{"cn":"你城市里最喜欢的公园是哪个？","en":"Which park do you like most in your city?"},{"cn":"你一般去公园做什么？","en":"What do you usually do in a park?"},{"cn":"你觉得公园够用吗？","en":"Do you think your city has enough green space?"}],"holidayType":"topic","sourceUrls":["https://www.unhabitat.org/"],"sourceNote":"联合国人居署 UN-Habitat 官网，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-public-transport","cn":"公共交通","en":"Public transport","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"公共交通决定了一座城市的生活半径。可以聊地铁、公交、骑行接驳，也可以聊通勤时间和换乘体验，比较的是便利度而不是票价。","briefEn":"Public transport shapes how far a city feels. People can talk about metro lines, buses, bike connections, commute times and transfers. The interesting part is convenience and daily experience, not ticket prices. Some prefer a longer ride if it means no changes.","questions":[{"cn":"你平时坐地铁还是公交？","en":"Do you usually take the metro or the bus?"},{"cn":"你通勤要多久？","en":"How long is your commute?"},{"cn":"你住的地方换乘方便吗？","en":"Are transfers easy where you live?"}],"holidayType":"topic","sourceUrls":["https://www.worldbank.org/en/topic/urbandevelopment"],"sourceNote":"世界银行城市发展专题页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-museums","cn":"博物馆","en":"Museums","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"博物馆是了解一座城市最安静的方式。可以聊最近看的展、喜欢的类型，以及逛博物馆时喜欢听讲解还是自己慢慢看。","briefEn":"Museums are a quiet way into a city's story. Good topics are recent exhibitions, favourite kinds of museums, and whether someone likes guided explanations or wandering on their own. Many people remember one object from a visit years later.","questions":[{"cn":"你最近去过博物馆吗？","en":"Have you been to a museum recently?"},{"cn":"你喜欢哪类博物馆？","en":"What kind of museum do you like?"},{"cn":"你逛展喜欢听讲解吗？","en":"Do you like audio guides in museums?"}],"holidayType":"topic","sourceUrls":["https://www.louvre.fr/en"],"sourceNote":"卢浮宫官网英文页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-recycling","cn":"垃圾分类","en":"Recycling at home","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"垃圾分类的规则各地差别很大。可以聊家里怎么分、哪些东西最难处理，以及刚开始时的困惑。比较规则本身，不评价谁更先进。","briefEn":"Recycling rules differ a lot from place to place. People talk about how they sort at home, which items are hardest to deal with, and what confused them at first. It is interesting to compare systems, not to rank them.","questions":[{"cn":"你家里的垃圾怎么分类？","en":"How do you sort rubbish at home?"},{"cn":"你觉得哪类垃圾最难处理？","en":"Which kind of waste is hardest to deal with?"},{"cn":"你刚开始分类时困惑吗？","en":"Did sorting confuse you at first?"}],"holidayType":"topic","sourceUrls":["https://www.epa.gov/recycle","https://www.un.org/en/actnow"],"sourceNote":"美国环保署 EPA 减量复用回收专题页、联合国 Act Now 行动页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-sustainable-life","cn":"可持续生活","en":"Sustainable living","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"可持续生活不是一次做到完美，而是日常里的小选择。可以聊自带杯、二手物品、少浪费，以及哪些改变真正坚持下来了。","briefEn":"Sustainable living is less about being perfect and more about small daily choices. People talk about bringing their own cup, buying second-hand, wasting less, and which changes actually stuck. The habits that last are usually the ones that save time or money too.","questions":[{"cn":"你生活里有哪些环保小习惯？","en":"What small green habits do you have?"},{"cn":"你会买二手物品吗？","en":"Do you buy second-hand things?"},{"cn":"你觉得哪种改变最容易坚持？","en":"Which change is easiest to keep up?"}],"holidayType":"topic","sourceUrls":["https://www.un.org/en/climatechange/science/climate-issues"],"sourceNote":"联合国气候变化议题科普页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-pets-dogs","cn":"养狗","en":"Living with a dog","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"养狗是长期的陪伴和责任。可以聊遛狗路线、训练方式、掉毛和看兽医，也可以聊当初为什么决定养一只狗。","briefEn":"Having a dog is long-term company and responsibility. People enjoy talking about walking routes, training, shedding, vet visits, and why they decided to get a dog in the first place. Dogs also make it much easier to start conversations in a neighbourhood.","questions":[{"cn":"你养狗吗？","en":"Do you have a dog?"},{"cn":"你每天遛狗多久？","en":"How long do you walk your dog each day?"},{"cn":"你觉得养狗最麻烦的是什么？","en":"What is the hardest part of having a dog?"}],"holidayType":"topic","sourceUrls":["https://www.aspca.org/pet-care/dog-care"],"sourceNote":"ASPCA 官方犬类护理页面，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"宠物与摄影"},{"id":"more-pets-cats","cn":"养猫","en":"Living with a cat","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"猫的相处方式更像合租室友。可以聊猫的性格、室内饲养、抓家具和夜里跑动，也可以聊怎么让猫适应新环境。","briefEn":"Living with a cat is a bit like sharing a flat with a roommate. People talk about personality, indoor life, scratched furniture, midnight running, and how a cat settles into a new home. Some cats are social from day one and others take weeks.","questions":[{"cn":"你养猫吗？","en":"Do you have a cat?"},{"cn":"你的猫是什么性格？","en":"What is your cat's personality like?"},{"cn":"猫晚上会闹腾吗？","en":"Does your cat get active at night?"}],"holidayType":"topic","sourceUrls":["https://www.aspca.org/pet-care/cat-care"],"sourceNote":"ASPCA 官方猫类护理页面，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"宠物与摄影"},{"id":"more-photography","cn":"手机摄影","en":"Phone photography","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"手机让拍照变成日常记录。可以聊常拍什么、构图习惯、修不修图，以及旅行时更愿意拍人还是拍景。","briefEn":"Phones have made photography part of everyday life. Good topics are what people shoot, how they frame a picture, whether they edit, and whether they prefer people or scenery when travelling. Most people have one photo they keep coming back to.","questions":[{"cn":"你平时喜欢拍什么？","en":"What do you like to photograph?"},{"cn":"你会修图吗？","en":"Do you edit your photos?"},{"cn":"旅行时你更爱拍人还是拍景？","en":"When travelling, do you shoot people or scenery?"}],"holidayType":"topic","sourceUrls":["https://www.dpreview.com/"],"sourceNote":"摄影器材与资讯网站 DPReview 官网，2026-11-09 实抓 HTTP 200；站内文章页对爬虫返回 403，故只引用首页。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"宠物与摄影"},{"id":"more-screen-time","cn":"屏幕时间与数字生活","en":"Screen time","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"手机让很多事更方便，也让休息时间被切碎。可以聊每天屏幕用时、睡前刷手机的习惯，以及有没有主动关掉通知。","briefEn":"Phones make many things easier but also chop up rest time. People talk about daily screen hours, scrolling before bed, and whether they have turned notifications off on purpose. The interesting part is which apps feel useful and which ones just eat time.","questions":[{"cn":"你每天大概看多久手机？","en":"About how long do you look at your phone each day?"},{"cn":"你睡前会刷手机吗？","en":"Do you scroll on your phone before bed?"},{"cn":"你会主动关掉通知吗？","en":"Do you turn notifications off?"}],"holidayType":"topic","sourceUrls":["https://www.itu.int/en/ITU-D/Statistics/Pages/facts/default.aspx"],"sourceNote":"国际电信联盟 ITU 数字化发展事实与数据报告页，2026-11-09 实抓 HTTP 200。","verifiedAt":"2026-11-09","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-weekend-trip","cn":"周末短途旅行","en":"Weekend getaways","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"周末两天不想走太远，又想换个环境。可以聊目的地怎么选、开车还是坐车、住一晚还是当天回，以及回来后累不累。","briefEn":"A weekend away does not need to be far. People talk about how they pick a place, whether they drive or take the train, staying one night or coming back the same day, and whether they feel rested afterwards. The best short trips are usually the ones with the least planning.","questions":[{"cn":"你周末更喜欢出去玩还是在家待着？","en":"On weekends, do you prefer going out or staying home?"},{"cn":"你最近一次短途旅行去了哪里？","en":"Where did you go on your last short trip?"},{"cn":"你会当天来回还是住一晚？","en":"Do you go for the day or stay overnight?"}],"holidayType":"topic","sourceUrls":["https://www.lonelyplanet.com/articles/perfect-weekend-prague","https://www.lonelyplanet.com/articles"],"sourceNote":"Lonely Planet「Perfect weekend in Prague」周末行程文章与文章频道页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-city-walking","cn":"城市里的步行体验","en":"Walking around a city","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"走路是认识一座城市最慢也最直接的方式。可以聊常走的路线、人行道好不好走、晚上散步安不安全，以及走路时会不会留意街边小店。","briefEn":"Walking is the slowest and most direct way to know a city. People talk about the routes they take, whether the pavements are easy to walk on, how safe evening walks feel, and whether they notice small shops along the way. Some walk mainly to get somewhere and others just to look around.","questions":[{"cn":"你在城市里一般走路还是坐车？","en":"Do you usually walk or take transport around your city?"},{"cn":"你常走的那条路好走吗？","en":"Is the route you usually take easy to walk?"},{"cn":"你晚上会在城市里散步吗？","en":"Do you take evening walks in your city?"}],"holidayType":"topic","sourceUrls":["https://www.pps.org/","https://www.who.int/news-room/fact-sheets/detail/physical-activity"],"sourceNote":"Project for Public Spaces 公共空间机构官网、世界卫生组织身体活动事实清单页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-street-food","cn":"街头小吃与夜市","en":"Street food and night markets","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"夜市和小吃摊是城市最有烟火气的部分。可以聊常吃的小吃、摊位排队值不值、卫生怎么判断，以及各自城市夜市开到几点。","briefEn":"Night markets and street stalls are where a city feels most alive. Good topics are the snacks people always order, whether a queue is worth joining, how they judge hygiene, and how late markets stay open. Street food is also an easy way to explain local habits to someone from another country.","questions":[{"cn":"你那边有夜市吗？","en":"Are there night markets where you live?"},{"cn":"你最常买的小吃是什么？","en":"What snack do you buy most often?"},{"cn":"你会为了排队等一家摊子吗？","en":"Will you queue for a popular stall?"}],"holidayType":"topic","sourceUrls":["https://www.unesco.org/en/creative-cities"],"sourceNote":"UNESCO 创意城市网络（含美食之都）官方页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"旅行与美食"},{"id":"more-sports-watching","cn":"运动观赛","en":"Watching sport","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"看比赛可以是周末的固定安排，也可以是和朋友的借口。可以聊支持的球队、去现场还是在家看、看球时的习惯，以及输了之后的反应。","briefEn":"Watching sport can be a fixed weekend routine or just an excuse to meet friends. People talk about the teams they follow, watching at the stadium or at home, their match-day habits, and how they react when their side loses. Even people who rarely watch a full game have one team they care about.","questions":[{"cn":"你看什么比赛？","en":"What sports do you watch?"},{"cn":"你更喜欢去现场还是在家看？","en":"Do you prefer watching live or at home?"},{"cn":"你看球时有什么固定习惯？","en":"Do you have any habits when you watch a match?"}],"holidayTy
