pe":"topic","sourceUrls":["https://www.fifa.com/en/tournaments","https://www.fifa.com/"],"sourceNote":"国际足联 FIFA 赛事频道页与官网首页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-online-gaming-friends","cn":"电子游戏与线上朋友","en":"Games and online friends","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"一起打游戏的人都来自很远的地方，却几乎天天见面。可以聊怎么组队、语音里聊什么、时差怎么凑，以及游戏里的朋友和现实朋友有什么不同。","briefEn":"Many people now play with friends they have never met in person. Good topics are how they find a squad, what they talk about on voice chat, how they deal with time zones, and how game friends differ from the ones nearby. Some of these friendships outlast the game itself.","questions":[{"cn":"你会和网友一起打游戏吗？","en":"Do you play games with people you met online?"},{"cn":"你们在语音里一般聊什么？","en":"What do you usually talk about on voice chat?"},{"cn":"游戏里的朋友和现实朋友像吗？","en":"Are game friends like friends in real life?"}],"holidayType":"topic","sourceUrls":["https://www.theesa.com/"],"sourceNote":"美国娱乐软件协会 ESA 官网，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-podcasts","cn":"播客与有声内容","en":"Podcasts and audio","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"通勤、做饭、走路时，耳朵一直没有闲着。可以聊常听的节目、一次听多久、喜欢访谈还是讲故事，以及有没有因为播客改变过想法。","briefEn":"Podcasts fill the time when people commute, cook or walk. They like talking about the shows they follow, how long they listen in one go, whether they prefer interviews or stories, and anything that changed their mind. Listening together with someone is also a good way to start a conversation.","questions":[{"cn":"你平时听播客吗？","en":"Do you listen to podcasts?"},{"cn":"你一般在什么时候听？","en":"When do you usually listen?"},{"cn":"你更喜欢访谈还是讲故事？","en":"Do you prefer interviews or storytelling?"}],"holidayType":"topic","sourceUrls":["https://www.npr.org/podcasts/","https://www.npr.org/podcasts/510313/how-i-built-this"],"sourceNote":"NPR 播客总目录页与《How I Built This》节目页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-social-media-boundaries","cn":"社交媒体使用边界","en":"Social media boundaries","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"很多人都有过刷太久之后的疲惫感。可以聊每天用多久、会不会发生活细节、怎么处理不想看到的内容，以及有没有试过关掉一段时间。","briefEn":"Many people feel tired after scrolling for too long. Good topics are daily usage, what they share about their own lives, how they handle content they would rather not see, and whether they have ever taken a break. Everyone draws the line somewhere different, and that is worth comparing.","questions":[{"cn":"你每天用多久社交媒体？","en":"How long do you spend on social media each day?"},{"cn":"你会发自己的生活细节吗？","en":"Do you post details about your daily life?"},{"cn":"你有试过关掉一段时间吗？","en":"Have you ever taken a break from it?"}],"holidayType":"topic","sourceUrls":["https://www.apa.org/topics/social-media-internet"],"sourceNote":"美国心理学会 APA 社交媒体与互联网专题页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"影音与游戏"},{"id":"more-online-shopping","cn":"网购与快递习惯","en":"Online shopping and deliveries","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"网购改变了很多人的购物习惯。可以聊买之前怎么比价、多久收到一次快递、快递柜还是送上门，以及买回来不合心意怎么处理。","briefEn":"Online shopping has changed how many people buy things. People talk about comparing prices before they order, how often parcels arrive, whether they prefer a locker or delivery to the door, and what they do when something is not right. Waiting for a parcel is a small daily pleasure for some and an annoyance for others.","questions":[{"cn":"你常在网上买东西吗？","en":"Do you shop online often?"},{"cn":"你买之前会比价吗？","en":"Do you compare prices before you buy?"},{"cn":"你更喜欢送上门还是放快递柜？","en":"Do you prefer delivery to the door or a locker?"}],"holidayType":"topic","sourceUrls":["https://www.usps.com/ship/","https://www.usps.com/"],"sourceNote":"美国邮政 USPS 寄件服务页与官网首页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"金钱健康科技"},{"id":"more-saving-money","cn":"存钱与消费计划","en":"Saving and spending plans","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"存钱的方式和花钱的习惯往往是一起出现的。可以聊有没有固定存一部分、记账管不管用、大件怎么决定，以及计划之外的花销怎么办。","briefEn":"Saving and spending habits usually show up together. People like talking about whether they set aside a fixed amount, whether budgeting apps help, how they decide on big purchases, and what they do about unexpected costs. Small everyday choices often matter more than one big decision.","questions":[{"cn":"你会固定存一部分钱吗？","en":"Do you set aside a fixed amount each month?"},{"cn":"你觉得记账有用吗？","en":"Does tracking your spending help?"},{"cn":"买大件东西时你会怎么决定？","en":"How do you decide on a big purchase?"}],"holidayType":"topic","sourceUrls":["https://americasaves.org/"],"sourceNote":"America Saves（美国消费者联合会储蓄推广项目）官网，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"金钱健康科技"},{"id":"more-new-skill","cn":"学一门新技能","en":"Learning a new skill","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"成年之后学新东西，动力和时间都要自己安排。可以聊想学什么、为什么开始、卡在哪一步，以及有没有把学到的东西用在生活里。","briefEn":"Learning something new as an adult means finding both the reason and the time. People talk about what they want to learn, why they started, where they got stuck, and whether they have used it in daily life. Starting is easy and keeping going is usually the hard part.","questions":[{"cn":"你最近想学什么？","en":"What would you like to learn next?"},{"cn":"你学新东西一般卡在哪一步？","en":"Where do you usually get stuck when learning something new?"},{"cn":"你学过的东西用上了吗？","en":"Have you actually used what you learned?"}],"holidayType":"topic","sourceUrls":["https://ocw.mit.edu/","https://www.edx.org/learn"],"sourceNote":"MIT OpenCourseWare 公开课官网、edX 课程页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"工作学习"},{"id":"more-volunteering","cn":"志愿服务与社区参与","en":"Volunteering and community","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"社区里的参与可以是固定值班，也可以是一次帮忙。可以聊做过什么、为什么开始、遇到什么样的人，以及这类活动的成就感从哪来。","briefEn":"Getting involved in a community can mean a regular shift or a one-off helping hand. People talk about what they have done, why they started, who they met, and where the sense of meaning comes from. Sometimes the smallest task turns into the most memorable part of the week.","questions":[{"cn":"你做过志愿服务吗？","en":"Have you ever volunteered?"},{"cn":"你当时为什么开始做？","en":"What made you start?"},{"cn":"你觉得做这类事最难的是什么？","en":"What is the hardest part of it for you?"}],"holidayType":"topic","sourceUrls":["https://www.unv.org/","https://www.un.org/en/observances/volunteer-day"],"sourceNote":"联合国志愿人员组织 UNV 官网、联合国国际志愿者日页面，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"城市与环保"},{"id":"more-elder-care","cn":"养老与陪伴长辈","en":"Time with older family members","region":"国际","theme":"更多","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"和长辈相处的日常里有很多细节可以聊。可以聊多久联系一次、要不要住在一起、陪伴时做什么，以及看到他们状态变化时怎么应对。","briefEn":"Time with older family members is full of small everyday details. People talk about how often they call or visit, whether they live together, what they actually do together, and how they respond when they notice changes. Every family works out its own arrangement.","questions":[{"cn":"你多久和长辈联系一次？","en":"How often do you talk to older family members?"},{"cn":"你们在一起一般做什么？","en":"What do you usually do together?"},{"cn":"你觉得和长辈住一起怎么样？","en":"How do you feel about living with older family members?"}],"holidayType":"topic","sourceUrls":["https://www.nia.nih.gov/health/healthy-aging","https://www.who.int/news-room/fact-sheets/detail/ageing-and-health"],"sourceNote":"美国国家老龄研究所 NIA 健康老龄页、世界卫生组织老龄与健康事实清单页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[],"subtheme":"家庭与关系"},{"id":"ball-table-tennis","cn":"乒乓球","en":"Table tennis","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"一张桌子、两只拍子就能开局，社区中心、学校和公司休息室都很常见。发球每两分轮换，球拍胶皮差别很大，聊起来门槛低、谁都能接话。","briefEn":"Table tennis needs only a table, two paddles and a small ball, so you find it in community halls, schools and office break rooms. Games go to eleven points and the serve changes every two points. Racket rubbers vary a lot, which gives you plenty to compare.","questions":[{"cn":"你平时打乒乓球吗？","en":"Do you play table tennis very often?"},{"cn":"你更喜欢单打还是双打？","en":"Do you prefer singles or doubles?"},{"cn":"你们的球拍是随便拿的还是自己配的？","en":"Do you just use whatever racket is there, or do you put your own together?"}],"holidayType":"topic","sourceUrls":["https://www.tabletennisengland.co.uk/","https://www.usatt.org/"],"sourceNote":"Table Tennis England 首页（标题 Home - Table Tennis England）与 USA Table Tennis 首页（标题 USA Table Tennis Home），2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-tennis","cn":"网球","en":"Tennis","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"硬地、红土、草地打起来手感完全不同，单打和双打的节奏也不一样。计分从十五开始有点特别，约场地、找球友、聊装备都容易开场。","briefEn":"Tennis is played on hard, clay or grass courts, and singles feels very different from doubles. The scoring starts at fifteen, which surprises newcomers. People love comparing where they learned, how often they book a court, and how much string tension they like.","questions":[{"cn":"你打网球多久了？","en":"How long have you been playing tennis?"},{"cn":"你常在哪里打球？红土、硬地还是草地？","en":"Where do you usually play — clay, hard court or grass?"},{"cn":"你打单打多还是双打多？","en":"Do you play more singles or doubles?"}],"holidayType":"topic","sourceUrls":["https://www.itftennis.com/en/","https://www.wimbledon.com/"],"sourceNote":"国际网球联合会官网 ITF Tennis 英文首页与温布尔登锦标赛官网（标题 The Championships, Wimbledon - Official Website by IBM），2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-pickleball","cn":"匹克球","en":"Pickleball","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"场地比网球小，球是带孔的塑料球，球拍像加大版乒乓球拍。上手快、双打多，公园和社区球场常能见到，最近聊这项运动的人越来越多。","briefEn":"Pickleball uses a small court, a perforated plastic ball and a paddle that looks like a bigger table tennis bat. It borrows from tennis, badminton and table tennis, and doubles is the usual format. It is easy to learn, and the no-volley zone near the net keeps games tactical.","questions":[{"cn":"你玩过匹克球吗？","en":"Have you tried pickleball yet?"},{"cn":"你们那边球场好订吗？","en":"Is it easy to get a court where you live?"},{"cn":"你觉得它上手快吗？","en":"Did you find it quick to pick up?"}],"holidayType":"topic","sourceUrls":["https://www.pickleballcanada.org/","https://www.pickleballengland.org/"],"sourceNote":"Pickleball Canada 官网（标题 Pickleball Canada – Advancing Pickleball for All, for Life!）与 Pickleball England 官网（标题 HOME - Pickleball England），2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-badminton","cn":"羽毛球","en":"Badminton","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"室内居多，球是羽毛或塑料做的，轻但掉得快。二十一分制、每球得分，杀球和网前小球差别明显，约球和聊器材都很好接。","briefEn":"Badminton is mostly played indoors with a feathered or plastic shuttle. Games go to twenty-one points on a rally system, and a hard smash feels completely different from a soft drop shot. Plenty of people play in clubs, and others just hit around in a park or backyard.","questions":[{"cn":"你平时打羽毛球吗？","en":"Do you play badminton regularly?"},{"cn":"你打单打还是双打？","en":"Do you play singles or doubles?"},{"cn":"你们那边室内球场多吗？","en":"Are there many indoor courts near you?"}],"holidayType":"topic","sourceUrls":["https://corporate.bwfbadminton.com/","https://www.badmintonengland.co.uk/"],"sourceNote":"世界羽毛球联合会企业官网（标题 BWF Corporate）与 Badminton England 官网，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-volleyball","cn":"排球","en":"Volleyball","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"六人一队隔网对打，轮转发球，二传和自由人分工不同。学校体育课和社区球场都很常见，室内排球和沙滩排球规则差别也不小。","briefEn":"Volleyball has six players a side, a net in the middle and rotating positions. Setters, hitters and a libero do different jobs, and games usually go to twenty-five points. You can find it in school gyms and community courts, and indoor rules differ from the beach version.","questions":[{"cn":"你打过排球吗？","en":"Have you played volleyball before?"},{"cn":"你喜欢室内还是沙滩？","en":"Do you prefer indoor or beach volleyball?"},{"cn":"你一般打什么位置？","en":"Which position do you usually play?"}],"holidayType":"topic","sourceUrls":["https://www.fivb.com/"],"sourceNote":"国际排球联合会官网首页（标题 FIVB - Fédération Internationale de Volleyball），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-beach-volleyball","cn":"沙滩排球","en":"Beach volleyball","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"两人一队，在沙地上打，场地更小、没有固定换位。夏天海边和城市沙场很热闹，节奏快、回合短，聊度假和周末活动很自然。","briefEn":"Beach volleyball is two against two on sand, with a smaller court and no fixed positions. Points are short and the pace is quick, so games move fast. Summer beaches and city sand courts get busy, which makes it an easy topic for holiday and weekend plans.","questions":[{"cn":"你在海边打过沙滩排球吗？","en":"Have you played beach volleyball by the sea?"},{"cn":"两人一队和六人制，你更喜欢哪个？","en":"Do you prefer two-a-side or the six-a-side game?"},{"cn":"夏天你们那边沙场人多吗？","en":"Are the sand courts busy in summer where you are?"}],"holidayType":"topic","sourceUrls":["https://www.fivb.com/en/beachvolleyball"],"sourceNote":"国际排联沙滩排球官方栏目页（标题 Beach Volleyball – FIVB），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-baseball","cn":"棒球","en":"Baseball","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"投手对打者，跑垒得分，打满九局。北美、东亚和加勒比地区都很流行，节奏慢但细节多，聊位置、聊数据都能聊很久。","briefEn":"Baseball is pitcher against batter, with runners moving around four bases over nine innings. It is big in North America, East Asia and the Caribbean. The pace is slow but the details are rich, so people happily talk about positions, favourite teams and stats for hours.","questions":[{"cn":"你看棒球吗？","en":"Do you follow baseball at all?"},{"cn":"你打过吗？打什么位置？","en":"Have you played? Which position?"},{"cn":"你更爱看现场还是看转播？","en":"Do you prefer watching in the stadium or on TV?"}],"holidayType":"topic","sourceUrls":["https://www.wbsc.org/"],"sourceNote":"世界棒垒球联合会官网首页（标题 World Baseball Softball Confederation - wbsc.org），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-softball","cn":"垒球","en":"Softball","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"球比棒球大，投球是下手投，常见七局制。有快投和慢投两种玩法，慢投更休闲，公司联赛和社区活动里很常见。","briefEn":"Softball uses a bigger ball than baseball and the pitch comes underhand. Games often run seven innings, and there are fastpitch and slowpitch versions. Slowpitch is the casual one you see in company leagues, community games and weekend tournaments.","questions":[{"cn":"你打过垒球吗？","en":"Have you played softball?"},{"cn":"你们那边有公司联赛吗？","en":"Are there company or community leagues near you?"},{"cn":"慢投和快投，你玩过哪种？","en":"Have you tried slowpitch or fastpitch?"}],"holidayType":"topic","sourceUrls":["https://www.wbsc.org/","https://www.usasoftball.com/"],"sourceNote":"世界棒垒球联合会官网首页与 USA Softball 官网首页（标题 Homepage - USA Softball），2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-cricket","cn":"板球","en":"Cricket","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"用板击球、跑分，投球以轮次计算，有 T20、一日赛和测试赛三种节奏。英联邦国家、南亚和澳洲更常见，聊赛制就能聊开。","briefEn":"Cricket is played with a bat and wickets, and overs set the rhythm. T20 is short and loud, one-day games sit in the middle, and Test matches can run five days. It is huge in South Asia, Australia, England and other Commonwealth countries, so asking which format someone follows gets a conversation going.","questions":[{"cn":"你看板球吗？","en":"Do you watch cricket?"},{"cn":"你更喜欢 T20 还是长赛制？","en":"Do you prefer T20 or the longer formats?"},{"cn":"你们那边有可以打的场地吗？","en":"Is there a ground to play on near you?"}],"holidayType":"topic","sourceUrls":["https://www.icc-cricket.com/"],"sourceNote":"国际板球理事会官网首页（标题 Home | ICC），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-rugby","cn":"橄榄球","en":"Rugby","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"美式橄榄球戴头盔护具、按档推进；英式橄榄球不戴护具、比赛更连续。球都是椭圆形，北美、英伦和南太平洋地区更常见。","briefEn":"Rugby covers two main codes. American football uses helmets and pads and moves in downs, while rugby union has no helmets and flows continuously. Both use an oval ball. You see them in North America, Britain, Ireland, France, Australia, New Zealand and the Pacific islands.","questions":[{"cn":"你平时看橄榄球吗？","en":"Do you watch rugby at all?"},{"cn":"你更熟悉美式还是英式？","en":"Are you more familiar with the American game or rugby union?"},{"cn":"你打过吗？","en":"Have you ever played?"}],"holidayType":"topic","sourceUrls":["https://www.nfl.com/","https://www.world.rugby/"],"sourceNote":"NFL 官网国际首页（标题 NFL International Homepage）与 World Rugby 官网（标题 World Rugby），2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-golf","cn":"高尔夫","en":"Golf","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"十八洞、不同球杆，差点决定让杆。练习场和球场是两种体验，讲究安静和礼让，聊入门课、聊球场都挺自然。","briefEn":"Golf is eighteen holes with a set of different clubs, and a handicap lets players of different levels compete. Driving ranges and full courses feel like two different worlds. Etiquette matters, so people often talk about lessons, favourite courses and how they started.","questions":[{"cn":"你打高尔夫吗？","en":"Do you play golf?"},{"cn":"你是从练习场开始的吗？","en":"Did you start at a driving range?"},{"cn":"你们那边球场好订吗？","en":"Is it easy to book a course where you live?"}],"holidayType":"topic","sourceUrls":["https://www.randa.org/"],"sourceNote":"R&A 官网首页（标题 The R&A，负责高尔夫规则与公开锦标赛），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-billiards-snooker","cn":"台球/斯诺克","en":"Billiards and snooker","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"台球和斯诺克都用球杆击球，但球台大小、袋口和球数不同。斯诺克红球加彩球计分，酒吧和球房都能玩，聊规则差异很有意思。","briefEn":"Billiards and snooker both use a cue and a table, but the table size, pockets and number of balls differ. Snooker uses reds plus colours with a points system, while pool is more common on pub tables. Comparing the two is an easy way into the topic.","questions":[{"cn":"你平时打台球还是斯诺克？","en":"Do you usually play pool or snooker?"},{"cn":"你更常去酒吧台还是球房？","en":"Do you play more on pub tables or in a proper club?"},{"cn":"你打得怎么样？","en":"How good are you at it?"}],"holidayType":"topic","sourceUrls":["https://wpbsa.com/"],"sourceNote":"世界职业比利与斯诺克协会官网首页（标题 WPBSA | Official World Governing Body of Snooker and Billiards），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-bowling","cn":"保龄球","en":"Bowling","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"把球滚向十条球瓶，全中和小补的算法不一样。球馆提供公用球，也有人自带定制球，联赛和家庭聚会都很常见。","briefEn":"Bowling is ten pins at the end of a lane, and strikes and spares are scored differently. Alleys lend house balls, while regulars bring their own drilled ball. League nights and family birthdays both happen there, which makes it a relaxed thing to chat about.","questions":[{"cn":"你多久打一次保龄球？","en":"How often do you go bowling?"},{"cn":"你有自己的球吗？","en":"Do you have your own ball?"},{"cn":"你们那边有联赛吗？","en":"Are there leagues where you live?"}],"holidayType":"topic","sourceUrls":["https://www.bowl.com/","https://www.bowl.com/About/"],"sourceNote":"美国保龄球协会 USBC 官网首页（标题 BOWL.com | Home）与 About Us 页（标题 BOWL.com | About Us），2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-frisbee","cn":"飞盘","en":"Frisbee and disc sports","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"飞盘不只用来看，极限飞盘七人一队、自己判罚，讲究公平竞赛。公园、校园和沙滩都能玩，还有飞盘高尔夫这种玩法。","briefEn":"Frisbee is not just catching on a beach. Ultimate is seven against seven, self-refereed, and built around spirit of the game. You also find disc golf and casual park games. The 175-gram disc is the standard, and pickup games are easy to join.","questions":[{"cn":"你玩过极限飞盘吗？","en":"Have you played Ultimate?"},{"cn":"你更喜欢正式比赛还是公园随便扔？","en":"Do you prefer a proper game or just throwing in the park?"},{"cn":"你们那边周末有固定的局吗？","en":"Is there a regular weekend game near you?"}],"holidayType":"topic","sourceUrls":["https://usaultimate.org/","https://usaultimate.org/about/"],"sourceNote":"USA Ultimate 官网首页（标题 USA Ultimate | Learn. Play. Compete.）与 About 页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-squash","cn":"壁球","en":"Squash","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"四面墙的场地，球小、拍子也小，热身之后弹性会变。一个人也能对着墙练，节奏快、出汗多，约场地和聊体能都好接。","briefEn":"Squash is played in a room with four walls, a small racket and a small ball that bounces more once it warms up. You can play alone against the wall or with a partner. Games are fast and sweaty, so people talk about fitness, court booking and glass courts.","questions":[{"cn":"你打过壁球吗？","en":"Have you played squash?"},{"cn":"你喜欢一个人练还是两个人打？","en":"Do you prefer practising alone or playing a partner?"},{"cn":"你们那边订场方便吗？","en":"Is it easy to book a court near you?"}],"holidayType":"topic","sourceUrls":["https://worldsquash.org/"],"sourceNote":"世界壁球联合会官网首页（标题 Home - World Squash），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"ball-handball","cn":"手球","en":"Handball","region":"国际","theme":"健身运动","subtheme":"球类","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"七人一队，用手传球和射门，不是用脚踢。室内场地、三步上篮式进攻，欧洲联赛很热闹，节奏快、对抗强。","briefEn":"Handball is seven a side and played with the hands, not the feet. Players pass and shoot on an indoor court, and three steps are allowed before passing or shooting. It is fast and physical, with strong leagues in Europe and a growing presence elsewhere.","questions":[{"cn":"你看手球吗？","en":"Do you watch handball?"},{"cn":"你上学时打过吗？","en":"Did you play it at school?"},{"cn":"你们那边有手球俱乐部吗？","en":"Are there handball clubs near you?"}],"holidayType":"topic","sourceUrls":["https://www.ihf.info/"],"sourceNote":"国际手球联合会官网首页（标题 IHF），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-skateboarding","cn":"滑板","en":"Skateboarding","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"在街头、广场或滑板场练动作，从推板、豚跳开始，摔跤是常态。很多人小时候玩过，聊第一块板、本地滑板场和喜欢的滑手都容易接上话。","briefEn":"Skateboarding happens on streets, plazas or in skate parks, starting with pushing and ollies, and falling is just part of it. It is easy to talk about because a lot of people had a board as kids, so asking about their first one, local spots and favorite skaters usually gets a conversation going.","questions":[{"cn":"你是从什么时候开始玩滑板的？","en":"When did you start skateboarding?"},{"cn":"你们那边有专门的滑板场吗？","en":"Are there skate parks near where you live?"},{"cn":"你以前会自己组装板吗？","en":"Did you use to put your own board together?"}],"holidayType":"topic","sourceUrls":["https://www.worldskate.org/skateboarding.html"],"sourceNote":"World Skate 官方 Skateboarding 项目页（世界轮滑与滑板运动管理机构），2026-11-10 实抓 HTTP 200，页面标题含 Skateboarding。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-surfing","cn":"冲浪","en":"Surfing","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"冲浪要看浪况选时间，清晨的浪常常最好。沙滩浪和礁石浪不同，长板稳、短板灵活，入门先学追浪和起乘。聊本地浪点和最难忘的一次下海都很自然。","briefEn":"Surfing depends on the swell, so people watch the forecast and often go early in the morning when the waves are cleaner. Beach breaks and reef breaks feel different, longboards are stable and shortboards turn fast, and beginners usually learn by paddling for waves first. Ask about their local break and best session.","questions":[{"cn":"你一般多久下一次海？","en":"How often do you get out in the water?"},{"cn":"你那边有固定的浪点吗？","en":"Do you have a spot you always surf at?"},{"cn":"你玩长板还是短板？","en":"Do you ride a longboard or a shortboard?"}],"holidayType":"topic","sourceUrls":["https://www.worldsurfleague.com/","https://beachsafe.org.au/"],"sourceNote":"World Surf League 官网首页（职业冲浪国际赛事与浪况报道）与澳大利亚 Beachsafe 官方海滩安全信息平台，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-snowboarding","cn":"单板滑雪","en":"Snowboarding","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"单板滑雪双脚固定在同一块板上，侧身顺坡滑，雪场分道内和公园道具。第一季几乎都在摔，因此很好聊：第一次摔得多惨、常去哪个雪场。","briefEn":"On a snowboard both feet are locked onto one board and you ride sideways down the slope. Resorts have groomed runs plus terrain parks with jumps and rails. Almost everyone spends the first season falling, which makes it easy to talk about how rough day one was and which mountain they keep going back to.","questions":[{"cn":"你第一次上雪是不是摔得很惨？","en":"Was your first day on a board a total disaster?"},{"cn":"你更喜欢道内还是公园？","en":"Do you prefer the groomed runs or the park?"},{"cn":"你常去的是哪个雪场？","en":"Which mountain do you usually go to?"}],"holidayType":"topic","sourceUrls":["https://www.fis-ski.com/snowboard-alpine","https://www.worldsnowboardfederation.org/"],"sourceNote":"国际雪联 FIS 官方 Snowboard Alpine Hub 页与世界单板滑雪联合会官网首页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-alpine-skiing","cn":"双板滑雪","en":"Alpine skiing","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"双板滑雪两只脚各踩一块板，面对山下顺坡滑，入门比单板快。雪场从缓坡到黑道分级清楚，欧洲不少人从小滑到大。聊雪季、常去的山都自然。","briefEn":"In alpine skiing you have a ski on each foot and face downhill, which most people find easier to pick up than snowboarding. Resorts grade runs from gentle slopes to steep blacks, and in Europe a lot of people started as kids and never stopped. Good topics are the season and the mountain they always return to.","questions":[{"cn":"你几岁开始学滑雪的？","en":"How old were you when you learned to ski?"},{"cn":"你一般滑什么难度的雪道？","en":"What kind of runs do you usually ski?"},{"cn":"你们那边滑雪季大概多长？","en":"How long is the ski season where you live?"}],"holidayType":"topic","sourceUrls":["https://www.fis-ski.com/alpine-skiing"],"sourceNote":"国际雪联 FIS 官方 Alpine Skiing Hub 页（高山滑雪项目与赛事信息），2026-11-10 实抓 HTTP 200，页面标题为 FIS | Alpine Skiing Hub。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-sup","cn":"桨板（SUP）","en":"Stand-up paddleboarding","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"桨板是充气或硬板加一支桨，常在湖面、河湾和平静海面站着划。风浪大时很难站稳，出门习惯看天气。有休闲慢划也有竞速，聊第一次站起来的经历很好接。","briefEn":"Stand-up paddleboarding is a board plus a single paddle, and most people do it standing on lakes, calm rivers or sheltered sea. Wind and chop make balance hard, so checking the forecast becomes a habit. Some paddle casually, some race, and asking about the first time they actually stood up always gets a laugh.","questions":[{"cn":"你第一次站上桨板是不是马上就掉水里了？","en":"Did you fall in the first time you stood up on a board?"},{"cn":"你一般在湖上划还是去海边？","en":"Do you usually paddle on a lake or out on the sea?"},{"cn":"你玩的是充气板还是硬板？","en":"Do you use an inflatable board or a hard one?"}],"holidayType":"topic","sourceUrls":["https://www.canoeicf.com/disciplines/stand-up-paddling"],"sourceNote":"国际皮划艇联合会 ICF 官方 Stand Up Paddling 项目页（规则、板型与竞速说明），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-roller-skating","cn":"轮滑/滑冰","en":"Roller skating and ice skating","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"轮滑和滑冰一个是轮子一个是冰刀，感觉相近。轮滑多在广场和公园路面，滑冰在室内冰场，头盔护具都要戴。聊小时候玩不玩、现在还滑不滑很容易接。","briefEn":"Roller skating and ice skating feel similar even though one runs on wheels and the other on blades. Roller skating usually happens on plazas and paved park paths, while ice skating is indoors at a rink, and helmets and pads are standard. Asking whether they skated as a kid and still do now opens people up fast.","questions":[{"cn":"你小时候玩过轮滑吗？","en":"Did you roller skate when you were a kid?"},{"cn":"你那边滑冰场好找吗？","en":"Is it easy to find an ice rink where you live?"},{"cn":"你现在还会去滑吗？","en":"Do you still go skating these days?"}],"holidayType":"topic","sourceUrls":["https://www.worldskate.org/roller-freestyle.html"],"sourceNote":"World Skate 官方 Roller Freestyle 项目页（世界轮滑运动管理机构），2026-11-10 实抓 HTTP 200，页面标题含 Roller Freestyle。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-indoor-climbing","cn":"室内攀岩","en":"Indoor climbing","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"室内攀岩分抱石和上绳，抱石墙矮、下面铺厚垫子，上绳要系绳保护。馆里用颜色标难度，从易到难。聊第一次爬和手上的茧子，气氛通常很轻松。","briefEn":"Indoor climbing comes in two main forms. Bouldering is short walls over thick mats with no rope, while top-rope and lead climbing use a harness and a belay partner. Gyms mark difficulty with colours and set routes that change often. Asking about their first session and the calluses on their hands is an easy, relaxed opener.","questions":[{"cn":"你第一次去攀岩馆是什么感觉？","en":"What was your first time at a climbing gym like?"},{"cn":"你更喜欢抱石还是上绳？","en":"Do you prefer bouldering or climbing on a rope?"},{"cn":"你现在的难度大概到哪一级？","en":"What grade are you climbing at now?"}],"holidayType":"topic","sourceUrls":["https://www.ifsc-climbing.org/index.php/disciplines"],"sourceNote":"国际攀岩联合会 IFSC 官方项目页（抱石、难度、速度三个分项说明），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-trail-running","cn":"越野跑","en":"Trail running","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"越野跑在山径和土路上跑，上下坡多、路面不平，和公路跑很不一样。距离长短都有，更看重抓地鞋和水袋。聊常跑的路线和路上遇到的风景最容易接。","briefEn":"Trail running happens on dirt paths and mountain tracks, with plenty of climbs, descents and uneven ground, so it feels very different from road running. Distances range from a few kilometres to ultras, and gear matters more, especially grippy shoes and a hydration pack. Asking about their regular route and the scenery usually gets people talking.","questions":[{"cn":"你常跑的是哪条线路？","en":"Which trail do you usually run?"},{"cn":"你跑过最长的距离是多少？","en":"What is the longest distance you have run?"},{"cn":"跑山的时候你会带多少装备？","en":"How much gear do you carry on a trail run?"}],"holidayType":"topic","sourceUrls":["https://worldathletics.org/disciplines/trail-running"],"sourceNote":"世界田联 World Athletics 官方 Trail Running 项目页，2026-11-10 实抓 HTTP 200，页面标题为 Trail Running。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-mountain-biking","cn":"山地骑行","en":"Mountain biking","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"山地骑行走土路和林道，有缓坡也有陡的速降道，车带避震、轮胎粗，护具也比公路车多。聊第一次摔车、常去的山和平时怎么修车都很好接。","briefEn":"Mountain biking means riding dirt roads and forest trails, from gentle cross-country loops to steep downhill tracks. Bikes have suspension and wide knobby tyres, and riders wear more protection than road cyclists do. Asking about their first crash, the hills they ride and how they keep the bike running is an easy way in.","questions":[{"cn":"你第一次骑山地车摔过吗？","en":"Did you crash on your first mountain bike ride?"},{"cn":"你那边有可以骑的山道吗？","en":"Are there trails you can ride near where you live?"},{"cn":"车是你自己保养吗？","en":"Do you do your own bike maintenance?"}],"holidayType":"topic","sourceUrls":["https://www.uci.org/disciplines/all/2tLnZMo6WrUBplRXDxyEi7","https://www.uci.org/news/mountain-bike/7kanRwIStdaXG6Ee0LT3bS"],"sourceNote":"国际自行车联盟 UCI 官方项目总览页（含 Mountain Bike 分项）与 UCI 山地车项目新闻页，2026-11-10 实抓均 HTTP 200，页面正文均含 Mountain Bike。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"board-camping","cn":"露营","en":"Camping","region":"国际","theme":"健身运动","subtheme":"板类与户外","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"露营就是带帐篷或开房车，在营地过夜，做饭、生火、看星星是标配。营地多在国家公园和湖边，提前订位、收好食物。聊第一次露营和装备踩过的坑很好接。","briefEn":"Camping usually means a tent or an RV and a night at a campground, with cooking, a small fire and a sky full of stars as the standard package. Many sites sit inside national parks or beside lakes, so booking ahead and storing food properly matter. Asking about their first camping trip and gear they regret buying works every time.","questions":[{"cn":"你第一次露营是什么时候？","en":"When was your first camping trip?"},{"cn":"你更喜欢帐篷还是房车？","en":"Do you prefer a tent or an RV?"},{"cn":"你们那边营地要提前订吗？","en":"Do you have to book campsites ahead where you live?"}],"holidayType":"topic","sourceUrls":["https://www.nps.gov/subjects/camping/index.htm","https://www.recreation.gov/"],"sourceNote":"美国国家公园管理局 NPS 官方 Camping 主题页（营地类型、预订与安全须知）与 Recreation.gov 官方营地预订平台，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-job-interview","cn":"面试经历","en":"Job interviews","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"面试轮次和形式因公司而异，有人一轮就定，有人要过好几关。可以聊最怕被问到的问题、自我介绍怎么准备，以及线上和现场面试的不同感受。","briefEn":"Interviews look very different from one company to the next. Some people get an offer after one conversation, others sit through five rounds. It is worth talking about the questions you dread, how you prepare your introduction, and whether video interviews feel easier or harder than meeting in person.","questions":[{"cn":"你面试时最怕被问什么？","en":"What question do you dread most in an interview?"},{"cn":"你们那边面试一般几轮？","en":"How many rounds of interviews are typical where you are?"},{"cn":"线上和现场面试，你觉得哪个更难？","en":"Which feels harder, a video interview or one in person?"}],"holidayType":"topic","sourceUrls":["https://hbr.org/topic/subject/job-interviews","https://www.cnbc.com/make-it/2026/11/03/employer-ghosting-job-interviews.html"],"sourceNote":"Harvard Business Review「Job Interviews」主题页与 CNBC Make It《Employers are ghosting job candidates in the hiring process》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-overtime-boundary","cn":"加班与下班边界","en":"Overtime and switching off","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"下班后还回不回工作消息，公司和地区差别很大。可以聊加班频率、领导会不会在晚上找人，以及自己怎么把工作和休息分开。","briefEn":"Whether people answer work messages after hours varies a lot by company and country. Some teams expect it, others treat it as a red flag. It is easy to compare how often overtime happens, whether managers contact people in the evening, and what each person does to leave work behind.","questions":[{"cn":"你们下班后还会回工作消息吗？","en":"Do you reply to work messages after hours?"},{"cn":"你多久加一次班？","en":"How often do you work overtime?"},{"cn":"你怎么让自己下班后不再想工作？","en":"How do you switch off after work?"}],"holidayType":"topic","sourceUrls":["https://www.gov.uk/maximum-weekly-working-hours","https://www.acas.org.uk/working-hours"],"sourceNote":"GOV.UK《Maximum weekly working hours》与 Acas《Working time and rest》官方页面，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-meeting-speak","cn":"开会发言","en":"Speaking up in meetings","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"会上谁先说话、能不能打断、要不要提前准备，各地习惯不同。可以聊自己开会时的紧张感、怎么表达不同意见，以及线上会议发言更难还是更容易。","briefEn":"Meeting habits differ from place to place. In some rooms people jump in freely, in others you wait to be invited. People can compare how nervous they feel speaking up, how they disagree without sounding rude, and whether it is harder to get a word in during video calls.","questions":[{"cn":"开会时你会主动发言吗？","en":"Do you speak up in meetings?"},{"cn":"你怎么在会上表达不同意见？","en":"How do you disagree with someone in a meeting?"},{"cn":"线上会议比线下更容易发言吗？","en":"Is it easier to speak in online meetings?"}],"holidayType":"topic","sourceUrls":["https://hbr.org/topic/subject/meetings","https://www.atlassian.com/blog/productivity"],"sourceNote":"Harvard Business Review「Meeting Management」主题页与 Atlassian 官方博客首页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-colleagues","cn":"同事关系","en":"Getting along with colleagues","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"同事之间是只谈工作，还是也会一起吃饭、聊天，差别很大。可以聊怎么和不太熟的同事相处、遇到分歧怎么办，以及离职后还会不会联系。","briefEn":"Some workplaces keep things strictly professional, while others turn colleagues into close friends. People talk about how they break the ice with people they do not know well, what they do when a disagreement comes up, and whether they stay in touch with former colleagues.","questions":[{"cn":"你和同事会一起吃饭吗？","en":"Do you eat with your colleagues?"},{"cn":"和同事有分歧时，你一般怎么处理？","en":"How do you handle disagreement with a colleague?"},{"cn":"离职后你还会和前同事联系吗？","en":"Do you keep in touch with former colleagues?"}],"holidayType":"topic","sourceUrls":["https://hbr.org/topic/subject/collaboration","https://www.gallup.com/workplace/349484/social-proof-friends-at-work.aspx"],"sourceNote":"Harvard Business Review「Collaboration and Teams」主题页与 Gallup《State of the Global Workplace 2026》职场关系数据页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-hybrid-remote","cn":"远程办公与混合办公","en":"Remote and hybrid work","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"一周去几天办公室、能不能完全远程，各公司规定不同。可以聊在家工作的效率、通勤省下来的时间怎么用，以及远程时团队怎么保持联系。","briefEn":"Remote and hybrid arrangements vary widely. Some people go in every day, some twice a week, and some never. People compare focus at home, what they do with the saved commute, and how their team stays connected when everyone is in a different place.","questions":[{"cn":"你更想完全远程还是去办公室？","en":"Would you rather work fully remote or go into the office?"},{"cn":"在家工作效率更高还是更低？","en":"Are you more productive at home?"},{"cn":"你们团队怎么保持联系？","en":"How does your team stay in touch?"}],"holidayType":"topic","sourceUrls":["https://www.microsoft.com/en-us/worklab/work-trend-index","https://wfhresearch.com/"],"sourceNote":"Microsoft WorkLab《Work Trend Index》与 WFH Research《Survey of Working Arrangements and Attitudes》，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-job-change","cn":"跳槽与职业规划","en":"Changing jobs and career plans","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人几年换一次工作，有人在一个地方待很久，没有统一标准。可以聊换工作的原因、怎么判断机会好不好，以及未来几年想做什么。","briefEn":"Some people move jobs every few years, others stay put for a long time, and neither path is unusual. People can talk about why they changed jobs, how they judge whether an offer is worth it, and what they hope to be doing in a few years.","questions":[{"cn":"你换过几次工作？","en":"How many times have you changed jobs?"},{"cn":"什么情况会让你考虑跳槽？","en":"What would make you consider changing jobs?"},{"cn":"你未来几年想做什么？","en":"What do you hope to be doing in a few years?"}],"holidayType":"topic","sourceUrls":["https://hbr.org/topic/subject/career-planning","https://www.linkedin.com/business/talent/blog/talent-acquisition"],"sourceNote":"Harvard Business Review「Career Planning」主题页与 LinkedIn Talent Blog 招聘栏目，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-first-job","cn":"第一份工作","en":"Your first job","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"第一份工作常让人紧张：不会做的事很多，又不好意思问。可以聊刚入职时闹过什么笑话、怎么学会开口求助，以及带自己的人给了哪些帮助。","briefEn":"A first job is often nerve-racking. There is a lot you do not know and asking feels awkward. People enjoy talking about early mistakes, how they learned to ask for help, and what the person who showed them around did that actually made a difference.","questions":[{"cn":"你还记得第一份工作第一天吗？","en":"Do you remember your first day at your first job?"},{"cn":"刚工作时你最大的困难是什么？","en":"What was hardest when you started working?"},{"cn":"你会不会不好意思问问题？","en":"Do you feel awkward asking questions?"}],"holidayType":"topic","sourceUrls":["https://www.shrm.org/topics-tools/topics/onboarding","https://www.gallup.com/workplace/247076/onboarding-new-hires.aspx"],"sourceNote":"SHRM《Complete Employee Onboarding Guide》与 Gallup 新员工留存指标页（页面标题 Global Indicator: Employee Retention & Attraction），2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-office-address","cn":"职场称呼与礼貌","en":"Names and manners at work","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"叫名字、叫老师还是叫职位，各地各公司差别很大。可以聊刚入职时怎么称呼前辈、邮件开头怎么写，以及哪些小习惯在自己那边算失礼。","briefEn":"How people address each other at work changes with company and country. Some teams use first names from day one, others expect titles or family names. People can talk about what they called senior colleagues when they started, how they open an email, and which small habits count as rude.","questions":[{"cn":"你们上班怎么称呼领导？","en":"How do you address your manager at work?"},{"cn":"新人第一天该叫名字还是叫职位？","en":"Should a new hire use first names or titles?"},{"cn":"你觉得哪些职场礼貌最重要？","en":"Which workplace manners matter most to you?"}],"holidayType":"topic","sourceUrls":["https://www.shrm.org/topics-tools/topics/civility","https://hbr.org/topic/subject/office-politics"],"sourceNote":"SHRM《Civility at Work - Civility Index Research》与 Harvard Business Review「Office Politics」主题页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-leave","cn":"请假与休假","en":"Taking time off","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"请假好不好批、休多久算正常，公司和地区差别很大。可以聊请假前怎么跟同事交代、休假时会不会看工作消息，以及长假一般怎么安排。","briefEn":"How easy it is to take leave, and how much is normal, varies a lot. People compare how they hand over work before a break, whether they check messages while away, and how they plan a longer holiday. Some feel guilty asking, others do not think twice.","questions":[{"cn":"你请假容易吗？","en":"Is it easy for you to take time off?"},{"cn":"休假时你会看工作消息吗？","en":"Do you check work messages while on holiday?"},{"cn":"你更喜欢短假还是长假？","en":"Do you prefer short breaks or a long holiday?"}],"holidayType":"topic","sourceUrls":["https://www.gov.uk/holiday-entitlement-rights","https://www.acas.org.uk/holidays"],"sourceNote":"GOV.UK《Holiday entitlement: Entitlement》与 Acas《How much holiday someone gets》官方页面，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-exam-prep","cn":"考试与备考","en":"Exams and preparing for them","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人提前几个月复习，有人最后两周才冲刺。可以聊自己怎么安排时间、压力大时怎么办，以及考完最后一科那一刻的感受。","briefEn":"Some people revise for months, others cram in the last two weeks, and both approaches have their defenders. People talk about how they plan their time, what they do when stress builds up, and how it feels the moment the exam is finally over.","questions":[{"cn":"你一般是提前复习还是最后冲刺？","en":"Do you prepare early or cram at the end?"},{"cn":"备考时压力大，你会怎么调整？","en":"How do you cope with stress before an exam?"},{"cn":"考完最后一科你是什么感觉？","en":"How did you feel after your last exam?"}],"holidayType":"topic","sourceUrls":["https://www.ets.org/toefl.html","https://www.neea.edu.cn/"],"sourceNote":"ETS《TOEFL English Language Test》官方页与中国教育考试网首页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-university-class","cn":"大学课堂","en":"University classes","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"大课、小班讨论、必修和选修，各学校安排不同。可以聊课上敢不敢提问、小组作业怎么分工，以及怎么看待上课点名这件事。","briefEn":"University classes come in many shapes: huge lectures, small seminars, required courses and electives. People compare whether they ask questions in class, how group projects get divided up, and how they feel about attendance being checked.","questions":[{"cn":"你上课会主动提问吗？","en":"Do you ask questions in class?"},{"cn":"小组作业你们怎么分工？","en":"How do you divide work in group projects?"},{"cn":"你怎么看上课点名？","en":"What do you think about attendance checks?"}],"holidayType":"topic","sourceUrls":["https://www.unesco.org/en/education","https://www.aacu.org/"],"sourceNote":"UNESCO《Education transforms lives》教育主题页与 AAC&U 美国大学协会官网，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-study-abroad","cn":"留学与交换","en":"Studying abroad","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"留学或交换要适应课堂、住宿和日常生活的不同。可以聊刚到时最不习惯什么、怎么交到当地朋友，以及想家时一般怎么办。","briefEn":"Studying abroad or on an exchange means adjusting to a new classroom, a new home and a new daily routine. People talk about what felt strangest at first, how they made local friends, and what they did when they felt homesick.","questions":[{"cn":"你会考虑去别的国家读书吗？","en":"Would you consider studying in another country?"},{"cn":"刚到一个新地方，你最不习惯什么？","en":"What was hardest to get used to in a new place?"},{"cn":"想家的时候你会怎么做？","en":"What do you do when you feel homesick?"}],"holidayType":"topic","sourceUrls":["https://www.iie.org/research-and-insights/","https://www.unesco.org/en/education"],"sourceNote":"IIE《Research》国际教育研究页与 UNESCO 教育主题页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-online-course","cn":"线上课程与自学","en":"Online courses and self-study","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"线上课程时间灵活，但坚持下来不容易。可以聊自己报过什么课、真正看完的有多少，以及怎么安排学习时间不被打断。","briefEn":"Online courses are flexible, but finishing them is another matter. People talk about the courses they signed up for, how many they actually completed, and how they protect time for study when messages and chores keep interrupting.","questions":[{"cn":"你报过线上课程吗？学完了吗？","en":"Have you taken an online course? Did you finish it?"},{"cn":"自学时你最容易分心的是什么？","en":"What distracts you most when you study alone?"},{"cn":"你一般什么时候学习？","en":"When do you usually study?"}],"holidayType":"topic","sourceUrls":["https://www.coursera.org/","https://www.edx.org/"],"sourceNote":"Coursera 官网首页与 edX 官网首页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-new-skill","cn":"学一门技能","en":"Learning a new skill","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"学做菜、学编程、学乐器，起点和目标都不一样。可以聊为什么想学、跟谁学，以及练了很久没进步时怎么坚持下来。","briefEn":"Learning a new skill can mean cooking, coding, a musical instrument or something else entirely. People talk about why they started, whether they learn alone or with others, and what keeps them going when progress stalls for weeks.","questions":[{"cn":"你最近想学什么新技能？","en":"What new skill would you like to learn?"},{"cn":"你更喜欢自己学还是上课？","en":"Do you prefer learning alone or taking a class?"},{"cn":"没进步的时候你怎么坚持？","en":"How do you keep going when you stop improving?"}],"holidayType":"topic","sourceUrls":["https://www.shrm.org/topics-tools/topics/learning-development","https://www.linkedin.com/business/talent/blog/learning-and-development"],"sourceNote":"SHRM《Learning & Development》主题页与 LinkedIn Talent Blog 学习发展栏目，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-library-study","cn":"图书馆与自习","en":"Libraries and study spaces","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人非图书馆学不进去，有人在家更自在。可以聊常去的自习地点、座位好不好找，以及图书馆除了借书还能做些什么。","briefEn":"Some people can only concentrate in a library, others work better at home. People compare their usual study spots, how crowded they get, whether seats are saved with bags, and what else the local library offers besides books.","questions":[{"cn":"你更喜欢在图书馆还是在家学习？","en":"Do you prefer studying in a library or at home?"},{"cn":"你们图书馆好找座位吗？","en":"Is it easy to find a seat in your library?"},{"cn":"你去图书馆只借书吗？","en":"Do you only go to the library for books?"}],"holidayType":"topic","sourceUrls":["https://www.ala.org/tools/libfactsheets/alalibraryfactsheet06","https://www.ala.org/news"],"sourceNote":"American Library Association《Public Library Use》事实清单页与 ALA News 新闻中心，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"work-teacher-mentor","cn":"老师和导师","en":"Teachers and mentors","region":"国际","theme":"更多","subtheme":"工作学习","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"好老师可能改变一个人对整门课的看法。可以聊印象最深的老师、他们怎么帮到自己，以及工作后有没有遇到过愿意带自己的人。","briefEn":"A good teacher can change how someone feels about a whole subject. People talk about the teacher they remember most, what that person did that helped, and whether they have found someone at work who is willing to show them the ropes.","questions":[{"cn":"你印象最深的老师是谁？","en":"Which teacher do you remember most?"},{"cn":"好老师身上最重要的是什么？","en":"What matters most in a good teacher?"},{"cn":"工作后有人带过你吗？","en":"Has anyone mentored you at work?"}],"holidayType":"topic","sourceUrls":["https://www.unesco.org/en/teachers","https://hbr.org/topic/subject/mentoring"],"sourceNote":"UNESCO《Teachers》主题页与 Harvard Business Review「Mentoring」主题页，2026-11-10 实抓 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-salary-saving","cn":"工资与存钱习惯","en":"Salary and saving habits","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"工资到账后怎么分，是最早的财务习惯之一。可以聊先存还是先花、有没有单独账户、意外支出会不会打乱计划，也能聊各家对“该存多少”的看法差很远。","briefEn":"What happens right after payday says a lot about someone. You can ask whether they save first or spend first, whether they keep a separate savings account, and how an unexpected bill messes up the plan. People also disagree a lot about how much is enough to put away.","questions":[{"cn":"工资到账后，你会先存一部分吗？","en":"When your paycheck comes in, do you save part of it first?"},{"cn":"你有专门的储蓄账户吗？","en":"Do you keep a separate account for savings?"},{"cn":"遇到意外支出，你的存钱计划会乱吗？","en":"Does an unexpected expense throw off your saving plan?"}],"holidayType":"topic","sourceUrls":["https://www.federalreserve.gov/publications/report-economic-well-being-us-households.htm","https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth"],"sourceNote":"美联储《Economic Well-Being of U.S. Households (SHED)》报告页（含储蓄与应急资金调查）与英国国家统计局 Income and wealth 主题页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-budget-tracking","cn":"记账与预算","en":"Budgeting and tracking spending","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人每笔都记，有人只看月底余额。可以聊用 App 还是表格、记了会不会真的少花、预算超了怎么调整，也能聊“大致心里有数”到底靠不靠谱。","briefEn":"Some people log every purchase, others just check the balance at the end of the month. You can ask whether they use an app or a spreadsheet, whether tracking actually changes their spending, and what they do when the budget is blown. It is a low-stakes way to compare very different money habits.","questions":[{"cn":"你会记账吗？用 App 还是表格？","en":"Do you track your spending? With an app or a spreadsheet?"},{"cn":"记账之后，你花的钱变少了吗？","en":"Has tracking your spending actually changed how much you spend?"},{"cn":"预算超了，你会怎么调整？","en":"What do you do when you go over budget?"}],"holidayType":"topic","sourceUrls":["https://www.citizensadvice.org.uk/debt-and-money/budgeting/budgeting/","https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/expenditure"],"sourceNote":"Citizens Advice 的 Budgeting 指南页与英国国家统计局 Expenditure 主题页，2026-11-10 实抓均 HTTP 200，页面标题分别为 Budgeting - Citizens Advice、Expenditure - Office for National Statistics。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-big-purchase","cn":"大额消费决策","en":"Making big purchases","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"买车、换家电、买大件设备，决定过程很能看出一个人的性格。可以聊会比价多久、听朋友还是看评测、买新的还是二手的，也能聊买完会不会后悔。","briefEn":"Big purchases bring out very different decision styles. You can ask how long someone compares options, whether they trust friends or reviews, and whether they go new or used. The follow-up question almost always works: do they regret it afterwards?","questions":[{"cn":"买大件前，你会研究多久？","en":"How long do you research before buying something expensive?"},{"cn":"你更信朋友推荐还是专业评测？","en":"Do you trust friends' recommendations or professional reviews more?"},{"cn":"买完大件后，你后悔过吗？","en":"Have you ever regretted a big purchase?"}],"holidayType":"topic","sourceUrls":["https://www.which.co.uk/reviews/cars"],"sourceNote":"英国消费者组织 Which? 的汽车评测与对比页（New and used car Reviews），2026-11-10 实抓 HTTP 200，正文含选购对比内容。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-cards-payments","cn":"信用卡与移动支付","en":"Cards and mobile payments","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"刷卡、扫码、付现金，各地习惯差别很大。可以聊出门还带不带现金、用不用手机付款、信用卡是每月还清还是分期，也能聊小店只收现金时的尴尬。","briefEn":"How people pay for things varies a lot by country and by person. You can ask whether they still carry cash, whether they pay by phone, and whether they clear the card every month or carry a balance. The awkward moment at a cash-only shop is a reliable conversation starter.","questions":[{"cn":"你出门还带现金吗？","en":"Do you still carry cash when you go out?"},{"cn":"你平时更常用手机还是实体卡付款？","en":"Do you usually pay with your phone or a physical card?"},{"cn":"信用卡账单你会一次还清吗？","en":"Do you pay off your credit card balance in full each month?"}],"holidayType":"topic","sourceUrls":["https://www.federalreserve.gov/paymentsystems/fr-payments-study.htm"],"sourceNote":"美联储《Federal Reserve Payments Study (FRPS)》官方页面，2026-11-10 实抓 HTTP 200，内容为各类支付方式使用情况。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-used-phone-repair","cn":"二手机与维修","en":"Used phones and repairs","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"手机坏了是修还是换，很多人有自己的算法。可以聊换过几次电池和屏幕、会不会自己动手修、买二手最担心什么，也能聊维修报价和换新机的取舍。","briefEn":"Repair or replace is a decision people feel strongly about. You can ask how many batteries or screens they have swapped, whether they fix things themselves, and what worries them about buying used. The comparison between a repair quote and a new device usually gets a real answer.","questions":[{"cn":"手机坏了，你会先修还是直接换？","en":"When your phone breaks, do you repair it first or just replace it?"},{"cn":"你买过二手手机或二手电子产品吗？","en":"Have you bought a used phone or other second-hand electronics?"},{"cn":"你会自己动手修东西吗？","en":"Do you try to fix things yourself?"}],"holidayType":"topic","sourceUrls":["https://www.ifixit.com/News","https://www.ifixit.com/"],"sourceNote":"iFixit 官方维修新闻博客（The Official iFixit Blog: Tech Repair News）与 iFixit 主站，2026-11-10 实抓均 HTTP 200，内容为设备维修与可维修性话题。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-subscriptions","cn":"订阅服务与会员","en":"Subscriptions and memberships","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"视频、音乐、云存储、健身会员，订阅越开越多。可以聊每月到底订了几项、有没有忘了取消的、自动续费踩过什么坑，也能聊哪些服务真的天天在用。","briefEn":"Streaming, music, cloud storage, gym memberships: the list keeps growing. You can ask how many subscriptions someone actually has, whether they forgot to cancel one, and what happened with auto-renewal. Then compare which services they genuinely use every week.","questions":[{"cn":"你现在一共订了几项服务？","en":"How many subscription services do you have right now?"},{"cn":"你有过忘了取消、被自动续费的时候吗？","en":"Have you ever been charged because you forgot to cancel?"},{"cn":"哪项订阅你觉得最值？","en":"Which subscription feels most worth the money to you?"}],"holidayType":"topic","sourceUrls":["https://www.gov.uk/cma-cases?keywords=subscription"],"sourceNote":"英国竞争与市场管理局（CMA）官网按 subscription 关键词筛选的案件与项目列表，2026-11-10 实抓 HTTP 200，页面列出订阅相关调查项目。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-doctor-visit","cn":"就医与挂号体验","en":"Seeing a doctor","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"看医生这件事，各地流程差别特别大。可以聊怎么预约、等多久、能不能线上问诊，也能聊小病会不会拖着不去、看完有没有听懂医生说的话。","briefEn":"How you get to see a doctor varies hugely from place to place. You can ask about booking, waiting times, and whether video appointments are common. It also opens up honest talk about putting off small problems and leaving the clinic unsure what the doctor actually said.","questions":[{"cn":"你那边看医生一般怎么预约？","en":"How do you usually book a doctor's appointment where you live?"},{"cn":"看一次医生通常要等多久？","en":"How long do you usually wait to see a doctor?"},{"cn":"小毛病你会先拖着，还是马上去看？","en":"Do you wait out minor problems or go straight to a doctor?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/nhs-services/gps/","https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"],"sourceNote":"英国 NHS 的 GP services 与 Register with a GP surgery 页面，2026-11-10 实抓均 HTTP 200，内容为预约与注册家庭医生的实际流程。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-sleep-schedule","cn":"作息与睡眠质量","en":"Sleep schedules and rest","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"工作日和周末的作息常常是两套。可以聊两边差几个小时、早上醒来是什么状态、换季或加班后怎么调回来，也能聊“睡够了”到底怎么判断。","briefEn":"Many people run two different schedules: one for workdays and one for days off. You can ask how far apart they are, how they feel when they wake up, and how they reset after a late week. The tricky part is defining what actually counts as enough sleep.","questions":[{"cn":"你工作日和周末的作息差多少？","en":"How different are your weekday and weekend schedules?"},{"cn":"你早上醒来通常是什么状态？","en":"How do you usually feel when you wake up?"},{"cn":"熬夜之后，你怎么把作息调回来？","en":"How do you get your sleep schedule back on track after a late night?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/conditions/insomnia/","https://www.nhs.uk/live-well/sleep-and-tiredness/"],"sourceNote":"英国 NHS 的 Insomnia 与 Sleep and tiredness 页面，2026-11-10 实抓均 HTTP 200，提供一般性睡眠卫生与作息信息，仅作生活经验交流。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-stress-relief","cn":"压力与放松方式","en":"Stress and winding down","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"每个人减压的方式都不一样。可以聊压力大时做什么、散步还是躺着刷手机、和朋友聊有没有用，也能聊工作忙起来最先放弃的是什么。","briefEn":"Everyone winds down differently, and most people are happy to explain their method. You can ask what they do when stress builds up, whether they walk it off or scroll in bed, and whether talking to a friend helps. It also leads to what they drop first when work gets busy.","questions":[{"cn":"压力大的时候，你会做什么？","en":"What do you do when you are really stressed?"},{"cn":"散步、运动、刷手机，哪个对你最管用？","en":"Which helps you most: walking, exercise, or scrolling on your phone?"},{"cn":"和朋友聊一聊，会让你好受些吗？","en":"Does talking to a friend actually make you feel better?"}],"holidayType":"topic","sourceUrls":["https://www.who.int/news-room/questions-and-answers/item/stress","https://www.nhs.uk/mental-health/self-help/guides-tools-and-activities/tips-to-reduce-stress/"],"sourceNote":"世界卫生组织 Stress 问答页与英国 NHS「10 stress busters」页面，2026-11-10 实抓均 HTTP 200，内容为一般性压力应对建议。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-therapy-counseling","cn":"看心理医生或咨询","en":"Therapy and counselling","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"心理咨询在不同地方接受度差别很大。可以聊身边人愿不愿意谈、第一次去紧不紧张、线上咨询和面对面哪个更自在，也能聊怎么判断一个咨询师合不合适。","briefEn":"Attitudes to therapy differ a lot between places and families. You can ask whether people around them talk about it openly, how nervous they were the first time, and whether online sessions feel easier than face-to-face. Deciding whether a therapist is the right fit is another good thread.","questions":[{"cn":"你身边的人会公开聊心理咨询吗？","en":"Do people around you talk openly about therapy?"},{"cn":"第一次去咨询，你会紧张吗？","en":"Were you nervous the first time you tried counselling?"},{"cn":"线上咨询和面对面，你更习惯哪种？","en":"Do you prefer online sessions or meeting in person?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/nhs-talking-therapies/"],"sourceNote":"英国 NHS 的 Talking therapies 官方页面，2026-11-10 实抓 HTTP 200，介绍谈话治疗与转介流程，仅作生活经验交流。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-health-checkup","cn":"体检与健康检查","en":"Health checks","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"多久做一次体检，各地做法很不一样。可以聊公司有没有安排、自己会不会主动去、报告出来先看哪几项，也能聊看到异常指标时的心态。","briefEn":"Routine health checks are handled very differently depending on where you live and who you work for. You can ask whether their employer offers one, whether they book it themselves, and which numbers they look at first. How people react to one odd result is often the most interesting part.","questions":[{"cn":"你多久做一次体检？","en":"How often do you get a health check?"},{"cn":"公司会安排体检，还是你自己去？","en":"Does your employer arrange it, or do you book it yourself?"},{"cn":"拿到报告，你最先看哪几项？","en":"Which results do you look at first in your report?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/conditions/nhs-health-check/"],"sourceNote":"英国 NHS 的 NHS Health Check 页面，2026-11-10 实抓 HTTP 200，介绍常规健康检查内容，仅作一般信息与生活交流。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-diet-weight","cn":"饮食与体重管理","en":"Eating habits and weight","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"吃什么、要不要控制体重，是很多人常想到的事。可以聊有没有试过改变饮食习惯、饿的时候怎么扛、外食怎么选，也能聊各地对体重的看法和压力差很多。","briefEn":"Food and weight come up in daily conversation almost everywhere. You can ask whether someone has tried changing their eating habits, how they handle hunger, and how they choose when eating out. The social pressure around weight is also very different from place to place, which makes it worth comparing.","questions":[{"cn":"你试过刻意改变饮食习惯吗？","en":"Have you ever tried to change your eating habits on purpose?"},{"cn":"在外吃饭时，你会怎么选？","en":"How do you choose what to eat when you eat out?"},{"cn":"你会因为体重焦虑吗？","en":"Do you ever feel anxious about your weight?"}],"holidayType":"topic","sourceUrls":["https://www.who.int/news-room/fact-sheets/detail/healthy-diet"],"sourceNote":"世界卫生组织 Healthy diet 实况报道页，2026-11-10 实抓 HTTP 200，内容为一般性健康饮食建议，不作为医疗或减重指导。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-phone-privacy","cn":"手机隐私与权限","en":"Phone privacy and permissions","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"装 App 时那一串权限请求，很多人直接点同意。可以聊会不会逐个看、定位和麦克风权限给不给、多久清理一次授权，也能聊广告为什么像在偷听。","briefEn":"Most people tap through permission prompts without reading them. You can ask whether they check each one, whether they allow location or microphone access, and how often they review what apps can do. The feeling that ads are listening is a familiar and funny angle to start from.","questions":[{"cn":"装新 App 时，你会看权限说明吗？","en":"Do you read the permission list when you install a new app?"},{"cn":"定位和麦克风权限，你一般会给吗？","en":"Do you usually allow location and microphone access?"},{"cn":"你会定期清理 App 的权限吗？","en":"Do you go back and review app permissions from time to time?"}],"holidayType":"topic","sourceUrls":["https://www.ncsc.gov.uk/collection/mobile-device-guidance"],"sourceNote":"英国国家网络安全中心（NCSC）的 Device security guidance 页面，2026-11-10 实抓 HTTP 200，内容为移动设备安全与权限管理的一般建议。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-ai-tools","cn":"AI 工具的使用","en":"Using AI tools","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"AI 已经进了很多人的工作和学习。可以聊平时用哪类工具、拿来写东西还是查资料、会不会担心答案不准，也能聊哪些活交给它反而更慢。","briefEn":"AI tools have slipped into plenty of daily workflows already. You can ask which ones someone uses, whether they write or just look things up with them, and whether they worry about wrong answers. It is also fun to compare which tasks actually get slower when you hand them over.","questions":[{"cn":"你平时会用 AI 工具做什么？","en":"What do you use AI tools for?"},{"cn":"AI 给的结果，你会再核对吗？","en":"Do you double-check what an AI tool gives you?"},{"cn":"有没有哪件事，你觉得交给 AI 反而更慢？","en":"Is there anything that gets slower when you hand it to AI?"}],"holidayType":"topic","sourceUrls":["https://hai.stanford.edu/ai-index/2025-ai-index-report"],"sourceNote":"斯坦福大学人类中心人工智能研究院（Stanford HAI）《2025 AI Index Report》报告页，2026-11-10 实抓 HTTP 200，含 AI 采用与使用趋势数据。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-misinformation","cn":"网络信息真假判断","en":"Spotting false information online","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"群里的截图、短视频里的说法，真假很难一眼看出。可以聊看到惊人消息先做什么、会不会自己搜一下出处、家里长辈转发时怎么处理，也能聊踩过哪些坑。","briefEn":"Screenshots and short videos are hard to judge at a glance. You can ask what someone does when they see a shocking claim, whether they search for the source, and how they handle relatives forwarding questionable posts. Most people also have a story about getting fooled once.","questions":[{"cn":"看到一条惊人消息，你会先做什么？","en":"What do you do first when you see a shocking claim online?"},{"cn":"你会去找原始出处吗？","en":"Do you try to find the original source?"},{"cn":"家里人转发可疑消息，你会怎么处理？","en":"What do you do when a family member forwards something doubtful?"}],"holidayType":"topic","sourceUrls":["https://digital-strategy.ec.europa.eu/en/policies/online-disinformation"],"sourceNote":"欧盟委员会数字战略官网的 Tackling online disinformation 政策页，2026-11-10 实抓 HTTP 200，内容为网络虚假信息的识别与应对。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"life-online-learning-focus","cn":"线上学习与注意力","en":"Online learning and focus","region":"国际","theme":"更多","subtheme":"金钱健康科技","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"网课方便，但很难一直专注。可以聊能连续看多久、会不会开倍速、边看边刷别的页面吗，也能聊记笔记和线下上课有什么不同。","briefEn":"Online courses are convenient, but staying focused is the hard part. You can ask how long someone can watch before drifting, whether they speed up the video, and whether other tabs stay open. Comparing notes with a classroom setting usually brings out clear preferences.","questions":[{"cn":"看网课时，你能专心多久？","en":"How long can you stay focused during an online class?"},{"cn":"你会开倍速看课程吗？","en":"Do you watch course videos at a faster speed?"},{"cn":"线上学习和线下上课，你更容易走神的是哪个？","en":"Do you lose focus more easily online or in a classroom?"}],"holidayType":"topic","sourceUrls":["https://ocw.mit.edu/","https://www.insidehighered.com/"],"sourceNote":"MIT OpenCourseWare 官方开放课程站与 Inside Higher Ed 高等教育新闻站，2026-11-10 实抓均 HTTP 200，可用于线上学习形式与注意力管理话题。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-first-date","cn":"第一次约会","en":"First dates","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"第一次见面的安排能看出一个人的习惯：吃饭、散步还是喝咖啡，谁定时间，迟到怎么处理。不同地方对谁买单、第一次聊多深，默契也不太一样。","briefEn":"First dates are mostly logistics and small signals: a meal, a walk, or just coffee, who suggests the time, and what happens when someone is ten minutes late. Places also differ on who picks up the bill and how personal the first conversation is expected to get.","questions":[{"cn":"第一次约会你更习惯谁买单？","en":"On a first date, who usually pays where you're from?"},{"cn":"你会选吃饭、散步，还是喝咖啡这种轻松的安排？","en":"Would you go for a meal, a walk, or something low-key like coffee?"},{"cn":"第一次见面聊多深算合适？","en":"How personal do people usually get on a first date?"}],"holidayType":"topic","sourceUrls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC11332061/","https://www.betterhealth.vic.gov.au/health/healthyliving/relationships-creating-intimacy"],"sourceNote":"PMC 开放全文《Social and nonsocial synchrony are interrelated and romantically attractive》(2024) 与澳大利亚维多利亚州政府 Better Health Channel「Relationships - creating intimacy」页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-meet-through-friends","cn":"朋友介绍认识","en":"Meeting through friends","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有人靠朋友牵线认识伴侣，有人完全排斥被安排。可以聊介绍人是谁、第一次见面朋友在不在场、被介绍和别人自然认识，感觉差在哪里。","briefEn":"Some people meet partners through friends, others refuse to be set up at all. You can ask who did the introducing, whether the friend stayed for the first meeting, and how a planned setup feels different from meeting by accident at a party.","questions":[{"cn":"你身边有人是被朋友介绍认识伴侣的吗？","en":"Do you know anyone who met their partner through a friend?"},{"cn":"如果朋友要给你介绍，你会答应吗？","en":"If a friend offered to introduce you to someone, would you say yes?"},{"cn":"介绍人在场会让气氛更轻松，还是更尴尬？","en":"Does having the friend there make it easier or more awkward?"}],"holidayType":"topic","sourceUrls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC2831261/","https://www.betterhealth.vic.gov.au/health/healthyliving/relationships-creating-intimacy"],"sourceNote":"PMC 开放全文《Birds of a Feather, or Friend of a Friend?》(2011，青少年同伴网络中的伴侣选择) 与 Better Health Channel「Relationships - creating intimacy」页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-long-distance","cn":"异地相处","en":"Long-distance relationships","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"异地怎么维持，各家差别很大：多久见一次、每天视频还是各忙各的、谁飞过去、节假日怎么分。也有人试过之后发现不适合自己，这很正常。","briefEn":"Long distance looks different for every couple: how often you visit, whether you video call daily or just text, who travels, and how holidays get split. Some people also try it and decide it is not for them, which is just as worth talking about.","questions":[{"cn":"异地的话，你觉得多久见一次才够？","en":"If you were long distance, how often would you need to see each other?"},{"cn":"每天视频和偶尔联系，你更能接受哪种？","en":"Would you rather call every day or just check in now and then?"},{"cn":"异地你最担心的是什么？","en":"What would worry you most about long distance?"}],"holidayType":"topic","sourceUrls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC8669216/","https://www.betterhealth.vic.gov.au/health/healthyliving/relationships-creating-intimacy"],"sourceNote":"PMC 开放全文《Long-distance texting: Text messaging is linked with higher relationship satisfaction in long-distance relationships》(2021) 与 Better Health Channel 关系主题页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-meet-parents","cn":"见对方家长","en":"Meeting the parents","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"第一次见对方父母，紧张点常常不在礼节，而在节奏：什么时候去、带不带东西、待多久、要不要帮忙洗碗。有人家很随意，有人家规矩多。","briefEn":"Meeting someone's parents is less about etiquette than timing: when you go, whether you bring something, how long you stay, and whether you help in the kitchen. Some families keep it casual, others have a lot of small rules nobody explains.","questions":[{"cn":"第一次见对方父母，你觉得该带点东西吗？","en":"Should you bring something the first time you meet someone's parents?"},{"cn":"第一次上门，待多久算合适？","en":"How long is a normal first visit?"},{"cn":"你会在对方家里帮忙做家务吗？","en":"Would you help out with chores at their place?"}],"holidayType":"topic","sourceUrls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC10480833/","https://www.psychologytoday.com/us/basics/marriage"],"sourceNote":"PMC 开放全文《Do as We Wish: Parental Tactics of Mate Choice Manipulation》(2013，父母对子女择偶的影响) 与 Psychology Today「Marriage」基础页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-date-money","cn":"约会花钱方式","en":"Who pays when dating","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"谁买单、AA 还是轮流，是约会里最容易尴尬的一段。可以聊第一次谁付、长期怎么分、收入差很多时怎么办，也能聊直接谈钱会不会破坏气氛。","briefEn":"Who pays is one of the more awkward parts of dating: split every time, take turns, or one person always covers it. You can ask what happens when incomes differ a lot, and whether talking about money out loud ruins the mood or actually helps.","questions":[{"cn":"约会时你们怎么分账？","en":"How do you split costs when you go out?"},{"cn":"收入差很多的话，付钱方式要调整吗？","en":"If one person earns much more, should the paying change?"},{"cn":"直接聊钱会让你觉得尴尬吗？","en":"Does talking about money make things awkward for you?"}],"holidayType":"topic","sourceUrls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC10632137/","https://www.betterhealth.vic.gov.au/health/healthyliving/relationships-creating-intimacy"],"sourceNote":"PMC 开放全文《When couples fight about money, what do they fight about?》(2023) 与 Better Health Channel「Relationships - creating intimacy」页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-chores","cn":"同居分担家务","en":"Sharing chores at home","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"同居后家务怎么分，往往比想象中更花时间商量：谁做饭、谁洗碗、谁记得买纸、多久打扫一次。有人按清单分，有人凭感觉，也有人一直在磨合。","briefEn":"Once you live together, chores take more negotiation than people expect: who cooks, who does dishes, who remembers to buy toilet paper, and how often anyone cleans. Some couples split by list, some by feel, and plenty are still working it out.","questions":[{"cn":"同居后家务你们怎么分？","en":"How do you divide chores when you live together?"},{"cn":"家里谁负责记着要买什么？","en":"Who keeps track of what needs buying?"},{"cn":"觉得分配不公，你会直接说出来吗？","en":"If the split felt unfair, would you say it out loud?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/householdcharacteristics","https://pmc.ncbi.nlm.nih.gov/articles/PMC10343096/"],"sourceNote":"英国国家统计局 Household characteristics 主题页与 PMC 开放全文《The management of cognitive labour in same-gender couples》(2023，家务与心力的分工)，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-marriage-timing","cn":"结婚节奏","en":"Timing of marriage","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"什么时候结婚、要不要结婚，节奏因人而异：有人恋爱很久才定，有人很快决定，也有人一直不结。可以聊身边人的时间表，和家里催不催。","briefEn":"When to marry, or whether to marry at all, varies a lot: some couples wait years, some decide fast, and some never do either. It is easy to compare the timelines around you, and to talk about whether family members push for a date.","questions":[{"cn":"你身边人一般恋爱多久结婚？","en":"How long do couples around you usually date before marrying?"},{"cn":"家里会催婚吗？","en":"Does your family push you about marriage?"},{"cn":"一直不结婚只在一起生活，你怎么看？","en":"How do you see long-term partners who never marry?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/marriagecohabitationandcivilpartnerships"],"sourceNote":"英国国家统计局 Marriage, cohabitation and civil partnerships 主题页（含平均结婚年龄与同居数据），2026-11-10 实抓 HTTP 200，页面标题 Marriage, cohabitation and civil partnerships - Office for National Statistics。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-wedding-size","cn":"婚礼规模","en":"Wedding size","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"婚礼办多大，是很多人第一次真正要谈拢的事：几十人的小型仪式还是几百人的大场面，请不请远房亲戚、同事，钱花在场地还是酒席。","briefEn":"Wedding size is often the first thing couples really have to agree on: a small ceremony with thirty people or a big party with three hundred, whether distant relatives and coworkers get invited, and whether the budget goes to the venue or the food.","questions":[{"cn":"你理想中的婚礼大概是多少人？","en":"What size wedding would you want?"},{"cn":"远房亲戚和同事，你会请吗？","en":"Would you invite distant relatives and coworkers?"},{"cn":"小而简单和大场面，你更倾向哪个？","en":"Small and simple, or big and loud?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/marriagecohabitationandcivilpartnerships","https://www.psychologytoday.com/us/basics/marriage"],"sourceNote":"英国国家统计局婚姻与同居主题页（含年度婚礼数量统计）与 Psychology Today「Marriage」基础页，2026-11-10 实抓均 HTTP 200。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-kids-or-not","cn":"要不要孩子","en":"Whether to have children","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"要不要孩子是很个人的决定，身边选择也越来越不一样：有人很早就想清楚，有人一直没答案，也有人确定不要。可以聊这些想法怎么变的，不评判。","briefEn":"Whether to have kids is a personal decision, and the people around you probably disagree: some knew early, some still have no answer, and some are sure they do not want any. You can talk about how those views changed over time without judging where anyone landed.","questions":[{"cn":"你身边人大多想要孩子吗？","en":"Do most people around you want kids?"},{"cn":"这个想法会随着年龄变吗？","en":"Has that view changed as you got older?"},{"cn":"有人明确说不要孩子，你会怎么回应？","en":"How would you respond if someone said they definitely do not want kids?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths"],"sourceNote":"英国国家统计局 Live births 主题页（含生育率与生育年龄统计），2026-11-10 实抓 HTTP 200，页面标题 Live births - Office for National Statistics。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-daily-childcare","cn":"带孩子的日常","en":"A day with kids","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"有孩子之后，一天基本被切成小块：几点起、谁送、谁接、晚饭怎么解决、周末去哪消耗精力。没孩子的人也能聊自己小时候被怎么带大。","briefEn":"With kids, the day gets cut into small blocks: who is up first, who does drop-off and pickup, how dinner happens, and where the weekend energy goes. Even without kids, people can compare how they were raised themselves.","questions":[{"cn":"有孩子的一天大概是怎么安排的？","en":"What does a normal day with kids look like?"},{"cn":"接送孩子一般谁负责？","en":"Who usually handles drop-off and pickup?"},{"cn":"你小时候的周末是怎么过的？","en":"How did your weekends look as a kid?"}],"holidayType":"topic","sourceUrls":["https://www.unicef.org/parenting"],"sourceNote":"UNICEF Parenting 官方育儿主题页（含日常照护与亲子互动内容），2026-11-10 实抓 HTTP 200，页面标题 UNICEF Parenting。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"family-grandparent-help","cn":"祖辈帮忙带孩子","en":"Grandparents helping with kids","region":"国际","theme":"更多","subtheme":"家庭与关系","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"祖辈帮不帮忙带孩子，各家差别很大：有人天天接送，有人只偶尔照看，也有人住得远只能视频。可以聊这份帮忙怎么谈、累不累、要不要给钱。","briefEn":"Grandparent help ranges widely: some do daily pickup, some babysit now and then, and some live too far for anything but video calls. You can ask how that help gets arranged, whether it wears them out, and whether anyone offers to pay for it.","questions":[{"cn":"在你家，祖辈会帮忙带孩子吗？","en":"Do grandparents help with childcare where you're from?"},{"cn":"这种帮忙是他们主动提的，还是要开口请？","en":"Do they offer, or do you have to ask?"},{"cn":"长期帮忙要不要给钱或补贴？","en":"Should families pay grandparents for regular help?"}],"holidayType":"topic","
