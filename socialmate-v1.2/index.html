街拍氛围的代表之一，门口的小桌椅经常坐满来聊天的年轻人。比起喝完就走，更适合坐在室外看街景、感受这条街的热闹。", "en": "You can find it at Longxing Road in Longhua District, close to Baiyuan Yaju. This café is part of what made Longxing Road trendy. People gather at the small outdoor tables, so it's a fun stop for coffee and people-watching between photos.", "specialEn": "This café is part of what made Longxing Road trendy. People gather at the small outdoor tables, so it's a fun stop for coffee and people-watching between photos.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区龙兴路，柏园雅居附近", "locationEn": "Longxing Road in Longhua District, close to Baiyuan Yaju", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Matata%20Coffee%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Matata%20Coffee%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 24, "cnName": "斑马院子（龙兴路）", "enName": "Zebra Courtyard (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路的斑马院子店铺。它是龙兴路较早受欢迎的小店之一，烘焙和有设计感的店面很受拍照的人喜欢。适合和龙兴路一起逛，不需要把它当成单独的半天景点。", "en": "You can find it at Zebra Courtyard on Longxing Road, Longhua District. One of the street's earlier popular shops, known for baked treats and a photogenic storefront. Drop in while exploring Longxing Road rather than making a separate trip.", "specialEn": "One of the street's earlier popular shops, known for baked treats and a photogenic storefront. Drop in while exploring Longxing Road rather than making a separate trip.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区龙兴路的斑马院子店铺", "locationEn": "Zebra Courtyard on Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%91%E9%A9%AC%E9%99%A2%E5%AD%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%91%E9%A9%AC%E9%99%A2%E5%AD%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 25, "cnName": "席地而坐（龙兴路）", "enName": "Sitting & Drinking (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路5号附近。这家店白天偏咖啡，晚上又有餐酒吧的社交感觉，是龙兴路从午后逛街切换到夜生活的代表。想拍街头生活照，也可以留意它的门口和周边小巷。", "en": "It is around No. 5 Longxing Road, Longhua District. A café-meets-bar that shows Longxing Road's daytime-to-evening personality. It's a nice stop for a drink and some lively street photos, especially later in the day.", "specialEn": "A café-meets-bar that shows Longxing Road's daytime-to-evening personality. It's a nice stop for a drink and some lively street photos, especially later in the day.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "示意", "locationCn": "海口市龙华区龙兴路5号附近", "locationEn": "Around No. 5 Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%B8%AD%E5%9C%B0%E8%80%8C%E5%9D%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%B8%AD%E5%9C%B0%E8%80%8C%E5%9D%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 26, "cnName": "手帐咖啡好天气（龙兴路）", "enName": "Good Weather Journal Café (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路上的手帐主题小店。和普通咖啡店不一样，这里更吸引喜欢手帐、文具和手作的人。可以看看小物件、拍些细节照片，适合喜欢文艺小店的朋友。", "en": "You can find it at A stationery-themed café along Longxing Road, Longhua District. This is a fun little stop if you like notebooks, stationery, and handmade details. It's more about browsing creative objects than checking off another coffee shop.", "specialEn": "This is a fun little stop if you like notebooks, stationery, and handmade details. It's more about browsing creative objects than checking off another coffee shop.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "示意", "locationCn": "海口市龙华区龙兴路上的手帐主题小店", "locationEn": "A stationery-themed café along Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%89%8B%E5%B8%90%E5%92%96%E5%95%A1%E5%A5%BD%E5%A4%A9%E6%B0%94%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%89%8B%E5%B8%90%E5%92%96%E5%95%A1%E5%A5%BD%E5%A4%A9%E6%B0%94%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 27, "cnName": "Hippo Gelato（龙兴路）", "enName": "Hippo Gelato (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路一带的冰淇淋小店。逛龙兴路逛累了，可以顺路来吃一份意式冰淇淋。它是街拍路线上的小休息站，不必特地为一家冰淇淋店跑很远。", "en": "You can find it at A gelato shop in the Longxing Road area of Longhua District. A simple treat while walking around Longxing Road. Grab some gelato, take a break, and carry on exploring the cafés and pretty shopfronts.", "specialEn": "A simple treat while walking around Longxing Road. Grab some gelato, take a break, and carry on exploring the cafés and pretty shopfronts.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区龙兴路一带的冰淇淋小店", "locationEn": "A gelato shop in the Longxing Road area of Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Hippo%20Gelato%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Hippo%20Gelato%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 28, "cnName": "金盘夜市", "enName": "Jinpan Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区金盘路8号。这座夜市更有附近居民出来吃宵夜的感觉，摊位多，价格和选择比较接地气。晚上来试试烤串、海南小吃，比去商场吃饭更能感受本地生活。", "en": "It is at No. 8 Jinpan Road, Longhua District, Haikou. This night market feels like where nearby residents go for supper. Expect barbecue, local snacks, and a lively, everyday atmosphere rather than a polished tourist show.", "specialEn": "This night market feels like where nearby residents go for supper. Expect barbecue, local snacks, and a lively, everyday atmosphere rather than a polished tourist show.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区金盘路8号", "locationEn": "No. 8 Jinpan Road, Longhua District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E7%9B%98%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E7%9B%98%E5%A4%9C%E5%B8%82"}, {"id": 29, "cnName": "寻尝里夜市", "enName": "Xunchangli Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市秀英区美俗路35号。这里是一片集中的夜市小吃区，适合几个人一起点不同的东西分着吃。比起只找一家餐厅，边走边选更有乐趣，尤其适合不知道要吃什么的时候。", "en": "It is at No. 35 Meisu Road, Xiuying District, Haikou. This is an easy place to sample different foods in one evening. Go with friends, pick a few stalls, share dishes, and see what you discover.", "specialEn": "This is an easy place to sample different foods in one evening. Go with friends, pick a few stalls, share dishes, and see what you discover.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区美俗路35号", "locationEn": "No. 35 Meisu Road, Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%AF%BB%E5%B0%9D%E9%87%8C%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%AF%BB%E5%B0%9D%E9%87%8C%E5%A4%9C%E5%B8%82"}, {"id": 30, "cnName": "福地夜巷", "enName": "Fudi Night Lane", "city": "海口", "category": "美食夜生活", "cn": "海口市琼山区忠介路86号，府城老城区内。这里把传统老城区和热闹夜市结合起来，逛完府城老街可以直接接着吃宵夜。附近有不少海南本地小吃，是晚上体验府城生活的方便一站。", "en": "It is at No. 86 Zhongjie Road in Qiongshan District, within old Fucheng. This night market is right in old Fucheng, so you can explore the older streets and then stay for snacks. It's a convenient way to experience the neighborhood after dark.", "specialEn": "This night market is right in old Fucheng, so you can explore the older streets and then stay for snacks. It's a convenient way to experience the neighborhood after dark.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市琼山区忠介路86号，府城老城区内", "locationEn": "No. 86 Zhongjie Road in Qiongshan District, within old Fucheng", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%A6%8F%E5%9C%B0%E5%A4%9C%E5%B7%B7", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%A6%8F%E5%9C%B0%E5%A4%9C%E5%B7%B7"}, {"id": 31, "cnName": "桂林洋大学城夜市", "enName": "Guilinyang University Town Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市美兰区桂林洋大学城一带。这里以学生为主，夜市的感觉比较年轻，常见各种实惠小吃和饮料。适合想看看海南大学城夜生活、顺便找点便宜好吃东西的人。", "en": "You can find it at The Guilinyang university district in Meilan District, Haikou. The crowd here is mostly students, and the food is casual and affordable. Visit for the lively university-night-market vibe and an easy late snack.", "specialEn": "The crowd here is mostly students, and the food is casual and affordable. Visit for the lively university-night-market vibe and an easy late snack.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区桂林洋大学城一带", "locationEn": "The Guilinyang university district in Meilan District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E5%A4%A7%E5%AD%A6%E5%9F%8E%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E5%A4%A7%E5%AD%A6%E5%9F%8E%E5%A4%9C%E5%B8%82"}, {"id": 32, "cnName": "丁村万人海鲜广场", "enName": "Dingcun Seafood Square", "city": "海口", "category": "美食夜生活", "cn": "海口市琼山区丁村一带的万人海鲜广场。和普通餐厅不同，这里可以先挑海鲜，再按自己的口味让店家加工。适合几个朋友一起点鱼、虾、蟹，体验海南人热热闹闹吃海鲜的方式。", "en": "You can find it at Dingcun Seafood Square in Qiongshan District, Haikou. You choose seafood first and then have it cooked the way you like. It's especially fun with a group, sharing fish, prawns, and crab around a big table.", "specialEn": "You choose seafood first and then have it cooked the way you like. It's especially fun with a group, sharing fish, prawns, and crab around a big table.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市琼山区丁村一带的万人海鲜广场", "locationEn": "Dingcun Seafood Square in Qiongshan District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%81%E6%9D%91%E4%B8%87%E4%BA%BA%E6%B5%B7%E9%B2%9C%E5%B9%BF%E5%9C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%81%E6%9D%91%E4%B8%87%E4%BA%BA%E6%B5%B7%E9%B2%9C%E5%B9%BF%E5%9C%BA"}, {"id": 33, "cnName": "东门市场", "enName": "Dongmen Market", "city": "海口", "category": "美食夜生活", "cn": "海口市美兰区博爱南路和东门市场周边。这里不是精致的网红打卡点，而是能看到海南人真实买菜生活的市场。鱼虾、热带水果、香料和各种食材都很有地方特色，早上来会更有意思。", "en": "It is around Dongmen Market and Bo'ai South Road in Meilan District. This is a real local market, not a polished photo attraction. Come in the morning to see seafood, tropical fruit, spices, and the bustle of everyday shopping.", "specialEn": "This is a real local market, not a polished photo attraction. Come in the morning to see seafood, tropical fruit, spices, and the bustle of everyday shopping.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区博爱南路和东门市场周边", "locationEn": "Around Dongmen Market and Bo'ai South Road in Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E9%97%A8%E5%B8%82%E5%9C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E9%97%A8%E5%B8%82%E5%9C%BA"}, {"id": 34, "cnName": "观澜湖美食自助夜市", "enName": "Mission Hills Food Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区观澜湖新城石矿湖附近。它和传统夜市不同，走的是买票后集中尝多种风味小吃的模式，节假日和周末比较热闹。可能还有表演和游乐安排，去之前一定要确认当期有没有开场。", "en": "It is near Shikuang Lake in Mission Hills Centreville, Longhua District. Unlike a normal night market, this one has offered a ticketed all-you-can-try food experience. Entertainment and opening dates can change, so check the current event schedule first.", "specialEn": "Unlike a normal night market, this one has offered a ticketed all-you-can-try food experience. Entertainment and opening dates can change, so check the current event schedule first.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区观澜湖新城石矿湖附近", "locationEn": "Near Shikuang Lake in Mission Hills Centreville, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%BE%9C%E6%B9%96%E7%BE%8E%E9%A3%9F%E8%87%AA%E5%8A%A9%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%BE%9C%E6%B9%96%E7%BE%8E%E9%A3%9F%E8%87%AA%E5%8A%A9%E5%A4%9C%E5%B8%82"}, {"id": 35, "cnName": "上邦百汇城", "enName": "Shangbang Baihuicheng", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区国贸片区的上邦百汇城。这是市中心比较方便约朋友的餐饮购物区，周围选择多。它不是必须专程旅游的地标，不过热得不想走户外时，来吃饭、看电影或喝咖啡很实用。", "en": "You can find it at Shangbang Baihuicheng in Haikou's Guomao district. A convenient central place for food, shopping, and meeting friends. It's not a must-see landmark, but it's handy when it's too hot to spend the whole day outdoors.", "specialEn": "A convenient central place for food, shopping, and meeting friends. It's not a must-see landmark, but it's handy when it's too hot to spend the whole day outdoors.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区国贸片区的上邦百汇城", "locationEn": "Shangbang Baihuicheng in Haikou's Guomao district", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%8A%E9%82%A6%E7%99%BE%E6%B1%87%E5%9F%8E", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%8A%E9%82%A6%E7%99%BE%E6%B1%87%E5%9F%8E"}, {"id": 36, "cnName": "友谊阳光城", "enName": "Friendship Sunshine City", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区金龙路的友谊阳光城。国贸片区的大型商场，餐饮、娱乐和购物集中，最适合用来躲太阳或下雨天安排活动。想找一个集合地点再去附近逛街，也很方便。", "en": "You can find it at Youyi Sunshine City on Jinlong Road, Longhua District. A large shopping mall in the Guomao area, useful for food, entertainment, and escaping the midday heat. It's also an easy meeting point.", "specialEn": "A large shopping mall in the Guomao area, useful for food, entertainment, and escaping the midday heat. It's also an easy meeting point.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区金龙路的友谊阳光城", "locationEn": "Youyi Sunshine City on Jinlong Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%8F%8B%E8%B0%8A%E9%98%B3%E5%85%89%E5%9F%8E", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%8F%8B%E8%B0%8A%E9%98%B3%E5%85%89%E5%9F%8E"}, {"id": 37, "cnName": "cdf海口国际免税城", "enName": "CDF Haikou International Duty Free City", "city": "海口", "category": "美食夜生活", "cn": "海口市秀英区滨海大道西段，新海港附近。这里最特别的是商场规模很大，适合喜欢国际品牌和免税购物的人。它和看风景的景区不一样，更适合把购物、吃饭和看大型室内空间安排在一起。", "en": "It is on western Binhai Avenue in Xiuying District, near Xinhai Port. This is a huge duty-free shopping complex near the port. Visit for international brands and indoor shopping rather than beaches or nature.", "specialEn": "This is a huge duty-free shopping complex near the port. Visit for international brands and indoor shopping rather than beaches or nature.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区滨海大道西段，新海港附近", "locationEn": "On western Binhai Avenue in Xiuying District, near Xinhai Port", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3cdf%E6%B5%B7%E5%8F%A3%E5%9B%BD%E9%99%85%E5%85%8D%E7%A8%8E%E5%9F%8E", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3cdf%E6%B5%B7%E5%8F%A3%E5%9B%BD%E9%99%85%E5%85%8D%E7%A8%8E%E5%9F%8E"}, {"id": 38, "cnName": "海口湾演艺中心", "enName": "Haikou Bay Performing Arts Center", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区滨海大道海口湾一带。海口湾演艺中心适合有演出时专门来，音乐会、剧场节目才是重点。最好先看节目单和票务，别只为了打卡建筑跑一趟。", "en": "It is along Binhai Avenue near Haikou Bay, Longhua District. The real reason to visit is a concert or performance, not just the building. Check the program and tickets before planning your evening.", "specialEn": "The real reason to visit is a concert or performance, not just the building. Check the program and tickets before planning your evening.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区滨海大道海口湾一带", "locationEn": "Along Binhai Avenue near Haikou Bay, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BC%94%E8%89%BA%E4%B8%AD%E5%BF%83", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BC%94%E8%89%BA%E4%B8%AD%E5%BF%83"}, {"id": 39, "cnName": "万绿园", "enName": "Evergreen Park (Wanlüyuan)", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区滨海大道38号，海口湾边。万绿园是海口人经常去散步、跑步、野餐的大草坪，天气舒服时很有生活气。比起拍一个固定景点，更适合带朋友放松，看草地、椰树和海边城市风景。", "en": "It is at No. 38 Binhai Avenue, Longhua District, right by Haikou Bay. This is where locals picnic, run, and relax on big lawns near the bay. Come to slow down and see everyday Haikou life rather than chase a famous landmark.", "specialEn": "This is where locals picnic, run, and relax on big lawns near the bay. Come to slow down and see everyday Haikou life rather than chase a famous landmark.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区滨海大道38号，海口湾边", "locationEn": "No. 38 Binhai Avenue, Longhua District, right by Haikou Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%87%E7%BB%BF%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%87%E7%BB%BF%E5%9B%AD"}, {"id": 40, "cnName": "世纪公园", "enName": "Century Park", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区世纪公园，靠近世纪大桥南端。这里最有代表性的画面就是高高的世纪大桥和海口湾放在一起。傍晚能看桥上的车灯、海面和城市建筑，特别适合拍海口夜景。", "en": "You can find it at Century Park in Longhua District, near the south end of Century Bridge. The best view combines Century Bridge, the bay, and Haikou's skyline. Come at dusk when the bridge lights and city reflections begin to appear.", "specialEn": "The best view combines Century Bridge, the bay, and Haikou's skyline. Come at dusk when the bridge lights and city reflections begin to appear.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区世纪公园，靠近世纪大桥南端", "locationEn": "Century Park in Longhua District, near the south end of Century Bridge", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%96%E7%BA%AA%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%96%E7%BA%AA%E5%85%AC%E5%9B%AD"}, {"id": 41, "cnName": "海口湾滨海步道", "enName": "Haikou Bay Waterfront Walk", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区海口湾沿岸，世纪公园至云洞图书馆一带。这条路线适合边走边看现代海口，不需要门票，也不必专门安排项目。海风、桥梁、海边建筑和落日都能拍到，晚上散步也很舒服。", "en": "It is along Haikou Bay in Longhua District, around Century Park and Cloud Cave Library. This waterfront walk gives you bridges, modern buildings, and sea views in one easy route. It's free, relaxed, and especially pleasant toward sunset.", "specialEn": "This waterfront walk gives you bridges, modern buildings, and sea views in one easy route. It's free, relaxed, and especially pleasant toward sunset.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区海口湾沿岸，世纪公园至云洞图书馆一带", "locationEn": "Along Haikou Bay in Longhua District, around Century Park and Cloud Cave Library", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BB%A8%E6%B5%B7%E6%AD%A5%E9%81%93", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BB%A8%E6%B5%B7%E6%AD%A5%E9%81%93"}, {"id": 42, "cnName": "西秀海滩", "enName": "Xixiu Beach", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区滨海大道173号附近。这里和一般海滩不同，能看到帆船帆板训练的场景，是海南海上运动很有代表性的地方。想体验帆船要找正规机构预约，光是海边看船也挺有意思。", "en": "It is around No. 173 Binhai Avenue, Xiuying District. This beach is known for sailing and windsurfing, so you might see boats and training activities. Book a proper operator if you want to try the sport yourself.", "specialEn": "This beach is known for sailing and windsurfing, so you might see boats and training activities. Book a proper operator if you want to try the sport yourself.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区滨海大道173号附近", "locationEn": "Around No. 173 Binhai Avenue, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A5%BF%E7%A7%80%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A5%BF%E7%A7%80%E6%B5%B7%E6%BB%A9"}, {"id": 43, "cnName": "假日海滩", "enName": "Holiday Beach", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区滨海大道西段的假日海滩。这里是一条有椰树、沙滩和海风的城市海岸，适合傍晚散步或者坐着看落日。海口的海水条件和三亚不同，来这里主要是休闲看海，不要默认能安全游泳。", "en": "You can find it at Holiday Beach on western Binhai Avenue, Xiuying District. A classic city beach for coconut trees, sea breezes, and sunsets. Come mainly to relax by the water; swimming conditions are not the same as at every resort beach.", "specialEn": "A classic city beach for coconut trees, sea breezes, and sunsets. Come mainly to relax by the water; swimming conditions are not the same as at every resort beach.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区滨海大道西段的假日海滩", "locationEn": "Holiday Beach on western Binhai Avenue, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%81%87%E6%97%A5%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%81%87%E6%97%A5%E6%B5%B7%E6%BB%A9"}, {"id": 44, "cnName": "观海台", "enName": "Guanhaitai Seaside Viewpoint", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区西海岸滨海大道沿线的观海台。这是西海岸比较容易停下来欣赏海景的地方，海面开阔，适合看夕阳。可以和假日海滩、西秀海滩安排在同一趟路线上，不必单独开车来回折腾。", "en": "You can find it at Guanhaitai on the western coastal stretch of Binhai Avenue. A simple open-water viewpoint on Haikou's west coast, best around sunset. Combine it with nearby beaches instead of making a separate long trip.", "specialEn": "A simple open-water viewpoint on Haikou's west coast, best around sunset. Combine it with nearby beaches instead of making a separate long trip.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区西海岸滨海大道沿线的观海台", "locationEn": "Guanhaitai on the western coastal stretch of Binhai Avenue", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%B5%B7%E5%8F%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%B5%B7%E5%8F%B0"}, {"id": 45, "cnName": "白沙门公园", "enName": "Baishamen Park", "city": "海口", "category": "海滨日落", "cn": "海口市美兰区海甸六东路一带的白沙门公园。这里更像海口人的海边生活公园，草地、树荫和休闲步道都有。适合早晚散步或带朋友轻松运动，不是那种需要排队拍照的大景区。", "en": "You can find it at Baishamen Park near Haidian Sixth East Road, Meilan District. A local seaside park with lawns, shade, and walking paths. It's best for a relaxed stroll or light exercise rather than a big sightseeing itinerary.", "specialEn": "A local seaside park with lawns, shade, and walking paths. It's best for a relaxed stroll or light exercise rather than a big sightseeing itinerary.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区海甸六东路一带的白沙门公园", "locationEn": "Baishamen Park near Haidian Sixth East Road, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%99%BD%E6%B2%99%E9%97%A8%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%99%BD%E6%B2%99%E9%97%A8%E5%85%AC%E5%9B%AD"}, {"id": 46, "cnName": "拾贝公园", "enName": "Shibei Park", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区西海岸沿线的拾贝公园。这片滨海公园的特点是空间开阔、路好走，适合吹风和拍海边散步的生活照。若本来就在西海岸，可以顺路停一停。", "en": "You can find it at Shibei Park on the west coast of Xiuying District. This is an open coastal park for an easy walk and breezy photos. It's worth a stop if you're already exploring Haikou's western shoreline.", "specialEn": "This is an open coastal park for an easy walk and breezy photos. It's worth a stop if you're already exploring Haikou's western shoreline.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区西海岸沿线的拾贝公园", "locationEn": "Shibei Park on the west coast of Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%8B%BE%E8%B4%9D%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%8B%BE%E8%B4%9D%E5%85%AC%E5%9B%AD"}, {"id": 47, "cnName": "金沙湾滨海公园", "enName": "Jinsha Bay Coastal Park", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区金沙湾海岸一带。海面和沙滩比较开阔，天气好时适合野餐、拍日落和放空。这里的看点不是密集娱乐项目，而是能找块空地舒服地坐一会儿。", "en": "You can find it at The Jinshawan coast in Xiuying District, Haikou. The broad coastline is best for a picnic, an open sunset view, or simply sitting by the sea. It's about space and quiet rather than lots of attractions.", "specialEn": "The broad coastline is best for a picnic, an open sunset view, or simply sitting by the sea. It's about space and quiet rather than lots of attractions.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区金沙湾海岸一带", "locationEn": "The Jinshawan coast in Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E6%B2%99%E6%B9%BE%E6%BB%A8%E6%B5%B7%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E6%B2%99%E6%B9%BE%E6%BB%A8%E6%B5%B7%E5%85%AC%E5%9B%AD"}, {"id": 48, "cnName": "桂林洋海滨", "enName": "Guilinyang Coast", "city": "海口", "category": "海滨日落", "cn": "海口市美兰区桂林洋海岸一带。这里离市中心有一段距离，海岸感觉相对自然，游客聚集程度低一些。适合喜欢安静海景和海岸摄影的人，但去之前要了解交通、天气和海浪情况。", "en": "You can find it at The Guilinyang coast in Meilan District. This stretch feels more natural and less crowded than the central bay. Go for quiet coastal scenery, but check access, weather, and sea conditions first.", "specialEn": "This stretch feels more natural and less crowded than the central bay. Go for quiet coastal scenery, but check access, weather, and sea conditions first.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区桂林洋海岸一带", "locationEn": "The Guilinyang coast in Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E6%B5%B7%E6%BB%A8", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E6%B5%B7%E6%BB%A8"}, {"id": 49, "cnName": "东寨港红树林", "enName": "Dongzhai Harbor Mangroves", "city": "海口", "category": "自然体验", "cn": "海口市美兰区演丰镇红林路，东寨港湿地一带。这里不是普通森林，而是树根长在潮水里的红树林湿地。跟着正规观景路线看树根、滩涂和鸟类，很容易发现海南不只有椰树和沙滩。", "en": "You can find it at Honglin Road in Yanfeng Town, Meilan District, by Dongzhai Harbor. These trees grow in tidal water, creating a very different kind of forest. Follow the proper viewing route to see their roots, mudflats, and birds.", "specialEn": "These trees grow in tidal water, creating a very different kind of forest. Follow the proper viewing route to see their roots, mudflats, and birds.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区演丰镇红林路，东寨港湿地一带", "locationEn": "Honglin Road in Yanfeng Town, Meilan District, by Dongzhai Harbor", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%AF%A8%E6%B8%AF%E7%BA%A2%E6%A0%91%E6%9E%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%AF%A8%E6%B8%AF%E7%BA%A2%E6%A0%91%E6%9E%97"}, {"id": 50, "cnName": "三卿村", "enName": "Sanqing Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇，火山口地质公园附近。三卿村的石屋、石墙和小路很多都是用火山石砌成的，走进去有一种被黑色石头包围的感觉。很适合和火山口公园安排在同一天，看完自然地貌再看火山村落。", "en": "You can find it at Shishan Town, Xiuying District, close to the volcano park. Many houses, lanes, and walls here are built from volcanic stone. Pair it with the volcano park to see how the same rock shaped both the land and village life.", "specialEn": "Many houses, lanes, and walls here are built from volcanic stone. Pair it with the volcano park to see how the same rock shaped both the land and village life.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区石山镇，火山口地质公园附近", "locationEn": "Shishan Town, Xiuying District, close to the volcano park", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%89%E5%8D%BF%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%89%E5%8D%BF%E6%9D%91"}, {"id": 51, "cnName": "美社村", "enName": "Meishe Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇美社村。这里最值得看的是火山岩石屋和海南乡村的老巷子，不是大型商业景点。适合慢慢走，看看当地人怎么在火山石环境里生活。", "en": "You can find it at Meishe Village in Shishan Town, Xiuying District. This village is known for traditional volcanic-stone buildings and old lanes. It's a quiet place to see how people have lived in Haikou's volcanic countryside.", "specialEn": "This village is known for traditional volcanic-stone buildings and old lanes. It's a quiet place to see how people have lived in Haikou's volcanic countryside.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区石山镇美社村", "locationEn": "Meishe Village in Shishan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%BE%8E%E7%A4%BE%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%BE%8E%E7%A4%BE%E6%9D%91"}, {"id": 52, "cnName": "施茶村", "enName": "Shicha Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇施茶村。这里把火山石地貌和农业结合起来，石斛种植是比较有代表性的特色。喜欢乡村体验的人可以了解当地农场怎么利用火山岩环境种植物。", "en": "You can find it at Shicha Village in Shishan Town, Xiuying District. Shicha is interesting for its volcanic-stone farming, especially the way locals grow dendrobium orchids. It's more of a countryside experience than a typical tourist attraction.", "specialEn": "Shicha is interesting for its volcanic-stone farming, especially the way locals grow dendrobium orchids. It's more of a countryside experience than a typical tourist attraction.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区石山镇施茶村", "locationEn": "Shicha Village in Shishan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%BD%E8%8C%B6%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%BD%E8%8C%B6%E6%9D%91"}, {"id": 53, "cnName": "荔枝花海·火山营地", "enName": "Lychee Blossom Volcanic Camp", "city": "海口", "category": "自然体验", "cn": "海口市秀英区永兴镇荔枝花海火山营地。荔枝季这里的看点不只是露营，还可以体验荔枝林和当地火山荔枝。采摘有季节限制，最好在活动开放时来，不要以为一年四季都能摘果子。", "en": "You can find it at Lychee Flower Sea Volcano Camp in Yongxing Town, Xiuying District. During lychee season, the orchards are the main attraction, and picking activities may be available. Camping and events vary by date, so check the season before coming.", "specialEn": "During lychee season, the orchards are the main attraction, and picking activities may be available. Camping and events vary by date, so check the season before coming.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区永兴镇荔枝花海火山营地", "locationEn": "Lychee Flower Sea Volcano Camp in Yongxing Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%8D%94%E6%9E%9D%E8%8A%B1%E6%B5%B7%C2%B7%E7%81%AB%E5%B1%B1%E8%90%A5%E5%9C%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%8D%94%E6%9E%9D%E8%8A%B1%E6%B5%B7%C2%B7%E7%81%AB%E5%B1%B1%E8%90%A5%E5%9C%B0"}, {"id": 54, "cnName": "自由大陆营地", "enName": "Free Continent Camp", "city": "海口", "category": "自然体验", "cn": "海口市龙华区城西镇沙坡郊野湿地公园附近。它是湿地旁的休闲露营地，有草地、营地餐食和窑烤面包之类的特色体验。比较适合几个人提前约好来聚会，具体开放和活动要临时确认。", "en": "It is near Shapo Wetland Park in Chengxi Town, Longhua District. This campsite sits by a wetland and has offered outdoor meals, gatherings, and oven-baked bread. It's better for a planned group outing; confirm the current schedule first.", "specialEn": "This campsite sits by a wetland and has offered outdoor meals, gatherings, and oven-baked bread. It's better for a planned group outing; confirm the current schedule first.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区城西镇沙坡郊野湿地公园附近", "locationEn": "Near Shapo Wetland Park in Chengxi Town, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%87%AA%E7%94%B1%E5%A4%A7%E9%99%86%E8%90%A5%E5%9C%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%87%AA%E7%94%B1%E5%A4%A7%E9%99%86%E8%90%A5%E5%9C%B0"}, {"id": 55, "cnName": "海口演艺新空间·泊岸艺术中心", "enName": "Bo'an Art Center", "city": "海口", "category": "自然体验", "cn": "海口市龙华区滨海大道42号海口演艺新空间内，万绿园旁。泊岸艺术中心以展览和创意活动为主，艺术家作品、空间设计和旁边的剧场可以一起看。这里不是每天都有一样的内容，先查当期展览或演出，选自己感兴趣的时间去。", "en": "It is inside Haikou Performing Arts New Space at No. 42 Binhai Avenue, Longhua District, beside Evergreen Park. This arts venue is part of a larger performance complex near Evergreen Park. Look for exhibitions, creative events, and theater programs; check the current schedule before visiting.", "specialEn": "This arts venue is part of a larger performance complex near Evergreen Park. Look for exhibitions, creative events, and theater programs; check the current schedule before visiting.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区滨海大道42号海口演艺新空间内，万绿园旁", "locationEn": "Inside Haikou Performing Arts New Space at No. 42 Binhai Avenue, Longhua District, beside Evergreen Park", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%BC%94%E8%89%BA%E6%96%B0%E7%A9%BA%E9%97%B4%C2%B7%E6%B3%8A%E5%B2%B8%E8%89%BA%E6%9C%AF%E4%B8%AD%E5%BF%83", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%BC%94%E8%89%BA%E6%96%B0%E7%A9%BA%E9%97%B4%C2%B7%E6%B3%8A%E5%B2%B8%E8%89%BA%E6%9C%AF%E4%B8%AD%E5%BF%83"}, {"id": 56, "cnName": "冯小刚电影公社", "enName": "Feng Xiaogang Movie Town", "city": "海口", "category": "自然体验", "cn": "海口市龙华区观澜湖旅游度假区电影公社内。这里特别适合喜欢复古街拍的人，能在同一个园区看到不同年代风格的街道、招牌和建筑。穿复古服装来拍照更有趣，拍出来像电影剧照。", "en": "It is inside the Movie Town at Mission Hills, Longhua District. Movie Town is great for retro photos, with streets and storefronts styled after different periods. Dressing up makes the experience even more fun—your pictures can look like movie stills.", "specialEn": "Movie Town is great for retro photos, with streets and storefronts styled after different periods. Dressing up makes the experience even more fun—your pictures can look like movie stills.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区观澜湖旅游度假区电影公社内", "locationEn": "Inside the Movie Town at Mission Hills, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%86%AF%E5%B0%8F%E5%88%9A%E7%94%B5%E5%BD%B1%E5%85%AC%E7%A4%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%86%AF%E5%B0%8F%E5%88%9A%E7%94%B5%E5%BD%B1%E5%85%AC%E7%A4%BE"}, {"id": 57, "cnName": "长影奇幻乐园", "enName": "Changying Fantasy Park", "city": "海口", "category": "自然体验", "cn": "海口市秀英区长影奇幻乐园园区。这里主要是游乐和光影主题体验，适合想玩设施、看表演的人。项目开放情况可能变化，最好先确认现在有哪些设施营业，再决定值不值得专程来。", "en": "You can find it at Changying Fantasy Park in Xiuying District, Haikou. This is for rides, entertainment, and themed attractions. Check which facilities are operating before making a special trip, since availability can change.", "specialEn": "This is for rides, entertainment, and themed attractions. Check which facilities are operating before making a special trip, since availability can change.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区长影奇幻乐园园区", "locationEn": "Changying Fantasy Park in Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%95%BF%E5%BD%B1%E5%A5%87%E5%B9%BB%E4%B9%90%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%95%BF%E5%BD%B1%E5%A5%87%E5%B9%BB%E4%B9%90%E5%9B%AD"}, {"id": 58, "cnName": "观澜湖旅游度假区", "enName": "Mission Hills Resort", "city": "海口", "category": "自然体验", "cn": "海口市龙华区观澜湖旅游度假区。这一带以高尔夫、度假酒店和配套休闲为主，更适合想安排半天到一天轻松活动的人。和年轻人街拍路线不同，主要是度假和运动体验。", "en": "You can find it at Mission Hills Resort in Longhua District, Haikou. Mission Hills is more about golf, resort facilities, and a relaxed day out than street photography. Go if you're in the mood for leisure or sport.", "specialEn": "Mission Hills is more about golf, resort facilities, and a relaxed day out than street photography. Go if you're in the mood for leisure or sport.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区观澜湖旅游度假区", "locationEn": "Mission Hills Resort in Longhua District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%BE%9C%E6%B9%96%E6%97%85%E6%B8%B8%E5%BA%A6%E5%81%87%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%BE%9C%E6%B9%96%E6%97%85%E6%B8%B8%E5%BA%A6%E5%81%87%E5%8C%BA"}, {"id": 59, "cnName": "海南热带野生动植物园", "enName": "Hainan Tropical Wildlife Park", "city": "海口", "category": "自然体验", "cn": "海口市秀英区东山镇海南热带野生动植物园。这里可以看海南热带植物和各种动物，适合喜欢动物或带孩子的朋友。园区比较大，天气热时建议早去，提前看好园内交通和游览路线。", "en": "You can find it at Hainan Tropical Wildlife and Botanical Garden in Dongshan Town, Xiuying District. This large park combines animals with tropical greenery. Go early to avoid the hottest hours, and check the park route so you can cover the areas you want to see.", "specialEn": "This large park combines animals with tropical greenery. Go early to avoid the hottest hours, and check the park route so you can cover the areas you want to see.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区东山镇海南热带野生动植物园", "locationEn": "Hainan Tropical Wildlife and Botanical Garden in Dongshan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8D%97%E7%83%AD%E5%B8%A6%E9%87%8E%E7%94%9F%E5%8A%A8%E6%A4%8D%E7%89%A9%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8D%97%E7%83%AD%E5%B8%A6%E9%87%8E%E7%94%9F%E5%8A%A8%E6%A4%8D%E7%89%A9%E5%9B%AD"}, {"id": 60, "cnName": "海口湾游船（东坡老码头出发）", "enName": "Haikou Bay Cruise (Dongpo Wharf)", "city": "海口", "category": "自然体验", "cn": "海口市美兰区碧海大道东坡老码头游船码头。这不是站在岸上看海，而是坐船从水上看世纪大桥、海口湾和城市灯光。夜游比较有氛围，但班次可能因天气调整，要先看当日船票和出航通知。", "en": "You can find it at The cruise pier at Dongpo Old Wharf on Bihai Avenue, Meilan District. See Haikou from the water instead of the shore. The evening cruise gives you views of Century Bridge and the skyline, but departures depend on tickets and weather.", "specialEn": "See Haikou from the water instead of the shore. The evening cruise gives you views of Century Bridge and the skyline, but departures depend on tickets and weather.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区碧海大道东坡老码头游船码头", "locationEn": "The cruise pier at Dongpo Old Wharf on Bihai Avenue, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%B8%B8%E8%88%B9%EF%BC%88%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4%E5%87%BA%E5%8F%91%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%B8%B8%E8%88%B9%EF%BC%88%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4%E5%87%BA%E5%8F%91%EF%BC%89"}, {"id": 61, "cnName": "铜鼓岭", "enName": "Tongguling Scenic Area", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭景区，靠近月亮湾。这里最大的卖点是登高后能同时看到绿色山坡、弯弯的月亮湾和蓝色大海。天气晴朗时层次特别漂亮，比站在普通海滩上看海更震撼。", "en": "You can find it at Tongguling in Longlou Town, Wenchang, above Moon Bay. The view is the star: green hills, the curved Moon Bay, and blue sea all in one panorama. On a clear day, it's much more dramatic than a regular beach view.", "specialEn": "The view is the star: green hills, the curved Moon Bay, and blue sea all in one panorama. On a clear day, it's much more dramatic than a regular beach view.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇铜鼓岭景区，靠近月亮湾", "locationEn": "Tongguling in Longlou Town, Wenchang, above Moon Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%9C%E9%BC%93%E5%B2%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%9C%E9%BC%93%E5%B2%AD"}, {"id": 62, "cnName": "石头公园", "enName": "Stone Park", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭附近的石头公园海岸。这里不是平整沙滩，而是一大片被海浪冲刷过的巨石，石头形状和浪花都很特别。适合拍气势比较强的海岸照片，但岩石湿滑，不要靠近危险浪区。", "en": "You can find it at Stone Park on the coast near Tongguling, Longlou Town, Wenchang. Huge weathered rocks and crashing waves make this coastline look dramatic. It's wonderful for landscape photos, but the rocks can be slippery and the surf dangerous.", "specialEn": "Huge weathered rocks and crashing waves make this coastline look dramatic. It's wonderful for landscape photos, but the rocks can be slippery and the surf dangerous.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇铜鼓岭附近的石头公园海岸", "locationEn": "Stone Park on the coast near Tongguling, Longlou Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%9F%B3%E5%A4%B4%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%9F%B3%E5%A4%B4%E5%85%AC%E5%9B%AD"}, {"id": 63, "cnName": "东郊椰林", "enName": "Dongjiao Coconut Grove", "city": "文昌", "category": "海南环岛", "cn": "文昌市东郊镇东郊椰林海岸。这里椰子树特别密，很多地方一抬头就是椰叶，走几步又能看到大海。想让外国朋友感受最典型的海南热带海岛画面，来这里很合适。", "en": "You can find it at Dongjiao Coconut Grove in Dongjiao Town, Wenchang. Tall coconut palms grow densely beside the sea here. If you want that classic tropical-island feeling—palm leaves overhead and the coast just steps away—this is the place.", "specialEn": "Tall coconut palms grow densely beside the sea here. If you want that classic tropical-island feeling—palm leaves overhead and the coast just steps away—this is the place.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市东郊镇东郊椰林海岸", "locationEn": "Dongjiao Coconut Grove in Dongjiao Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%9C%E9%83%8A%E6%A4%B0%E6%9E%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%9C%E9%83%8A%E6%A4%B0%E6%9E%97"}, {"id": 64, "cnName": "木兰湾风车海岸", "enName": "Mulan Bay Windmill Coast", "city": "文昌", "category": "海南环岛", "cn": "文昌市铺前镇木兰湾海岸和木兰灯塔附近。这一带很适合自驾，海边能看到风车、灯塔和长长的海岸线。不是那种店铺很多的热闹景区，重点是沿途风景和看海，天气好时很有电影感。", "en": "You can find it at Mulan Bay near Mulan Lighthouse in Puqian Town, Wenchang. The drive is part of the fun, with wind turbines, a lighthouse, and a wide coastal landscape. It's more about the scenery than shops or activities.", "specialEn": "The drive is part of the fun, with wind turbines, a lighthouse, and a wide coastal landscape. It's more about the scenery than shops or activities.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市铺前镇木兰湾海岸和木兰灯塔附近", "locationEn": "Mulan Bay near Mulan Lighthouse in Puqian Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%A8%E5%85%B0%E6%B9%BE%E9%A3%8E%E8%BD%A6%E6%B5%B7%E5%B2%B8", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%A8%E5%85%B0%E6%B9%BE%E9%A3%8E%E8%BD%A6%E6%B5%B7%E5%B2%B8"}, {"id": 65, "cnName": "淇水湾海滩", "enName": "Qishui Bay Beach", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇淇水湾，文昌航天发射场附近。这片海滩除了海景漂亮，还有一个很特别的理由：遇到合适的发射任务，有些观景位置能远远看到火箭升空。平时可以看海，想看发射必须提前查官方通告。", "en": "You can find it at Qishui Bay in Longlou Town, near the Wenchang Space Launch Site. This beach has a special claim to fame: during some launches, you may be able to watch a rocket rise in the distance. On normal days it's a scenic beach; always check official launch notices.", "specialEn": "This beach has a special claim to fame: during some launches, you may be able to watch a rocket rise in the distance. On normal days it's a scenic beach; always check official launch notices.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇淇水湾，文昌航天发射场附近", "locationEn": "Qishui Bay in Longlou Town, near the Wenchang Space Launch Site", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%B7%87%E6%B0%B4%E6%B9%BE%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%B7%87%E6%B0%B4%E6%B9%BE%E6%B5%B7%E6%BB%A9"}, {"id": 66, "cnName": "文昌航天发射场相关参观体验", "enName": "Wenchang Space Launch Visitor Experience", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇文昌航天发射场周边指定参观区域。这里最吸引人的不是普通展馆，而是能近距离了解中国航天发射基地的真实环境。参观范围受管理规定限制，不能想进哪里就进哪里，最好按正规渠道预约。", "en": "You can find it at Designated visitor areas near the Wenchang Space Launch Site in Longlou Town. This is one of China's major rocket-launch locations, so space fans will love learning about the real launch facilities. Access is controlled, and visits must follow approved arrangements.", "specialEn": "This is one of China's major rocket-launch locations, so space fans will love learning about the real launch facilities. Access is controlled, and visits must follow approved arrangements.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇文昌航天发射场周边指定参观区域", "locationEn": "Designated visitor areas near the Wenchang Space Launch Site in Longlou Town", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%96%87%E6%98%8C%E8%88%AA%E5%A4%A9%E5%8F%91%E5%B0%84%E5%9C%BA%E7%9B%B8%E5%85%B3%E5%8F%82%E8%A7%82%E4%BD%93%E9%AA%8C", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%96%87%E6%98%8C%E8%88%AA%E5%A4%A9%E5%8F%91%E5%B0%84%E5%9C%BA%E7%9B%B8%E5%85%B3%E5%8F%82%E8%A7%82%E4%BD%93%E9%AA%8C"}, {"id": 67, "cnName": "瑶光火箭观礼平台", "enName": "Yaoguang Rocket Viewing Platform", "city": "文昌", "category": "海南环岛", "cn": "文昌市东郊镇X183附近的瑶光火箭观礼平台。它是专门为了看火箭发射而建的观礼平台，不是普通观海台。真正值得来的时候是有发射任务时，可以和大家一起倒数、感受火箭点火升空，座位和道路需要提前预约。", "en": "You can find it at Yaoguang Rocket Viewing Platform in Dongjiao Town, along X183, Wenchang. This platform is built for rocket launches, not ordinary sightseeing. On launch day, the countdown and liftoff are the main event. Book ahead and follow road-control instructions.", "specialEn": "This platform is built for rocket launches, not ordinary sightseeing. On launch day, the countdown and liftoff are the main event. Book ahead and follow road-control instructions.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市东郊镇X183附近的瑶光火箭观礼平台", "locationEn": "Yaoguang Rocket Viewing Platform in Dongjiao Town, along X183, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%91%B6%E5%85%89%E7%81%AB%E7%AE%AD%E8%A7%82%E7%A4%BC%E5%B9%B3%E5%8F%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%91%B6%E5%85%89%E7%81%AB%E7%AE%AD%E8%A7%82%E7%A4%BC%E5%B9%B3%E5%8F%B0"}, {"id": 68, "cnName": "月亮湾", "enName": "Moon Bay", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭山脚的月亮湾海岸。从高处看，这片海湾像一条长长的弧线，海水颜色很漂亮。可以结合铜鼓岭一起玩：山上拍全景，来到海边再看沙滩与海浪。", "en": "You can find it at Moon Bay below Tongguling in Longlou Town, Wenchang. From above, the shoreline forms a beautiful long curve. Combine it with Tongguling—take wide shots from the hill and then enjoy the beach up close.", "specialEn": "From above, the shoreline forms a beautiful long curve. Combine it with Tongguling—take wide shots from the hill and then enjoy the beach up close.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇铜鼓岭山脚的月亮湾海岸", "locationEn": "Moon Bay below Tongguling in Longlou Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%88%E4%BA%AE%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%88%E4%BA%AE%E6%B9%BE"}, {"id": 69, "cnName": "三婆与海·糟粕醋文化休闲庄园", "enName": "Sanpo & Sea Zaopocu Restaurant", "city": "文昌", "category": "海南环岛", "cn": "文昌市铺前镇木兰湾海岸、007乡道附近。这家近年挺火的海边餐厅，纯白建筑放在蓝天大海前面，很像热门旅拍取景地。除了拍照，还能尝文昌有特色的酸辣糟粕醋，属于既能吃又能出片的地方。", "en": "It is near County Road 007 on the Mulan Bay coast, Puqian Town, Wenchang. This seaside spot became popular for its white building against the blue sea, almost like a Mediterranean-style photo set. It's also a chance to try Wenchang's tangy, spicy zaopocu specialty.", "specialEn": "This seaside spot became popular for its white building against the blue sea, almost like a Mediterranean-style photo set. It's also a chance to try Wenchang's tangy, spicy zaopocu specialty.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "示意", "locationCn": "文昌市铺前镇木兰湾海岸、007乡道附近", "locationEn": "Near County Road 007 on the Mulan Bay coast, Puqian Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%89%E5%A9%86%E4%B8%8E%E6%B5%B7%C2%B7%E7%B3%9F%E7%B2%95%E9%86%8B%E6%96%87%E5%8C%96%E4%BC%91%E9%97%B2%E5%BA%84%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%89%E5%A9%86%E4%B8%8E%E6%B5%B7%C2%B7 the Wanquan River in Bo'ao Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%8E%89%E5%B8%A6%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%8E%89%E5%B8%A6%E6%BB%A9"}, {"id": 74, "cnName": "沙美村", "enName": "Shamei Village", "city": "琼海", "category": "海南环岛", "cn": "琼海市博鳌镇沙美村，靠近沙美内海。这里的画面很柔和：小村庄、湖面、湿地和远处的山连在一起。适合慢慢走、看看田园和水鸟，和热闹的海滩度假完全是两种感觉。", "en": "You can find it at Shamei Village in Bo'ao Town, beside Shamei Lagoon. Shamei is about peaceful countryside scenery—village lanes, wetlands, water, and distant hills. It's a slower and quieter break from crowded beaches.", "specialEn": "Shamei is about peaceful countryside scenery—village lanes, wetlands, water, and distant hills. It's a slower and quieter break from crowded beaches.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市博鳌镇沙美村，靠近沙美内海", "locationEn": "Shamei Village in Bo'ao Town, beside Shamei Lagoon", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%B2%99%E7%BE%8E%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%B2%99%E7%BE%8E%E6%9D%91"}, {"id": 75, "cnName": "世界热带水果之窗", "enName": "World Tropical Fruit Window", "city": "琼海", "category": "海南环岛", "cn": "琼海市大路镇世界热带水果之窗景区。这里最有意思的是能认识来自不同地方、平时在超市不常见的热带水果。适合喜欢新鲜水果的人，看看果树长什么样，比只在水果店买水果更有趣。", "en": "You can find it at Window to the World of Tropical Fruits in Dalu Town, Qionghai. See tropical fruit growing on trees instead of only on supermarket shelves. It's fun for anyone curious about unusual fruit varieties and where they come from.", "specialEn": "See tropical fruit growing on trees instead of only on supermarket shelves. It's fun for anyone curious about unusual fruit varieties and where they come from.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市大路镇世界热带水果之窗景区", "locationEn": "Window to the World of Tropical Fruits in Dalu Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E4%B8%96%E7%95%8C%E7%83%AD%E5%B8%A6%E6%B0%B4%E6%9E%9C%E4%B9%8B%E7%AA%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E4%B8%96%E7%95%8C%E7%83%AD%E5%B8%A6%E6%B0%B4%E6%9E%9C%E4%B9%8B%E7%AA%97"}, {"id": 76, "cnName": "白石岭", "enName": "Baishiling Mountain", "city": "琼海", "category": "海南环岛", "cn": "琼海市嘉积镇附近白石岭景区。想从平地换个视角看琼海，可以来这座山。登高以后能看到城市、田野和周围山景，适合喜欢爬山又不想跑太远的人。", "en": "You can find it at Baishiling Scenic Area near Jiaji Town, Qionghai. Climb above the surrounding fields and town for a different view of Qionghai. It's a good option if you want some elevation without traveling far inland.", "specialEn": "Climb above the surrounding fields and town for a different view of Qionghai. It's a good option if you want some elevation without traveling far inland.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市嘉积镇附近白石岭景区", "locationEn": "Baishiling Scenic Area near Jiaji Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%99%BD%E7%9F%B3%E5%B2%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%99%BD%E7%9F%B3%E5%B2%AD"}, {"id": 77, "cnName": "北仍村", "enName": "Beireng Village", "city": "琼海", "category": "海南环岛", "cn": "琼海市嘉积镇北仍村乡村旅游区。这里把乡村绿植、小路和咖啡休闲空间结合起来，感觉比较清静。适合喜欢慢生活、想在海南乡下坐一会儿的人，不是追求刺激项目的景点。", "en": "You can find it at Beireng Village near Jiaji Town, Qionghai. This green rural village is more about slow walks and quiet breaks than big attractions. It's nice for seeing the countryside at an easy pace.", "specialEn": "This green rural village is more about slow walks and quiet breaks than big attractions. It's nice for seeing the countryside at an easy pace.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市嘉积镇北仍村乡村旅游区", "locationEn": "Beireng Village near Jiaji Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8C%97%E4%BB%8D%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8C%97%E4%BB%8D%E6%9D%91"}, {"id": 78, "cnName": "日月湾", "enName": "Riyue Bay", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇日月湾，海南东线海岸。这里是海南非常有名的冲浪海湾，浪板、冲浪店和海边咖啡馆随处可见，年轻人特别多。就算不会冲浪，也可以找正规教练上体验课，或者坐着看高手追浪。", "en": "You can find it at Riyue Bay in Liji Town, Wanning, on Hainan's east coast. One of Hainan's best-known surf spots, with boards, surf schools, and beach cafés everywhere. Try a beginner lesson with a qualified instructor, or simply watch the surfers.", "specialEn": "One of Hainan's best-known surf spots, with boards, surf schools, and beach cafés everywhere. Try a beginner lesson with a qualified instructor, or simply watch the surfers.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市礼纪镇日月湾，海南东线海岸", "locationEn": "Riyue Bay in Liji Town, Wanning, on Hainan's east coast", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE"}, {"id": 79, "cnName": "日月湾礼堂", "enName": "Riyue Bay Chapel", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇日月湾海边的日月湾礼堂。这栋海边建筑因为简洁的造型和海景背景很受情侣、摄影博主欢迎。真正吸引人的是建筑线条和海浪同框，适合在冲浪之外顺便拍一组漂亮的照片。", "en": "You can find it at The seaside chapel-like building at Riyue Bay in Liji Town, Wanning. This simple seaside building is popular for couple and influencer photos. Its clean lines against the waves make a lovely shot while you're visiting the surf bay.", "specialEn": "This simple seaside building is popular for couple and influencer photos. Its clean lines against the waves make a lovely shot while you're visiting the surf bay.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市礼纪镇日月湾海边的日月湾礼堂", "locationEn": "The seaside chapel-like building at Riyue Bay in Liji Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE%E7%A4%BC%E5%A0%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE%E7%A4%BC%E5%A0%82"}, {"id": 80, "cnName": "石梅湾", "enName": "Shimei Bay", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇石梅湾海岸。这里和热闹的日月湾不同，海滩、椰林和度假酒店带来更安静的度假感觉。适合找个地方住一晚、早晨走沙滩，而不只是来拍照五分钟就走。", "en": "You can find it at Shimei Bay in Liji Town, Wanning. Quieter than the surf scene at Riyue Bay, Shimei Bay is about palm-lined beaches and relaxed resorts. It's a place to stay, slow down, and walk on the sand in the morning.", "specialEn": "Quieter than the surf scene at Riyue Bay, Shimei Bay is about palm-lined beaches and relaxed resorts. It's a place to stay, slow down, and walk on the sand in the morning.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市礼纪镇石梅湾海岸", "locationEn": "Shimei Bay in Liji Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%9F%B3%E6%A2%85%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%9F%B3%E6%A2%85%E6%B9%BE"}, {"id": 81, "cnName": "神州半岛", "enName": "Shenzhou Peninsula", "city": "万宁", "category": "海南环岛", "cn": "万宁市东澳镇神州半岛海岸。半岛两侧都有海景，路边常能看到漂亮的海湾和度假建筑。适合自驾、住海边酒店，顺便把灯塔放进当天的拍照路线。", "en": "You can find it at Shenzhou Peninsula in Dong'ao Town, Wanning. This peninsula gives you coastal views from different angles, with beaches and resorts along the way. Combine a scenic drive with a visit to its lighthouse.", "specialEn": "This peninsula gives you coastal views from different angles, with beaches and resorts along the way. Combine a scenic drive with a visit to its lighthouse.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市东澳镇神州半岛海岸", "locationEn": "Shenzhou Peninsula in Dong'ao Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B"}, {"id": 82, "cnName": "神州半岛灯塔", "enName": "Shenzhou Peninsula Lighthouse", "city": "万宁", "category": "海南环岛", "cn": "万宁市东澳镇神州半岛海岸尽头附近的灯塔。这座红白相间的灯塔立在伸入海中的防波堤尽头，非常醒目。海水、堤岸和灯塔一起拍很有画面感，但要看清通行安排，不要冒险走到被封闭的区域。", "en": "You can find it at The lighthouse near the end of Shenzhou Peninsula in Dong'ao Town. The red-and-white striped lighthouse stands at the end of a breakwater reaching into the sea. It makes a striking photo with the blue water, but follow access signs and stay away from closed areas.", "specialEn": "The red-and-white striped lighthouse stands at the end of a breakwater reaching into the sea. It makes a striking photo with the blue water, but follow access signs and stay away from closed areas.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市东澳镇神州半岛海岸尽头附近的灯塔", "locationEn": "The lighthouse near the end of Shenzhou Peninsula in Dong'ao Town", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B%E7%81%AF%E5%A1%94", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B%E7%81%AF%E5%A1%94"}, {"id": 83, "cnName": "兴隆热带植物园", "enName": "Xinglong Tropical Botanical Garden", "city": "万宁", "category": "海南环岛", "cn": "万宁市兴隆华侨旅游经济区兴隆热带植物园。这里有很多平时很少见的香料和热带经济植物，咖啡、可可也能看到真实植物。适合对食物来源好奇的人，不是只有走马观花看花草。", "en": "You can find it at Xinglong Tropical Botanical Garden in Wanning's Xinglong Overseas Chinese area. See where coffee, cocoa, spices, and other tropical crops actually come from. It's especially interesting if you enjoy food and want to learn about the plants behind it.", "specialEn": "See where coffee, cocoa, spices, and other tropical crops actually come from. It's especially interesting if you enjoy food and want to learn about the plants behind it.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市兴隆华侨旅游经济区兴隆热带植物园", "locationEn": "Xinglong Tropical Botanical Garden in Wanning's Xinglong Overseas Chinese area", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E7%83%AD%E5%B8%A6%E6%A4%8D%E7%89%A9%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E7%83%AD%E5%B8%A6%E6%A4%8D%E7%89%A9%E5%9B%AD"}, {"id": 84, "cnName": "兴隆咖啡文化街区", "enName": "Xinglong Coffee Area", "city": "万宁", "category": "海南环岛", "cn": "万宁市兴隆华侨旅游经济区的兴隆咖啡街区。兴隆的咖啡文化和归侨历史联系很深，很多人会专程来喝当地咖啡、尝南洋风味点心。这里不是只拍一张咖啡杯，而是能体验海南很有地方特色的咖啡生活。", "en": "You can find it at Coffee spots around Xinglong in Wanning's Overseas Chinese area. Xinglong has a strong coffee tradition shaped by overseas Chinese communities. Come for local coffee and Southeast Asian-influenced snacks, not just another café photo.", "specialEn": "Xinglong has a strong coffee tradition shaped by overseas Chinese communities. Come for local coffee and Southeast Asian-influenced snacks, not just another café photo.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市兴隆华侨旅游经济区的兴隆咖啡街区", "locationEn": "Coffee spots around Xinglong in Wanning's Overseas Chinese area", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E5%92%96%E5%95%A1%E6%96%87%E5%8C%96%E8%A1%97%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E5%92%96%E5%95%A1%E6%96%87%E5%8C%96%E8%A1%97%E5%8C%BA"}, {"id": 85, "cnName": "巴厘村", "enName": "Bali Village", "city": "万宁", "category": "海南环岛", "cn": "万宁市兴隆华侨旅游经济区巴厘村景区。这里有不少东南亚风格建筑和装饰，能看出归侨文化对兴隆的影响。适合想拍异域风情照片、又想知道海南为什么有这么多南洋元素的人。", "en": "You can find it at Bali Village in the Xinglong area of Wanning. The Southeast Asian-style buildings reflect Xinglong's overseas Chinese heritage. It's a photogenic stop and a good way to see how regional cultures mix in Hainan.", "specialEn": "The Southeast Asian-style buildings reflect Xinglong's overseas Chinese heritage. It's a photogenic stop and a good way to see how regional cultures mix in Hainan.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市兴隆华侨旅游经济区巴厘村景区", "locationEn": "Bali Village in the Xinglong area of Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%B7%B4%E5%8E%98%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%B7%B4%E5%8E%98%E6%9D%91"}, {"id": 86, "cnName": "山钦湾燕子洞海岸", "enName": "Shanqin Bay Sea Cave Coast", "city": "万宁", "category": "海南环岛", "cn": "万宁市山钦湾海岸，燕子洞一带。这里最抢眼的是海蚀洞和黑色岩石，海浪拍上来时画面很壮观。它是自然海岸，不是设施完善的沙滩景区，潮汐和浪况危险，建议只在安全位置远观。", "en": "You can find it at The rocky Yanzi Cave coastline at Shanqin Bay, Wanning. The sea cave and dark rocks look dramatic when waves crash in. This is a wild coastline, not a developed beach, so stay well away from dangerous surf and slippery cliffs.", "specialEn": "The sea cave and dark rocks look dramatic when waves crash in. This is a wild coastline, not a developed beach, so stay well away from dangerous surf and slippery cliffs.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市山钦湾海岸，燕子洞一带", "locationEn": "The rocky Yanzi Cave coastline at Shanqin Bay, Wanning", "mapA function handleLiveAsrEvent(event){
  if(!S.session||S.asrState==='off'||!event||typeof event!=='object')return;
  if(event.type==='session'){
    if(event.mock===true)S.asrState='mock';
    else if(event.status==='ready')S.asrState='ready';
    if(event.status==='error')S.asrState='error';
    if(event.status==='ended'){S.asrState='waiting';S.asrInterim='';}
    if(S.tab==='chat')render();
    return;
  }
  if(event.type==='error'){
    S.asrState='error';S.asrInterim=String(event.text||'识别服务出错').slice(0,300);
    if(S.tab==='chat')render();return;
  }
  if(!['interim','final'].includes(event.type))return;
  const text=String(event.text||'').trim().slice(0,700);
  if(!text)return;
  S.asrState=event.mock===true?'mock':'ready';
  if(event.type==='interim' || event.final!==true){
    S.asrInterim=(event.mock===true?'非实时：':'实时：')+text;
    const target=document.querySelector('#asrInterim');
    if(target)target.textContent=S.asrInterim;
    return;
  }
  const key=[event.sessionId,event.track,event.index,event.startMs,event.endMs,text].join(':');
  if(S.asrSeen.has(key))return;
  S.asrSeen.add(key);
  if(S.asrSeen.size>250)S.asrSeen.clear();
  S.asrInterim='';
  // A/B and spk_N are NOT a verified identity mapping. Never label a mixed speaker as "friend".
  const who=event.speaker==='self'?'me':event.speaker==='friend'?'friend':'unknown';
  const source=event.mock===true?'mock':'tencent';
  const msg={who,text,time:new Date().toLocaleTimeString('zh-CN'),source,
    speaker:String(event.speaker||'unknown'),sessionId:String(event.sessionId||'')};
  S.session.messages.push(msg);
  S.recs=automaticCards();
  // 只追加气泡 + 更新建议卡，不整页重绘：字幕刷新时右侧卡片不跳动、输入框不丢焦点。
  if(S.tab==='chat'){appendBubble(msg);showRecs()}
  // Only verified final Tencent subtitles can automatically trigger a paid cloud request.
  // No paid AI calls for mock ASR or interim, and a 2.5s anti-spend throttle.
  if(source==='tencent'&&S.session.cloudConsent&&S.aiState!=='loading'){
    const now=Date.now();
    if(now-S.lastLiveAiAt>=2500){S.lastLiveAiAt=now;requestRealAI();}
  }
  // T2：真实 final 的候选卡由事件驱动出现（服务端已把 pendingId 带进 SSE）。
  if(source==='tencent'){
    S.live.sessionId=msg.sessionId;
    if(LIVE_MODE)refreshLiveFacts();
  }
}

 */

 for(const q of (prep&&prep.personalized||[]).slice(0,2))list.push({en:q.en,zh:q.zh,tag:'专属'});
 if(prep&&prep.generic)list.push({en:prep.generic.en,zh:prep.generic.zh,tag:'通用'});
 return list;
}

window.addEventListener('pagehide',()=>{

function connectLiveASR(){
  if(!S.session)return tip(t('msg.needStart'));
  if(!HTTP_UI||!window.EventSource){
    // 降级信息由聊天页顶部的常驻提示承担，不再用浮层遮挡内容。
    return;
  }
  if(S.asrStream)return;
  S.asrWanted=true;S.asrState='connecting';render();
  let source;
  try{
    source=new window.EventSource('/api/asr/live');
  }catch(error){
    S.asrState='error';S.asrInterim='无法连接实时字幕。';render();
    scheduleAsrReconnect();
    return;
  }
  S.asrStream=source;
  source.addEventListener('ready',()=>{
    if(S.asrStream!==source)return;
    S.asrRetry=0;S.asrState='ready';if(S.tab==='chat')render();
  });
  source.addEventListener('asr',e=>{
    if(S.asrStream!==source)return;
    try{handleLiveAsrEvent(JSON.parse(e.data));}catch{}
  });
  source.onerror=()=>{
    if(S.asrStream!==source)return;
    source.close();S.asrStream=null;S.asrState='error';
    S.asrInterim='实时字幕连接中断；正在自动重连（录音页保持打开即可）。';
    if(S.tab==='chat')render();
    scheduleAsrReconnect();
  };
}
function scheduleAsrReconnect(){
  if(!S.asrWanted||S.asrRetryTimer)return;
  S.asrRetry=(S.asrRetry||0)+1;
  if(S.asrRetry>10){S.asrInterim='实时字幕多次重连失败；检查 Mac mini 服务后点「连接实时字幕」。';render();return;}
  const delay=Math.min(8000,500*Math.pow(2,S.asrRetry-1));
  S.asrRetryTimer=setTimeout(()=>{
    S.asrRetryTimer=null;
    if(S.asrWanted&&!S.asrStream)connectLiveASR();
  },delay);
}
function autoStartLiveSession(){
  if(!LIVE_MODE||S.session)return;
  // 页面重载后 ?live=1 仍然在，但原生可能已经停止：不能在没开麦时假装“字幕已接入”。
  const b=(typeof window!=='undefined')?window.SocialMateAndroid:null;
  if(b&&typeof b.isRecording==='function'){
    let on=false;try{on=!!b.isRecording()}catch{}
    if(!on){S.asrState='off';setTab('chat');return}
  }
  S.session={id:String(Date.now()),messages:[],date:new Date().toLocaleString('zh-CN'),
    cloudConsent:false,provider:'deepseek',model:'deepseek-flash',liveMode:true};
  S.ai=null;S.aiState='demo';S.aiError='';S.asrSeen=new Set();S.lastLiveAiAt=0;
  setTab('chat');
  connectLiveASR();
}
function requestRealAI(){
 const session=S.session,seq=++S.aiSeq;
 if(!session||!session.messages.length)return;
 if(!session.cloudConsent){S.aiState='demo';return;}
 if(!HTTP_UI||!window.fetch){
   S.aiState='blocked';S.aiError='当前页面未连接建议服务，先用本地建议继续。';showRecs();return;
 }
 S.aiState='loading';S.aiError='';if(S.tab==='chat')showRecs();
 window.fetch('/api/ai/analyze',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({consent:true,provider:session.provider,model:session.model,includePersonal:false,
     messages:session.messages.slice(-6).map(m=>({speaker:m.who==='me'?'self':m.who==='friend'?'friend':'unknown',text:m.text}))})
 }).then(async resp=>{
   const answer=await resp.json();
   if(!resp.ok)throw Error(answer.error||answer.code||'模型服务不可用');
   return answer;
 }).then(answer=>{
   if(seq!==S.aiSeq||S.session!==session)return;
   if(answer.mode!=='real-ai'||!answer.reply)throw Error('未返回真实 AI 结果');
   S.ai=answer;S.aiState='ready';S.aiError='';
   S.recs=(answer.references||[]).map(ref=>{
     const kind=ref.kind,id=String(ref.id);
     const x=kind==='place'?D.places.find(p=>String(p.id)===id):
       kind==='app'?D.apps.find(a=>a.id===id):SAV.stories.find(a=>a.id===id);
     return x?{kind,id,title:kind==='place'?x.cnName:kind==='app'?x.name:x.title,en:x.en}:null;
   }).filter(Boolean);
   if(S.tab==='chat')render();
 }).catch(err=>{
   if(seq!==S.aiSeq||S.session!==session)return;
   S.ai=null;S.aiState='error';S.aiError=String(err.message||'模型连接失败').slice(0,180);if(S.tab==='chat')render();
 });
}
/* T3-EVAL:SUGG-START —— 四方向合并/去重；qa/t3-quality/eval-suggestions.mjs 按标记抽取 */
function suggestionsNow(){
 const real=S.aiState==='ready'&&S.ai?S.ai:null;
 const base=coachPlan()||{};
 const name=(real&&real.topic)||base.name||'继续交流';
 const clean=(x)=>String(x||'').trim();
 const norm=(x)=>clean(x).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,' ').trim();
 // 跨方向共用 seen：同一话题内四个方向不出现完全相同的句子。
 const seen=new Set();
 const uniq=(arr)=>{const out=[];for(const it of arr){if(!it)continue;const en=clean(it.en);if(!en)continue;const k=norm(en);if(!k||seen.has(k))continue;seen.add(k);out.push({en,zh:clean(it.zh)})}return out};
 const respondItems=uniq([
  {en:real?real.reply:'',zh:''},
  {en:base.respond,zh:base.respondZh},
  {en:base.respondAlt,zh:base.respondAltZh},
  {en:'That sounds interesting. Tell me a little more.',zh:'听起来很有意思，能再多说一点吗？'}
 ]);
 const askItems=uniq([
  ...((real&&Array.isArray(real.questions))?real.questions.map(en=>({en,zh:''})):[]),
  ...((base.ask||[]).map((en,i)=>({en,zh:(base.askZh||[])[i]||''})))
 ]);
 const shareItems=uniq([
  {en:real?real.share:'',zh:''},
  {en:base.share,zh:base.shareZh},
  base.shareAlt||{},
  {en:'I can share a local tip if that would help.',zh:'如果这有帮助，我可以分享一个本地小建议。'}
 ]);
 const switchItems=uniq([
  ...((base.switches||[]).map(x=>x)),
  {en:'By the way, what are your plans for the rest of the day?',zh:'对了，你今天剩下的时间有什么安排？'}
 ]);
 return {name,ai:!!real,groups:[
  {key:'respond',label:'自然接话',hint:'先接住对方',items:respondItems.slice(0,3)},
  {key:'ask',label:'继续追问',hint:'把话接下去',items:askItems.slice(0,3)},
  {key:'share',label:'分享自己',hint:'拉近距离',items:shareItems.slice(0,3)},
  {key:'switch',label:'转换话题',hint:'自然换题',items:switchItems.slice(0,3)},
 ]};
}

function planNow(){

  ask:(s.groups.find(g=>g.key==='ask')?.items||[]).map(x=>x.en),

}

function vsGroups(sugg){
 const order=[['respond','接话'],['ask','追问'],['switch','换题'],['share','分享']];
 const quota={respond:2,ask:2,switch:3,share:3};
 const out=[];
 for(const [key,label] of order){
  const g=(sugg.groups||[]).find(x=>x.key===key);
  const items=((g&&g.items)||[]).slice(0,quota[key]);
  if(items.length)out.push({key,label,items});
 }
 return out;
}

 }
