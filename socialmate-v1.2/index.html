闹。", "en": "You can find it at Longxing Road in Longhua District, close to Baiyuan Yaju. This café is part of what made Longxing Road trendy. People gather at the small outdoor tables, so it's a fun stop for coffee and people-watching between photos.", "specialEn": "This café is part of what made Longxing Road trendy. People gather at the small outdoor tables, so it's a fun stop for coffee and people-watching between photos.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区龙兴路，柏园雅居附近", "locationEn": "Longxing Road in Longhua District, close to Baiyuan Yaju", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Matata%20Coffee%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Matata%20Coffee%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 24, "cnName": "斑马院子（龙兴路）", "enName": "Zebra Courtyard (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路的斑马院子店铺。它是龙兴路较早受欢迎的小店之一，烘焙和有设计感的店面很受拍照的人喜欢。适合和龙兴路一起逛，不需要把它当成单独的半天景点。", "en": "You can find it at Zebra Courtyard on Longxing Road, Longhua District. One of the street's earlier popular shops, known for baked treats and a photogenic storefront. Drop in while exploring Longxing Road rather than making a separate trip.", "specialEn": "One of the street's earlier popular shops, known for baked treats and a photogenic storefront. Drop in while exploring Longxing Road rather than making a separate trip.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区龙兴路的斑马院子店铺", "locationEn": "Zebra Courtyard on Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%91%E9%A9%AC%E9%99%A2%E5%AD%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%91%E9%A9%AC%E9%99%A2%E5%AD%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 25, "cnName": "席地而坐（龙兴路）", "enName": "Sitting & Drinking (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路5号附近。这家店白天偏咖啡，晚上又有餐酒吧的社交感觉，是龙兴路从午后逛街切换到夜生活的代表。想拍街头生活照，也可以留意它的门口和周边小巷。", "en": "It is around No. 5 Longxing Road, Longhua District. A café-meets-bar that shows Longxing Road's daytime-to-evening personality. It's a nice stop for a drink and some lively street photos, especially later in the day.", "specialEn": "A café-meets-bar that shows Longxing Road's daytime-to-evening personality. It's a nice stop for a drink and some lively street photos, especially later in the day.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "示意", "locationCn": "海口市龙华区龙兴路5号附近", "locationEn": "Around No. 5 Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%B8%AD%E5%9C%B0%E8%80%8C%E5%9D%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%B8%AD%E5%9C%B0%E8%80%8C%E5%9D%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 26, "cnName": "手帐咖啡好天气（龙兴路）", "enName": "Good Weather Journal Café (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路上的手帐主题小店。和普通咖啡店不一样，这里更吸引喜欢手帐、文具和手作的人。可以看看小物件、拍些细节照片，适合喜欢文艺小店的朋友。", "en": "You can find it at A stationery-themed café along Longxing Road, Longhua District. This is a fun little stop if you like notebooks, stationery, and handmade details. It's more about browsing creative objects than checking off another coffee shop.", "specialEn": "This is a fun little stop if you like notebooks, stationery, and handmade details. It's more about browsing creative objects than checking off another coffee shop.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "示意", "locationCn": "海口市龙华区龙兴路上的手帐主题小店", "locationEn": "A stationery-themed café along Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%89%8B%E5%B8%90%E5%92%96%E5%95%A1%E5%A5%BD%E5%A4%A9%E6%B0%94%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%89%8B%E5%B8%90%E5%92%96%E5%95%A1%E5%A5%BD%E5%A4%A9%E6%B0%94%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 27, "cnName": "Hippo Gelato（龙兴路）", "enName": "Hippo Gelato (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路一带的冰淇淋小店。逛龙兴路逛累了，可以顺路来吃一份意式冰淇淋。它是街拍路线上的小休息站，不必特地为一家冰淇淋店跑很远。", "en": "You can find it at A gelato shop in the Longxing Road area of Longhua District. A simple treat while walking around Longxing Road. Grab some gelato, take a break, and carry on exploring the cafés and pretty shopfronts.", "specialEn": "A simple treat while walking around Longxing Road. Grab some gelato, take a break, and carry on exploring the cafés and pretty shopfronts.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区龙兴路一带的冰淇淋小店", "locationEn": "A gelato shop in the Longxing Road area of Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Hippo%20Gelato%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Hippo%20Gelato%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 28, "cnName": "金盘夜市", "enName": "Jinpan Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市龙华区金盘路8号。这座夜市更有附近居民出来吃宵夜的感觉，摊位多，价格和选择比较接地气。晚上来试试烤串、海南小吃，比去商场吃饭更能感受本地生活。", "en": "It is at No. 8 Jinpan Road, Longhua District, Haikou. This night market feels like where nearby residents go for supper. Expect barbecue, local snacks, and a lively, everyday atmosphere rather than a polished tourist show.", "specialEn": "This night market feels like where nearby residents go for supper. Expect barbecue, local snacks, and a lively, everyday atmosphere rather than a polished tourist show.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区金盘路8号", "locationEn": "No. 8 Jinpan Road, Longhua District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E7%9B%98%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E7%9B%98%E5%A4%9C%E5%B8%82"}, {"id": 29, "cnName": "寻尝里夜市", "enName": "Xunchangli Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市秀英区美俗路35号。这里是一片集中的夜市小吃区，适合几个人一起点不同的东西分着吃。比起只找一家餐厅，边走边选更有乐趣，尤其适合不知道要吃什么的时候。", "en": "It is at No. 35 Meisu Road, Xiuying District, Haikou. This is an easy place to sample different foods in one evening. Go with friends, pick a few stalls, share dishes, and see what you discover.", "specialEn": "This is an easy place to sample different foods in one evening. Go with friends, pick a few stalls, share dishes, and see what you discover.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区美俗路35号", "locationEn": "No. 35 Meisu Road, Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%AF%BB%E5%B0%9D%E9%87%8C%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%AF%BB%E5%B0%9D%E9%87%8C%E5%A4%9C%E5%B8%82"}, {"id": 30, "cnName": "福地夜巷", "enName": "Fudi Night Lane", "city": "海口", "category": "美食夜生活", "cn": "海口市琼山区忠介路86号，府城老城区内。这里把传统老城区和热闹夜市结合起来，逛完府城老街可以直接接着吃宵夜。附近有不少海南本地小吃，是晚上体验府城生活的方便一站。", "en": "It is at No. 86 Zhongjie Road in Qiongshan District, within old Fucheng. This night market is right in old Fucheng, so you can explore the older streets and then stay for snacks. It's a convenient way to experience the neighborhood after dark.", "specialEn": "This night market is right in old Fucheng, so you can explore the older streets and then stay for snacks. It's a convenient way to experience the neighborhood after dark.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市琼山区忠介路86号，府城老城区内", "locationEn": "No. 86 Zhongjie Road in Qiongshan District, within old Fucheng", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%A6%8F%E5%9C%B0%E5%A4%9C%E5%B7%B7", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%A6%8F%E5%9C%B0%E5%A4%9C%E5%B7%B7"}, {"id": 31, "cnName": "桂林洋大学城夜市", "enName": "Guilinyang University Town Night Market", "city": "海口", "category": "美食夜生活", "cn": "海口市美兰区桂林洋大学城一带。这里以学生为主，夜市的感觉比较年轻，常见各种实惠小吃和饮料。适合想看看海南大学城夜生活、顺便找点便宜好吃东西的人。", "en": "You can find it at The Guilinyang university district in Meilan District, Haikou. The crowd here is mostly students, and the food is casual and affordable. Visit for the lively university-night-market vibe and an easy late snack.", "specialEn": "The crowd here is mostly students, and the food is casual and affordable. Visit for the lively university-night-market vibe and an easy late snack.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区桂林洋大学城一带", "locationEn": "The Guilinyang university district in Meilan District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E5%A4%A7%E5%AD%A6%E5%9F%8E%E5%A4%9C%E5%B8%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E5%A4%A7%E5%AD%A6%E5%9F%8E%E5%A4%9C%E5%B8%82"}, {"id": 32, "cnName": "丁村万人海鲜广场", "enName": "Dingcun Seafood Square", "city": "海口", "category": "美食夜生活", "cn": "海口市琼山区丁村一带的万人海鲜广场。和普通餐厅不同，这里可以先挑海鲜，再按自己的口味让店家加工。适合几个朋友一起点鱼、虾、蟹，体验海南人热热闹闹吃海鲜的方式。", "en": "Yo ather than chase a famous landmark.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区滨海大道38号，海口湾边", "locationEn": "No. 38 Binhai Avenue, Longhua District, right by Haikou Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%87%E7%BB%BF%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%87%E7%BB%BF%E5%9B%AD"}, {"id": 40, "cnName": "世纪公园", "enName": "Century Park", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区世纪公园，靠近世纪大桥南端。这里最有代表性的画面就是高高的世纪大桥和海口湾放在一起。傍晚能看桥上的车灯、海面和城市建筑，特别适合拍海口夜景。", "en": "You can find it at Century Park in Longhua District, near the south end of Century Bridge. The best view combines Century Bridge, the bay, and Haikou's skyline. Come at dusk when the bridge lights and city reflections begin to appear.", "specialEn": "The best view combines Century Bridge, the bay, and Haikou's skyline. Come at dusk when the bridge lights and city reflections begin to appear.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华区世纪公园，靠近世纪大桥南端", "locationEn": "Century Park in Longhua District, near the south end of Century Bridge", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%96%E7%BA%AA%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%96%E7%BA%AA%E5%85%AC%E5%9B%AD"}, {"id": 41, "cnName": "海口湾滨海步道", "enName": "Haikou Bay Waterfront Walk", "city": "海口", "category": "海滨日落", "cn": "海口市龙华区海口湾沿岸，世纪公园至云洞图书馆一带。这条路线适合边走边看现代海口，不需要门票，也不必专门安排项目。海风、桥梁、海边建筑和落日都能拍到，晚上散步也很舒服。", "en": "It is along Haikou Bay in Longhua District, around Century Park and Cloud Cave Library. This waterfront walk gives you bridges, modern buildings, and sea views in one easy route. It's free, relaxed, and especially pleasant toward sunset.", "specialEn": "This waterfront walk zes, and sunsets. Come mainly to relax by the water; swimming conditions are not the same as at every resort beach.", "specialEn": "A classic city beach for coconut trees, sea breezes, and sunsets. Come mainly to relax by the water; swimming conditions are not the same as at every resort beach.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区滨海大道西段的假日海滩", "locationEn": "Holiday Beach on western Binhai Avenue, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%81%87%E6%97%A5%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%81%87%E6%97%A5%E6%B5%B7%E6%BB%A9"}, {"id": 44, "cnName": "观海台", "enName": "Guanhaitai Seaside Viewpoint", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区西海岸滨海大道沿线的观海台。这是西海岸比较容易停下来欣赏海景的地方，海面开阔，适合看夕阳。可以和假日海滩、西秀海滩安排在同一趟路线上，不必单独开车来回折腾。", "en": "You can find it at Guanhaitai on the western coastal stretch of Binhai Avenue. A simple open-water viewpoint on Haikou's west coast, best around sunset. Combine it with nearby beaches instead of making a separate long trip.", "specialEn": "A simple open-water viewpoint on Haikou's west coast, best around sunset. Combine it with nearby beaches instead of making a separate long trip.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区西海岸滨海大道沿线的观海台", "locationEn": "Guanhaitai on the western coastal stretch of Binhai Avenue", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%B5%B7%E5%8F%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A7%82%E6%B5%B7%E5%8F%B0"}, {"id": 45, "cnName": "白沙门公园", "enName": "Baishamen Park", "city": "海口", "category": "海滨日落", "cn": "海口市美兰区海甸六东路一带的白沙门公园。这里更像海口人的海边生活公园，草地、树荫和休闲步道都有。适合早晚散步或带朋友轻松运动，不是那种需要排队拍照的大景区。", "en": "You can find it at Baishamen Park near Haidian Sixth East Road, Meilan District. A local seaside park with lawns, shade, and walking paths. It's best for a relaxed stroll or light exercise rather than a big sightseeing itinerary.", "specialEn": "A local seaside park with lawns, shade, and walking paths. It's best for a relaxed stroll or light exercise rather than a big sightseeing itinerary.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区海甸六东路一带的白沙门公园", "locationEn": "Baishamen Park near Haidian Sixth East Road, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%99%BD%E6%B2%99%E9%97%A8%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%99%BD%E6%B2%99%E9%97%A8%E5%85%AC%E5%9B%AD"}, {"id": 46, "cnName": "拾贝公园", "enName": "Shibei Park", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区西海岸沿线的拾贝公园。这片滨海公园的特点是空间开阔、路好走，适合吹风和拍海边散步的生活照。若本来就在西海岸，可以顺路停一停。", "en": "You can find it at Shibei Park on the west coast of Xiuying District. This is an open coastal park for an easy walk and breezy photos. It's worth a stop if you're already exploring Haikou's western shoreline.", "specialEn": "This is an open coastal park for an easy walk and breezy photos. It's worth a stop if you're already exploring Haikou's western shoreline.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区西海岸沿线的拾贝公园", "locationEn": "Shibei Park on the west coast of Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%8B%BE%E8%B4%9D%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%8B%BE%E8%B4%9D%E5%85%AC%E5%9B%AD"}, {"id": 47, "cnName": "金沙湾滨海公园", "enName": "Jinsha Bay Coastal Park", "city": "海口", "category": "海滨日落", "cn": "海口市秀英区金沙湾海岸一带。海面和沙滩比较开阔，天气好时适合野餐、拍日落和放空。这里的看点不是密集娱乐项目，而是能找块空地舒服地坐一会儿。", "en": "You can find it at The Jinshawan coast in Xiuying District, Haikou. The broad coastline is best for a picnic, an open sunset view, or simply sitting by the sea. It's about space and quiet rather than lots of attractions.", "specialEn": "The broad coastline is best for a picnic, an open sunset view, or simply sitting by the sea. It's about space and quiet rather than lots of attractions.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区金沙湾海岸一带", "locationEn": "The Jinshawan coast in Xiuying District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E6%B2%99%E6%B9%BE%E6%BB%A8%E6%B5%B7%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%87%91%E6%B2%99%E6%B9%BE%E6%BB%A8%E6%B5%B7%E5%85%AC%E5%9B%AD"}, {"id": 48, "cnName": "桂林洋海滨", "enName": "Guilinyang Coast", "city": "海口", "category": "海滨日落", "cn": "海口市美兰区桂林洋海岸一带。这里离市中心有一段距离，海岸感觉相对自然，游客聚集程度低一些。适合喜欢安静海景和海岸摄影的人，但去之前要了解交通、天气和海浪情况。", "en": "You can find it at The Guilinyang coast in Meilan District. This stretch feels more natural and less crowded than the central bay. Go for quiet coastal scenery, but check access, weather, and sea conditions first.", "specialEn": "This stretch feels more natural and less crowded than the central bay. Go for quiet coastal scenery, but check access, weather, and sea conditions first.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区桂林洋海岸一带", "locationEn": "The Guilinyang coast in Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E6%B5%B7%E6%BB%A8", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%A1%82%E6%9E%97%E6%B4%8B%E6%B5%B7%E6%BB%A8"}, {"id": 49, "cnName": "东寨港红树林", "enName": "Dongzhai Harbor Mangroves", "city": "海口", "category": "自然体验", "cn": "海口市美兰区演丰镇红林路，东寨港湿地一带。这里不是普通森林，而是树根长在潮水里的红树林湿地。跟着正规观景路线看树根、滩涂和鸟类，很容易发现海南不只有椰树和沙滩。", "en": "You can find it at Honglin Road in Yanfeng Town, Meilan District, by Dongzhai Harbor. These trees grow in tidal water, creating a very different kind of forest. Follow the proper viewing route to see their roots, mudflats, and birds.", "specialEn": "These trees grow in tidal water, creating a very different kind of forest. Follow the proper viewing route to see their roots, mudflats, and birds.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区演丰镇红林路，东寨港湿地一带", "locationEn": "Honglin Road in Yanfeng Town, Meilan District, by Dongzhai Harbor", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%AF%A8%E6%B8%AF%E7%BA%A2%E6%A0%91%E6%9E%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%AF%A8%E6%B8%AF%E7%BA%A2%E6%A0%91%E6%9E%97"}, {"id": 50, "cnName": "三卿村", "enName": "Sanqing Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇，火山口地质公园附近。三卿村的石屋、石墙和小路很多都是用火山石砌成的，走进去有一种被黑色石头包围的感觉。很适合和火山口公园安排在同一天，看完自然地貌再看火山村落。", "en": "You can find it at Shishan Town, Xiuying District, close to the volcano park. Many houses, lanes, and walls here are built from volcanic stone. Pair it with the volcano park to see how the same rock shaped both the land and village life.", "specialEn": "Many houses, lanes, and walls here are built from volcanic stone. Pair it with the volcano park to see how the same rock shaped both the land and village life.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区石山镇，火山口地质公园附近", "locationEn": "Shishan Town, Xiuying District, close to the volcano park", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%89%E5%8D%BF%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%B8%89%E5%8D%BF%E6%9D%91"}, {"id": 51, "cnName": "美社村", "enName": "Meishe Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇美社村。这里最值得看的是火山岩石屋和海南乡村的老巷子，不是大型商业景点。适合慢慢走，看看当地人怎么在火山石环境里生活。", "en": "You can find it at Meishe Village in Shishan Town, Xiuying District. This village is known for traditional volcanic-stone buildings and old lanes. It's a quiet place to see how people have lived in Haikou's volcanic countryside.", "specialEn": "This village is known for traditional volcanic-stone buildings and old lanes. It's a quiet place to see how people have lived in Haikou's volcanic countryside.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区石山镇美社村", "locationEn": "Meishe Village in Shishan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%BE%8E%E7%A4%BE%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E7%BE%8E%E7%A4%BE%E6%9D%91"}, {"id": 52, "cnName": "施茶村", "enName": "Shicha Village", "city": "海口", "category": "自然体验", "cn": "海口市秀英区石山镇施茶村。这里把火山石地貌和农业结合起来，石斛种植是比较有代表性的特色。喜欢乡村体验的人可以了解当地农场怎么利用火山岩环境种植物。", "en": "You can find it at Shicha Village in Shishan Town, Xiuying District. Shicha is interesting for its volcanic-stone farming, especially the way locals grow dendrobium orchids. It's more of a countryside experience than a typical tourist attraction.", "specialEn": "Shicha is interesting for its volcanic-stone farming, especially the way locals grow dendrobium orchids. It's more of a countryside experience than a typical tourist attraction.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区石山镇施茶村", "locationEn": "Shicha Village in Shishan Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%BD%E8%8C%B6%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%BD%E8%8C%B6%E6%9D%91"}, {"id": 53, "cnName": "荔枝花海·火山营地", "enName": "Lychee Blossom Volcanic Camp", "city": "海口", "category": "自然体验", "cn": "海口市秀英区永兴镇荔枝花海火山营地。荔枝季这里的看点不只是露营，还可以体验荔枝林和当地火山荔枝。采摘有季节限制，最好在活动开放时来，不要以为一年四季都能摘果子。", "en": "You can find it at Lychee Flower Sea Volcano Camp in Yongxing Town, Xiuying District. During lychee season, the orchards are the main attraction, and picking activities may be available. Camping and events vary by date, so check the season before coming.", "specialEn": "During lychee season, the orchards are the main attraction, and picking activities may be available. Camping and events vary by date, so check the season before coming.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市秀英区永兴镇荔枝花海火山营地", "locationEn": "Lychee Flower Sea Volcano Camp in Yongxing Town, Xiuying District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%8D%94%E6%9E%9D%E8%8A%B1%E6%B5%B7%C2%B7%E7%81%AB%E5%B1%B1%E8%90%A5%E5%9C%B0", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%8D%94%E6%9E%9D%E8%8A%B1%E6%B5%B7%C2%B7%E7%81%AB%E5%B1%B1%E8%90%A5%E5%9C%B0"}, {"id": 54, "cnName": "自由大陆营地", "enName": "Free Continent Camp", "city": "海口", "category": "自然体验", "cn": "海口市龙华区城西镇沙坡郊野湿地公园附近。它是湿地旁的休闲露营地，有草地、营地餐食和窑烤面包之类的特色体验。比较适合几个人提前约好来聚会，具体开放和活动要临时确认。", "en": "It is near Shapo Wetland Park in Chengxi Town, Longhua District. This campsite sits by a wetland and has offered outdoor meals, gatherings, and oven-baked bread. It's better for a planned group outing; confirm the current schedule first.", "specialEn": "This campsite sits by a wetland and has offered outdoor meals, gatherings, and oven-baked bread. It's better for a planned group outing; confirm the current schedule first.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市龙华 /uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8D%97%E7%83%AD%E5%B8%A6%E9%87%8E%E7%94%9F%E5%8A%A8%E6%A4%8D%E7%89%A9%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8D%97%E7%83%AD%E5%B8%A6%E9%87%8E%E7%94%9F%E5%8A%A8%E6%A4%8D%E7%89%A9%E5%9B%AD"}, {"id": 60, "cnName": "海口湾游船（东坡老码头出发）", "enName": "Haikou Bay Cruise (Dongpo Wharf)", "city": "海口", "category": "自然体验", "cn": "海口市美兰区碧海大道东坡老码头游船码头。这不是站在岸上看海，而是坐船从水上看世纪大桥、海口湾和城市灯光。夜游比较有氛围，但班次可能因天气调整，要先看当日船票和出航通知。", "en": "You can find it at The cruise pier at Dongpo Old Wharf on Bihai Avenue, Meilan District. See Haikou from the water instead of the shore. The evening cruise gives you views of Century Bridge and the skyline, but departures depend on tickets and weather.", "specialEn": "See Haikou from the water instead of the shore. The evening cruise gives you views of Century Bridge and the skyline, but departures depend on tickets and weather.", "photos": [1, 2, 3], "cityFolder": "Haikou", "photoNote": "", "locationCn": "海口市美兰区碧海大道东坡老码头游船码头", "locationEn": "The cruise pier at Dongpo Old Wharf on Bihai Avenue, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%B8%B8%E8%88%B9%EF%BC%88%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4%E5%87%BA%E5%8F%91%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%B8%B8%E8%88%B9%EF%BC%88%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4%E5%87%BA%E5%8F%91%EF%BC%89"}, {"id": 61, "cnName": "铜鼓岭", "enName": "Tongguling Scenic Area", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭景区，靠近月亮湾。这里最大的卖点是登高后能同时看到绿色山坡、弯弯的月亮湾和蓝色大海。天气晴朗时层次特别漂亮，比站在普通海滩上看海更震撼。", "en": "You can find it at Tongguling in Longlou Town, Wenchang, above Moon Bay. The view is the star: green hills, the curved Moon Bay, and blue sea all in one panorama. On a clear day, it's much more dramatic than a regular beach view.", "specialEn": "The view is the star: green hills, the curved Moon Bay, and blue sea all in one panorama. On a clear day, it's much more dramatic than a regular beach view.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇铜鼓岭景区，靠近月亮湾", "locationEn": "Tongguling in Longlou Town, Wenchang, above Moon Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%9C%E9%BC%93%E5%B2%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E9%93%9C%E9%BC%93%E5%B2%AD"}, {"id": 62, "cnName": "石头公园", "enName": "Stone Park", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇铜鼓岭附近的石头公园海岸。这里不是平整沙滩，而是一大片被海浪冲刷过的巨石，石头形状和浪花都很特别。适合拍气势比较强的海岸照片，但岩石湿滑，不要靠近危险浪区。", "en": "You can find it at Stone Park on the coast near Tongguling, Longlou Town, Wenchang. Huge weathered rocks and crashing waves make this coastline look dramatic. It's wonderful for landscape photos, but the rocks can be slippery and the surf dangerous.", "specialEn": "Huge weathered rocks and crashing waves make this coastline look dramatic. It's wonderful for landscape photos, but the rocks can be slippery and the surf dangerous.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇铜鼓岭附近的石头公园海岸", "locationEn": "Stone Park on the coast near Tongguling, Longlou Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%9F%B3%E5%A4%B4%E5%85%AC%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E7%9F%B3%E5%A4%B4%E5%85%AC%E5%9B%AD"}, {"id": 63, "cnName": "东郊椰林", "enName": "Dongjiao Coconut Grove", "city": "文昌", "category": "海南环岛", "cn": "文昌市东郊镇东郊椰林海岸。这里椰子树特别密，很多地方一抬头就是椰叶，走几步又能看到大海。想让外国朋友感受最典型的海南热带海岛画面，来这里很合适。", "en": "You can find it at Dongjiao Coconut Grove in Dongjiao Town, Wenchang. Tall coconut palms grow densely beside the sea here. If you want that classic tropical-island feeling—palm leaves overhead and the coast just steps away—this is the place.", "specialEn": "Tall coconut palms grow densely beside the sea here. If you want that classic tropical-island feeling—palm leaves overhead and the coast just steps away—this is the place.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市东郊镇东郊椰林海岸", "locationEn": "Dongjiao Coconut Grove in Dongjiao Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%9C%E9%83%8A%E6%A4%B0%E6%9E%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E4%B8%9C%E9%83%8A%E6%A4%B0%E6%9E%97"}, {"id": 64, "cnName": "木兰湾风车海岸", "enName": "Mulan Bay Windmill Coast", "city": "文昌", "category": "海南环岛", "cn": "文昌市铺前镇木兰湾海岸和木兰灯塔附近。这一带很适合自驾，海边能看到风车、灯塔和长长的海岸线。不是那种店铺很多的热闹景区，重点是沿途风景和看海，天气好时很有电影感。", "en": "You can find it at Mulan Bay near Mulan Lighthouse in Puqian Town, Wenchang. The drive is part of the fun, with wind turbines, a lighthouse, and a wide coastal landscape. It's more about the scenery than shops or activities.", "specialEn": "The drive is part of the fun, with wind turbines, a lighthouse, and a wide coastal landscape. It's more about the scenery than shops or activities.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市铺前镇木兰湾海岸和木兰灯塔附近", "locationEn": "Mulan Bay near Mulan Lighthouse in Puqian Town, Wenchang", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%A8%E5%85%B0%E6%B9%BE%E9%A3%8E%E8%BD%A6%E6%B5%B7%E5%B2%B8", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%9C%A8%E5%85%B0%E6%B9%BE%E9%A3%8E%E8%BD%A6%E6%B5%B7%E5%B2%B8"}, {"id": 65, "cnName": "淇水湾海滩", "enName": "Qishui Bay Beach", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇淇水湾，文昌航天发射场附近。这片海滩除了海景漂亮，还有一个很特别的理由：遇到合适的发射任务，有些观景位置能远远看到火箭升空。平时可以看海，想看发射必须提前查官方通告。", "en": "You can find it at Qishui Bay in Longlou Town, near the Wenchang Space Launch Site. This beach has a special claim to fame: during some launches, you may be able to watch a rocket rise in the distance. On normal days it's a scenic beach; always check official launch notices.", "specialEn": "This beach has a special claim to fame: during some launches, you may be able to watch a rocket rise in the distance. On normal days it's a scenic beach; always check official launch notices.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇淇水湾，文昌航天发射场附近", "locationEn": "Qishui Bay in Longlou Town, near the Wenchang Space Launch Site", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%B7%87%E6%B0%B4%E6%B9%BE%E6%B5%B7%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%96%87%E6%98%8C%E6%B7%87%E6%B0%B4%E6%B9%BE%E6%B5%B7%E6%BB%A9"}, {"id": 66, "cnName": "文昌航天发射场相关参观体验", "enName": "Wenchang Space Launch Visitor Experience", "city": "文昌", "category": "海南环岛", "cn": "文昌市龙楼镇文昌航天发射场周边指定参观区域。这里最吸引人的不是普通展馆，而是能近距离了解中国航天发射基地的真实环境。参观范围受管理规定限制，不能想进哪里就进哪里，最好按正规渠道预约。", "en": "You can find it at Designated visitor areas near the Wenchang Space Launch Site in Longlou Town. This is one of China's major rocket-launch locations, so space fans will love learning about the real launch facilities. Access is controlled, and visits must follow approved arrangements.", "specialEn": "This is one of China's major rocket-launch locations, so space fans will love learning about the real launch facilities. Access is controlled, and visits must follow approved arrangements.", "photos": [1, 2, 3], "cityFolder": "Wenchang", "photoNote": "", "locationCn": "文昌市龙楼镇文昌航天发射场周边指定参观区域", "locationEn": "Designated visitor areas near the Wenchang Space Launc : "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%8E%89%E5%B8%A6%E6%BB%A9", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%8E%89%E5%B8%A6%E6%BB%A9"}, {"id": 74, "cnName": "沙美村", "enName": "Shamei Village", "city": "琼海", "category": "海南环岛", "cn": "琼海市博鳌镇沙美村，靠近沙美内海。这里的画面很柔和：小村庄、湖面、湿地和远处的山连在一起。适合慢慢走、看看田园和水鸟，和热闹的海滩度假完全是两种感觉。", "en": "You can find it at Shamei Village in Bo'ao Town, beside Shamei Lagoon. Shamei is about peaceful countryside scenery—village lanes, wetlands, water, and distant hills. It's a slower and quieter break from crowded beaches.", "specialEn": "Shamei is about peaceful countryside scenery—village lanes, wetlands, water, and distant hills. It's a slower and quieter break from crowded beaches.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市博鳌镇沙美村，靠近沙美内海", "locationEn": "Shamei Village in Bo'ao Town, beside Shamei Lagoon", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%B2%99%E7%BE%8E%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E6%B2%99%E7%BE%8E%E6%9D%91"}, {"id": 75, "cnName": "世界热带水果之窗", "enName": "World Tropical Fruit Window", "city": "琼海", "category": "海南环岛", "cn": "琼海市大路镇世界热带水果之窗景区。这里最有意思的是能认识来自不同地方、平时在超市不常见的热带水果。适合喜欢新鲜水果的人，看看果树长什么样，比只在水果店买水果更有趣。", "en": "You can find it at Window to the World of Tropical Fruits in Dalu Town, Qionghai. See tropical fruit growing on trees instead of only on supermarket shelves. It's fun for anyone curious about unusual fruit varieties and where they come from.", "specialEn": "See tropical fruit growing on trees instead of only on supermarket shelves. It's fun for anyone curious about unusual fruit varieties and where they come from.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市大路镇世界热带水果之窗景区", "locationEn": "Window to the World of Tropical Fruits in Dalu Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E4%B8%96%E7%95%8C%E7%83%AD%E5%B8%A6%E6%B0%B4%E6%9E%9C%E4%B9%8B%E7%AA%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E4%B8%96%E7%95%8C%E7%83%AD%E5%B8%A6%E6%B0%B4%E6%9E%9C%E4%B9%8B%E7%AA%97"}, {"id": 76, "cnName": "白石岭", "enName": "Baishiling Mountain", "city": "琼海", "category": "海南环岛", "cn": "琼海市嘉积镇附近白石岭景区。想从平地换个视角看琼海，可以来这座山。登高以后能看到城市、田野和周围山景，适合喜欢爬山又不想跑太远的人。", "en": "You can find it at Baishiling Scenic Area near Jiaji Town, Qionghai. Climb above the surrounding fields and town for a different view of Qionghai. It's a good option if you want some elevation without traveling far inland.", "specialEn": "Climb above the surrounding fields and town for a different view of Qionghai. It's a good option if you want some elevation without traveling far inland.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市嘉积镇附近白石岭景区", "locationEn": "Baishiling Scenic Area near Jiaji Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%99%BD%E7%9F%B3%E5%B2%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E7%99%BD%E7%9F%B3%E5%B2%AD"}, {"id": 77, "cnName": "北仍村", "enName": "Beireng Village", "city": "琼海", "category": "海南环岛", "cn": "琼海市嘉积镇北仍村乡村旅游区。这里把乡村绿植、小路和咖啡休闲空间结合起来，感觉比较清静。适合喜欢慢生活、想在海南乡下坐一会儿的人，不是追求刺激项目的景点。", "en": "You can find it at Beireng Village near Jiaji Town, Qionghai. This green rural village is more about slow walks and quiet breaks than big attractions. It's nice for seeing the countryside at an easy pace.", "specialEn": "This green rural village is more about slow walks and quiet breaks than big attractions. It's nice for seeing the countryside at an easy pace.", "photos": [1, 2, 3], "cityFolder": "Qionghai", "photoNote": "", "locationCn": "琼海市嘉积镇北仍村乡村旅游区", "locationEn": "Beireng Village near Jiaji Town, Qionghai", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8C%97%E4%BB%8D%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E7%90%BC%E6%B5%B7%E5%8C%97%E4%BB%8D%E6%9D%91"}, {"id": 78, "cnName": "日月湾", "enName": "Riyue Bay", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇日月湾，海南东线海岸。这里是海南非常有名的冲浪海湾，浪板、冲浪店和海边咖啡馆随处可见，年轻人特别多。就算不会冲浪，也可以找正规教练上体验课，或者坐着看高手追浪。", "en": "You can find it at Riyue Bay in Liji Town, Wanning, on Hainan's east coast. One of Hainan's best-known surf spots, with boards, surf schools, and beach cafés everywhere. Try a beginner lesson with a qualified instructor, or simply watch the surfers.", "specialEn": "One of Hainan's best-known surf spots, with boards, surf schools, and beach cafés everywhere. Try a beginner lesson with a qualified instructor, or simply watch the surfers.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市礼纪镇日月湾，海南东线海岸", "locationEn": "Riyue Bay in Liji Town, Wanning, on Hainan's east coast", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE"}, {"id": 79, "cnName": "日月湾礼堂", "enName": "Riyue Bay Chapel", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇日月湾海边的日月湾礼堂。这栋海边建筑因为简洁的造型和海景背景很受情侣、摄影博主欢迎。真正吸引人的是建筑线条和海浪同框，适合在冲浪之外顺便拍一组漂亮的照片。", "en": "You can find it at The seaside chapel-like building at Riyue Bay in Liji Town, Wanning. This simple seaside building is popular for couple and influencer photos. Its clean lines against the waves make a lovely shot while you're visiting the surf bay.", "specialEn": "This simple seaside building is popular for couple and influencer photos. Its clean lines against the waves make a lovely shot while you're visiting the surf bay.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市礼纪镇日月湾海边的日月湾礼堂", "locationEn": "The seaside chapel-like building at Riyue Bay in Liji Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE%E7%A4%BC%E5%A0%82", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E6%97%A5%E6%9C%88%E6%B9%BE%E7%A4%BC%E5%A0%82"}, {"id": 80, "cnName": "石梅湾", "enName": "Shimei Bay", "city": "万宁", "category": "海南环岛", "cn": "万宁市礼纪镇石梅湾海岸。这里和热闹的日月湾不同，海滩、椰林和度假酒店带来更安静的度假感觉。适合找个地方住一晚、早晨走沙滩，而不只是来拍照五分钟就走。", "en": "You can find it at Shimei Bay in Liji Town, Wanning. Quieter than the surf scene at Riyue Bay, Shimei Bay is about palm-lined beaches and relaxed resorts. It's a place to stay, slow down, and walk on the sand in the morning.", "specialEn": "Quieter than the surf scene at Riyue Bay, Shimei Bay is about palm-lined beaches and relaxed resorts. It's a place to stay, slow down, and walk on the sand in the morning.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市礼纪镇石梅湾海岸", "locationEn": "Shimei Bay in Liji Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%9F%B3%E6%A2%85%E6%B9%BE", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%9F%B3%E6%A2%85%E6%B9%BE"}, {"id": 81, "cnName": "神州半岛", "enName": "Shenzhou Peninsula", "city": "万宁", "category": "海南环岛", "cn": "万宁市东澳镇神州半岛海岸。半岛两侧都有海景，路边常能看到漂亮的海湾和度假建筑。适合自驾、住海边酒店，顺便把灯塔放进当天的拍照路线。", "en": "You can find it at Shenzhou Peninsula in Dong'ao Town, Wanning. This peninsula gives you coastal views from different angles, with beaches and resorts along the way. Combine a scenic drive with a visit to its lighthouse.", "specialEn": "This peninsula gives you coastal views from different angles, with beaches and resorts along the way. Combine a scenic drive with a visit to its lighthouse.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市东澳镇神州半岛海岸", "locationEn": "Shenzhou Peninsula in Dong'ao Town, Wanning", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B"}, {"id": 82, "cnName": "神州半岛灯塔", "enName": "Shenzhou Peninsula Lighthouse", "city": "万宁", "category": "海南环岛", "cn": "万宁市东澳镇神州半岛海岸尽头附近的灯塔。这座红白相间的灯塔立在伸入海中的防波堤尽头，非常醒目。海水、堤岸和灯塔一起拍很有画面感，但要看清通行安排，不要冒险走到被封闭的区域。", "en": "You can find it at The lighthouse near the end of Shenzhou Peninsula in Dong'ao Town. The red-and-white striped lighthouse stands at the end of a breakwater reaching into the sea. It makes a striking photo with the blue water, but follow access signs and stay away from closed areas.", "specialEn": "The red-and-white striped lighthouse stands at the end of a breakwater reaching into the sea. It makes a striking photo with the blue water, but follow access signs and stay away from closed areas.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市东澳镇神州半岛海岸尽头附近的灯塔", "locationEn": "The lighthouse near the end of Shenzhou Peninsula in Dong'ao Town", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B%E7%81%AF%E5%A1%94", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E7%A5%9E%E5%B7%9E%E5%8D%8A%E5%B2%9B%E7%81%AF%E5%A1%94"}, {"id": 83, "cnName": "兴隆热带植物园", "enName": "Xinglong Tropical Botanical Garden", "city": "万宁", "category": "海南环岛", "cn": "万宁市兴隆华侨旅游经济区兴隆热带植物园。这里有很多平时很少见的香料和热带经济植物，咖啡、可可也能看到真实植物。适合对食物来源好奇的人，不是只有走马观花看花草。", "en": "You can find it at Xinglong Tropical Botanical Garden in Wanning's Xinglong Overseas Chinese area. See where coffee, cocoa, spices, and other tropical crops actually come from. It's especially interesting if you enjoy food and want to learn about the plants behind it.", "specialEn": "See where coffee, cocoa, spices, and other tropical crops actually come from. It's especially interesting if you enjoy food and want to learn about the plants behind it.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市兴隆华侨旅游经济区兴隆热带植物园", "locationEn": "Xinglong Tropical Botanical Garden in Wanning's Xinglong Overseas Chinese area", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E7%83%AD%E5%B8%A6%E6%A4%8D%E7%89%A9%E5%9B%AD", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E7%83%AD%E5%B8%A6%E6%A4%8D%E7%89%A9%E5%9B%AD"}, {"id": 84, "cnName": "兴隆咖啡文化街区", "enName": "Xinglong Coffee Area", "city": "万宁", "category": "海南环岛", "cn": "万宁市兴隆华侨旅游经济区的兴隆咖啡街区。兴隆的咖啡文化和归侨历史联系很深，很多人会专程来喝当地咖啡、尝南洋风味点心。这里不是只拍一张咖啡杯，而是能体验海南很有地方特色的咖啡生活。", "en": "You can find it at Coffee spots around Xinglong in Wanning's Overseas Chinese area. Xinglong has a strong coffee tradition shaped by overseas Chinese communities. Come for local coffee and Southeast Asian-influenced snacks, not just another café photo.", "specialEn": "Xinglong has a strong coffee tradition shaped by overseas Chinese communities. Come for local coffee and Southeast Asian-influenced snacks, not just another café photo.", "photos": [1, 2, 3], "cityFolder": "Wanning", "photoNote": "", "locationCn": "万宁市兴隆华侨旅游经济区的兴隆咖啡街区", "locationEn": "Coffee spots around Xinglong in Wanning's Overseas Chinese area", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E4%B8%87%E5%AE%81%E5%85%B4%E9%9A%86%E5%92%96%E5%95%A1%E6%96%87%E5%8C%96%E8%A1%97%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E function chatEnPick(id){

function chatEnRun(){
 const msgs=(S.session&&S.session.messages)||[];

 if(!zhMsgs.length)return tip('先说一句中文');
 const picked=chatEnMsgById(S.v152.enTarget);
 let target=null;
 if(picked&&SM_ZH_RE.test(String(picked.text||'')))target=picked;
 else{
  const last=zhMsgs[zhMsgs.length-1];
  const map=(S.session&&S.session.speakerMap)||{};
  const mine=last.who==='me'||last.speaker==='self'
   ||(!!last.speaker&&(map[last.speaker]?map[last.speaker]===t('chat.mine'):speakerLabel(last.speaker)===t('chat.mine')));
  if(!mine)return tip('先点一下你要译的那句中文');

 }

 if(target.enDraftState==='loading'||String(target.enDraft||'').trim())return;
 target.enDraftState='loading';target.enDraftError='';
 vsRefreshMessages();
 const backfill=fn=>{const m=chatEnMsgById(id);if(m)fn(m);vsRefreshMessages()};
 fetch('/api/ai/draft-en',{method:'POST',cache:'no-store',
  headers:{'Content-Type':'application/json','x-archive-token':uiToken()},
  body:JSON.stringify({consent:true,text})})
  .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(d.error||d.code||('HTTP '+r.status)),{code:d.code});return d})
  .then(d=>{
   const en=String((d&&d.en)||'').trim();
   if(!en)throw Error('英文译文为空');
   backfill(m=>{m.enDraft=en;m.enDraftState='ready';m.enDraftError=''});

 });

 if(S.session)S.session.speakerMap=S.session.speakerMap||{};

function handleLiveAsrEvent(event){
  if(!S.session||S.asrState==='off'||!event||typeof event!=='object')return;
  if(event.type==='session'){
    if(event.mock===true)S.asrState='mock';
    else if(event.status==='ready')S.asrState='ready';
    if(event.status==='error')S.asrState='error';
    if(event.status==='ended'){S.asrState='waiting';S.asrInterim='';}
    if(S.tab==='chat')render();
    return;
  }
  if(event.type==='error'){
    S.asrState='error';S.asrInterim=String(event.text||'识别服务出错').slice(0,300);
    if(S.tab==='chat')render();return;
  }
  if(!['interim','final'].includes(event.type))return;
  // 已暂停：原生确认暂停后不再接收新字幕，避免暂停期间写入新句子。
  if(S.v152.paused)return;
  const text=String(event.text||'').trim().slice(0,700);
  if(!text)return;
  S.asrState=event.mock===true?'mock':'ready';
  if(event.type==='interim' || event.final!==true){
    S.asrInterim=(event.mock===true?'非实时：':'实时：')+text;
    const target=document.querySelector('#asrInterim');
    if(target)target.textContent=S.asrInterim;
    return;
  }
  const key=[event.sessionId,event.track,event.index,event.startMs,event.endMs,text].join(':');
  if(S.asrSeen.has(key))return;
  S.asrSeen.add(key);
  if(S.asrSeen.size>250)S.asrSeen.clear();
  S.asrInterim='';
  // A/B and spk_N are NOT a verified identity mapping. Never label a mixed speaker as "friend".
  const who=event.speaker==='self'?'me':event.speaker==='friend'?'friend':'unknown';
  const source=event.mock===true?'mock':'tencent';
  const msg={who,text,time:new Date().toLocaleTimeString('zh-CN'),source,
    speaker:String(event.speaker||'unknown'),sessionId:String(event.sessionId||'')};
  S.session.messages.push(msg);
  S.recs=automaticCards();
  // 只追加气泡 + 更新建议卡，不整页重绘：字幕刷新时右侧卡片不跳动、输入框不丢焦点。
  if(S.tab==='chat'){appendBubble(msg);showRecs()}
  // Only verified final Tencent subtitles can automatically trigger a paid cloud request.
  // No paid AI calls for mock ASR or interim, and a 2.5s anti-spend throttle.
  if(source==='tencent'&&S.aiState!=='loading'){
    const now=Date.now();
    if(now-S.lastLiveAiAt>=2500){S.lastLiveAiAt=now;requestRealAI();}
  }
  // T2：真实 final 的候选卡由事件驱动出现（服务端已把 pendingId 带进 SSE）。
  if(source==='tencent'){
    S.live.sessionId=msg.sessionId;
    if(LIVE_MODE)refreshLiveFacts();
  }
}

function connectLiveASR(){
  if(!S.session)return tip(t('msg.needStart'));
  if(!HTTP_UI||!window.EventSource){
    // 降级信息由聊天页顶部的常驻提示承担，不再用浮层遮挡内容。
    return;
  }
  if(S.asrStream)return;
  S.asrWanted=true;S.asrState='connecting';render();
  let source;
  try{
    source=new window.EventSource('/api/asr/live');
  }catch(error){
    S.asrState='error';S.asrInterim='无法连接实时字幕。';render();
    scheduleAsrReconnect();
    return;
  }
  S.asrStream=source;
  source.addEventListener('ready',()=>{
    if(S.asrStream!==source)return;
    S.asrRetry=0;S.asrState='ready';if(S.tab==='chat')render();
  });
  source.addEventListener('asr',e=>{
    if(S.asrStream!==source)return;
    try{handleLiveAsrEvent(JSON.parse(e.data));}catch{}
  });
  source.onerror=()=>{
    if(S.asrStream!==source)return;
    source.close();S.asrStream=null;S.asrState='error';
    S.asrInterim='实时字幕连接中断；正在自动重连（录音页保持打开即可）。';
    if(S.tab==='chat')render();
    scheduleAsrReconnect();
  };
}
function scheduleAsrReconnect(){
  if(!S.asrWanted||S.asrRetryTimer)return;
  S.asrRetry=(S.asrRetry||0)+1;
  if(S.asrRetry>10){S.asrInterim='实时字幕多次重连失败；检查 Mac mini 服务后点「连接实时字幕」。';render();return;}
  const delay=Math.min(8000,500*Math.pow(2,S.asrRetry-1));
  S.asrRetryTimer=setTimeout(()=>{
    S.asrRetryTimer=null;
    if(S.asrWanted&&!S.asrStream)connectLiveASR();
  },delay);
}

function requestRealAI(){
 const session=S.session,seq=++S.aiSeq;
 if(!session||!session.messages.length)return;
 if(!HTTP_UI||!window.fetch){
   S.aiState='blocked';S.aiError='当前页面未连接建议服务，先用本地建议继续。';showRecs();return;
 }
 S.aiState='loading';S.aiError='';if(S.tab==='chat')showRecs();
 window.fetch('/api/ai/analyze',{
   method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','x-archive-token':uiToken()},
   body:JSON.stringify({consent:true,provider:session.provider,model:session.model,includePersonal:false,
     messages:session.messages.slice(-6).map(m=>({speaker:m.who==='me'?'self':m.who==='friend'?'friend':'unknown',text:m.text}))})
 }).then(async resp=>{
   const answer=await resp.json();
   if(!resp.ok)throw Error(answer.error||answer.code||'模型服务不可用');
   return answer;
 }).then(answer=>{

function aiReplyParts(ai){

function suggestionsNow(){

 // 跨方向共用 seen：同一话题内四个方向不出现完全相同的句子。
 const seen=new Set();
 const uniq=(arr)=>{const out=[];for(const it of arr){if(!it)continue;const en=clean(it.en);if(!en)continue;const k=norm(en);if(!k||seen.has(k))continue;seen.add(k);out.push({en,zh:clean(it.zh)})}return out};

 return {name,ai:!!real,groups:[
  {key:'respond',label:'自然接话',hint:'先接住对方',items:respondItems.slice(0,3)},
  {key:'ask',label:'继续追问',hint:'把话接下去',items:askItems.slice(0,3)},

async function apiCall(path,opt){
 const o=opt||{};
 if(!window.fetch)throw new Error('此浏览器不支持联网读取');
 const headers=Object.assign({'Accept':'application/json'},o.headers||{});
 const token=o.token!==undefined?o.token:uiToken();

 let data=null;try{data=await res.json()}catch{}

function queuePeopleSummaries(){
 const P=S.people;if(!HTTP_UI||P.mode!=='online')return;
 P.summaries=P.summaries||{};P.summaryBusy=P.summaryBusy||{};
 const todo=(P.list||[]).filter(p=>!P.summaries[p.slug]&&!P.summaryBusy[p.slug]).slice(0,12);
 if(!todo.length)return;
 todo.forEach(p=>P.summaryBusy[p.slug]=true);
 (async()=>{
  for(let i=0;i<todo.length;i+=3){
   await Promise.all(todo.slice(i,i+3).map(async p=>{
    try{
     const d=await apiCall('/v12/api/people/'+encodeURIComponent(p.slug));
     const person=(d&&d.person)||{};
     const facts=Array.isArray(person.confirmed)?person.confirmed:[];
     const latest=facts.length?facts[facts.length-1]:null;
     const text=latest?String(latest.text||''):'';
     const date=person.lastContact?fmtWhen(person.lastContact):'';
     P.summaries[p.slug]=text?tf(date?'people.memo':'people.memoNoDate',{date,text}):t('people.memoNone');
    }catch{P.summaries[p.slug]=t('people.memoNone')}
    delete P.summaryBusy[p.slug];
   }));
   paintPeopleSummaries();
  }
 })();
}

let smAudioEl=null;
let smAudioCtx=null;
let smAudioSource=null;
let smAudioPaused=false;
function smStopAudio(){
 if(smAudioSource){try{smAudioSource.stop()}catch{};smAudioSource=null;}
 smAudioPaused=false;
}
function smPauseAudio(){
 if(!smAudioCtx||!smAudioSource)return false;
 if(smAudioCtx.state==='running'){try{smAudioCtx.suspend()}catch{}smAudioPaused=true;return true;}
 return false;
}
function smResumeAudio(){
 if(!smAudioCtx||!smAudioPaused)return false;
 try{smAudioCtx.resume()}catch{}
 smAudioPaused=false;
 return true;
}
function smEnsureAudioCtx(){
 try{
  if(!smAudioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;smAudioCtx=new C();}
  if(smAudioCtx.state==='suspended'){smAudioCtx.resume().catch(()=>{});}
  return smAudioCtx;
 }catch{return null}
}
async function smPlayBuffer(buf){
 smStopAudio();
 const ctx=smEnsureAudioCtx();
 if(!ctx)throw Error('no audiocontext');
 if(ctx.state==='suspended'){try{await ctx.resume()}catch{}}
 const audioBuf=await ctx.decodeAudioData(buf.slice(0));
 return new Promise((resolve,reject)=>{
  let settled=false;
  const finish=(err)=>{
   if(settled)return;
   settled=true;
   clearTimeout(timer);
   if(err)reject(err);else resolve();
  };
  const source=ctx.createBufferSource();
  source.buffer=audioBuf;
  source.connect(ctx.destination);
  smAudioSource=source;
  source.onended=()=>{ if(smAudioSource===source)smAudioSource=null; finish(); };
  let timer=null;
  try{source.start(0);}catch(e){return finish(e);}
  timer=setTimeout(()=>finish(Error('audio play timeout')),Math.max(8000,(Number(audioBuf.duration)||5)*1000+3000));
 });
}
function smSplitSpeech(value){
 const parts=[];let rest=String(value||'');
 while(rest.length>1800){
  let cut=-1;
  for(const mark of ['。','！','？','\n','. ','! ','? ']){const i=rest.lastIndexOf(mark,1800);if(i>cut)cut=i+(mark.length>1?1:1)}
  if(cut<200)cut=1800;
  parts.push(rest.slice(0,cut));rest=rest.slice(cut);
 }
 if(rest.trim())parts.push(rest);
 return parts;
}

function termPickedWord(el,e){

 try{selection=window.getSelection&&window.getSelection()}catch{}
 const highlighted=selection&&selection.toString?selection.toString().trim():'';
 if(highlighted&&selection&&selection.anchorNode&&el.contains(selection.anchorNode))return termClean(highlighted);

  if(document.caretRangeFromPoint)range=document.caretRangeFromPoint(e.clientX,e.clientY);
  else if(document.caretPositionFromPoint){const pos=document.caretPositionFromPoint(e.clientX,e.clientY);if(pos){range=document.createRange();range.setStart(pos.offsetNode,pos.offset);range.collapse(true)}}
 }catch{}
 if(range&&el.contains(range.startContainer)&&range.startContainer.nodeType===3){
  const txt=range.startContainer.textContent||'';let pos=Math.min(txt.length,range.startOffset);
  const letter=c=>/[a-zA-Z\u00c0-\u017f'-]/.test(c||'');
  if(!letter(txt[pos])&&pos>0&&letter(txt[pos-1]))pos--;
  let l=pos,r=pos;while(l>0&&letter(txt[l-1]))l--;while(r<txt.length&&letter(txt[r]))r++;

/* 写操作需要一次性写授权票（T1-4）：同源 + 自定义头 + 短期票据。
   读接口不需要令牌，保证手机首次打开就有三位演示人物。 */
let smWriteTicket={value:'',exp:0};
function smTicket(){
 if(smWriteTicket.value&&Date.now()<smWriteTicket.exp-5000)return Promise.resolve(smWriteTicket.value);
 return fetch('/v12/api/demo/write-ticket',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  if(!d||!d.ticket)throw new Error('写授权票获取失败');
  smWriteTicket={value:d.ticket,exp:Date.parse(d.expiresAt)||Date.now()+60000};
  return d.ticket;
 });
}
async function demoApi(path,opt){
 const o=opt||{};
 const method=(o.method||'GET').toUpperCase();
 const headers={'Accept':'application/json'};
 if(o.body)headers['Content-Type']='application/json';
 if(o.token)headers['x-archive-token']=o.token;
 if(method!=='GET'){
  try{
   headers['x-sm-write']=await smTicket();
   // 写授权票是一次性的（T1-4）：发出后立刻作废本地缓存，下一次写重新取票。
   // 否则第二次写会复用已消费的票，界面提示「需要写授权票」，用户必须点两次才成功。
   smWriteTicket={value:'',exp:0};
  }catch(e){throw Object.assign(e,{code:'WRITE_TICKET_UNAVAILABLE'})}
 }
 const res=await fetch(path,{method,headers,cache:'no-store',body:o.body});
 let d=null;try{d=await res.json()}catch{}
 if(!res.ok){
  // 票过期/重放：清掉缓存，下一次点击重新取票（不隐藏错误，只允许一次自动重试由用户触发）。
  if(d&&/^WRITE_TICKET_/.test(String(d.code||'')))smWriteTicket={value:'',exp:0};
  const err=new Error(apiMsg(d,'HTTP '+res.status));err.status=res.status;err.code=d&&d.code;err.retryAfterMs=d&&d.retryAfterMs;throw err
 }
 return d||{};
}

/* 仅在原生 App 内合并私有地点；公开 PWA / 浏览器预览保持 115 条原样。 */
async function loadPrivatePlacesIntoDataset(){

 for(let i=0;i<20;i++){
  if(uiToken())break;
  await new Promise(r=>setTimeout(r,500));
 }
 if(!uiToken())return;
 try{
  /* 服务重启或令牌注入晚到时，一次性失败会让私有地点永久消失（实测踩到两次）；
     这里重试 3 次，并保留手动重试入口，避免用户以为记录丢了。 */
  let d=null;
  for(let attempt=0;attempt<3;attempt++){
   try{ d=await demoApi('/v12/api/private-places',{token:uiToken()}); if(d&&Array.isArray(d.places))break; }
   catch(err){ d=null; }
   await new Promise(r=>setTimeout(r,800*(attempt+1)));
  }
  const list=Array.isArray(d&&d.places)?d.places:[];
  if(!list.length){ smApplyPrivateCache(); return; }
  smMergePrivatePlaces(list);
  smPrivateCacheWrite(list);
  PRIVATE_PLACES_LOADED=true;
  try{ window.__smPrivateState={ok:true,count:list.length,at:Date.now()}; }catch{}
  if(S.tab==='hainan'){S.cat='全部';render();}
 }catch(e){ try{ window.__smPrivateState={ok:false,error:String(e&&e.message||e),at:Date.now()}; }catch{} }
}

/* —— 档案写操作：令牌 + 同源 + 服务端限流 —— */
function pfWrite(path,body){
 const token=uiToken();
 if(!token)return Promise.reject(Object.assign(new Error(dp('needToken')),{code:'TOKEN_REQUIRED'}));
 return demoApi(path,{method:'POST',token,body:JSON.stringify(Object.assign({confirm:true},body||{}))});
}
function pfFail(err){
 if(err&&err.code==='TOKEN_REQUIRED')tip(dp('needToken'));
 else tip('操作失败：'+apiMsg(null,err&&err.message||''));
}
function pfApply(d,msg){
 if(d&&d.person){S.demo.detail=d.person}
 const ui=pfUi();ui.editId=null;ui.delId=null;ui.bulkConfirm=false;ui.addGroup=null;
 renderDemoPerson();
 S.demo.state='idle';demoEnsure(true);
 if(msg)tip(msg);
}
function pfSetLang(lang){const ui=pfUi();ui.lang=lang==='en'?'en':'zh';ui.editId=null;ui.delId=null;ui.addGroup=null;renderDemoPerson()}
function pfStartEdit(id,lang){const ui=pfUi();ui.editId=id;ui.editLang=lang==='en'?'en':'zh';ui.delId=null;renderDemoPerson();setTimeout(()=>{const el=document.getElementById('pfEditInput');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch{}}},30)}
function pfSaveEdit(id){
 const input=document.getElementById('pfEditInput');if(!input)return;
 const ui=pfUi();
 pfWrite('/v12/api/demo/people/'+encodeURIComponent(S.demo.detail.slug)+'/facts/'+encodeURIComponent(id)+'/edit',
  {text:input.value,lang:ui.editLang}).then(d=>pfApply(d,dp('saved'))).catch(pfFail);
}
function pfAskDelete(id){const ui=pfUi();ui.delId=id;ui.editId=null;renderDemoPerson()}
function pfConfirmDelete(id){
 pfWrite('/v12/api/demo/people/'+encodeURIComponent(S.demo.detail.slug)+'/facts/'+encodeURIComponent(id)+'/delete',{})
  .then(d=>pfApply(d,dp('deleted'))).catch(pfFail);
}
function pfEnterBulk(group){const ui=pfUi();ui.bulkGroup=group;ui.bulkConfirm=false;ui.editId=null;ui.delId=null;ui.addGroup=null;ui.sel={};renderDemoPerson()}
function pfExitBulk(){const ui=pfUi();ui.bulkGroup=null;ui.bulkConfirm=false;ui.sel={};renderDemoPerson()}
function pfTogglePick(id){const ui=pfUi();ui.sel[id]=!ui.sel[id];ui.bulkConfirm=false;renderDemoPerson()}
function pfSelectAll(group){
 const ui=pfUi();const model=pfModel(S.demo.detail);
 const list=model.facts.filter(f=>f.group===group);
 const all=list.length&&list.every(f=>ui.sel[f.id]);
 for(const f of list)ui.sel[f.id]=!all;
 ui.bulkConfirm=false;renderDemoPerson();
}
function pfPicked(group){
 const ui=pfUi();const model=pfModel(S.demo.detail);
 return model.facts.filter(f=>f.group===group&&ui.sel[f.id]).map(f=>f.id);
}
function pfBulkDelete(){
 const ui=pfUi();const ids=pfPicked(ui.bulkGroup);
 if(!ids.length)return tip(dp('pickFirst'));
 if(!ui.bulkConfirm){ui.bulkConfirm=true;renderDemoPerson();return}
 pfWrite('/v12/api/demo/people/'+encodeURIComponent(S.demo.detail.slug)+'/facts/bulk-delete',{factIds:ids})
  .then(d=>{ui.sel={};pfApply(d,dp('bulkDeleted',{n:d.removedCount||ids.length}))}).catch(pfFail);
}
function pfMoveGroup(){
 const ui=pfUi();const ids=pfPicked(ui.bulkGroup);
 if(!ids.length)return tip(dp('pickFirst'));
 const sel=document.getElementById('pfMoveSelect');
 const group=sel?String(sel.value||''):'';
 pfWrite('/v12/api/demo/people/'+encodeURIComponent(S.demo.detail.slug)+'/facts/bulk-group',{factIds:ids,group})
  .then(d=>{ui.sel={};pfApply(d,dp('moved',{n:d.movedCount||ids.length}))}).catch(pfFail);
}
function pfStartAdd(group){const ui=pfUi();ui.addGroup=group;ui.editId=null;ui.delId=null;ui.bulkGroup=null;renderDemoPerson();setTimeout(()=>{const el=document.getElementById('pfAddInput');if(el)el.focus()},30)}
function pfSaveAdd(group){
 const input=document.getElementById('pfAddInput');if(!input)return;
 pfWrite('/v12/api/demo/people/'+encodeURIComponent(S.demo.detail.slug)+'/facts',{text:input.value,group})
  .then(d=>pfApply(d,dp('saved'))).catch(pfFail);
}
function pfUndo(id){
 pfWrite('/v12/api/demo/people/'+encodeURIComponent(S.demo.detail.slug)+'/changelog/'+encodeURIComponent(id)+'/undo',{})
  .then(d=>pfApply(d,dp('undoneTip'))).catch(pfFail);
}

/* 回放一条合成 final：只进待确认队列，不写档案。 */
function demoReplay(slug){
 const btn=document.querySelector('[data-dfinal="'+slug+'"]');
 if(btn)btn.disabled=true;
 demoApi('/v12/api/demo/final',{method:'POST',body:JSON.stringify({confirm:true,slug})}).then(d=>{
  if(btn)btn.disabled=false;
  if(d.added&&d.person){S.demo.detail=d.person;S.demo.flash='新到 1 条合成 final，已放进待确认（未写入主档）。';renderDemoPerson();S.demo.state='idle';demoEnsure(true);tip('已加入待确认（未写入档案）')}
  else tip(d.reason==='NO_REPLAY_LEFT'?'这位人物的演示 final 已全部回放，可先确认或忽略现有待确认':'这条演示 final 已在待确认列表里');
 }).catch(err=>{if(btn)btn.disabled=false;tip('回放失败：'+apiMsg(null,err.message))});
}
/* 确认/忽略一条待确认：同屏刷新事实与专属问题，不需要重载页面。 */
function demoPendingAct(slug,id,action){
 demoApi('/v12/api/demo/people/'+encodeURIComponent(slug)+'/pending/'+encodeURIComponent(id)+'/'+action,
  {method:'POST',body:JSON.stringify({confirm:true})}).then(d=>{
   if(d.person){S.demo.detail=d.person;S.demo.flash=action==='confirm'?'已确认并写入演示档案；专属问题已按新事实重算。':'已忽略这条候选，档案没有变化。';renderDemoPerson()}
   S.demo.state='idle';demoEnsure(true);
   tip(action==='confirm'?'已写入演示档案，专属问题已更新':'已忽略，未写入档案');
  }).catch(err=>tip((action==='confirm'?'确认失败：':'忽略失败：')+apiMsg(null,err.message)));
}
/* 未归属 final：用户选好人物后才允许写入。 */
function demoInboxAct(id,action,slug){
 const path=slug
   ?'/v12/api/demo/people/'+encodeURIComponent(slug)+'/pending/'+encodeURIComponent(id)+'/'+action
   :'/v12/api/demo/pending/'+encodeURIComponent(id)+'/'+action;
 demoApi(path,{method:'POST',body:JSON.stringify({confirm:true,slug})}).then(()=>{
  S.demo.state='idle';demoEnsure(true);
  tip(action==='confirm'?'已按你选择的归属写入演示档案':'已忽略该候选，未写入档案');
 }).catch(err=>tip((action==='confirm'?'确认失败：':'忽略失败：')+apiMsg(null,err.message)));
}
function smDemoClick(e){
 const t=e&&e.target;if(!t||typeof t.closest!=='function')return false;
 let pf;
 if((pf=t.closest('[data-pf-lang]'))){pfSetLang(pf.dataset.pfLang);return true}
 if((pf=t.closest('[data-pf-edit]'))){pfStartEdit(pf.dataset.pfEdit,pfLang());return true}
 if((pf=t.closest('[data-pf-del]'))){pfAskDelete(pf.dataset.pfDel);return true}
 if((pf=t.closest('[data-pf-saveedit]'))){pfSaveEdit(pf.dataset.pfSaveedit);return true}
 if(t.closest('[data-pf-canceledit]')){const ui=pfUi();ui.editId=null;renderDemoPerson();return true}
 if((pf=t.closest('[data-pf-confirmdel]'))){pfConfirmDelete(pf.dataset.pfConfirmdel);return true}
 if(t.closest('[data-pf-canceldel]')){const ui=pfUi();ui.delId=null;renderDemoPerson();return true}
 if((pf=t.closest('[data-pf-bulk]'))){const g=pf.dataset.pfBulk;const ui=pfUi();if(ui.bulkGroup===g)pfExitBulk();else pfEnterBulk(g);return true}
 if((pf=t.closest('[data-pf-selectall]'))){pfSelectAll(pf.dataset.pfSelectall);return true}
 if((pf=t.closest('[data-pf-pick]'))){pfTogglePick(pf.dataset.pfPick);return true}
 if((pf=t.closest('[data-pf-bulkdel]'))){pfBulkDelete();return true}
 if((pf=t.closest('[data-pf-bulkdeletego]'))){pfBulkDelete();return true}
 if(t.closest('[data-pf-bulkcancel]')){const ui=pfUi();ui.bulkConfirm=false;renderDemoPerson();return true}
 if(t.closest('[data-pf-move]')){pfMoveGroup();return true}
 if((pf=t.closest('[data-pf-add]'))){pfStartAdd(pf.dataset.pfAdd);return true}
 if((pf=t.closest('[data-pf-addsave]'))){pfSaveAdd(pf.dataset.pfAddsave);return true}
 if(t.closest('[data-pf-addcancel]')){const ui=pfUi();ui.addGroup=null;renderDemoPerson();return true}
 if((pf=t.closest('[data-pf-undo]'))){pfUndo(pf.dataset.pfUndo);return true}
 const act=t.closest('[data-demo-act]');
 if(act){const k=act.dataset.demoAct;if(k==='archive'){demoArchivePush();return true}demoAsk(k==='clear'?'clear':'restore');return true}
 const go=t.closest('[data-demo-go]');
 if(go){closeModal();demoManage(go.dataset.demoGo==='clear'?'clear':'restore');return true}
 const person=t.closest('[data-dperson]');
 if(person){openDemoPerson(person.dataset.dperson);return true}
 const dpend=t.closest('[data-dpend]');
 if(dpend){demoPendingAct(dpend.dataset.dslug,dpend.dataset.dpid,dpend.dataset.dpend==='ignore'?'ignore':'confirm');return true}
 const dfinal=t.closest('[data-dfinal]');
 if(dfinal){demoReplay(dfinal.dataset.dfinal);return true}
 const dinbox=t.closest('[data-dinbox]');
 if(dinbox){
  const idx=String(dinbox.dataset.dinboxidx||'0');
  const sel=document.getElementById('demoattr'+idx);
  demoInboxAct(dinbox.dataset.dinbox,'confirm',sel?String(sel.value||''):'');
  return true;
 }
 const dinboxignore=t.closest('[data-dinboxignore]');
 if(dinboxignore){demoInboxAct(dinboxignore.dataset.dinboxignore,'ignore','');return true}
 return false;
}

d with lamps, family gatherings, and sweets. Practice varies widely by region and community; do not assume everyone celebrates.","questions":[{"cn":"你家乡有类似的灯光节日吗？","en":"Is there a festival of lights where you are from?"},{"cn":"节日里你更喜欢在家还是出门？","en":"During festivals, do you prefer staying home or going out?"}],"holidayType":"festival_day","sourceUrls":["https://www.officeholidays.com/countries/india/2026","https://www.officeholidays.com/countries/india/2027"],"sourceNote":"Office Holidays 印度多数地区排灯节为 2026-11-08、2027-10-29；新加坡官方 Deepavali 2027 为 10-28，属地区观月差异。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"holi","cn":"洒红节","en":"Holi","region":"印度","theme":"文化","dateRule":"Phalguna 月满月次日","y2026":"2026-03-04","y2027":"2027-03-22","status":"fixed","briefCn":"印度的洒红节在春天，人们互相泼洒彩粉和水，象征色彩与新生。日期按印度历计算，各地不同，也有人不参加。","briefEn":"Holi is a spring festival in India where people throw coloured powder and water, celebrating colour and renewal. The date follows the Hindu calendar and varies by region; some people do not take part.","questions":[{"cn":"你参加过泼彩粉的节日吗？","en":"Have you joined a festival where people throw coloured powder?"},{"cn":"节日里你更喜欢热闹还是安静？","en":"At festivals, do you prefer lively crowds or a quiet time?"}],"holidayType":"festival_day","sourceUrls":["https://www.officeholidays.com/countries/india/2026","https://www.officeholidays.com/countries/india/2027"],"sourceNote":"Office Holidays 印度多数地区洒红节主日为 2026-03-04、2027-03-22；部分地区日期相差一天（2026 年有地区为 03-03、2027 年有地区为 03-23）。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"republic-day","cn":"共和国日","en":"Republic Day","region":"印度","theme":"国家","dateRule":"固定公历 1 月 26 日","y2026":"2026-01-26","y2027":"2027-01-26","status":"fixed","briefCn":"印度共和国日在 1 月 26 日，是国定假日。首都举行阅兵与游行，学校也有活动；各地庆祝规模不一样。","briefEn":"Republic Day in India is on 26 January and is a national holiday. The capital holds a parade and schools often mark it, though the scale of celebrations varies by place.","questions":[{"cn":"你们的国庆会阅兵或游行吗？","en":"Does your national day include a parade?"},{"cn":"你会去现场还是在家看电视？","en":"Would you go in person or watch it at home?"}],"holidayType":"public_holiday","sourceUrls":["https://www.officeholidays.com/countries/india/2026","https://www.officeholidays.com/countries/india/2027"],"sourceNote":"Office Holidays 印度公共假期列为 1 月 26 日共和国日。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"gandhi-jayanti","cn":"甘地诞辰日","en":"Gandhi Jayanti","region":"印度","theme":"纪念","dateRule":"固定公历 10 月 2 日","y2026":"2026-10-02","y2027":"2027-10-02","status":"fixed","briefCn":"甘地诞辰日是印度国定假日，10 月 2 日。常见纪念活动与献花，部分场所会有限制；不是每个人都以同样方式过。","briefEn":"Gandhi Jayanti on 2 October is a national holiday in India, marked with commemorations and flower offerings. Some venues have restrictions, and not everyone observes it in the same way.","questions":[{"cn":"你们有纪念重要人物的日子吗？","en":"Does your country have a day honouring an important figure?"},{"cn":"你了解这个人的哪一面？","en":"Which side of that person do you know best?"}],"holidayType":"public_holiday","sourceUrls":["https://www.officeholidays.com/countries/india/2026","https://www.officeholidays.com/countries/india/2027"],"sourceNote":"Office Holidays 印度公共假期列为 10 月 2 日甘地诞辰日。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"singapore-nd","cn":"新加坡国庆日","en":"National Day","region":"新加坡","theme":"国家","dateRule":"固定公历 8 月 9 日","y2026":"2026-08-09","y2027":"2027-08-09","status":"fixed","briefCn":"新加坡的国庆公共假期，常见庆典、烟花和社区活动。具体安排以当年官方公告为准。","briefEn":"Singapore's national day public holiday, often marked with celebrations, fireworks, and community events. Check the official programme each year.","questions":[{"cn":"你们国庆会看庆典还是和朋友聚？","en":"On your national day, do you watch the celebrations or meet friends?"},{"cn":"你会为国庆专门出门吗？","en":"Do you go out specially for national day?"}],"holidayType":"public_holiday","sourceUrls":["https://www.mom.gov.sg/employment-practices/public-holidays"],"sourceNote":"新加坡 MOM 官方公共假期页列为 2026-08-09、2027-08-09。","verifiedAt":"2026-11-09","r ear. Some places have countdowns, fireworks, or family meals; others treat it as a quiet day off.","questions":[{"cn":"你们那里跨年有什么固定习惯吗？","en":"Is there a fixed way people mark the new year where you are from?"},{"cn":"你更喜欢热闹倒数还是安静待在家？","en":"Would you rather join a big countdown or stay in quietly?"}],"holidayType":"public_holiday","sourceUrls":["https://date.nager.at/api/v3/PublicHolidays/2026/CN","https://date.nager.at/api/v3/PublicHolidays/2027/CN"],"sourceNote":"公历固定日期 1 月 1 日；Nager.Date 中国公共假期列示。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"womens-day","cn":"国际妇女节","en":"International Women's Day","region":"国际","theme":"纪念","dateRule":"固定公历 3 月 8 日","y2026":"2026-03-08","y2027":"2027-03-08","status":"fixed","briefCn":"关注女性权益与贡献的国际纪念日。不同国家有不同做法，有的是公共假期，有的只是纪念活动。","briefEn":"An international day recognising women's rights and contributions. Practice differs by country: some have a public holiday, others only events.","questions":[{"cn":"你们那里这天会给女性送花吗？","en":"Do people give flowers to women on this day where you are from?"},{"cn":"你觉得这类纪念日更像庆祝还是提醒？","en":"Do you see this day more as a celebration or a reminder?"}],"holidayType":"observance","sourceUrls":["https://www.un.org/en/observances/womens-day"],"sourceNote":"联合国官方国际妇女节页面确认 3 月 8 日；公历固定日期。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"students-day","cn":"国际大学生节","en":"International Students' Day","region":"国际","theme":"青年","dateRule":"固定公历 11 月 17 日","y2026":"2026-11-17","y2027":"2027-11-17","status":"fixed","briefCn":"纪念学生运动的国际纪念日，不同学校会有讲座或活动。它更像纪念日，不是普遍放假的节日。","briefEn":"An international commemoration linked to a student movement. Some schools hold talks or events; it is a remembrance day rather than a universal holiday.","questions":[{"cn":"你读书时学校会办这类纪念活动吗？","en":"Did your school hold events like this when you were a student?"},{"cn":"你大学时最难忘的活动是什么？","en":"What was the most memorable event from your university years?"}],"holidayType":"observance","sourceUrls":["https://en.wikipedia.org/wiki/International_Students_Day"],"sourceNote":"国际大学生节为固定公历 11 月 17 日，维基页面确认，无需农历来源。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"christmas","cn":"圣诞节","en":"Christmas","region":"国际","theme":"家庭","dateRule":"固定公历 12 月 25 日","y2026":"2026-12-25","y2027":"2027-12-25","status":"fixed","briefCn":"在许多国家是家庭聚会和交换礼物的日子，也有人只当作年末假期。宗教与家庭习惯差异很大。","briefEn":"In many countries a time for family gatherings and gifts; for others it is simply a year-end break. Religious and family practices vary widely.","questions":[{"cn":"你们家圣诞节会交换礼物吗？","en":"Does your family exchange gifts at Christmas?"},{"cn":"你更喜欢节日聚餐还是安静休息？","en":"Do you prefer a festive meal or a quiet rest?"}],"holidayType":"public_holiday","sourceUrls":["https://date.nager.at/api/v3/PublicHolidays/2026/GB","https://date.nager.at/api/v3/PublicHolidays/2027/GB"],"sourceNote":"公历固定日期 12 月 25 日；Nager.Date 英国公共假期列示。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"singles-day","cn":"双十一","en":"Singles' Day","region":"中国","theme":"购物","dateRule":"固定公历 11 月 11 日（商业节日，非公共假期）","y2026":"2026-11-11","y2027":"2027-11-11","status":"fixed","briefCn":"原本是校园里的“光棍节”，后来变成大型网购促销日。它不是传统节日，也不放假。","briefEn":"Originally a campus joke about being single, now a major online shopping day. It is not a traditional festival and not a public holiday.","questions":[{"cn":"你会在双十一买东西吗？","en":"Do you shop on Singles' Day?"},{"cn":"你更喜欢提前计划购物还是看到合适才买？","en":"Do you plan purchases in advance or buy when you see something good?"}],"holidayType":"observance","sourceUrls":["https://en.wikipedia.org/wiki/Singles_Day"],"sourceNote":"双十一为固定公历 11 月 11 日的商业节日，非公共假期；维基页面确认。","verifiedAt":"2026-11-09","relatedPlaceIds":[]},{"id":"earth-day","cn":"世界地球日","en":"Earth Day","region":"国际","theme":"环保","dateRule":"固定公历 4 月 22 日","y2026":"2026-04-22","y2027":"2027-04-22","status":"fixed","briefCn":"世界地球日在 4 月 22 日，关注环境保护。各地有植树、清洁与宣传活动，它不是普遍放假的节日。","briefEn":"Earth Day on 22 April focuses on environmental protection. Tree planting, clean-ups, and awareness events take place in many places, but it is not a widely observed day off at all.","questions":[{"cn":"你们那里有环保主题的活动吗？","en":"Are there environmental events where you are from?"},{"cn":"旅行时你会注意减少垃圾吗？","en":"Do you try to reduce waste when you travel?"}],"holidayType":"observance","sourceUrls":["https://en.wikipedia.org/wiki/Earth_Day"],"sourceNote":"世界地球日为固定公历 4 月 22 日，维基页面确认，无需农历来源。","verifiedAt":"2026-11-09","relatedPlaceIds":[115,9]}];</script><script id="n06-topics-data">window.N06_TOPICS=[{"id":"daily-commute","cn":"通勤日常","en":"Commuting","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"每天怎么去上班上学，是很多人一天最固定的时段。可以聊单程多久、路上做什么、挤公共交通或开车的体验，也能聊住得远近和城市节奏的取舍。","briefEn":"How people get to work or school is one of the most predictable parts of the day. You can ask about commute times, what they do on the way, and whether they take transit, drive, bike, or walk. It also opens up bigger questions about where they live and how they balance time.","questions":[{"cn":"你每天通勤要多久？","en":"How long is your commute each day?"},{"cn":"路上你一般做什么？","en":"What do you usually do on your commute?"},{"cn":"你会为了住得近一点多花钱吗？","en":"Would you pay more to live closer to work?"}],"holidayType":"topic","sourceUrls":["https://www.gov.uk/government/statistics/national-travel-survey-2023"],"sourceNote":"GOV.UK 交通部 National Travel Survey 2023 统计页，2026-11-10 实抓 HTTP 200，标题 National Travel Survey: 2023，正文含通勤出行数据。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-cooking-takeout","cn":"做饭与外卖","en":"Cooking and takeout","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"自己做饭还是点外卖，往往取决于时间、预算和心情。可以聊一周做几次饭、最拿手的菜、外卖常点什么，也能聊到“做饭算放松还是负担”这种真实差别。","briefEn":"Cooking at home or ordering takeout usually comes down to time, budget, and energy. Ask how often they cook, what they can make without a recipe, and what they order when they cannot be bothered. It is also worth asking whether cooking feels relaxing or like another chore.","questions":[{"cn":"你一周大概做几次饭？","en":"How often do you cook in a typical week?"},{"cn":"忙的时候你一般点什么外卖？","en":"What do you usually order when you are too busy to cook?"},{"cn":"你觉得做饭是放松还是负担？","en":"Does cooking feel relaxing to you, or more like a chore?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/eat-well/"],"sourceNote":"NHS 健康饮食指南页，2026-11-10 实抓 HTTP 200，标题 Eat well - NHS。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-grocery-shopping","cn":"超市购物","en":"Grocery shopping","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"买菜能看出不少生活细节：一周采购一次还是天天买、会不会看标签比价、是否容易被货架摆放带着多买。聊这些比问“喜欢吃什么”更容易聊开。","briefEn":"Grocery shopping says a lot about daily life: whether someone shops weekly or picks things up day by day, checks labels and prices, or ends up buying more because of how the store is laid out. These small habits are easier to talk about than asking what food they like.","questions":[{"cn":"你一般一周采购一次，还是路过就买？","en":"Do you do one big shop each week, or pick things up as you go?"},{"cn":"你会比较价格和看营养标签吗？","en":"Do you compare prices or check nutrition labels?"},{"cn":"你有没有本来只想买一样，结果拎了一大袋出来？","en":"Have you ever gone in for one thing and come out with a full bag?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/eat-well/how-to-read-food-labels/"],"sourceNote":"NHS 食品标签解读页，2026-11-10 实抓 HTTP 200，标题 Food labels - NHS，正文讲如何看营养与价格相关信息。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-weekend-plans","cn":"周末安排","en":"Weekend plans","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"周末怎么过很能看出节奏：有人排满活动，有人只想躺着。可以聊睡到几点、有没有固定安排、家务和休息怎么分，也常聊到“周末过完更累”。","briefEn":"Weekends reveal a lot about how someone recharges. Some people pack them with plans, while others just want to stay home. Ask about sleeping in, regular routines, chores, and whether they feel rested or even more tired by Sunday night.","questions":[{"cn":"你理想的周末是什么样的？","en":"What does an ideal weekend look like for you?"},{"cn":"周末你会睡到很晚吗？","en":"Do you sleep in on weekends?"},{"cn":"你的周末有没有什么固定安排？","en":"Do you have any regular weekend routines?"}],"holidayType":"topic","sourceUrls":["https://www.ons.gov.uk/peoplepopulationandcommunity/leisureandtourism"],"sourceNote":"英国国家统计局 ONS 休闲与旅游主题页，2026-11-10 实抓 HTTP 200，标题 Leisure and tourism。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-sleep-routine","cn":"睡眠作息","en":"Sleep routines","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"几点睡、睡多久、睡前做什么，最容易聊也最容易有共鸣。可以聊熬夜的原因、闹钟响几次、周末补觉有没有用，也能带出“睡眠习惯很难改”。","briefEn":"When someone goes to bed, how long they sleep, and what they do before that is easy to talk about and easy to relate to. Ask why they stay up late, how many times they hit snooze, and whether weekend catch-up sleep actually helps. Most people have strong opinions about this.","questions":[{"cn":"你一般几点上床睡觉？","en":"What time do you usually go to bed?"},{"cn":"你睡前会看手机吗？","en":"Do you look at your phone before bed?"},{"cn":"你周末会补觉吗？","en":"Do you try to catch up on sleep on weekends?"}],"holidayType":"topic","sourceUrls":["https://www.nhs.uk/live-well/sleep-and-tiredness/how-to-get-to-sleep/"],"sourceNote":"NHS 睡眠与疲劳指南页，2026-11-10 实抓 HTTP 200，标题 Sleep and tiredness - NHS，含入睡建议。","verifiedAt":"2026-11-10","relatedPlaceIds":[]},{"id":"daily-renting","cn":"租房与居住","en":"Renting a home","region":"国际","theme":"日常生活","dateRule":"","y2026":null,"y2027":null,"status":"evergreen","briefCn":"租房的人大多有一两个故事：合租还是独住、房租和通勤怎么权衡、房东修东西快不快。可以聊住过几处、最看重什么，也能聊搬家的麻烦和押金。","briefEn":"Most renters have a story or two: living alone versus with roommates, balancing rent against commute time, or waiting on a landlord to fix something. Ask how many places they have lived in, what they look for first, and what moving and deposits are really like.","questions":[{"cn":"你现在是合租还是自己住？","en":"Do you live alone or wit
