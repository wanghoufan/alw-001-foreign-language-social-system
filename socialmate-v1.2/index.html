function openDetail(kind,id){S.detail={kind:kind,id:String(id)};let a=kind==='app'?D.apps.find(x=>x.id===id):kind==='place'?D.places.find(x=>String(x.id)===id):kind==='story'?SAV.stories.find(x=>x.id===id):kind==='person'?SAV.people.find(x=>x.id===id):SAV.sessions.find(x=>x.id===id);if(!a)return;let content='';if(kind==='app'){content=`<h2>${esc(a.name)}</h2><p class="sub">${esc(a.id)} · ${a.cat==='A'?'APP / PWA':t('soft.catOther')}</p>${smGallery(kind,id)}<div class="detailbox"><div class="boxhead">${t('soft.cnHead')}</div><p>${esc(a.cn)}</p></div><div class="detailbox"><div class="boxhead">${t('soft.enHead')}</div><p class="english-reading" lang="en">${esc(a.en)}</p></div>${buttons(kind,id,a.en)}${window.__smCards&&window.__smCards.byId('app',id)?window.__smCards.detailActions('app',id):''}<div class="sectiontitle"><strong>${t('soft.steps')}</strong><small>${tf('soft.stepsCount',{n:a.steps.length},a.steps.length)}</small></div><div class="steps">${a.steps.map(st=>`<div class="step"><b>${st.n}. ${esc(st.cn)}</b><p>${esc(st.detail)}</p><p lang="en">${esc(st.en)}</p></div>`).join('')}</div><p class="footnote">${esc(a.status)}${t('soft.footnote')}</p>`;}else if(kind==='place'){const pl=placeDescLang();const zhBox=`<div class="detailbox"><div class="boxhead">${t('hainan.cnHead')}</div><p>${esc(a.cn)}</p></div>`;const enBox=`<div class="detailbox"><div class="boxhead">${t('hainan.enHead')}</div><p class="english-reading" lang="en">${esc(a.en)}</p></div>`;content=`<h2>${esc(a.cnName)} <span class="enname">${esc(a.enName)}</span></h2><p class="sub">${esc(a.city)} · ${esc(a.category)} </p>${smGallery(kind,id)}`+(pl==='en'?enBox+'<details class="zhraw"><summary>'+esc(t('hainan.cnHead'))+'</summary>'+zhBox+'</details>':zhBox+enBox)+`${buttons(kind,id,a.en)}${window.__smCards&&window.__smCards.byId('place',id)?window.__smCards.detailActions('place',id):''}<div id="n05PlaceHost" data-place-id="${esc(String(id))}"><div class="stateempty">正在读取我的游玩记录…</div></div><div class="actions"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.cnName+' '+a.city)}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a><a class="btn" href="https://uri.amap.com/search?keyword=${encodeURIComponent(a.cnName+' '+a.city)}" target="_blank" rel="noopener noreferrer">${t('hainan.amap')}</a></div>`;}else if(kind==='story'){content=`<h2>${esc(a.title)}</h2><p class="sub">${esc(a.cat)} · ${t('self.editable')}</p>${smGallery(kind,id)}<div class="detailbox"><div class="boxhead">${t('self.cnHead')}</div><p>${esc(a.cn)}</p></div><div class="detailbox"><div class="boxhead">${t('self.enHead')}</div><p>${esc(a.en)}</p></div>${buttons(kind,id,a.en)}${window.__smCards&&window.__smCards.byId('story',id)?window.__smCards.detailActions('story',id):''}`;}else if(kind==='person'){content=`<h2>${esc(a.name)}</h2><p class="sub">${t('people.personPrivate')}</p><div class="detailbox"><div class="boxhead">${t('people.notesHead')}</div><p>${esc(a.about)}</p></div><div class="sectiontitle"><strong>${t('people.confirmedHead')}</strong></div>${(a.notes||[]).map(n=>`<div class="detailbox"><p>${esc(n.text)}</p><small>${esc(n.date)}</small></div>`).join('')||('<p class="footnote">'+esc(t('people.noneConfirmed'))+'</p>')}<div class="actions"><button class="btn mainbtn" data-selectperson="${esc(a.id)}">${t('people.setChatPerson')}</button></div>`;}else{content=`<h2>${t('people.sessionTitle')}</h2><p class="sub">${esc(a.date)}</p><div class="detailbox"><p>${esc(a.review)}</p></div><div class="actions"><button class="btn" data-download="${esc(id)}">${t('people.downloadMd')}</button></div>`;}openDrawer(content);try{window.__smCards&&window.__smCards.paintDetail(kind,id)}catch{}}
async function copy(v){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(v);else{let t=document.createElement('textarea');t.value=v;t.style.position='fixed';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('clipboard');t.remove()}tip(t('msg.copied'))}catch{tip(t('msg.copyBlocked'))}}
function source(kind,id){return kind==='app'?D.apps.find(x=>x.id===id):kind==='place'?D.places.find(x=>String(x.id)===id):SAV.stories.find(x=>x.id===id)}
function pin(kind,id){let x=source(kind,id);if(!x)return;let title=kind==='app'?x.name:kind==='place'?x.cnName:x.title;SAV.pins=SAV.pins.filter(p=>p.kind!==kind||p.id!==id);SAV.pins.unshift({kind,id,title,en:x.en});SAV.pins=SAV.pins.slice(0,12);persist();tip(t('msg.pinned'));}
function cardsFor(q){q=q.toLowerCase();let scored=[],storyHit=null;let words=[...new Set(q.match(/[a-z]{3,}|[\u4e00-\u9fa5]{2,}/g)||[])];let aliases={'outdoors':['公园','海边','火山','自然','walk','volcano'],'coffee':['咖啡','coffee','café'],'software':['软件','app','project'],'beach':['海边','coast','sea'],'music':['live','夜市','音乐']};let kws=[...words];for(let w of words){if(aliases[w])kws.push(...aliases[w]);}for(let item of D.apps){let text=(item.name+item.en+item.cn).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'app',id:item.id,title:item.name,en:item.en,score})}for(let item of D.places){let text=(item.cnName+item.enName+item.cn+item.en).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score)scored.push({kind:'place',id:String(item.id),title:item.cnName,en:item.en,score:score+((q.includes('outdoor')&&item.id===9)?4:0)})}for(let item of SAV.stories){let text=(item.title+item.cn+item.en).toLowerCase();let score=kws.filter(w=>text.includes(w.toLowerCase())).length;if(score){const hit={kind:'story',id:item.id,title:'关于我 · '+item.title,en:item.en,score};scored.push(hit);if(!storyHit)storyHit=hit}}scored.sort((a,b)=>b.score-a.score);let out=scored.slice(0,5);if(storyHit&&!out.some(x=>x.kind==='story'))out[out.length-1]=storyHit;return out}
function question(){let q=S.session?.messages.at(-1)?.text?.toLowerCase()||'';return /coffee|cafe/.test(q)?'Do you have a favorite café here in Haikou?':/nature|outdoor|walk|park|hike/.test(q)?'Do you like going for a walk by the sea?':/app|software|coding/.test(q)?'What kind of apps do you find useful?':'What brought you to Haikou?'}

function smCloudBridge(){return window.SocialMateAndroid||null}
function smCloudKeyStatus(){const b=smCloudBridge();if(!b||typeof b.cloudKeyStatus!=='function')return null;try{return JSON.parse(b.cloudKeyStatus())}catch{return null}}
function smRefreshCloudKeyStatus(){
  const d=smCloudKeyStatus(),s=(d&&d.status)||{};
  [['smKeyDeepseekStatus',!!s.deepseek],['smKeyDoubaoStatus',!!s.doubao],['smKeyTencentStatus',!!s.tencent]].forEach(function(pair){
    const el=document.querySelector('#'+pair[0]);if(el)el.textContent=pair[1]?'已配置（仅本机）':'未配置';
  });
}
function smSaveCloudKey(kind,inputId){
  const b=smCloudBridge();if(!b||typeof b.saveCloudKey!=='function')return tip('仅 App 内可用');
  const input=document.querySelector('#'+inputId),v=(input&&input.value||'').trim();
  if(!v)return tip('请先填写 Key');
  let d=null;try{d=JSON.parse(b.saveCloudKey(kind,v))}catch(e){}
  if(input)input.value='';
  smRefreshCloudKeyStatus();
  tip(d&&d.ok?'已保存到本机 Keystore':'保存失败');
}
function smClearCloudKey(kind){
  const b=smCloudBridge();if(!b||typeof b.clearCloudKey!=='function')return tip('仅 App 内可用');
  try{b.clearCloudKey(kind)}catch(e){}
  smRefreshCloudKeyStatus();tip('已清除本机 Key');
}
function smTestCloudKey(kind,statusId){
  const b=smCloudBridge();if(!b||typeof b.testCloudKey!=='function')return tip('仅 App 内可用');
  const el=document.querySelector('#'+statusId);
  if(el)el.textContent='测试中…（会产生少量费用）';
  tip('测试中…（会产生少量费用）');
  setTimeout(function(){
    let d=null;try{d=JSON.parse(b.testCloudKey(kind))}catch(e){d={ok:false,message:String(e&&e.message||e)}}
    const msg=(d&&d.message)||'';
    if(el)el.textContent=(d&&d.ok?'通联成功':'通联失败'+(msg?'：'+msg:''));
    tip(d&&d.ok?'通联成功':('通联失败'+(msg?'：'+msg:'')));
  },80);
}
function smBatchTexts(){
  const out=[];
  try{(S.session&&S.session.messages||[]).forEach(function(m){if(m&&m.text)out.push(m.text)})}catch(e){}
  try{(S.recs||[]).forEach(function(r){(r.blocks||[]).forEach(function(b){if(b.sourceText)out.push(b.sourceText)})})}catch(e){}
  try{(SAV.stories||[]).forEach(function(s){if(s.en)out.push(s.en);if(s.cn)out.push(s.cn)})}catch(e){}
  return Array.from(new Set(out)).slice(0,60);
}
async function smBatchCacheSession(){
  const texts=smBatchTexts(),el=document.querySelector('#smBatchCacheStatus');
  if(!texts.length){if(el)el.textContent='当前没有可缓存内容';return tip('当前没有可缓存内容')}
  if(!window.SocialMateAndroid){return tip('仅 App 内可用')}
  const t=sessionStorage.getItem('sm-archive-token')||'';
  let ok=0;
  for(let i=0;i<texts.length;i++){
    if(el)el.textContent='缓存中 '+(i+1)+'/'+texts.length;
    try{
      const r=await fetch('/v12/api/tts/synthesize',{method:'POST',headers:{'Content-Type':'application/json','x-archive-token':t},body:JSON.stringify({text:texts[i].slice(0,2000),voiceProfileId:S.v152.voice,explicitConsent:true})});
      if(r.ok)ok++;
    }catch(e){}
  }
  if(el)el.textContent='已缓存 '+ok+'/'+texts.length+' 段（'+S.v152.voice+'）';
  tip('已缓存 '+ok+'/'+texts.length+' 段');
}
function smSync(kind){
  const b=smCloudBridge();if(!b||typeof b.syncPush!=='function')return tip('仅 App 内可用');
  const el=document.querySelector('#smSyncStatus');
  if(el)el.textContent='同步中…';tip('同步中…');
  setTimeout(function(){
    let d=null;
    try{d=JSON.parse(kind==='push'?b.syncPush():b.syncPull())}catch(e){d={ok:false,message:String(e&&e.message||e)}}
    const msg=d&&d.ok?(kind==='push'?'已推送 '+(d.bytes||0)+' 字节到 Mac':('已导入 '+(d.imported||0)+' 项')):('失败：'+((d&&d.message)||'未知'));
    if(el)el.textContent=msg;tip(msg);
  },80);
}

document.addEventListener('click',function(e){
  const t=e&&e.target;
  if(!t||typeof t.closest!=='function')return;
  if(t.closest('#smCardCamera')){
    const f=document.querySelector('#smCardFile');
    const kind=(f&&f.dataset.cardKind)||'', id=(f&&f.dataset.cardId)||'';
    if(!id)return tip('请先保存卡片，再拍照');
    if(window.SocialMateAndroid&&typeof window.SocialMateAndroid.capturePhoto==='function'){
      window.SocialMateAndroid.capturePhoto(kind,id);tip('拍照完成后会自动加入卡片');
    }else tip('仅 App 内可用');
    return;
  }
  if(t.closest('#smBatchCache')){smBatchCacheSession();return;}
  if(t.closest('#smSyncPush')){smSync('push');return;}
  if(t.closest('#smSyncPull')){smSync('pull');return;}
  if(t.closest('#smKeyTestDeepseek')){smTestCloudKey('deepseek','smKeyDeepseekStatus');return;}
  if(t.closest('#smKeyTestDoubao')){smTestCloudKey('doubao','smKeyDoubaoStatus');return;}
  if(t.closest('#smKeyTestTencent')){smTestCloudKey('tencent','smKeyTencentStatus');return;}
  if(t.closest('#smKeySaveDeepseek')){smSaveCloudKey('deepseek','smKeyDeepseek');return;}
  if(t.closest('#smKeyClearDeepseek')){smClearCloudKey('deepseek');return;}
  if(t.closest('#smKeySaveDoubao')){smSaveCloudKey('doubao','smKeyDoubao');return;}
  if(t.closest('#smKeyClearDoubao')){smClearCloudKey('doubao');return;}
  if(t.closest('#smKeySaveTencent')){
    const b=smCloudBridge();if(!b||typeof b.saveCloudKey!=='function')return tip('仅 App 内可用');
    let ok=true;
    [['tencent_app_id','smKeyTencentAppId'],['tencent_secret_id','smKeyTencentSecretId'],['tencent_secret_key','smKeyTencentSecretKey']].forEach(function(pair){
      const el=document.querySelector('#'+pair[1]),v=(el&&el.value||'').trim();
      if(v){try{const r=JSON.parse(b.saveCloudKey(pair[0],v));if(!r.ok)ok=false}catch(e){ok=false}}
      if(el)el.value='';
    });
    smRefreshCloudKeyStatus();tip(ok?'腾讯 Key 已保存':'保存失败');return;
  }
  if(t.closest('#smKeyClearTencent')){
    const b=smCloudBridge();if(!b||typeof b.clearCloudKey!=='function')return tip('仅 App 内可用');
    ['tencent_app_id','tencent_secret_id','tencent_secret_key'].forEach(function(k){try{b.clearCloudKey(k)}catch(e){}});
    smRefreshCloudKeyStatus();tip('已清除腾讯 Key');return;
  }
  if(t.closest('#smBackupExport')){
    if(window.SocialMateAndroid&&typeof window.SocialMateAndroid.exportBackup==='function'){
      tip(window.SocialMateAndroid.exportBackup()?'请选择备份保存位置…':'本机备份仅 App 内可用');
    }else tip('本机备份仅 App 内可用');
    return;
  }
  if(t.closest('#smBackupImport')){
    if(window.SocialMateAndroid&&typeof window.SocialMateAndroid.importBackup==='function'){
      tip(window.SocialMateAndroid.importBackup()?'请选择 SocialMate 备份包…':'本机备份仅 App 内可用');
    }else tip('本机备份仅 App 内可用');
    return;
  }
});

function apiMsg(data,fallback){return String((data&&(data.error||data.code))||fallback||'')}
async function apiCall(path,opt){
 const o=opt||{};
 if(!window.fetch)throw new Error('此浏览器不支持联网读取');
 const headers=Object.assign({'Accept':'application/json'},o.headers||{});
 const token=o.token!==undefined?o.token:uiToken();
 if(token)headers['x-archive-token']=token;
 const res=await fetch(path,{method:o.method||'GET',headers,cache:'no-store',body:o.body});
 let data=null;try{data=await res.json()}catch{}
 if(!res.ok){const err=new Error(apiMsg(data,'HTTP '+res.status));err.status=res.status;err.code=data&&data.code;throw err}
 return data||{};
}

function queuePeopleSummaries(){

 const todo=(P.list||[]).filter(p=>!P.summaries[p.slug]&&!P.summaryBusy[p.slug]).slice(0,12);

 todo.forEach(p=>P.summaryBusy[p.slug]=true);
 (async()=>{

/* —— 朗读（只用系统语音，不联网） —— */
let smAudioEl=null;
let smAudioCtx=null;
let smAudioSource=null;
let smAudioPaused=false;
function smStopAudio(){
 if(smAudioSource){try{smAudioSource.stop()}catch{};smAudioSource=null;}
 smAudioPaused=false;
}
function smPauseAudio(){
 if(!smAudioCtx||!smAudioSource)return false;
 if(smAudioCtx.state==='running'){try{smAudioCtx.suspend()}catch{}smAudioPaused=true;return true;}
 return false;
}
function smResumeAudio(){
 if(!smAudioCtx||!smAudioPaused)return false;
 try{smAudioCtx.resume()}catch{}
 smAudioPaused=false;
 return true;
}
function smEnsureAudioCtx(){
 try{
  if(!smAudioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;smAudioCtx=new C();}
  if(smAudioCtx.state==='suspended'){smAudioCtx.resume().catch(()=>{});}
  return smAudioCtx;
 }catch{return null}
}
async function smPlayBuffer(buf){
 smStopAudio();
 const ctx=smEnsureAudioCtx();
 if(!ctx)throw Error('no audiocontext');
 if(ctx.state==='suspended'){try{await ctx.resume()}catch{}}
 const audioBuf=await ctx.decodeAudioData(buf.slice(0));
 return new Promise((resolve,reject)=>{
  let settled=false;
  const finish=(err)=>{
   if(settled)return;
   settled=true;
   clearTimeout(timer);
   if(err)reject(err);else resolve();
  };
  const source=ctx.createBufferSource();
  source.buffer=audioBuf;
  source.connect(ctx.destination);
  smAudioSource=source;
  source.onended=()=>{ if(smAudioSource===source)smAudioSource=null; finish(); };
  let timer=null;
  try{source.start(0);}catch(e){return finish(e);}
  timer=setTimeout(()=>finish(Error('audio play timeout')),Math.max(8000,(Number(audioBuf.duration)||5)*1000+3000));
 });
}
function smSplitSpeech(value){
 const parts=[];let rest=String(value||'');
 while(rest.length>1800){
  let cut=-1;
  for(const mark of ['。','！','？','\n','. ','! ','? ']){const i=rest.lastIndexOf(mark,1800);if(i>cut)cut=i+(mark.length>1?1:1)}
  if(cut<200)cut=1800;
  parts.push(rest.slice(0,cut));rest=rest.slice(cut);
 }
 if(rest.trim())parts.push(rest);
 return parts;
}

 if((S.v152.ttsEngine||'doubao')==='system'){try{window.__ttsLastDoubaoError='engine-system'}catch{};return false;}

    'Content-Type':'application/json','x-archive-token':uiToken(),'x-sm-write':ticket},
    body:JSON.stringify({providerId:'doubao',segmentType:zh?'cn':'enA',locale,voiceProfileId:voice,
     text:part,requestId:'spk-'+Date.now().toString(36)+'-'+(index++),recordId:o.recordId||'read',blockId:o.blockId||'',revision:Number(o.revision)||0,explicitConsent:true})});
   const d=await res.json().catch(()=>({}));
   if(!res.ok||!d?.result?.audioId)throw Object.assign(Error(d.error||d.code||('HTTP '+res.status)),{code:d.code});
   const audio=await fetch('/v12/api/tts/audio/'+encodeURIComponent(d.result.audioId),{headers:{'x-archive-token':uiToken()},cache:'no-store'});
   if(!audio.ok)throw Error('audio HTTP '+audio.status);

 }catch(err){
  const why=String(err?.code||err?.message||'unknown');

  return false;
 }

 * 数据只来自 /v12/api/demo/*（Mac 端 SocialMate-Data/Demo），与真实 People/归档物理隔离。
 * 服务读不到时回退到构建期内嵌的只读母版，保证手机打开不是空白。

 */

/* 写操作需要一次性写授权票（T1-4）：同源 + 自定义头 + 短期票据。
   读接口不需要令牌，保证手机首次打开就有三位演示人物。 */
let smWriteTicket={value:'',exp:0};
function smTicket(){
 if(smWriteTicket.value&&Date.now()<smWriteTicket.exp-5000)return Promise.resolve(smWriteTicket.value);
 return fetch('/v12/api/demo/write-ticket',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  if(!d||!d.ticket)throw new Error('写授权票获取失败');
  smWriteTicket={value:d.ticket,exp:Date.parse(d.expiresAt)||Date.now()+60000};
  return d.ticket;
 });
}
async function demoApi(path,opt){
 const o=opt||{};
 const method=(o.method||'GET').toUpperCase();
 const headers={'Accept':'application/json'};
 if(o.body)headers['Content-Type']='application/json';
 if(o.token)headers['x-archive-token']=o.token;
 if(method!=='GET'){
  try{
   headers['x-sm-write']=await smTicket();
   // 写授权票是一次性的（T1-4）：发出后立刻作废本地缓存，下一次写重新取票。
   // 否则第二次写会复用已消费的票，界面提示「需要写授权票」，用户必须点两次才成功。
   smWriteTicket={value:'',exp:0};
  }catch(e){throw Object.assign(e,{code:'WRITE_TICKET_UNAVAILABLE'})}
 }
 const res=await fetch(path,{method,headers,cache:'no-store',body:o.body});
 let d=null;try{d=await res.json()}catch{}
 if(!res.ok){
  // 票过期/重放：清掉缓存，下一次点击重新取票（不隐藏错误，只允许一次自动重试由用户触发）。
  if(d&&/^WRITE_TICKET_/.test(String(d.code||'')))smWriteTicket={value:'',exp:0};
  const err=new Error(apiMsg(d,'HTTP '+res.status));err.status=res.status;err.code=d&&d.code;err.retryAfterMs=d&&d.retryAfterMs;throw err
 }
 return d||{};
}

/* 仅在原生 App 内合并私有地点；公开 PWA / 浏览器预览保持 115 条原样。 */
async function loadPrivatePlacesIntoDataset(){
 if(PRIVATE_PLACES_LOADED||!window.SocialMateAndroid)return;
 smApplyPrivateCache();
 for(let i=0;i<20;i++){
  if(uiToken())break;
  await new Promise(r=>setTimeout(r,500));
 }
 if(!uiToken())return;
 try{
  /* 服务重启或令牌注入晚到时，一次性失败会让私有地点永久消失（实测踩到两次）；
     这里重试 3 次，并保留手动重试入口，避免用户以为记录丢了。 */
  let d=null;
  for(let attempt=0;attempt<3;attempt++){
   try{ d=await demoApi('/v12/api/private-places',{token:uiToken()}); if(d&&Array.isArray(d.places))break; }
   catch(err){ d=null; }
   await new Promise(r=>setTimeout(r,800*(attempt+1)));
  }
  const list=Array.isArray(d&&d.places)?d.places:[];
  if(!list.length){ smApplyPrivateCache(); return; }
  smMergePrivatePlaces(list);
  smPrivateCacheWrite(list);
  PRIVATE_PLACES_LOADED=true;
  try{ window.__smPrivateState={ok:true,count:list.length,at:Date.now()}; }catch{}
  if(S.tab==='hainan'){S.cat='全部';render();}
 }catch(e){ try{ window.__smPrivateState={ok:false,error:String(e&&e.message||e),at:Date.now()}; }catch{} }
}

/* ============ N05 V1.3 学习播放队列：真实音频完成回调驱动 ============

  const en=String((p&&p.en)||'').trim();
  if(!zh&&!en) return null;
  const status=String((p&&p.reviewStatus)||'needs_review');
  const zhOk=!!zh&&SM_HAN.test(zh), enBad=SM_HAN.test(en);
  /* 缺中文的条目保留下来（UI 显示「缺中文」），但绝不可播；不允许把英文当中文。 */
  const playable=!!(zhOk&&en&&!enBad&&status!=='needs_review'&&p.playable!==false);
  return {
    id:String((p&&p.id)||((blockId||'b')+'-p'+(i+1))),
    zh:zh, en:en,
    source:String((p&&p.source)||''),
    evidence:String((p&&p.evidence)||''),
    reviewStatus:status,
    playable:playable
  };
}
/* 旧数据只有 phrases:string[]：只在「可明确拆分」时派生，仅供播放与显示，绝不写回原字段。 */
function derivePhrasePairs(block){
  const out=[];
  (block.phrases||[]).forEach((raw,i)=>{
    const s=String(raw==null?'':raw).trim();
    if(!s) return;
    let zh='',en='';
    const mEnZh=s.match(/^([^\u3400-\u9fff]+?)\s+([\u3400-\u9fff][\s\S]*)$/);
    const mZhEn=s.match(/^([\u3400-\u9fff][\s\S]*?)\s*\/\s*([A-Za-z][\s\S]*)$/);
    if(mEnZh){ en=mEnZh[1].trim(); zh=mEnZh[2].trim(); }
    else if(mZhEn){ zh=mZhEn[1].trim(); en=mZhEn[2].trim(); }
    else en=s;
    const ok=!!(zh&&en&&SM_HAN.test(zh)&&!SM_HAN.test(en));
    out.push({id:(block.blockId||'b')+'-p'+(i+1),zh:zh,en:en,
      source:ok?'parsed_from_original':'insufficient',
      evidence:ok?'原 phrases 串直接拆分':'原 phrases 仅有英文或无法确定中文',
      reviewStatus:ok?'parsed':'needs_review',playable:ok});
  });
  return out;
}
function phrasePairsOf(block){
  const list=Array.isArray(block&&block.phrasePairs)?block.phrasePairs:null;
  const pairs=(list||derivePhrasePairs(block||{}))
    .map((p,i)=>normalizePhrasePair(p,i,block&&block.blockId))
    .filter(Boolean);
  return pairs;
}
function phraseGapStats(block){
  const pairs=phrasePairsOf(block);
  return {
    total:pairs.length,
    playable:pairs.filter(p=>p.playable).length,
    pending:pairs.filter(p=>p.playable&&p.reviewStatus==='pending_user_confirm').length,
    missing:pairs.filter(p=>!p.playable).length
  };
}

/* ---------- 统一队列构建：单播与循环共用 ---------- */
function buildStudyPlaybackQueue(rec,block,mode,opts){
  const o=opts||{};
  const items=[];
  const rev=Number((rec&&rec.revision)||1);
  const rid=String((rec&&rec.recordId)||'');
  const bid=String((block&&block.blockId)||'');
  const base={recordId:rid,blockId:bid,revision:rev};
  const zh=String(((block&&block.cnSentences)||[]).join('')||'').trim();
  const enA=String(((block&&block.enVariants)||[])[0]||'').trim();
  const enB=String(((block&&block.enVariants)||[])[1]||'').trim();
  const pairs=phrasePairsOf(block).filter(p=>p.playable);
  const add=(kind,lang,text,label,gapBeforeMs,extra)=>{
    if(!String(text||'').trim()) return;
    items.push(Object.assign({kind:kind,lang:lang,text:String(text),label:label,gapBeforeMs:Number(gapBeforeMs)||0},extra||{},base));
  };
  const addPairs=(firstGap)=>{
    pairs.forEach((p,i)=>{
      add('phrase-zh','zh',p.zh,'词组 '+(i+1)+'/'+pairs.length+' 中文',i===0?firstGap:SM_PAIR_GAP_MS,{pairId:p.id});
      add('phrase-en','en',p.en,'词组 '+(i+1)+'/'+pairs.length+' 英文',SM_PHRASE_GAP_MS,{pairId:p.id});
    });
  };
  let label='';
  if(mode==='full'){
    add('zh','zh',zh,'中文',0);
    add('enA','en',enA,'英文 A',SM_STAGE_GAP_MS);
    add('enB','en',enB,'英文 B',SM_STAGE_GAP_MS);
    addPairs(SM_STAGE_GAP_MS);
    label='听本段';
  }else if(mode==='phrases'){
    addPairs(0);
    label='听词组';
  }else if(mode==='zh'||mode==='enA'||mode==='enB'){
    const text=mode==='zh'?zh:(mode==='enA'?enA:enB);
    add(mode,mode==='zh'?'zh':'en',text,mode==='zh'?'中文':(mode==='enA'?'英文 A':'英文 B'),0);
    label=mode==='zh'?'听中文':(mode==='enA'?'听英文 A':'听英文 B');
  }
  return {items:items,label:label,mode:mode,phraseStats:phraseGapStats(block),loopStart:Number(o.loopStart)||0};
}

/* ---------- 单元素朗读：只播一次，循环由队列自己管 ---------- */
function logTtsEngine(item,engine,reason){
 try{
  window.__ttsEngineLog=window.__ttsEngineLog||[];
  window.__ttsEngineLog.push({at:Date.now(),engine:engine,reason:String(reason||''),label:String(item&&item.label||''),voice:String((S.v152&&S.v152.voice)||''),text:String(item&&item.text||'').slice(0,24)});
  if(window.__ttsEngineLog.length>200)window.__ttsEngineLog.shift();
 }catch{}
}
async function ttsSpeakItem(item,ctx){
  if(!String(item&&item.text||'').trim()) return {ok:false,code:'TTS_EMPTY_TEXT'};
  const c0=ctx||{};
  if(await smDoubaoSpeak(String(item.text),{recordId:c0.recordId,blockId:c0.blockId,revision:c0.revision})){
   logTtsEngine(item,'doubao','');return {ok:true,doubao:true};
  }
  logTtsEngine(item,'native',String(window.__ttsLastDoubaoError||'unknown'));
  const b=ttsBridge();
  if(!b){ setTtsState('failed','当前环境无原生语音'); return {ok:false,code:'TTS_NO_BRIDGE'}; }
  if(typeof b.speakText!=='function'&&typeof b.speakTextWithIds!=='function')
    return {ok:false,code:'TTS_NO_ENTRY'};
  const c=ctx||{};
  try{ if(typeof b.setRate==='function') b.setRate(Number(N.tts.rate)||1); }catch{}
  let raw;
  try{
    if(typeof b.speakTextWithIds==='function')
      raw=b.speakTextWithIds(String(item.text),item.lang,1,String(c.recordId||''),String(c.blockId||''),Number(c.revision||0));
    else raw=b.speakText(String(item.text),item.lang);
  }catch(e){ raw={ok:false,code:'TTS_BRIDGE_ERROR',message:(e&&e.message)||'桥调用异常'}; }
  const d=bridgeResult(raw);
  if(d&&d.ok===false){
    const code=String(d.code||'TTS_FAILED');
    const msg=String(d.message||'');
    if(code==='TTS_LANG_UNAVAILABLE'||d.missingLanguage)
      note('缺少'+(item.lang==='zh'?'中文':'英文')+'语音包（TTS_LANG_UNAVAILABLE）；到系统设置安装语音数据后重试。');
    return {ok:false,code:code,message:msg};
  }
  return {ok:true,result:d||{}};
}

function smqClearTimers(q){
  if(!q) return;
  if(q.gapTimer){ clearTimeout(q.gapTimer); q.gapTimer=null; }
  if(q.watchdog){ clearTimeout(q.watchdog); q.watchdog=null; }
}
function smqCancel(reason,silent){
  try{smStopAudio()}catch{}
  qa('[data-n05="tts-loop-full"]').forEach(b=>b.classList.remove('on'));
  if(!SMQ) return;
  const q=SMQ;
  smqLog(q,{ev:'queue_cancel',reason:String(reason||''),idx:q.idx,round:q.loopDone+1});
  q.finalState='cancelled';
  try{ SMQ_HISTORY.push({mode:q.mode,items:q.items.length,rounds:q.loopDone,state:'cancelled',at:q.createdAt,log:q.log.slice()}); if(SMQ_HISTORY.length>12) SMQ_HISTORY.shift(); }catch{}
  smqClearTimers(q);
  SMQ_LAST=q; SMQ=null;
  try{ ttsStop(); }catch{}
  if(!silent){ setTtsState('idle','已停止（'+(reason||'用户停止')+'）'); }
}
function smqRun(fn){
  const q=SMQ;
  if(q&&q.paused){ q.pending=fn; return; }
  fn();
}
function smqFail(code,message){
  try{smStopAudio()}catch{}
  qa('[data-n05="tts-loop-full"]').forEach(b=>b.classList.remove('on'));
  const q=SMQ;
  if(!q) return;
  smqLog(q,{ev:'queue_failed',code:String(code||''),message:String(message||''),idx:q.idx,round:q.loopDone+1,item:(q.items[q.idx]||{}).label||''});
  q.finalState='failed';
  try{ SMQ_HISTORY.push({mode:q.mode,items:q.items.length,rounds:q.loopDone,state:'failed',at:q.createdAt,log:q.log.slice()}); if(SMQ_HISTORY.length>12) SMQ_HISTORY.shift(); }catch{}
  smqClearTimers(q);
  SMQ_LAST=q; SMQ=null;
  try{ ttsStop(); }catch{}
  setTtsState('failed',(code||'TTS_FAILED')+(q.items[q.idx]?(' · 第 '+(q.idx+1)+' 项 '+(q.items[q.idx].label||'')):''));
  note('朗读失败：'+(code||'TTS_FAILED')+(message?(' · '+message):'')+'；本次不计完成，点「重试本段」重播。');
}
function smqWatchdog(q,item){
  if(q.watchdog){ clearTimeout(q.watchdog); q.watchdog=null; }
  const first=(q.loopDone===0&&q.idx===0);
  const cap=first?SM_FIRST_TIMEOUT_MS:Math.min(30000,SM_ITEM_BASE_MS+String(item.text||'').length*SM_ITEM_PER_CHAR_MS);
  q.watchdog=setTimeout(()=>{
    if(SMQ!==q||q.paused) return;
    smqFail('TTS_ITEM_TIMEOUT','第 '+(q.idx+1)+' 项 '+cap+'ms 内无完成回调');
  },cap);
}
async function smqSpeakCurrent(){
  const q=SMQ; if(!q) return;
  if(q.idx>=q.items.length){ return smqRoundDone(); }
  const item=q.items[q.idx];
  q.awaiting=true;
  q.itemStartedAt=smqNow();
  setTtsState(q.loopTotal>1?'looping':'playing',
    '第 '+(q.loopDone+1)+'/'+q.loopTotal+' 轮 · 第 '+(q.idx+1)+'/'+q.items.length+' 项 · '+(item.label||''));
  smqLog(q,{ev:'item_start',idx:q.idx,kind:item.kind,lang:item.lang,label:item.label,chars:String(item.text||'').length,round:q.loopDone+1,message:item.text});
  const r=await ttsSpeakItem(item,{recordId:q.recordId,blockId:q.blockId,revision:q.revision});
  if(SMQ!==q) return;
  if(!r.ok){
    q.awaiting=false;
    smqFail(r.code||'TTS_FAILED',r.message||'');
    return;
  }
  if(r.doubao){
    q.awaiting=false;
    smqAdvance();
    return;
  }
  smqWatchdog(q,item);
}
function smqAdvance(){
  const q=SMQ; if(!q) return;
  const item=q.items[q.idx]||{};
  const done=smqNow();
  q.awaiting=false;
  q.itemRetries=0;
  if(q.watchdog){ clearTimeout(q.watchdog); q.watchdog=null; }
  smqLog(q,{ev:'item_done',idx:q.idx,kind:item.kind,elapsedMs:q.itemStartedAt?done-q.itemStartedAt:0});
  q.idx++;
  if(q.idx>=q.items.length){ return smqRoundDone(); }
  const lead=Number(q.items[q.idx].gapBeforeMs||0);
  if(lead>0){
    smqLog(q,{ev:'gap',ms:lead,before:q.items[q.idx].kind});
    q.gapTimer=setTimeout(()=>{ if(SMQ===q) smqRun(()=>smqSpeakCurrent()); },lead);
  }else{
    smqRun(()=>smqSpeakCurrent());
  }
}
function smqRoundDone(){
  const q=SMQ; if(!q) return;
  q.loopDone++;
  smqLog(q,{ev:'round_done',round:q.loopDone,total:q.loopTotal,items:q.items.length});
  if(q.loopDone>=q.loopTotal){ return smqFinish(); }
  q.idx=0;
  q.gapTimer=setTimeout(()=>{ if(SMQ===q) smqRun(()=>smqSpeakCurrent()); },SM_STAGE_GAP_MS);
}
function smqFinish(){
  try{smStopAudio()}catch{}
  qa('[data-n05="tts-loop-full"]').forEach(b=>b.classList.remove('on'));
  const q=SMQ; if(!q) return;
  smqLog(q,{ev:'queue_finished',rounds:q.loopDone,items:q.items.length,durationMs:smqNow()-q.createdAt});
  q.finalState='finished';
  try{ SMQ_HISTORY.push({mode:q.mode,items:q.items.length,rounds:q.loopDone,state:'finished',at:q.createdAt,log:q.log.slice()}); if(SMQ_HISTORY.length>12) SMQ_HISTORY.shift(); }catch{}
  smqClearTimers(q);
  SMQ_LAST=q; SMQ=null;
  setTtsState('finished',q.label+' · '+q.loopDone+' 轮 × '+q.items.length+' 项已完成');
  note(q.label+' 完成：'+q.loopDone+' 轮 × '+q.items.length+' 项，全部按中文/英文真实声线串接。');
}
function startStudyQueue(rec,block,mode,opts){
  if(!rec||!block){ note('记录还没加载，先刷新地点。'); return false; }
  const o=opts||{};
  const built=buildStudyPlaybackQueue(rec,block,mode,o);
  if(!built.items.length){
    smqCancel('empty_before_start',true);
    const st=built.phraseStats;
    if(mode==='phrases')
      note('本段暂无已确认的中英词组；'+st.total+' 条待补或待确认，未播放任何内容（不把英文当中文播）。');
    else
      note(mode==='enB'?'这一段还没有英文 B；先补充英文说法。':'这一段还没有可朗读内容。');
    setTtsState('idle','没有可播放内容');
    return false;
  }
  smqCancel('restart',true);
  smqIgnoreStoppedUntil=Date.now()+1500;
  const wantLoop=(mode==='full'||mode==='phrases')?Math.max(1,Math.min(20,Number(o.loop||N.tts.loop)||1)):1;
  SMQ={
    id:'smq-'+(++SMQ_SEQ), mode:mode, label:built.label,
    recordId:built.items[0].recordId, blockId:built.items[0].blockId, revision:built.items[0].revision,
    items:built.items, idx:0, loopTotal:wantLoop, loopDone:0,
    gapTimer:null, watchdog:null, awaiting:false, paused:false, pending:null,
    log:[], createdAt:smqNow(), itemStartedAt:0
  };
  N.tts.last={mode:mode,placeId:(N.view&&N.view.placeId)||'',recordId:String(rec.recordId),blockId:String(block.blockId),loop:wantLoop};
  smqLog(SMQ,{ev:'queue_start',mode:mode,loopTotal:wantLoop,items:built.items.length,
    kinds:built.items.map(x=>x.kind).join('>'),recordId:SMQ.recordId,blockId:SMQ.blockId,revision:SMQ.revision,
    phraseTotal:built.phraseStats.total,phrasePlayable:built.phraseStats.playable,phraseMissing:built.phraseStats.missing});
  qa('[data-n05="tts-loop-full"]').forEach(b=>b.classList.toggle('on',wantLoop>1));
  setTtsState(wantLoop>1?'looping':'playing','第 1/'+wantLoop+' 轮 · 0/'+built.items.length+' 项');
  smqSpeakCurrent();
  return true;
}

/* ---------- 原生状态回调：唯一推进来源 ---------- */
let smqIgnoreStoppedUntil=0;
function smTtsOnState(payload){
  let d=payload;
  if(typeof d==='string'){ try{ d=JSON.parse(d); }catch{ return; } }
  if(!d||typeof d!=='object') return;
  const st=String(d.type==='state'?(d.state||''):(d.state||d.type||''));
  if(!st) return;
  const q=SMQ;
  if(st==='error'){
    const code=String(d.code||'TTS_FAILED');
    const msg=String(d.message||'');
    if(!q){ setTtsState('failed',code+(msg?(' · '+msg):'')); return; }
    smqLog(q,{ev:'native_error',code:code,message:msg,retryable:d.retryable===true,idx:q.idx});
    const retryable=d.retryable===true||code==='TTS_REMOTE_REJECTED'||code==='TTS_REMOTE_TIMEOUT'
      ||code==='TTS_REMOTE_UNAVAILABLE'||code==='TTS_ITEM_TIMEOUT';
    q.itemRetries=Number(q.itemRetries)||0;
    if(retryable&&q.itemRetries<3){
      q.itemRetries++;
      const wait=Math.min(9000,Number(d.retryAfterMs)||(900*q.itemRetries));
      q.awaiting=false;
      if(q.watchdog){ clearTimeout(q.watchdog); q.watchdog=null; }
      if(q.gapTimer){ clearTimeout(q.gapTimer); q.gapTimer=null; }
      smqLog(q,{ev:'item_retry',idx:q.idx,attempt:q.itemRetries,waitMs:wait,code:code});
      setTtsState(q.loopTotal>1?'looping':'playing','第 '+(q.loopDone+1)+'/'+q.loopTotal+' 轮 · 第 '+(q.idx+1)+'/'+q.items.length+' 项 · 重试 '+q.itemRetries+'/3（'+code+'）');
      q.gapTimer=setTimeout(()=>{ if(SMQ===q) smqRun(()=>smqSpeakCurrent()); },wait);
      return;
    }
    smqFail(code,msg);
    return;
  }
  if(!q) return;
  if(st==='prepared'||st==='playing'||st==='loop_done'||st==='finished'||st==='paused'||st==='stopped'||st==='resumed')
    smqLog(q,{ev:'native_'+st,idx:q.idx,wallMs:Number(d.wallMs)||0,fileMs:Number(d.fileMs)||0,
      cacheHit:d.cacheHit===true,providerId:String(d.providerId||'')});
  if(st==='finished'&&q.awaiting) return smqAdvance();
  /* 原生被 stop（切后台/系统回收/其它调用方停止）时不能空等超时：
     立刻把这次队列标成「被中断」，保留已完成轮次，让用户知道真实原因。 */
  if(st==='stopped'&&q.awaiting){
    if(Date.now()<smqIgnoreStoppedUntil) return;
    smqLog(q,{ev:'queue_interrupted',reason:'native_stopped',idx:q.idx,round:q.loopDone+1});
    q.finalState='interrupted';
    smqClearTimers(q);
    try{ SMQ_HISTORY.push({mode:q.mode,items:q.items.length,rounds:q.loopDone,state:'interrupted',at:q.createdAt,log:q.log.slice()}); if(SMQ_HISTORY.length>12) SMQ_HISTORY.shift(); }catch{}
    SMQ_LAST=q; SMQ=null;
    setTtsState('failed','朗读被系统中断（已停在第 '+((q.loopDone+1))+'/'+q.loopTotal+' 轮第 '+(q.idx+1)+'/'+q.items.length+' 项）');
    note('朗读被中断：原生朗读已停止（通常是切到后台或被系统回收）。已完成的 '+q.loopDone+' 轮保留，点「听本段」可从本段重播。');
  }
}

function manualSplit(raw){
  const text=String(raw||'');
  const out=[]; let start=0;
  const re=/[^。！？!?\n]+[。！？!?]?/g; let m;
  while((m=re.exec(text))){
    const s=m[0]; const lead=s.length-s.trimStart().length;
    const st=start+lead; const t=s.trim();
    if(t) out.push({index:out.length,text:t,span:{start:st,end:st+t.length}});
    start=m.index+s.length;
  }
  return out.length?out:[{index:0,text:text.trim(),span:{start:0,end:text.trim().length}}];
}
async function memDraft(){
  const rawEl=$('#n05MemRaw');
  const raw=rawEl?String(rawEl.value||''):N.person.raw;
  N.person.raw=raw;
  if(!raw.trim()) return note('请先粘贴或输入要补充的信息。');
  const consent=!!($('#n05AiConsent')&&$('#n05AiConsent').checked);
  N.person.aiConsent=consent;
  N.person.busy=true; N.person.err=''; N.person.code=''; N.person.message=''; N.person.manual=[]; N.person.facts=[];
  if(!N.person.batchId) N.person.batchId='n05ui-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
  renderMem();
  try{
    const d=await demoApi('/v12/api/people/'+encodeURIComponent(N.person.slug)+'/facts/draft',{
      method:'POST', token:uiToken(),
      body:JSON.stringify({rawInput:raw,source:'manual_text',batchId:N.person.batchId,aiConsent:consent,confirm:true})
    });
    N.person.draftId=d.draftId||'';
    N.person.facts=Array.isArray(d.facts)?d.facts:[];
    N.person.manual=Array.isArray(d.manualFallback)?d.manualFallback:[];
    N.person.ai=d.ai||null;
    N.person.code=d.code||'';
    N.person.message=d.message||'';
    N.person.selected={};
    N.person.facts.forEach(f=>{ N.person.selected[f.factId]=!(f.duplicateOf||f.conflict); });
    N.person.err='';
    if(d.code) N.person.code=d.code;
    if(N.person.code&&!N.person.manual.length) N.person.manual=manualSplit(raw);
  }catch(e){
    N.person.code=e&&e.code?String(e.code):'AI_UNAVAILABLE';
    N.person.message=(e&&e.message)||'AI 整理不可用';
    N.person.err=N.person.message;
    N.person.manual=manualSplit(raw);
  }
  N.person.busy=false;
  renderMem();
  if(N.person.facts.length) note('候选 '+N.person.facts.length+' 条；未确认前 0 写入。');
  else if(N.person.code) note('AI_UNAVAILABLE 降级：'+N.person.code+'；原文已保留。');
}
async function memConfirm(){
  const p=N.person;
  if(!p.draftId) return note('还没有可确认的草稿，请先点「AI 整理」。');
  const items=p.facts.map(f=>{
    const on=!!p.selected[f.factId];
    const want=f.action==='replace'?'replace':f.action==='skip'?'skip':'append';
    const action=on?want:'skip';
    const item={factId:f.factId,action:action};
    if(action==='replace') item.targetFactKey=String(p.targets[f.factId]||(f.conflict&&f.conflict.with&&f.conflict.with.factId)||'').trim();
    return item;
  });
  if(!items.some(x=>x.action!=='skip')) return note('没有勾选任何一条，未写入。');
  const key='n05'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  try{
    const d=await demoApi('/v12/api/people/'+encodeURIComponent(p.slug)+'/facts/confirm',{
      method:'POST', token:uiToken(),
      body:JSON.stringify({draftId:p.draftId,idempotencyKey:key,confirm:true,items:items})
    });
    const written=Number(d.written||0);
    note('已写入 '+written+' 条事实；人物主档 SHA '+(d.afterSha256||'').slice(0,12)+'…');
    const slug=p.slug;
    if(typeof openRemotePerson==='function') await openRemotePerson(slug);
  }catch(e){
    p.code=e&&e.code?String(e.code):'CONFIRM_FAILED';
    p.err=(e&&e.message)||'确认写入失败';
    renderMem();
    note('确认失败：'+p.code+' · '+p.err+'；候选与原文都还在，未重复写入。');
  }
}

const SMC={place:[],story:[],app:[],loaded:{},media:{},error:{}};
const SMC_LABEL={place:'地点',story:'关于我',app:'软件作品'};
const SMC_KIND_OK={place:1,story:1,app:1};

function smCardMerge(kind){
  const list=SMC[kind]||[];
  if(kind==='place'){
    const vis=list.filter(c=>!c.deletedAt);
    D.places=D.places.filter(x=>!x.smCard);
    for(const c of vis){
      D.places.push({id:c.id,cnName:c.cnName||c.title||'',enName:c.enName||'',city:c.city||'海口',
        category:c.category||c.cat||'私有地点',cn:c.cn||'',en:c.en||'',photoNote:'我的地点',
        locationCn:'',locationEn:'',mapAmap:'',mapGoogle:'',private:true,smCard:true,
        cardMedia:c.media||[],coverMediaId:c.coverMediaId||''});
    }
    return;
  }
  if(kind==='story'){
    const vis=list.filter(c=>!c.deletedAt);
    SAV.stories=SAV.stories.filter(s=>!s.smCard);
    for(const c of vis){
      const row={id:c.id,title:c.title||c.cnName||'',cn:c.cn||'',en:c.en||'',cat:c.cat||c.category||'生活',tags:c.tags||[],smCard:true,
        cardMedia:c.media||[],coverMediaId:c.coverMediaId||''};
      const hit=SAV.stories.find(s=>String(s.id)===String(c.id));
      if(hit&&!hit.smCard)Object.assign(hit,row);else SAV.stories.push(row);
    }
    try{persist()}catch{}
    return;
  }
  const vis=list.filter(c=>!c.deletedAt);
  D.apps=D.apps.filter(a=>!a.smCard);
  for(const c of vis){
    const row={id:c.id,name:c.title||c.cnName||'',cn:c.cn||'',en:c.en||'',cat:c.cat||'A',
      status:c.status||'',steps:Array.isArray(c.steps)?c.steps:[],private:true,smCard:true,
      cardMedia:c.media||[],coverMediaId:c.coverMediaId||''};
    const hit=D.apps.find(a=>String(a.id)===String(c.id));
    if(hit&&!hit.smCard)Object.assign(hit,row);else D.apps.push(row);
  }
}

async function smCardsLoad(kind,{force=false}={}){
  if(!SMC_KIND_OK[kind])return [];
  if(!window.SocialMateAndroid||!uiToken())return [];
  if(SMC.loaded[kind]&&!force)return SMC[kind];
  try{
    const d=await demoApi('/v12/api/cards?kind='+kind,{token:uiToken()});
    SMC[kind]=Array.isArray(d&&d.cards)?d.cards:[];
    SMC.loaded[kind]=true;
    delete SMC.error[kind];
    smCardMerge(kind);
    /* 卡片是异步拉回来的：合并后必须重绘，否则冷启动看不到已有卡片。 */
    try{ if(typeof render==='function')render(); }catch{}
  }catch(e){
    /* 失败时不锁死：保留重试入口，并在列表顶部显示可重试提示，避免静默空列表。 */
    SMC.loaded[kind]=false;
    SMC.error[kind]=(e&&(e.message||e.code))||String(e)||'读取失败';
    try{ if(typeof render==='function')render(); }catch{}
  }
  return SMC[kind];
}

function smCardById(kind,id){return (SMC[kind]||[]).find(c=>String(c.id)===String(id))}

function smCardMediaUrl(cardId,file){
  const key=cardId+'/'+file;
  if(SMC.media[key])return Promise.resolve(SMC.media[key]);
  return fetch('/v12/media/'+encodeURIComponent(cardId)+'/'+encodeURIComponent(file),
    {headers:{'x-archive-token':uiToken()},cache:'force-cache'})
    .then(r=>r.ok?r.blob():null)
    .then(b=>{
      if(!b)return '';
      const url=URL.createObjectURL(b);
      SMC.media[key]=url;
      return url;
    })
    .catch(()=> '');
}

async function smCardPaintMedia(host,card){
  if(!host||!card)return;
  const id=String(card.id);
  let imgs=[...host.querySelectorAll('[data-smc-card]')].filter(n=>n.getAttribute('data-smc-card')===id);
  if(!imgs.length)imgs=[...host.querySelectorAll('[data-media]')];
  for(const img of imgs){
    const file=img.getAttribute('data-smc-file')||img.getAttribute('data-media');
    if(!file)continue;
    const url=await smCardMediaUrl(id,file);
    if(url){
      img.src=url;img.style.display='block';
      const ph=img.parentElement&&img.parentElement.querySelector('.thumb-ph');
      if(ph)ph.style.display='none';
      const cardEl=img.closest('.placecard');
      if(cardEl)cardEl.classList.remove('noimg');
    }
  }
}

      +(hasData?'离线：正在显示上次数据':'卡片读取失败：'+esc(err))
      +' <button type="button" class="linkbtn" data-act="cards-retry" data-kind="'+esc(kind)+'">重试</button></p>':'';
  }
  if(!SMC_KIND_OK[kind])return;
  const ids={};
  document.querySelectorAll('[data-smc-card]').forEach(n=>{ids[n.getAttribute('data-smc-card')]=1});
  for(const c of (SMC[kind]||[])){
    if(!ids[String(c.id)])continue;
    if(!Array.isArray(c.media)||!c.media.length)continue;
    smCardPaintMedia(document,c);
  }
}

async function smCardSave(kind,id){
  const msg=(text)=>{const el=$('#smCardMsg');if(el)el.textContent=text;tip(text)};
  if(!uiToken())return msg('未配对：请先在设置里完成设备配对');
  const payload=smCardPayload();
  if(!payload.cn&&!payload.en)return msg('中文或英文至少写一项');
  SMC.busy=true;
  try{
    let card=null;
    if(id){
      /* 服务端已强制带 revision：本地缓存没命中时先取单卡，避免直接 400 REVISION_REQUIRED。 */
      let cur=smCardById(kind,id);
      if(!cur||!Number.isFinite(Number(cur.revision))){
        const got=await demoApi('/v12/api/cards/'+kind+'/'+encodeURIComponent(id),{token:uiToken()});
        cur=got&&got.card;
      }
      if(!cur)throw new Error('卡片不存在，可能已被删除');
      const d=await demoApi('/v12/api/cards/'+kind+'/'+encodeURIComponent(id),{
        method:'PATCH',token:uiToken(),
        body:JSON.stringify({revision:Number(cur.revision),patch:payload})});
      card=d&&d.card;
    }else{
      const d=await demoApi('/v12/api/cards',{method:'POST',token:uiToken(),
        body:JSON.stringify({kind:kind,...payload})});
      card=d&&d.card;
    }
    if(!card)throw new Error('保存返回为空');
    const up=await smCardUploadPending(card);
    SMC.loaded[kind]=false;
    await smCardsLoad(kind,{force:true});
    render();
    if(up&&up.fail){
      /* 有图片没传成功：不关闭弹层，#smCardFile 里只留失败的文件供补传。 */
      msg('已保存 '+up.ok+' 张，失败 '+up.fail+' 张：'+(up.reasons.slice(0,3).join('；')||'上传失败')+'。请重新选择剩余图片后再点保存。');
      return;
    }
    msg('已保存');
    closeModal();
    if(kind==='place'&&S.tab==='hainan')render();
  }catch(e){
    msg((e&&e.code?e.code+' · ':'')+((e&&e.message)||'保存失败'));
  }finally{
    SMC.busy=false;
  }
}

/* 单张上传：遇到 429 按服务端 retryAfterMs 自动重试，最多 3 次。 */
async function smCardUploadOne(card,data,onWait){
  let attempt=0;
  for(;;){
    try{
      return await demoApi('/v12/api/cards/'+card.kind+'/'+encodeURIComponent(card.id)+'/media',{
        method:'POST',token:uiToken(),body:JSON.stringify({data:data,mime:'image/jpeg'})});
    }catch(e){
      const code=String((e&&e.code)||'');
      const wait=Math.max(120,Number(e&&e.retryAfterMs)||0)*(attempt>0?1.5:1);
      if((e&&e.status===429||code==='RATE_LIMITED')&&attempt<3){
        attempt++;
        if(typeof onWait==='function')onWait(attempt,Math.round(wait));
        await new Promise(r=>setTimeout(r,wait));
        continue;
      }
      throw e;
    }
  }
}
async function smCardUploadPending(card){
  const input=$('#smCardFile');
  if(!input||!input.files||!input.files.length)return {ok:0,fail:0,reasons:[]};
  const msg=$('#smCardMediaMsg');
  const files=Array.from(input.files).slice(0,12);
  let ok=0,fail=0,reasons=[],failed=[];
  for(let i=0;i<files.length;i++){
    const file=files[i];
    try{
      if(msg)msg.textContent='正在压缩 '+(i+1)+'/'+files.length+'：'+file.name+'…';
      /* Android WebView 不支持 createImageBitmap 的 imageOrientation 选项；
         用 <img> 解码：Chromium 会按 EXIF 自动摆正，Canvas 重绘后即剥离方向/位置等元数据。 */
      const src=URL.createObjectURL(file);
      let bitmap=null;
      try{
        bitmap=await new Promise((resolve,reject)=>{
          const img=new Image();
          img.onload=()=>resolve(img);
          img.onerror=()=>reject(new Error('图片解码失败'));
          img.src=src;
        });
      }finally{
        try{URL.revokeObjectURL(src)}catch{}
      }
      const sw=bitmap.naturalWidth||bitmap.width,sh=bitmap.naturalHeight||bitmap.height;
      if(!sw||!sh)throw new Error('图片尺寸无效');
      const scale=Math.min(1,1600/Math.max(sw,sh));
      const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
      const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.82));
      if(!blob)throw new Error('压缩失败');
      const data=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result||'').replace(/^data:[^;]+;base64,/,''));
        reader.onerror=()=>reject(new Error('读取图片失败'));
        reader.readAsDataURL(blob);
      });
      await smCardUploadOne(card,data,(n,ms)=>{if(msg)msg.textContent='服务器忙，'+(ms/1000).toFixed(1)+' 秒后重试第 '+n+' 次…'});
      ok++;
      if(msg)msg.textContent='已上传 '+(i+1)+'/'+files.length+'：'+file.name;
    }catch(e){
      fail++;failed.push(file);
      reasons.push(file.name+'：'+((e&&(e.message||e.code))||e));
    }
  }
  if(fail&&input){
    /* 只把失败文件留在选择框里，用户补传时不会把已成功的图重复上传。 */
    try{
      const dt=new DataTransfer();
      failed.forEach(f=>dt.items.add(f));
      input.files=dt.files;
    }catch{try{input.value=''}catch{}}
  }
  if(fail&&msg)msg.textContent='已保存 '+ok+' 张，失败 '+fail+' 张：'+reasons.slice(0,3).join('；');
  return {ok:ok,fail:fail,reasons:reasons};
}

/* 私有卡片取 media 文件；公开地点卡回落到固定封面地址。 */
function smCardImageRef(kind,id){
  const c=smCardById(kind,id);
  const media=c&&Array.isArray(c.media)?c.media:[];
  if(media.length){const cov=media.find(m=>String(m.id)===String(c.coverMediaId))||media[0];return {card:c,file:cov.file,private:true}}
  if(kind==='place'){
    const p=source('place',id);
    if(p&&!p.private)return {card:p,private:false,url:'/v12/img/'+encodeURIComponent(p.cityFolder||p.city_folder||'Haikou')+'/'+String(p.id).padStart(3,'0')+'/01.webp'};
  }
  return null;
}
async function smCardShare(kind,id,which){
  const s=smCardSharePayload(kind,id);
  if(which==='zh'){if(!s.cn)return tip('这张卡片还没有中文内容');await copy(s.cn);return tip('中文已复制')}
  if(which==='en'){if(!s.en)return tip('这张卡片还没有英文内容');await copy(s.en);return tip('英文已复制')}
  const ref=smCardImageRef(kind,id);
  if(!ref)return tip('这张卡片还没有可分享的图片；可先复制文字分享');
  const link=ref.private?location.origin+'/v12/media/'+encodeURIComponent(ref.card.id)+'/'+encodeURIComponent(ref.file||'')
    :location.origin+ref.url;
  try{
    let file=null;
    if(ref.private){
      const url=await smCardMediaUrl(ref.card.id,ref.file);
      if(!url)throw new Error('图片读取失败');
      const blob=await fetch(url).then(r=>r.blob());
      file=new File([blob],ref.file||'card.jpg',{type:blob.type||'image/jpeg'});
    }
    const text=[s.cn,s.en].filter(Boolean).join('\n\n');
    if(!navigator.share)throw new Error('当前环境不支持系统分享');
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:s.title||'SocialMate 卡片',text:text,files:[file]});
      return;
    }
    await navigator.share({title:s.title||'SocialMate 卡片',text:text+'\n\n图片：'+link});
  }catch(e){
    if(e&&e.name==='AbortError')return;
    await copy((s.en||s.cn||'')+'\n\n图片：'+link+'（需在已配对的 SocialMate 内打开）');
    tip('系统分享不可用，已复制英文与图片说明');
  }
}

/* 离线优先：地点详情先渲染上次成功缓存，再后台刷新；弱网/断网时不再空白等半天。 */
function smPlaceCacheKey(id){return 'sm.place.cache.v1.'+id}
function smPlaceCacheRead(id){
  try{
    const raw=localStorage.getItem(smPlaceCacheKey(id)); if(!raw) return null;
    const o=JSON.parse(raw); if(!o||!o.detail||typeof o.detail!=='object') return null;
    return o;
  }catch{return null}
}
function smPlaceCacheWrite(id,d){
  try{localStorage.setItem(smPlaceCacheKey(id),JSON.stringify({savedAt:Date.now(),detail:d}))}catch{}
}
/* 缓存时间按本机时区显示；直接 toISOString 会显示成 UTC，比本地时间少 8 小时。 */
function smLocalStamp(ms){
  const d=new Date(Number(ms)||0),p=n=>String(n).padStart(2,'0');
  if(!Number.isFinite(d.getTime()))return '';
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
async function loadPlace(placeId){
  const id=String(placeId||'');
  const cached=smPlaceCacheRead(id);
  N.place.id=id; N.place.err=''; N.place.cacheError='';
  N.place.cachedAt=cached?Number(cached.savedAt)||0:0;
  if(cached){ N.place.detail=cached.detail; N.place.loading=false; N.place.stale=true; }
  else { N.place.detail=null; N.place.loading=true; N.place.stale=false; }
  paintPlaceHost();
  try{
    const d=await apiCall('/v12/api/places/'+encodeURIComponent(id));
    N.place.detail=d; N.place.err=''; N.place.stale=false;
    smPlaceCacheWrite(id,d);
    try{ N.place.unassigned=await apiCall('/v12/api/places/unassigned'); }catch{ N.place.unassigned=null; }
  }catch(e){
    if(!N.place.detail){
      N.place.err=(e&&e.code?e.code+' · ':'')+((e&&e.message)||'读取地点档案失败');
    }else{
      N.place.stale=true; N.place.cacheError=(e&&e.message)||'';
    }
  }
  N.place.loading=false;
  paintPlaceHost();
}

async function saveBlocks(rec,blocks,opts){

  try{
    const body={rawInput:rec.rawInput,source:rec.source||'manual_text',confirm:true,revision:Number(rec.revision),recordId:rec.recordId};
    if(o.rebuildBlocks && !Array.isArray(blocks)){ body.rebuildBlocks=true; }
    else { body.blocks=blocks; body.rebuildBlocks=true; }
    const d=await demoApi('/v12/api/places/'+encodeURIComponent(N.view.placeId)+'/records',{
      method:'POST', token:uiToken(), body:JSON.stringify(body)
    });
    N.view.busy=false;

    await loadPlace(N.view.placeId);
    const nr=placeRecord(N.view.placeId,N.view.recordId);
    if(nr) renderRecord(nr); else renderRecord(rec);
    return true;
  }catch(e){
    N.view.busy=false;
    N.view.err=(e&&e.code?e.code+' · ':'')+((e&&e.message)||'保存失败');
    if(e&&e.code==='REVISION_CONFLICT') N.view.err+=' 你的原文与分段仍在，点「查看完整原文」可保稿。';
    const nr=currentRecord();
    if(nr) renderRecord(nr); else renderRecord(rec);
    note('保存失败：'+N.view.err);
    return false;
  }
}
function mergeBlocks(rec,i){
  const blocks=rec.blocks||[];
  const a=blocks[i],b=blocks[i+1];
  if(!b) return note('已经是最后一段，无法合并。');
  const gap=String(rec.rawInput).slice(a.sourceSpan.end,b.sourceSpan.start);
  const cn=(a.cnSentences||[]).slice();
  // 句数守恒：段间空隙（段落分隔）前挂到后一段首句，不能把两段末/首句并成一句，
  // 否则后端按原文句子数校验会判 SEGMENT_LOSS_DETECTED。
  if((b.cnSentences||[]).length) cn.push(gap+b.cnSentences[0]);
  if((b.cnSentences||[]).length>1) cn.push.apply(cn,b.cnSentences.slice(1));
  const span={start:a.sourceSpan.start,end:b.sourceSpan.end};
  const merged=Object.assign({},a,{
    sourceSpan:span,sourceText:String(rec.rawInput).slice(span.start,span.end),cnSentences:cn,
    enVariants:((a.enVariants||[]).concat(b.enVariants||[])).slice(0,2),
    phrases:Array.from(new Set((a.phrases||[]).concat(b.phrases||[]))),
    contentRevision:Number(rec.revision)+1,originalChanged:false,
    needsTranslation:!(((a.enVariants||[]).length)||((b.enVariants||[]).length))
  });
  const next=blocks.slice(0,i).concat([merged]).concat(blocks.slice(i+2)).map((x,j)=>Object.assign({},x,{order:j}));
  saveBlocks(rec,next);
}
function splitBlock(rec,i){
  const blocks=rec.blocks||[];
  const b=blocks[i];
  if(!b||(b.cnSentences||[]).length<2) return note('这一段只有一句，无法再拆。');
  const k=Math.ceil((b.cnSentences||[]).length/2);
  const cn1=(b.cnSentences||[]).slice(0,k), cn2=(b.cnSentences||[]).slice(k);
  const len1=cn1.join('').length;
  const span1={start:b.sourceSpan.start,end:b.sourceSpan.start+len1};
  const span2={start:b.sourceSpan.start+len1,end:b.sourceSpan.end};
  const mk=(cn,span,order,en)=>Object.assign({},b,{
    blockId:'blk-'+(order+1)+'-'+Math.random().toString(36).slice(2,10),order:order,
    sourceSpan:span,sourceText:String(rec.rawInput).slice(span.start,span.end),cnSentences:cn,
    enVariants:en,phrases:[],contentRevision:Number(rec.revision)+1,originalChanged:false,
    needsTranslation:!en.length
  });
  const enA=(b.enVariants||[])[0]||'', enB=(b.enVariants||[])[1]||'';
  const next=blocks.slice(0,i).concat([mk(cn1,span1,i,enA?[enA]:[]),mk(cn2,span2,i+1,enB?[enB]:[])])
    .concat(blocks.slice(i+1)).map((x,j)=>Object.assign({},x,{order:j}));
  saveBlocks(rec,next);
}

    '流程：1) 先用中文考我目标短语，我只答一种即可；2) 等我的英文回答；3) 用中文说整段，我用一种自然表达完整说出即可，另一种只作提醒；4) 最后给改进和复盘，复盘里带上 recordId/blockId/contentRevision。'
  ].join('\n');
}
function promptMetaOf(text){
  const s=String(text||'');
  const pick=(k)=>{ const m=s.match(new RegExp('^'+k+'=(.+)$','m')); return m?m[1].trim():''; };
  return {recordId:pick('recordId'),blockId:pick('blockId'),revision:Number(pick('contentRevision')||0)};
}
async function copyText(text,label,meta){
  N.lastPrompt=text; window.__n05LastPrompt=text;
  const m=meta||promptMetaOf(text);
  let ok=false, readback=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok=true; } }catch{}
  if(!ok){
    try{
      const ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      ok=document.execCommand('copy'); ta.remove();
    }catch{}
  }
  if(!ok&&navigator.share){
    try{ await navigator.share({title:'GPT 语音练习 Prompt',text:text}); ok=true; }catch{}
  }
  if(ok&&navigator.clipboard&&typeof navigator.clipboard.readText==='function'){
    try{
      const back=await navigator.clipboard.readText();
      const bm=promptMetaOf(back);
      readback=String(back)===String(text)||(bm.recordId===m.recordId&&bm.blockId===m.blockId&&Number(bm.revision)===Number(m.revision));
    }catch{}
  }
  // Android WebView 不给网页 clipboard-read 权限；原生桥只回答「剪贴板是否与这段文本完全一致」，
  // 不把剪贴板内容回传网页，避免带出别的 App 的隐私。
  if(ok&&!readback&&window.SocialMateAndroid&&typeof window.SocialMateAndroid.clipboardMatches==='function'){
    try{ const r=JSON.parse(window.SocialMateAndroid.clipboardMatches(String(text))); readback=!!(r&&r.match); }catch{}
  }
  // WebView 常拒绝 execCommand('copy')：改由原生写入并当场回读比对（只写这段 Prompt）。
  if(!ok&&window.SocialMateAndroid&&typeof window.SocialMateAndroid.copyToClipboard==='function'){
    try{ const r=JSON.parse(window.SocialMateAndroid.copyToClipboard(String(text))); ok=!!(r&&r.ok); readback=!!(r&&r.match); }catch{}
  }
  if(ok&&m.recordId&&m.blockId) N.promptMeta[promptKey(m.recordId,m.blockId)]={revision:Number(m.revision||1),verified:readback,at:Date.now()};
  note(ok?(readback?'已复制并回读校验通过（recordId/blockId/revision 一致）；可粘贴到 ChatGPT Voice。':'已复制；当前 WebView 未允许回读剪贴板，请粘贴后核对归属字段。'):'复制失败：请长按下方 Prompt 手动复制。');
  return {ok,readback};
}
function promptKey(recordId,blockId){ return String(recordId||'')+'|'+String(blockId||''); }
function promptRevisionFor(rec,b){
  const key=promptKey(rec.recordId,b.blockId);
  const m=N.promptMeta&&N.promptMeta[key];
  return m&&Number(m.revision)>0?Number(m.revision):Number(rec.revision||1);
}

  modal('<h2>回贴复盘 · 第 '+((rec.blocks||[]).indexOf(b)+1)+'/'+rec.blocks.length+' 段</h2>'
    +'<p class="n05mini">先确认归属：recordId='+esc(rec.recordId)+' · blockId='+esc(b.blockId)+' · contentRevision='+rev+(stale?'（Prompt 生成时的旧版本；保存后会标 stale-version，旧报告不覆盖）':'')+'</p>'
    +'<label class="n05label">本次结果</label><select id="n05PrResult" class="n05field small"><option value="review">需复习</option><option value="pass">通过</option></select>'
    +'<label class="n05label">薄弱表达（逗号分隔）</label><input id="n05PrWeak" class="n05field small" value="'+esc((b.weakPhrases||[]).map(x=>x.phrase||x).join('、'))+'">'
    +'<label class="n05label">下次重点</label><input id="n05PrNext" class="n05field small" placeholder="例如：把 have been to 说顺">'
    +'<label class="n05label">ChatGPT 复盘原文</label><textarea id="n05PrReport" class="n05field" style="min-height:150px" placeholder="粘贴 ChatGPT 的总结…"></textarea>'
    +'<label class="n05check"><input type="checkbox" id="n05PrConfirm"> 我已核对归属段与内容版本，旧报告不会被覆盖。</label>'
    +'<p class="n05mini" data-n05-msg>'+esc(N.msg)+'</p>'
    +'<div class="n05row"><button type="button" class="btn" data-action="close">取消</button>'
    +'<button type="button" class="btn mainbtn" data-n05="practice-save" data-record="'+esc(rec.recordId)+'" data-i="'+esc(String((rec.blocks||[]).indexOf(b)))+'">保存复盘</button></div>');
}
async function practiceSave(recordId,i){
  const rec=placeRecord(N.view.placeId,recordId);
  if(!rec) return note('记录不存在，无法保存复盘。');
  const b=(rec.blocks||[])[Number(i)];
  if(!b) return note('段不存在。');
  if(!($('#n05PrConfirm')&&$('#n05PrConfirm').checked)) return note('请先勾选“已核对归属段与版本”。');
  const rawEl=$('#n05PrReport');
  const raw=String((rawEl&&rawEl.value)||'').trim();
  if(raw.length<4) return note('复盘内容太短，请粘贴 ChatGPT 的总结。');
  const result=($('#n05PrResult')&&$('#n05PrResult').value)==='pass'?'pass':'review';
  const next=String(($('#n05PrNext')&&$('#n05PrNext').value)||'').trim();
  const weak=String(($('#n05PrWeak')&&$('#n05PrWeak').value)||'').split(/[,，、;；\n]+/).map(x=>x.trim()).filter(Boolean);
  const full='结果：'+(result==='pass'?'通过':'需复习')+'\n下次重点：'+(next||'—')+'\n薄弱表达：'+(weak.join('、')||'—')+'\n---\n'+raw;
  const promptRevision=promptRevisionFor(rec,b);
  N.practice.busy=true;
  try{
    const d=await demoApi('/v12/api/places/'+encodeURIComponent(N.view.placeId)+'/records/'+encodeURIComponent(recordId)+'/blocks/'+encodeURIComponent(b.blockId)+'/practice',{
      method:'POST', token:uiToken(),
      body:JSON.stringify({confirm:true,contentRevision:promptRevision,rawReport:full,weakPhrases:weak,status:'confirmed',practiceTime:new Date().toISOString()})
    });
    const rep=d&&d.report?d.report:null;
    if(rep) rememberReport(N.view.placeId,recordId,b.blockId,{
      reportId:rep.reportId,contentRevision:rep.contentRevision,practiceTime:rep.practiceTime,
      status:rep.status,result:result,next:next,weakPhrases:weak,rawReport:full
    });
    N.practice.busy=false;
    if(typeof closeModal==='function') closeModal();
    await loadPlace(N.view.placeId);
    const nr=placeRecord(N.view.placeId,recordId);
    if(nr) renderRecord(nr);
    note(rep&&rep.status==='stale-version'
      ?'复盘已独立保存为旧版本报告（stale-version）；当前记录已更新，旧报告未被覆盖。'
      :'复盘已独立保存；同段两次报告并列可见，旧报告不被覆盖。');
  }catch(e){
    N.practice.busy=false;
    note('复盘保存失败：'+((e&&e.code)||'')+' · '+((e&&e.message)||''));
  }
}

/* ===================== 事件 ===================== */
document.addEventListener('click',e=>{
  const el=e.target&&e.target.closest?e.target.closest('[data-n05]'):null;
  if(!el) return;
  const act=el.dataset.n05;
  const i=Number(el.dataset.i);
  const rec=currentRecord();
  switch(act){
    case 'mem-open': memStart(el.dataset.slug,el.dataset.name||''); break;
    case 'mem-back': { const slug=el.dataset.slug||N.person.slug; if(typeof openRemotePerson==='function') openRemotePerson(slug); break; }
    case 'mem-draft': memDraft(); break;
    case 'mem-confirm': memConfirm(); break;
    case 'mem-voice': note('App 内请用系统录音面板转写后粘贴到这里；浏览器预览不显示语音输入。'); break;
    case 'mem-flag': {
      const id=el.dataset.id; const f=(N.person.facts||[]).find(x=>x.factId===id);
      if(f){ if(el.dataset.kind==='dup') f.duplicateOf=f.duplicateOf?null:{manual:true,text:'你标记为重复'}; else f.conflict=f.conflict?null:{manual:true,with:{text:'你标记为矛盾'},options:['append','replace','cancel']}; renderMem(); }
      break;
    }
    case 'place-reload': loadPlace(el.dataset.place||N.place.id); break;
    case 'rec-new': recStart(el.dataset.place||N.place.id); break;
    case 'rec-back': { const pid=el.dataset.place||N.place.id; if(typeof openDetail==='function') openDetail('place',pid); setTimeout(()=>loadPlace(pid),20); break; }
    case 'rec-match': recMatch(); break;
    case 'rec-use-current': N.rec.chosen=String(el.dataset.place||N.rec.placeId||''); N.rec.candidates=[]; renderRecEditor(); note('已选当前地点 placeId '+N.rec.chosen); break;
    case 'rec-cancel-match': N.rec.chosen=''; N.rec.candidates=[]; N.rec.matches=null; renderRecEditor(); note('已取消匹配；可暂存未归属。'); break;
    case 'rec-manual-place': {
      const v=String(($('#n05ManualPlace')&&$('#n05ManualPlace').value)||'').trim();
      const n=Number(v);
      if(!/^\d{1,3}$/.test(v)||n<1||n>115) return note('placeId 必须是 1–115 的整数。');
      N.rec.chosen=String(n); N.rec.candidates=[]; N.rec.matches=null; renderRecEditor(); note('已手选 placeId '+n+'；保存后记录只落这个地点。');
      break;
    }
    case 'rec-save': recSave(false); break;
    case 'rec-unassigned': recSave(true); break;
    case 'rec-open': {
      const pid=String(el.dataset.place||''), rid=String(el.dataset.record||'');
      (async()=>{ if(!N.place.detail||String(N.place.id)!==pid) await loadPlace(pid); openRecord(pid,rid); })();
      break;
    }
    case 'rec-raw': {
      const r=placeRecord(N.view.placeId,N.view.recordId);
      if(r) modal('<h2>完整原文（逐字）</h2><div class="n05raw">'+esc(r.rawInput||'')+'</div><div class="n05row"><button type="button" class="btn" data-action="close">关闭</button></div>');
      break;
    }
    case 'rec-reset-seg': { const r=currentRecord(); if(r) saveBlocks(r,null,{rebuildBlocks:true}); break; }
    case 'rec-merge': if(rec) mergeBlocks(rec,i); break;
    case 'rec-split': if(rec) splitBlock(rec,i); break;
    case 'rec-edit-en': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      modal('<h2>编辑第 '+(i+1)+' 段英文 / 表达</h2>'
        +'<p class="n05mini">中文原句只读，原文与 sourceSpan 不变；只改英文说法与目标短语。</p>'
        +'<label class="n05label">英文 A</label><textarea id="n05EnA" class="n05field small">'+esc((b.enVariants||[])[0]||'')+'</textarea>'
        +'<label class="n05label">英文 B</label><textarea id="n05EnB" class="n05field small">'+esc((b.enVariants||[])[1]||'')+'</textarea>'
        +'<label class="n05label">目标短语（逗号或顿号分隔）</label><input id="n05Phrases" class="n05field small" value="'+esc((b.phrases||[]).join('、'))+'">'
        +'<div class="n05row"><button type="button" class="btn" data-action="close">取消</button>'
        +'<button type="button" class="btn mainbtn" data-n05="save-en" data-record="'+esc(rec.recordId)+'" data-i="'+i+'">保存</button></div>');
      break;
    }
    case 'save-en': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      const enA=String(($('#n05EnA')&&$('#n05EnA').value)||'').trim();
      const enB=String(($('#n05EnB')&&$('#n05EnB').value)||'').trim();
      const phrases=String(($('#n05Phrases')&&$('#n05Phrases').value)||'').split(/[,，、;；]+/).map(x=>x.trim()).filter(Boolean);
      const en=[enA,enB].filter(Boolean);
      const next=(rec.blocks||[]).map((x,j)=>Object.assign({},x,{
        enVariants:j===i?en:x.enVariants,phrases:j===i?phrases:x.phrases,
        contentRevision:Number(rec.revision)+1,originalChanged:false,needsTranslation:j===i?!en.length:x.needsTranslation
      }));
      if(typeof closeModal==='function') closeModal();
      saveBlocks(rec,next);
      break;
    }
    case 'bulk-en': {
      if(!rec) break;
      modal('<h2>批量英文 A / B</h2><p class="n05mini">每行一段：段号|英文A|英文B。段号从 1 开始；留空表示待补充。</p>'
        +'<textarea id="n05BulkEn" class="n05field" style="min-height:180px" placeholder="1|English A|English B"></textarea>'
        +'<div class="n05row"><button type="button" class="btn" data-action="close">取消</button>'
        +'<button type="button" class="btn mainbtn" data-n05="save-bulk-en" data-record="'+esc(rec.recordId)+'">应用并保存</button></div>');
      break;
    }
    case 'save-bulk-en': {
      if(!rec) break;
      const text=String(($('#n05BulkEn')&&$('#n05BulkEn').value)||'');
      const map={};
      text.split('\n').forEach(line=>{ const p=line.split('|'); if(p.length>=2){ const n=Number(p[0]); if(n>=1) map[n-1]=[String(p[1]||'').trim(),String(p[2]||'').trim()].filter(Boolean); } });
      const next=(rec.blocks||[]).map((x,j)=>Object.assign({},x,{
        enVariants:map[j]||[],contentRevision:Number(rec.revision)+1,originalChanged:false,needsTranslation:!(map[j]&&map[j].length)
      }));
      if(typeof closeModal==='function') closeModal();
      saveBlocks(rec,next);
      break;
    }
    case 'tts': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      N.tts.cur=i;
      renderRecord(rec);
      startStudyQueue(rec,b,String(el.dataset.ttsLang||'zh'),{loop:1});
      break;
    }
    case 'tts-full': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      N.tts.cur=i;
      renderRecord(rec);
      startStudyQueue(rec,b,'full',{loop:1});
      break;
    }
    case 'tts-loop-full': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      N.tts.cur=i;
      renderRecord(rec);
      startStudyQueue(rec,b,'full',{loop:Math.max(1,Number(N.tts.loop)||1)});
      note('循环播放 '+Math.max(1,Number(N.tts.loop)||1)+' 次');
      setTimeout(()=>{qa('[data-n05="tts-loop-full"]').forEach(x=>x.classList.add('on'))},40);
      break;
    }
    /* 旧按钮语义（只循环中文的单文本循环）已废弃；保留别名，一律升级为完整混合队列。 */
    case 'tts-loop-seg': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      N.tts.cur=i;
      renderRecord(rec);
      startStudyQueue(rec,b,'full',{loop:Math.max(1,Number(N.tts.loop)||1)});
      break;
    }
    case 'tts-stop': {
      smqCancel('用户点停止');
      note('已停止朗读；排队中的请求与回调已全部取消。');
      setTtsState('idle','已停止');
      break;
    }
    case 'tts-pause': {
      if(smPauseAudio()){
        if(SMQ){ SMQ.paused=true; if(SMQ.watchdog){ clearTimeout(SMQ.watchdog); SMQ.watchdog=null; } }
        setTtsState('paused',SMQ?('第 '+(SMQ.idx+1)+'/'+SMQ.items.length+' 项'):'');
        note('已暂停；点「继续」从当前项接着播。');
        break;
      }
      const b=ttsBridge();
      if(!b||typeof b.pause!=='function'){ note('当前版本原生桥不支持暂停；请用「停止」后重播。'); break; }
      const r=bridgeResult(b.pause());
      if(r&&r.ok===false){ note('暂停失败：'+String(r.code||r.message||'')); break; }
      if(SMQ){ SMQ.paused=true; if(SMQ.watchdog){ clearTimeout(SMQ.watchdog); SMQ.watchdog=null; } }
      setTtsState('paused',SMQ?('第 '+(SMQ.idx+1)+'/'+SMQ.items.length+' 项'):'');
      note('已暂停；点「继续」从当前项接着播。');
      break;
    }
    case 'tts-resume': {
      if(smResumeAudio()){
        if(SMQ){
          SMQ.paused=false;
          const item=SMQ.items[SMQ.idx];
          if(item) smqWatchdog(SMQ,item);
          const pending=SMQ.pending; SMQ.pending=null;
          if(pending) pending();
        }
        setTtsState(SMQ&&SMQ.loopTotal>1?'looping':'playing',SMQ?('第 '+(SMQ.loopDone+1)+'/'+SMQ.loopTotal+' 轮 · 第 '+(SMQ.idx+1)+'/'+SMQ.items.length+' 项'):'');
        note('继续播放。');
        break;
      }
      const b=ttsBridge();
      if(!b||typeof b.resume!=='function'){ note('当前版本原生桥不支持继续。'); break; }
      const r=bridgeResult(b.resume());
      if(r&&r.ok===false){ note('继续失败：'+String(r.code||r.message||'')); break; }
      if(SMQ){
        SMQ.paused=false;
        const item=SMQ.items[SMQ.idx];
        if(item) smqWatchdog(SMQ,item);
        const pending=SMQ.pending; SMQ.pending=null;
        if(pending) pending();
      }
      setTtsState(SMQ&&SMQ.loopTotal>1?'looping':'playing',SMQ?('第 '+(SMQ.loopDone+1)+'/'+SMQ.loopTotal+' 轮 · 第 '+(SMQ.idx+1)+'/'+SMQ.items.length+' 项'):'');
      note('继续播放。');
      break;
    }
    case 'tts-retry': {
      const last=N.tts.last;
      if(!last){ note('还没有可重试的朗读。'); break; }
      const rr=currentRecord();
      const bb=rr&&(rr.blocks||[]).find(x=>String(x.blockId)===String(last.blockId));
      if(!rr||!bb){ note('记录已变化，找不到上次朗读的那一段；请重新进入记录。'); break; }
      N.tts.cur=(rr.blocks||[]).indexOf(bb);
      renderRecord(rr);
      startStudyQueue(rr,bb,last.mode||'full',{loop:last.loop||1});
      break;
    }
    case 'seg': {
      if(!rec) break;
      smqCancel('切换段落',true);
      const dir=el.dataset.dir;
      const next=Math.max(0,Math.min((rec.blocks||[]).length-1,i+(dir==='next'?1:-1)));
      N.tts.cur=next;
      renderRecord(rec);
      setTtsState('idle','已切到第 '+(next+1)+' 段');
      if(next!==i) note('已切到第 '+(next+1)+'/'+rec.blocks.length+' 段；旧朗读队列已停止。');
      break;
    }
    case 'prompt-copy': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      const prompt=buildPrompt(rec,b);
      copyText(prompt,'第 '+(i+1)+' 段 Prompt',{recordId:rec.recordId,blockId:b.blockId,revision:Number(rec.revision||1)}); break;
    }
    case 'practice-open': {
      if(!rec) break;
      const b=(rec.blocks||[])[i]; if(!b) break;
      N.view.recordId=String(rec.recordId);
      practiceOpen(rec,b); break;
    }
    case 'practice-save': practiceSave(el.dataset.record,i); break;
  }
},false);

document.addEventListener('change',e=>{
  if(e.target&&e.target.name==='n05cand'){ N.rec.chosen=String(e.target.value); note('已手选 placeId '+N.rec.chosen+'，保存前仍可取消。'); return; }
  const el=e.target&&e.target.closest?e.target.closest('[data-n05]'):null;
  if(!el) return;
  const act=el.dataset.n05,id=el.dataset.id;
  if(act==='mem-pick'){
    const next=!N.person.selected[id];
    N.person.selected[id]=next;
    const f=(N.person.facts||[]).find(x=>x.factId===id);
    if(f&&next&&f.action==='skip') f.action='append';
    const host=$('#drawerbody'); if(host) renderMem();
  }
  else if(act==='mem-group'){ const f=(N.person.facts||[]).find(x=>x.factId===id); if(f){ f.group=el.value; f.groupLabel=(GROUPS.find(g=>g[0]===el.value)||[])[1]||f.group; } }
  else if(act==='mem-action'){ const f=(N.person.facts||[]).find(x=>x.factId===id); if(f) f.action=el.value; }
  else if(act==='tts-rate'){ N.tts.rate=Number(el.value)||1; try{ if(ttsBridge()&&ttsBridge().setRate) ttsBridge().setRate(N.tts.rate); }catch{} note('语速 '+N.tts.rate+'×'); }
  else if(act==='tts-loop'){ N.tts.loop=Number(el.value)||1; qa('[data-n05="tts-loop-full"]').forEach(b=>{ b.textContent='循环 ×'+N.tts.loop; }); note('循环 '+N.tts.loop+' 次'); }
},false);

document.addEventListener('input',e=>{
  const el=e.target;
  if(!el) return;
  if(el.id==='n05MemRaw'){ N.person.raw=String(el.value||''); return; }
  if(el.id==='n05RecRaw'){ N.rec.raw=String(el.value||''); return; }
  if(el.dataset&&el.dataset.n05==='mem-value'){
    const f=(N.person.facts||[]).find(x=>x.factId===el.dataset.id);
    if(f) f.value=String(el.value||'');
    return;
  }
  if(el.dataset&&el.dataset.n05==='mem-target'){
    N.person.targets[el.dataset.id]=String(el.value||'');
  }
});
