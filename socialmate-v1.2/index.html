oseDrawer" aria-label="关闭详情">×</button></div><div class="drawerbody" id="drawerbody"></div></aside><div id="modalbg" class="modalbg"><div class="modal" id="modalcontent"></div></div><div id="toast" class="toast" aria-live="polite"></div><script type="application/json" id="dataset">{"apps": [{"id": "P002", "name": "人生物种测试 · Personality Quiz", "cat": "A", "cn": "这是我做的一个趣味性格测试软件。我觉得很多人其实不太清楚自己是什么性格、喜欢什么样的生活，所以想通过一些简单有趣的问题，帮大家更好地认识自己。做完测试后，还可以跟朋友分享结果，看看彼此有什么不同。", "en": "I made this fun personality quiz to help people understand themselves a little better. You answer some simple questions, and it gives you insights into your personality and preferences. It’s also a fun way to compare results with friends and learn more about each other.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "介绍测评主题", "detail": "先告诉朋友这是一个了解性格的趣味测评。", "en": "This is a fun quiz about personality and preferences."}, {"n": 2, "cn": "展示问题", "detail": "打开可用题目，读一条你觉得有趣的问题。", "en": "Here’s the kind of question it asks."}, {"n": 3, "cn": "解释答题", "detail": "用一两个问题解释你会怎样选择答案。", "en": "I choose the answer that feels most like me."}, {"n": 4, "cn": "展示讨论", "detail": "如果实际版本提供结果页，展示结果并与朋友讨论。", "en": "We can talk about the results and see what we have in common."}]}, {"id": "P005", "name": "亲缘图谱 · Family Tree", "cat": "A", "cn": "这是一个整理家庭成员关系的软件。比如家里亲戚太多，碰到远房亲戚不知道怎么称呼，就可以在里面查。它能把几代人的关系画成家族图谱，还可以保存家人的照片，特别适合大家族。", "en": "I built a family tree app that helps you keep track of your relatives. In Chinese families, there are so many different names for relatives, and it can get really confusing. My app figures out how people are related and what you should call them. You can also add family photos and explore your whole family tree.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "建立家族成员：在成员管理里新增姓名和亲属资料。", "detail": "", "en": "First, I add family members and their details."}, {"n": 2, "cn": "连接亲属关系：把父母、配偶和兄弟姐妹的关系录进去。", "detail": "", "en": "Then I connect people as parents, partners, or siblings."}, {"n": 3, "cn": "查询称呼：选择两位家人，查看彼此应该怎么称呼。", "detail": "", "en": "I can pick any two people and see how they are related and what they should call each other."}, {"n": 4, "cn": "展示家族图：缩放关系图，点开照片，或导出图谱分享。", "detail": "", "en": "And here’s the family tree. I can zoom in, look at photos, and export it to share."}]}, {"id": "P011", "name": "我的地点 · My Places", "cat": "A", "cn": "这是我做的一个私人地点手账。比如我发现一家不错的咖啡馆，或者去了一个很漂亮的地方，就可以把照片、地点和自己的感受记录下来。以后想回忆或者推荐给朋友，直接打开就能找到。", "en": "I made this app to keep track of places I’ve visited. Whenever I find a nice café, a beautiful spot, or somewhere interesting, I can save photos and write a few notes about it. Later, I can easily find those places again or share my favorites with friends. It’s basically my personal travel and lifestyle journal.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "记录地点：进入记录页，选地点、上传照片、写下感受。", "detail": "", "en": "I tap the record section, choose a place, add some photos, and write a few notes."}, {"n": 2, "cn": "浏览回忆：切换画廊或地点视图，看看去过的地方。", "detail": "", "en": "Here I can browse my memories as a gallery or by location."}, {"n": 3, "cn": "寻找地点：在搜索页输入关键词，搭配地区或类型筛选。", "detail": "", "en": "If I want to find a place again, I just search for it and add filters."}, {"n": 4, "cn": "分享地点：选一条记录生成分享卡片或只读链接。", "detail": "", "en": "And I can share a place with a friend without sharing my private notes."}]}, {"id": "P016", "name": "懒得打字 · Speak Instead of Typing", "cat": "A", "cn": "这是我做的一款语音翻译输入软件。比如我跟外国朋友聊天，想表达一段比较复杂的意思，但英语不够好，就直接用中文说出来。它会帮我整理成自然的英语，直接填到微信或者其他聊天软件里，不用反复复制粘贴。", "en": "I built this app because I wanted an easier way to chat with international friends. Instead of typing in English, I can just speak Chinese, and the app turns what I say into natural English and puts it directly into my chat. It also works for other languages, reviews, and journal entries. It makes communicating in another language a lot easier.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "选择模式：打开悬浮工具，选直翻外语或口语查询。", "detail": "", "en": "I open the floating tool and pick the translation mode."}, {"n": 2, "cn": "语音输入：在聊天输入框里说出中文。", "detail": "", "en": "Then I simply speak Chinese while I’m in a chat."}, {"n": 3, "cn": "查看结果：软件整理出自然的外语表达，可按需核对。", "detail": "", "en": "It turns what I said into more natural English, and I can check the result."}, {"n": 4, "cn": "写回聊天：把结果写进当前输入框，再自行检查发送。", "detail": "", "en": "The translation goes back into the chat box, and I can review it before sending."}]}, {"id": "P019", "name": "拍照点助手 · Photo Spot Finder", "cat": "A", "cn": "这个软件主要是帮助喜欢拍照的人整理和寻找拍摄地点。比如刷到别人拍得很漂亮的照片，我希望能够方便地找到拍摄地点、保存参考照片，出门拍照时就不用临时到处找地方。", "en": "This is a project I’ve been working on for people who love photography. The idea is to help you discover interesting photo spots and organize your shooting locations and reference photos. That way, when you go out to take pictures, you already have some good places in mind.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "展示参考照片", "detail": "打开已有拍摄参考图，说明你想模仿的感觉。", "en": "I save photo references so I can plan a shoot."}, {"n": 2, "cn": "解释选地点", "detail": "结合参考图讲述自己为什么选择这个地点。", "en": "This helps me decide where I want to take photos."}, {"n": 3, "cn": "整理拍摄准备", "detail": "展示实际存在的地点或参考图记录；若尚无界面，用现有素材讲述思路。", "en": "I keep my location ideas and photo references together."}, {"n": 4, "cn": "对照拍摄成品", "detail": "拿出手机里已经拍摄的实拍照片与参考图比较。", "en": "Here’s how the actual photo turned out."}]}, {"id": "P020", "name": "拉伸换边计时器 · Stretch Timer", "cat": "A", "cn": "我平时拉伸的时候，经常需要左右两边轮流做动作，但每次都要自己看时间，所以做了这个软件。只要设置好时间，它就会自动倒计时，到时间提醒换边，还可以播放提示音和背景音乐。", "en": "I built this because I do a lot of stretching, and I got tired of constantly checking the time. You just set how long you want to stretch each side, and the app automatically tells you when to switch. It also has different sounds and background music, so you can focus on stretching instead of watching the clock.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "设置计时：选择单侧时长和训练总时长。", "detail": "", "en": "First, I choose how long to stretch each side and the total session time."}, {"n": 2, "cn": "开始拉伸：点开始，跟着倒计时动作。", "detail": "", "en": "I tap Start and follow the countdown."}, {"n": 3, "cn": "自动换边：听到提醒后换到另一边，无需自己重设秒表。", "detail": "", "en": "When it makes a sound, I switch sides. I don’t need to restart the timer."}, {"n": 4, "cn": "查看记录：结束后打开历史页回顾训练。", "detail": "", "en": "Afterwards, I can check my workout history."}]}, {"id": "P025", "name": "拉伸训练 · Stretch Routine", "cat": "A", "cn": "这是一个帮助自己规律做拉伸的软件。我希望把常见的拉伸动作和训练安排整理好，这样每天打开手机就可以照着练，不用每次都重新找教程。", "en": "I started this app to make daily stretching easier. The idea is to organize stretching exercises into simple routines, so you can just open the app and follow along instead of searching for different videos every time. It’s all about making stretching a regular habit.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "介绍训练目标", "detail": "告诉朋友这一套拉伸为哪些身体部位服务。", "en": "I use this to organize my stretching routine."}, {"n": 2, "cn": "选择动作", "detail": "从实际可见的训练内容中选一个动作。", "en": "I choose a stretch I want to work on."}, {"n": 3, "cn": "示范动作", "detail": "跟随真实训练内容做一次动作，不编造计时按钮。", "en": "Then I follow the exercise step by step."}, {"n": 4, "cn": "说明长期使用", "detail": "展示已有记录；如没有统计页，仅介绍希望养成的习惯。", "en": "The goal is to make stretching part of my daily routine."}]}, {"id": "P026", "name": "夜间补光灯 · Screen Fill Light", "cat": "A", "cn": "这是一个把手机屏幕变成临时补光灯的小工具。比如晚上自拍、拍视频或者视频聊天，光线不太好的时候，可以直接用手机补一点光，不用专门带一盏灯。", "en": "This is a little tool that turns your phone screen into a fill light. It’s useful when you’re taking selfies, recording videos, or making video calls in low light. The idea is to have a quick, simple lighting option without carrying extra equipment.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "说明弱光场景", "detail": "在室内暗一点的地方说明补光需求。", "en": "Sometimes I need a little extra light for a photo."}, {"n": 2, "cn": "使用屏幕补光", "detail": "在实际应用中打开可用的补光画面。", "en": "I use the phone screen as a simple fill light."}, {"n": 3, "cn": "比较效果", "detail": "切换应用前后对比脸部照明。", "en": "You can see how it changes the lighting on my face."}, {"n": 4, "cn": "实际自拍", "detail": "用另一台设备拍照对比效果。", "en": "Here’s the difference in a real photo."}]}, {"id": "P027 / P062", "name": "蛋白质计算器 · Protein Calculator", "cat": "A", "cn": "这是我为健身做的蛋白质计算器。因为很多人不知道自己每天需要多少蛋白质，也不清楚一块鸡胸肉或者几个鸡蛋到底含多少蛋白质。这个软件可以根据体重和健身目标计算每天的需要量，还可以把吃过的食物加进去，看看今天吃够了没有。", "en": "I made this protein calculator because I work out and wanted an easy way to track my protein intake. You enter your weight and fitness goal, and it estimates how much protein you need each day. You can also add foods like eggs, chicken, or milk to see how much protein you’re getting and how much more you might need.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "计算目标：输入体重、选择维持或增肌等目标。", "detail": "", "en": "I enter my weight and pick a goal, like muscle gain."}, {"n": 2, "cn": "添加食物：从食物列表选鸡蛋、牛奶等并调整份量。", "detail": "", "en": "Then I add foods like eggs or milk and set the portion sizes."}, {"n": 3, "cn": "查看差额：对比已经吃到的蛋白质和每日目标。", "detail": "", "en": "It shows how much protein I’ve had and how much I still need."}, {"n": 4, "cn": "浏览榜单：打开高蛋白食物榜，快速对比常见食物。", "detail": "", "en": "I can also browse a list of high-protein foods to get ideas."}]}, {"id": "P028", "name": "聚会之夜 · Party Night", "cat": "A", "cn": "这是一个为朋友聚会设计的娱乐软件。有时候大家聚在一起，不知道玩什么，气氛比较尴尬，所以我想做一个能随时打开、帮助大家活跃气氛的小工具。", "en": "I started this project to make hanging out with friends more fun. You know those moments when everyone gets together but nobody knows what to do? The idea is to have some easy party activities right on your phone, so it’s easier to break the ice and get everyone involved.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "介绍聚会用途", "detail": "向朋友解释它旨在减少聚会冷场。", "en": "I wanted a simple way to make gatherings less awkward."}, {"n": 2, "cn": "展示现有内容", "detail": "打开已实现的活动或游戏内容。", "en": "Here’s the kind of activity I had in mind."}, {"n": 3, "cn": "邀请朋友参与", "detail": "选取实际存在的玩法，邀请朋友尝试。", "en": "We can try one together."}, {"n": 4, "cn": "聊体验", "detail": "解释为什么你觉得这种互动适合新认识的人。", "en": "It gives people something fun to talk about."}]}, {"id": "P039", "name": "酒吧游戏 · Bar Games", "cat": "A", "cn": "这是一个为酒吧和朋友聚会准备的小游戏软件。特别是大家刚认识的时候，有时候不知道聊什么。可以通过一些简单的互动游戏来破冰，让气氛更轻松。", "en": "I made this for nights out with friends, especially when you’re meeting new people. Sometimes conversations can get a little awkward, so the idea is to use simple party games to break the ice and help everyone relax and have fun together.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "说明破冰场景", "detail": "解释朋友第一次见面时为什么需要小游戏。", "en": "It’s designed for breaking the ice when people first meet."}, {"n": 2, "cn": "展示游戏", "detail": "打开当前真实存在的一项游戏。", "en": "Let me show you one of the games."}, {"n": 3, "cn": "一起尝试", "detail": "按照实际规则玩一轮。", "en": "Let’s give it a try."}, {"n": 4, "cn": "解释结果", "detail": "说说游戏如何帮助大家交流。", "en": "It gives everyone an easy way to join the conversation."}]}, {"id": "P040", "name": "才艺展示厅 · Talent Showcase", "cat": "A", "cn": "这是一个用来展示个人才艺和作品的软件。比如你会跳舞、唱歌，或者拍了一些不错的视频，就可以把这些内容集中整理起来，让朋友更方便地了解你的兴趣和作品。", "en": "I built this project as a place where people can showcase their talents and creative work. For example, if you’re into dancing, singing, or making videos, you can organize your work in one place instead of having it scattered across different apps. It’s a simple way to show people what you love doing.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "展示作品合集", "detail": "打开当前可用的作品展示页。", "en": "This is where I bring my creative work together."}, {"n": 2, "cn": "介绍一个视频", "detail": "选一段自己拍摄的作品播放。", "en": "Let me show you a video I made."}, {"n": 3, "cn": "讲作品背景", "detail": "解释当时为什么拍、怎样创作。", "en": "Here’s the story behind it."}, {"n": 4, "cn": "分享作品", "detail": "用已实现的分享方式打开给朋友看；如未实现，则现场播放。", "en": "It’s much easier than searching through old chat messages."}]}, {"id": "P043", "name": "成片集 · Photo Delivery App", "cat": "A", "cn": "这是我专门给摄影师做的拍照和交付软件。比如在公园给游客拍照，拍完以后可以直接整理照片，让客户在手机上挑选喜欢的照片，然后按照套餐购买，最后交付原图。这样就不用手工一张张发照片，也方便管理拍摄订单。", "en": "I built this app for photographers, especially people doing portrait shoots or event photography. After a shoot, the photographer can organize the photos and let clients choose their favorites on their own phones. Clients can pick a photo package, and the photographer can deliver the original images afterward. It makes the whole process, from taking photos to delivering them, much easier.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "拍摄管理：打开拍摄页拍照，检查并删除废片。", "detail": "", "en": "I take photos in the app and remove the bad shots."}, {"n": 2, "cn": "邀请选片：创建分享链接或二维码，让客户在手机上看照片。", "detail": "", "en": "Then I share a link or QR code so the client can view their pictures."}, {"n": 3, "cn": "选择套餐：让客户挑喜欢的照片和购买数量。", "detail": "", "en": "The client selects their favorites and chooses a photo package."}, {"n": 4, "cn": "交付原图：人工核实付款后，完成原始照片交付。", "detail": "", "en": "After payment is confirmed, I deliver the original photos."}]}, {"id": "P045", "name": "盆底肌训练 · Pelvic Floor Trainer", "cat": "A", "cn": "这是我做的一款男性盆底肌训练软件。很多人做凯格尔训练时，不知道收紧多久、放松多久，还得自己默数。我把它做成语音引导的形式，戴着耳机跟着练就可以了，还有不同训练等级和进度记录。", "en": "I developed a pelvic floor training app for men. A lot of people find Kegel exercises difficult to follow because they have to count and time everything themselves. My app guides you through the exercises with voice instructions, so you don’t have to keep looking at the screen. It also has different training levels and progress tracking.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "能力摸底：在能力页选择测试，跟随语音完成。", "detail": "", "en": "I can start with a short assessment, following the voice instructions."}, {"n": 2, "cn": "开始训练：选当前等级，点今日训练。", "detail": "", "en": "Then I choose my level and start today’s session."}, {"n": 3, "cn": "跟练节奏：听收紧、保持、放松提示，必要时暂停。", "detail": "", "en": "The app tells me when to contract, hold, and relax, and I can pause anytime."}, {"n": 4, "cn": "查看进步：打开历史页了解训练次数、时间与等级变化。", "detail": "", "en": "Here I can see my training history and how I’ve progressed."}]}, {"id": "P046", "name": "麻将小白助手 · Mahjong Beginner’s Guide", "cat": "A", "cn": "这是我做的一个海南麻将入门软件。因为麻将对新手来说有很多规则和术语，第一次玩的时候经常听不懂。我把常见规则和牌型做成了带图片的简单说明，让完全不会打麻将的人也能快速上手。", "en": "I built this app to help complete beginners learn Mahjong, especially the version played in Hainan. Mahjong can be pretty confusing when you’re new to it, with all the rules and different tile combinations. My app explains the basics using real tile pictures and simple examples, so you can learn how to play without getting overwhelmed.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "查胡牌规则：点开能胡牌的条件，看真实牌例。", "detail": "", "en": "I start with the rules for winning a hand, using real tile examples."}, {"n": 2, "cn": "看失败案例：对照不能胡的例子找原因。", "detail": "", "en": "Then I can look at hands that don’t qualify and see why."}, {"n": 3, "cn": "学基本术语：打开术语表看吃、碰、杠等。", "detail": "", "en": "There’s also a glossary explaining the basic Mahjong terms."}, {"n": 4, "cn": "用座次工具：输入四人名字、选择庄家，查看风向。", "detail": "", "en": "And this little tool helps us keep track of seating and wind positions."}]}, {"id": "P047", "name": "慢食刻 · BiteTempo", "cat": "A", "cn": "这是一个提醒自己放慢吃饭速度的软件。因为很多人吃饭特别快，我就做了一个安静的用餐计时器。吃饭时可以跟着倒计时慢慢吃，吃完还可以用语音记录自己的感受，回头看看自己的用餐习惯有没有变化。", "en": "I made this app to help people slow down when they eat. A lot of us eat too quickly without even noticing, so I created a simple, quiet meal timer. You can take your time, enjoy your food, and record how you felt afterward. The app also helps you track your eating habits over time.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "启动用餐：选择 10、12、15 或 20 分钟计时。", "detail": "", "en": "I pick a meal duration, such as fifteen minutes, and start the timer."}, {"n": 2, "cn": "慢慢吃饭：跟着安静倒计时和文字提示吃饭。", "detail": "", "en": "I eat at a slower pace while the app quietly keeps time."}, {"n": 3, "cn": "留下心得：餐后说一句感受，按需让 AI 整理并确认。", "detail": "", "en": "After eating, I can record a quick voice note and tidy it up with AI."}, {"n": 4, "cn": "查看统计：打开统计页，看用餐次数和近七天记录。", "detail": "", "en": "And this screen shows my meals and habits over the past week."}]}, {"id": "P049", "name": "海口去哪玩 · Haikou What’s On", "cat": "A", "cn": "这是我专门为海口做的一个本地活动推荐软件。平时想出去玩或者认识新朋友，却不知道哪里有活动。它会整理当地的市集、演出、英语角、运动聚会等信息，让我能快速知道今天或者周末有什么值得参加的活动。", "en": "I built this app for Haikou, the city where I live in China. It’s basically a local event guide that helps you discover things to do, like live music, markets, language exchanges, sports meetups, and social events. Instead of checking a bunch of different apps, you can see what’s happening today or this weekend in one place. It’s especially useful for meeting new people and exploring the city.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "看今日推荐：打开首页查看今天最值得去的几项活动。", "detail": "", "en": "Here are a few events worth checking out today."}, {"n": 2, "cn": "找周末活动：进入周末分类，筛选感兴趣的项目。", "detail": "", "en": "I can switch to weekend events and find something I like."}, {"n": 3, "cn": "了解详情：点开活动，核对时间、地点和来源。", "detail": "", "en": "I open an event to check the time, location, and source."}, {"n": 4, "cn": "按提示参加：查看是否需要提前预约、报名或联系主办方。", "detail": "", "en": "And it tells me whether I need to book, register, or contact the organizer."}]}, {"id": "P051", "name": "妹妹的听书小屋 · My Sister’s Audiobook Library", "cat": "A", "cn": "这是我给妹妹做的一个私人听书软件。因为家里以前买过很多有声课程，但都放在电脑硬盘里，想听很麻烦。我把它们整理成一个手机上的课程书库，可以按学科和难度找内容，还支持倍速播放、睡眠定时和离线下载。", "en": "I built this app for my younger sister. We already had a large collection of educational audio courses stored on a computer, but they weren’t very convenient to listen to. So I turned them into a private audiobook library she can access on her phone. She can browse by subject and difficulty level, adjust the playback speed, set a sleep timer, and download lessons to listen offline.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "挑课程：按学科和难度筛选课程。", "detail": "", "en": "I choose a subject and difficulty level to find a course."}, {"n": 2, "cn": "逐集播放：打开课程，选择一集，调整倍速。", "detail": "", "en": "Then I pick an episode and adjust the playback speed."}, {"n": 3, "cn": "睡前听：开启睡眠定时或单集循环。", "detail": "", "en": "I can set a sleep timer or repeat the same episode."}, {"n": 4, "cn": "离线下载：提前下载课程，没网时继续收听。", "detail": "", "en": "I can also download lessons and listen without internet access."}]}, {"id": "P052", "name": "真心话大冒险 · Truth or Dare", "cat": "A", "cn": "这是我做的一个朋友聚会游戏。里面有真心话、大冒险、谁最可能、从来没有这四种玩法，一共 1500 多道题。可以根据大家的熟悉程度选择不同等级，朋友聚会时拿出手机就能玩。", "en": "I made a party game app with over 1,500 questions and challenges. It includes Truth or Dare, Never Have I Ever, and Most Likely To. You can choose different levels depending on how comfortable everyone is with each other. It’s great for house parties, game nights, or just getting to know new friends.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "选择玩法：在真心话、大冒险等四个分类间切换。", "detail": "", "en": "First, we choose a game, like Truth or Dare or Never Have I Ever."}, {"n": 2, "cn": "选择尺度：选 L1 到 L5 的等级。", "detail": "", "en": "Then we pick a level, depending on how adventurous everyone feels."}, {"n": 3, "cn": "抽取题目：打开题卡，轮流回答或完成挑战。", "detail": "", "en": "We draw a question and take turns answering or doing the challenge."}, {"n": 4, "cn": "离线使用：提前打开缓存后，即使没有网络也能继续玩。", "detail": "", "en": "And once it’s cached, we can even play without internet access."}]}, {"id": "P053", "name": "眨眼守护 · BlinkGuard", "cat": "A", "cn": "这个软件是为了保护长期看电脑的人的眼睛。我发现自己盯着电脑时经常忘记眨眼，所以想利用一台闲置安卓手机，通过前置摄像头检测眨眼情况。如果太久没有眨眼，它就会提醒你。还能记录用眼时间和眨眼情况。", "en": "I built this app because I spend a lot of time in front of a computer and sometimes forget to blink enough. You just place an old Android phone next to your monitor, and it uses the front camera to detect your blinking. If you haven’t blinked for a while, it reminds you. It also tracks your screen time and blinking patterns, and everything runs locally on the phone.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "摆放设备：把安卓手机放到显示器旁，让前摄拍到脸。", "detail": "", "en": "I place an old Android phone beside my monitor, facing me."}, {"n": 2, "cn": "开始监测：点开始，让它在本机检测完整眨眼。", "detail": "", "en": "Then I tap Start, and it starts tracking my blinks locally."}, {"n": 3, "cn": "体验提醒：长时间没眨眼时，听语音或提示音。", "detail": "", "en": "If I forget to blink for too long, it gives me a reminder."}, {"n": 4, "cn": "看统计技巧：打开统计和技巧页，查看用眼情况与护眼提示。", "detail": "", "en": "I can also check the statistics and some eye-care tips."}]}, {"id": "P055", "name": "姿势守护 · PostureGuard", "cat": "A", "cn": "这是一个帮助改善坐姿和久坐习惯的软件。因为长时间坐电脑前，很容易不知不觉驼背或者头往前伸。我把手机放在身体侧面，让它通过摄像头观察坐姿。如果姿势不对或者坐太久，就会语音提醒，还能统计每天坐了多久。", "en": "I built this app to help people improve their posture while working at a desk. You place an Android phone beside you, and its camera checks whether you’re leaning forward, slouching, or looking down too much. If your posture gets worse or you’ve been sitting for too long, it gives you a gentle reminder. It also tracks your sitting habits over time.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "摆放与校准：把手机放身体侧面，按照自己的自然坐姿校准。", "detail": "", "en": "I put the phone beside me and calibrate it to my normal sitting posture."}, {"n": 2, "cn": "开始监测：在监测页观察头部和上身姿态。", "detail": "", "en": "Then I start monitoring and see how my posture changes."}, {"n": 3, "cn": "听语音提醒：姿势偏离或久坐过久时收到提醒。", "detail": "", "en": "If I lean forward too much or sit too long, it reminds me."}, {"n": 4, "cn": "看久坐统计：打开统计页，查看坐姿时长和起身次数。", "detail": "", "en": "And I can check how long I’ve been sitting and how often I got up."}]}, {"id": "P056", "name": "筋形 LAB · Muscle Shape Lab", "cat": "A", "cn": "这是我做的一个 AI 健身参考软件。比如你已经健身一段时间，但不知道身体哪个肌肉部位相对薄弱。你可以拍几张不同角度的身体照片，它会帮你分析肌肉外观，推荐一些针对性的训练动作。过段时间再拍，还可以对比变化。", "en": "I’m building this AI fitness app to help people see which muscle groups might need more attention. You take a few photos from different angles, and the app analyzes your overall muscle appearance and suggests exercises for areas you might want to improve. You can also compare photos over time to see how your physique is changing.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "拍摄三张照片：在扫描页照提示拍正面、背面和侧面。", "detail": "", "en": "I start by taking front, back, and side photos using the guides."}, {"n": 2, "cn": "查看分析：打开肌肉区域的外观观察报告。", "detail": "", "en": "Then I open the report to see which areas may need attention."}, {"n": 3, "cn": "参考动作：选择肌肉区域和现有器械，查看候选动作。", "detail": "", "en": "I can choose a muscle group and see exercise suggestions for the equipment I have."}, {"n": 4, "cn": "对比变化：过段时间重新拍照，在进步页对比照片。", "detail": "", "en": "Later, I can take new photos and compare the results side by side."}]}, {"id": "P057", "name": "舞蹈大师 · Dance Master", "cat": "A", "cn": "这个软件是给喜欢学舞蹈的人做的，特别适合学抖音热门舞蹈或者 K-pop。因为跟着视频学舞特别麻烦，要反复暂停、倒退。我把视频按音乐的八拍切成一段一段，可以慢放、镜像、单段循环。先练熟每一段，再把整支舞连起来。", "en": "I built this app because I enjoy learning dance routines, especially K-pop and trending TikTok-style dances. Learning from regular videos can be frustrating because you’re constantly pausing and rewinding. My app lets you break a dance down into eight-count sections, slow it down, mirror the video, and loop specific parts. You can practice each section until you get it right, then put the whole routine together.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "收藏舞蹈：在我的舞蹈里添加喜欢的舞蹈链接或本地视频。", "detail": "", "en": "First, I save a dance link or import a video I’m allowed to use."}, {"n": 2, "cn": "分八拍练习：进入练舞页，设置节拍，选择想练的一小段。", "detail": "", "en": "Then I open the practice player and break the dance into eight-count sections."}, {"n": 3, "cn": "慢速镜像循环：把动作放慢、镜像，反复练同一个片段。", "detail": "", "en": "I can slow it down, mirror it, and loop one section until I get it right."}, {"n": 4, "cn": "整曲合练：切换整曲模式，练习完整编舞。", "detail": "", "en": "Once I’m ready, I switch to the full routine and dance all the way through."}]}, {"id": "P059", "name": "双屏协同提词器 · Dual-Screen Teleprompter", "cat": "A", "cn": "这是我为拍短视频和采访做的提词器。比如拍摄时，一个人当导演，一个人面对镜头说台词。导演可以用一台手机控制台词和翻页，演员用另一台手机看稿，中间的 iPhone 专门负责拍摄。两边通过二维码连接，还能快速修改稿件，特别适合小团队拍视频。", "en": "I built this teleprompter app for filming videos and interviews with a small team. One person can control the script on their phone, while the person on camera reads it from another screen. A third phone is used just for filming. The two screens stay in sync, and you can even make quick script changes during a shoot. It makes filming much smoother.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "准备文稿：在编导端粘贴或编辑台词，保存并分页。", "detail": "", "en": "First, I paste the script into the director’s screen and split it into pages."}, {"n": 2, "cn": "扫码连接：另一台手机扫描二维码成为提词屏。", "detail": "", "en": "The performer scans a QR code to open the same script on another phone."}, {"n": 3, "cn": "协同翻页：编导控制翻页，演员看提词屏，中间手机拍摄。", "detail": "", "en": "I control the pages while the performer reads from the other screen, and a third phone records."}, {"n": 4, "cn": "临场改稿：需要时即时编辑文字，并检查两屏显示。", "detail": "", "en": "If we change a line during filming, I can edit it and check the updated script."}]}, {"id": "P063", "name": "静蹲计时器 · Wall Sit Timer", "cat": "A", "cn": "这是一个专门用来做靠墙静蹲训练的计时器。因为这个动作主要是坚持一定时间，所以我想让训练时的计时更加简单，不用每次都打开手机自带的秒表。", "en": "I made this little timer specifically for wall sit exercises. It’s a simple leg-strengthening exercise where you hold a sitting position against a wall. The idea is to make timing your workouts easier without having to use a regular stopwatch every time.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "示范静蹲姿势", "detail": "面对墙演示靠墙坐姿。", "en": "A wall sit is where you hold this position against a wall."}, {"n": 2, "cn": "开始计时", "detail": "用实际可用的倒计时功能开始训练。", "en": "I start the timer when I get into position."}, {"n": 3, "cn": "坚持训练", "detail": "向朋友展示计时过程。", "en": "Then I try to hold the position until the timer finishes."}, {"n": 4, "cn": "结束训练", "detail": "真实软件支持时结束和查看记录。", "en": "When I’m done, I stop the timer."}]}, {"id": "P064", "name": "肌肉守护者 · Muscle Guardian", "cat": "A", "cn": "这是我给家里长辈做的腿部训练软件。因为随着年龄增长，保持腿部力量很重要。我希望让他们不用研究复杂的健身软件，打开手机就能跟着语音提示做简单的深蹲训练，还可以记录每次的训练时间和成绩。", "en": "I built this app for older family members because maintaining leg strength becomes really important as we age. It’s designed to be super simple. You choose a training duration, follow the voice instructions, and do some basic squat exercises. It also records your progress, so you can see how you’re improving over time.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "开始训练：在训练页选择时长，一点就开始。", "detail": "", "en": "I just choose a duration and tap to start."}, {"n": 2, "cn": "跟随语音：听计时和完成提示，必要时暂停。", "detail": "", "en": "It guides me with voice prompts, and I can pause whenever needed."}, {"n": 3, "cn": "做能力测试：进入测试页记录一次训练成绩。", "detail": "", "en": "There’s also a simple test to record how I’m doing."}, {"n": 4, "cn": "查看统计：在统计页查看今天、近七天和近三十天的数据。", "detail": "", "en": "Here I can see my training history for today, the past week, or the past month."}]}, {"id": "P041", "name": "NightRec · Night Recording", "cat": "B", "cn": "这是一个围绕夜间录制场景设计的软件项目。我想让晚上需要录制内容的时候，操作更方便一些，不必每次都使用功能复杂的普通拍摄软件。", "en": "This is a recording app project focused on nighttime use. The idea is to make recording in low-light or nighttime situations simpler and more convenient, without having to deal with a lot of unnecessary camera controls.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "讲夜间录制需求", "detail": "解释夜晚拍摄的困难。", "en": "Recording at night can be inconvenient."}, {"n": 2, "cn": "展示运行画面", "detail": "仅在有可运行版本时打开实际录制页面。", "en": "Here’s the recording interface I’m working on."}, {"n": 3, "cn": "尝试短录制", "detail": "如已实现录制，拍摄一个短样本。", "en": "I can make a quick test recording."}, {"n": 4, "cn": "查看结果", "detail": "如有成片，播放刚才的短样本。", "en": "And here’s how the recording turned out."}]}, {"id": "P044", "name": "AI 分镜工作室 · AI Storyboard Studio", "cat": "B", "cn": "这个软件主要是帮助拍短视频的人设计分镜。比如你有一个视频创意，但不知道应该怎么安排镜头、拍摄顺序和画面。我希望利用 AI 帮忙把这些想法整理成更清楚的拍摄方案。", "en": "I’m working on an AI storyboard tool for video creators. Sometimes you have a great video idea, but it’s hard to figure out the shots and how everything should flow. The goal is to use AI to help turn those ideas into a clearer shooting plan, so filming becomes easier and more organized.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "提出创意", "detail": "先说一个想拍的短视频故事。", "en": "Suppose I have an idea for a short video."}, {"n": 2, "cn": "说明镜头拆分", "detail": "用纸上或现有页面示范镜头结构。", "en": "I break the idea into a series of shots."}, {"n": 3, "cn": "展示分镜", "detail": "若有可运行生成器则展示，否则明确是设计目标。", "en": "The goal is to make the shooting plan easier to visualize."}, {"n": 4, "cn": "联系实拍", "detail": "展示一张真实参考照片或拍摄片段。", "en": "This helps me plan what I need to film."}]}, {"id": "P060", "name": "VoiceCut · AI Video Rough-Cut Editor", "cat": "B", "cn": "这是我做的一个自动视频粗剪软件。比如拍摄时有些镜头拍好了，有些说错了要重拍。传统剪辑要把所有视频看一遍，很费时间。现在只要拍摄时在片段结尾说“这段保留”或者“这段不要”，软件就能识别这些口令，把废弃片段剪掉，再把保留的片段拼接成视频，还会把用到的原始片段单独整理出来。", "en": "I built this video editing tool to save time after filming. Normally, when you shoot a video, you end up with lots of clips, including mistakes and retakes. Instead of going through everything manually, you can simply say “keep this take” or “delete this take” while filming. The software recognizes those voice commands, removes the unwanted parts, and automatically puts the good clips together into a rough cut. It also organizes the original clips you used, which makes further editing easier.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "选择素材：粘贴脚本，导入视频文件夹或上传原片。", "detail": "", "en": "I paste in the script and select the raw video files."}, {"n": 2, "cn": "识别口令：录制时口播保留或废弃的指令，交给软件识别。", "detail": "", "en": "During filming, we say which takes to keep or discard, and the software detects those commands."}, {"n": 3, "cn": "生成粗剪：开始处理，让它剔除废片并拼接保留镜头。", "detail": "", "en": "Then I start processing, and it puts the selected takes into a rough cut."}, {"n": 4, "cn": "下载结果：查看成片 MP4、已用片段 ZIP 和时间明细 CSV。", "detail": "", "en": "At the end, I get the video, a ZIP of used clips, and a detailed cut list."}]}, {"id": "P001", "name": "家庭保险看板 · Family Insurance Dashboard", "cat": "C", "cn": "这是一个整理家庭保险信息的项目。因为一个家庭可能有很多不同的保单，时间久了很难记得每个人买了什么保险、什么时候到期。我希望把这些信息集中在一起，让家庭保障情况一目了然。", "en": "I started this project to make it easier to manage family insurance. When several family members have different policies, it gets difficult to remember what’s covered and when everything expires. The idea is to put all that information in one place, so it’s easier to understand the family’s overall insurance coverage.", "status": "项目专属讲解（以仓库资料为依据，未经过现场点击验收）", "steps": [{"n": 1, "cn": "展示家庭保障概念", "detail": "先说明家庭成员各自可能持有不同保险。", "en": "Different family members can have different insurance policies."}, {"n": 2, "cn": "举一个保单例子", "detail": "拿一份脱敏示例保单说明保障范围。", "en": "Here’s an example of the coverage I want to keep track of."}, {"n": 3, "cn": "解释到期管理", "detail": "讲述为什么需要记住续保日期。", "en": "I want to see when each policy needs renewing."}, {"n": 4, "cn": "说明项目目标", "detail": "这款目前没有核实可运行管理界面，不现场声称已经自动提醒。", "en": "The goal is to see our family’s coverage in one place."}]}, {"id": "P003", "name": "后翻学长个人网站 · My Personal Website", "cat": "C", "cn": "这是我给自己做的个人网站，相当于我的线上名片。上面展示了我开发的软件、一些兴趣爱好和个人经历。朋友如果想了解我平时在做什么，可以直接打开网站，有些软件还可以直接在线体验或者下载安装。", "en": "I built my own personal website to showcase the things I’ve been working on. It includes my software projects, personal interests, and some of my experiences. It’s basically my online portfolio, but more personal than a typical résumé. If you’re curious about what I create, you can check it out and even try some of the apps yourself.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "浏览作品：在首页进入作品区。", "detail": "", "en": "Here’s the section where I showcase my apps."}, {"n": 2, "cn": "按类型筛选：切换网页、手机、桌面等类别。", "detail": "", "en": "I can filter the projects by type."}, {"n": 3, "cn": "打开详情：选择一个项目查看背景和成果。", "detail": "", "en": "I open a project to show what it does and why I made it."}, {"n": 4, "cn": "试用产品：从页面进入在线体验或下载链接。", "detail": "", "en": "And for some projects, I can open a live demo or download the app."}]}, {"id": "P006", "name": "提示词管理器 · Prompt Manager", "cat": "C", "cn": "这是一个专门管理 AI 提示词的软件。因为平时用 AI 时，经常会写一些特别好用的指令，但时间久了就找不到。我做这个工具把它们整理成卡片，可以搜索、分类、保存版本，还可以直接让 AI 调用这些提示词。", "en": "I built this tool to organize the prompts I use with AI. When you work with ChatGPT or other AI tools a lot, you end up collecting useful prompts, but they’re easy to lose. My app keeps them organized, searchable, and reusable. You can also connect it to compatible AI tools, so you don’t have to copy and paste the same instructions over and over again.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "建立卡片：新建提示词，粘贴正文。", "detail": "", "en": "I create a new card and paste in a useful AI prompt."}, {"n": 2, "cn": "搜索筛选：输入关键词或选择标签。", "detail": "", "en": "I can search for it later or filter prompts by tags."}, {"n": 3, "cn": "快速复制：打开卡片复制提示词。", "detail": "", "en": "I just open a card and copy the prompt when I need it."}, {"n": 4, "cn": "版本回退：查看旧版本，必要时恢复。", "detail": "", "en": "And if I accidentally change something, I can restore an earlier version."}]}, {"id": "P008", "name": "告别打字 · Less Typing", "cat": "C", "cn": "这是一个围绕减少手动打字设计的软件项目。因为日常工作和聊天经常要输入很多文字，我希望通过语音和更方便的输入方式，让这些操作变得轻松一点。", "en": "I started this project because I wanted to spend less time typing. The idea is to make everyday text input easier, especially through voice-based tools, so writing messages and handling routine tasks feels less repetitive.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "介绍问题", "detail": "讲述输入长段文字有多费时。", "en": "Typing long messages can get tiring."}, {"n": 2, "cn": "描述设想", "detail": "说明希望通过语音减少键盘输入。", "en": "The idea is to speak instead of typing everything."}, {"n": 3, "cn": "展示已有成果", "detail": "仅展示已完成的可运行功能或界面。", "en": "Here’s what I’ve built so far."}, {"n": 4, "cn": "区别P016", "detail": "解释与“懒得打字”的功能联系，尚未核实不当作两款成熟成品。", "en": "I’ve also worked on a related Android app for multilingual messages."}]}, {"id": "P009", "name": "滴答清单时间管理 · Time Management System", "cat": "C", "cn": "这是一个帮助自己安排任务和管理时间的项目。因为每天事情比较多，我希望把任务、计划和时间安排结合起来，让工作和生活更有条理。", "en": "I started this project to organize my daily tasks and manage my time more effectively. When you have lots of things going on, it’s easy to lose track of priorities. The idea is to bring tasks and schedules together so I can stay more organized and focused.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "看任务列表", "detail": "只在实际连接滴答清单时展示现有任务。", "en": "I keep track of the things I need to do."}, {"n": 2, "cn": "安排优先级", "detail": "用一个日常任务说明排序思路。", "en": "I decide what needs my attention first."}, {"n": 3, "cn": "安排时间", "detail": "如存在日程页面则展示，没有则用当前计划说明。", "en": "Then I plan when to work on each task."}, {"n": 4, "cn": "回顾完成", "detail": "展示已完成项目或已有记录。", "en": "It helps me see what I’ve actually finished."}]}, {"id": "P010", "name": "DeepSeek 余额监控 · AI Usage Monitor", "cat": "C", "cn": "这是我做的一个 AI 使用额度监控工具。因为我经常使用不同的 AI 服务，需要知道还剩多少余额、用了多少额度，不想每次都登录网站后台查看。所以做了一个可以直接在电脑上快速查看的小工具。", "en": "I built this little desktop tool because I use AI services quite a lot and wanted an easier way to monitor my usage and remaining balance. Instead of logging into different dashboards every time, I can quickly check the information from my computer. It’s available for both Mac and Windows.", "status": "项目专属讲解（以仓库资料为依据，未经过现场点击验收）", "steps": [{"n": 1, "cn": "打开桌面工具", "detail": "在 Mac 或 Windows 打开 DeepSeekBalanceWidget。", "en": "This is a small desktop app for checking my AI usage."}, {"n": 2, "cn": "查看余额", "detail": "在实际显示的余额位置指出剩余额度。", "en": "Here I can see how much credit I have left."}, {"n": 3, "cn": "解释费用", "detail": "说明频繁调用 AI 接口为什么需要监控。", "en": "I use AI APIs a lot, so I like knowing how much I’m spending."}, {"n": 4, "cn": "展示设置", "detail": "如需展示，打开设置但不要暴露 API Key。", "en": "I can configure it for my own account without showing my API key."}]}, {"id": "P012", "name": "投资组合再平衡 · Portfolio Rebalancing Dashboard", "cat": "C", "cn": "这是我给自己做的长期投资管理工具。比如原本计划股票占多少、债券占多少、黄金占多少，但市场涨跌以后，这些比例会发生变化。软件可以帮你算出现在偏离目标多少，以及需要买卖多少才能恢复到计划中的资产配置。", "en": "I built this dashboard to help manage my long-term investments. For example, I might want a certain percentage of my money in stocks, bonds, and gold, but those percentages change as markets go up and down. My app shows how far my portfolio has drifted from my target and calculates how much I would need to buy or sell to rebalance it.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "录入资产：输入持仓金额和理想目标比例。", "detail": "", "en": "I enter what I currently own and my target allocation."}, {"n": 2, "cn": "比较偏离：查看各类资产偏离目标多少。", "detail": "", "en": "It shows which parts of my portfolio are out of balance."}, {"n": 3, "cn": "切换方案：对比完整再平衡、超阈值调整与不调整。", "detail": "", "en": "I can compare different rebalancing strategies."}, {"n": 4, "cn": "看操作清单：阅读买卖金额与成本的测算。", "detail": "", "en": "And it calculates possible trades and estimated costs."}]}, {"id": "P013", "name": "滚仓计算器 · Trading Position Calculator", "cat": "C", "cn": "这是一个用来模拟不同杠杆交易策略的计算器。你可以输入本金、价格和杠杆倍数，看看不同阶段理论上会产生什么样的资金变化，还能保存计算记录和实际交易记录。", "en": "I built this calculator to explore different leveraged trading scenarios. You enter your starting capital, price, and leverage, and it shows how your position and account value could change across different stages. You can also save calculations and track actual trades. It’s mainly a tool for analyzing strategies, not predicting profits.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "填参数：输入本金、价格和杠杆。", "detail": "", "en": "I enter the capital, price, and leverage."}, {"n": 2, "cn": "观察推演：查看各阶段的理论变化。", "detail": "", "en": "The calculator shows how the numbers change across stages."}, {"n": 3, "cn": "保存快照：把方案存到历史记录。", "detail": "", "en": "I can save a calculation and come back to it later."}, {"n": 4, "cn": "记录实盘：在盈亏台账里加入交易和截图。", "detail": "", "en": "I can also record real trades and attach screenshots."}]}, {"id": "P014", "name": "加密货币突破雷达 · Crypto Breakout Radar", "cat": "C", "cn": "这是我做的一个加密货币行情研究工具。因为有些币突然上涨之前，会出现一些价格和成交量变化，但假突破也很多。我想把这些数据结合起来，帮助观察市场目前处于蓄势、突破还是突破失败的阶段，并跟历史行情做对比。", "en": "I built this tool to study cryptocurrency price movements, especially breakout patterns. It looks at things like price, trading volume, and market conditions to help identify whether a coin is building momentum, breaking out, or showing signs of a failed breakout. You can also compare current patterns with historical examples. It’s a research tool rather than something that predicts prices with certainty.", "status": "项目专属讲解（以仓库资料为依据，未经过现场点击验收）", "steps": [{"n": 1, "cn": "展示行情总览", "detail": "打开实时雷达，选择 PEPE 或 DOGE。", "en": "This is the market overview for a coin I’m tracking."}, {"n": 2, "cn": "解释状态", "detail": "指出蓄势、突破或失败等标签。", "en": "It shows whether the market is building momentum or a breakout is failing."}, {"n": 3, "cn": "查看证据", "detail": "打开指标信息，解释成交量和价格依据。", "en": "I can look at the numbers behind each signal."}, {"n": 4, "cn": "比较历史", "detail": "打开历史事件对照过往走势。", "en": "I can compare current conditions with past breakouts."}]}, {"id": "P015 / P029", "name": "私人照片图库 · Personal Photo Library", "cat": "C", "cn": "这是我做的私人照片管理项目。因为这些年拍了很多照片和视频，分散在不同硬盘里，想找一张旧照片非常费时间。我把它们集中到自己的电脑里，利用照片搜索、人脸识别和重复检测等功能，让以前的照片更容易找出来，而且尽量不修改原始文件。", "en": "I set up this personal photo library because I’ve collected thousands of photos and videos over the years, and they were scattered across different hard drives. The system organizes them in one place and helps me search for pictures, recognize faces, and find duplicates. The best part is that everything stays on my own computer, and the original files are kept safe.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "浏览图库：在私人相簿里按时间翻看照片。", "detail": "", "en": "Here I can browse photos by date."}, {"n": 2, "cn": "搜索图片：用关键词寻找旧照片。", "detail": "", "en": "I can search for photos instead of digging through folders."}, {"n": 3, "cn": "找人脸和重复：查看相似面孔和重复照片。", "detail": "", "en": "It can also help group faces and identify duplicates."}, {"n": 4, "cn": "保护原片：只读查看，不直接改动来源硬盘。", "detail": "", "en": "Most importantly, it leaves the original photos untouched."}]}, {"id": "P017", "name": "个人 RSS 阅读器 · Personal RSS Reader", "cat": "C", "cn": "这个软件是为了把我感兴趣的网络资讯集中到一起。因为每天要关注很多网站和文章，逐个打开很费时间。我希望通过它集中订阅和阅读，减少到处找信息的麻烦。", "en": "I started building my own RSS reader because I follow a lot of websites and online content. Instead of visiting each site separately, I wanted one place where I could keep up with everything I’m interested in. The idea is to make reading and finding useful information much more efficient.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "解释订阅", "detail": "以两个经常阅读的网站举例。", "en": "I follow several websites and want the updates in one place."}, {"n": 2, "cn": "展示来源", "detail": "展示真实订阅列表（若存在）。", "en": "Here are the sources I follow."}, {"n": 3, "cn": "打开文章", "detail": "从实际可打开的列表进入文章。", "en": "I open an article that looks interesting."}, {"n": 4, "cn": "说明节省时间", "detail": "对比逐个访问网页的方式。", "en": "This saves me from checking every website separately."}]}, {"id": "P018", "name": "视频转知识笔记 · Video to Notes", "cat": "C", "cn": "这个软件是想把视频里的知识变成可以长期保存的笔记。比如看了一段很长的教学视频，里面有很多有用内容，但下次想找又要重新看。我希望它能把视频内容整理成文字，保存到自己的知识库里，方便搜索和复习。", "en": "I started this project because I learn a lot from videos, but it’s hard to remember or find specific information later. The idea is to turn useful video content into organized notes and save them in my personal knowledge base. That way, I can search for what I’ve learned instead of watching the same video again.", "status": "项目专属讲解（以仓库资料为依据，未经过现场点击验收）", "steps": [{"n": 1, "cn": "选一个学习视频", "detail": "说明为什么自己想保存视频知识。", "en": "I often learn useful things from videos."}, {"n": 2, "cn": "展示视频笔记", "detail": "如存在已生成的 Obsidian 笔记则打开。", "en": "Here are some notes I saved from a video."}, {"n": 3, "cn": "快速搜索", "detail": "在 Obsidian 中检索一个视频知识点。", "en": "I can search my notes instead of rewatching the whole video."}, {"n": 4, "cn": "说明核实边界", "detail": "视频到笔记的自动转换能力需按当前版本确认。", "en": "The idea is to make what I learn from videos easier to find later."}]}, {"id": "P022", "name": "红利低波计算器 · Dividend Index Calculator", "cat": "C", "cn": "这是一个围绕红利低波指数投资设计的计算工具。我希望把相关的投资数据和计算集中在一个地方，减少每次查指标、手工计算的麻烦，帮助自己更方便地分析这类投资。", "en": "I started this calculator for analyzing dividend-focused, low-volatility stock indexes. The goal is to bring useful investment calculations and information into one place, so I don’t have to keep looking up data and calculating everything manually.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "说明红利低波", "detail": "用普通话解释关注稳定派息与波动的指数。", "en": "I use this for researching dividend-focused, lower-volatility indexes."}, {"n": 2, "cn": "展示输入数据", "detail": "展示真实存在的参数或表格。", "en": "These are the numbers I want to compare."}, {"n": 3, "cn": "解释结果", "detail": "指着已有计算结果说出它的含义。", "en": "Here’s what the calculation tells me."}, {"n": 4, "cn": "说清边界", "detail": "强调这只是分析工具，不代替投资判断。", "en": "It helps me think through the numbers, not predict the market."}]}, {"id": "P023", "name": "A 股指数估值看板 · Chinese Stock Market Valuation Dashboard", "cat": "C", "cn": "这是一个用来观察中国股票市场估值的网页工具。比如想知道沪深300或者红利低波指数现在算贵还是便宜，就可以看它们跟过去十年的估值相比处在什么位置，帮助自己做长期投资研究。", "en": "I built this dashboard to help me understand whether major Chinese stock indexes look expensive or relatively cheap compared with their historical valuations. It compares different indexes using data from roughly the past ten years, so I can get a clearer picture of where the market stands instead of making investment decisions based purely on emotion.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "选择指数：打开指数估值汇总表。", "detail": "", "en": "I open the overview of major Chinese stock indexes."}, {"n": 2, "cn": "查看分位：比较当前估值与过去十年的位置。", "detail": "", "en": "I compare today’s valuations with their historical ranges."}, {"n": 3, "cn": "对比指标：查看估值、股息率等不同维度。", "detail": "", "en": "I can compare valuation metrics and dividend yields."}, {"n": 4, "cn": "理解结果：把颜色作为研究参考，而不是买卖指令。", "detail": "", "en": "The colors make comparison easier, but they’re not trading signals."}]}, {"id": "P030", "name": "Skill 日报 · AI Skills Daily", "cat": "C", "cn": "这是我做的一套 AI 工具发现系统。现在每天都有很多新的 AI Skill 出现，但根本没时间一个个研究。它会自动收集、筛选和对比这些工具，告诉我哪些值得尝试、哪些可能有风险、哪些跟自己已经安装的工具重复。", "en": "I built this system to keep track of new AI tools and skills. There are so many coming out every day that it’s impossible to check them all manually. My system scans different sources, compares new tools with what I already use, and gives me a daily summary of what’s worth trying, what’s outdated, and what might be risky.", "status": "项目专属讲解（以仓库资料为依据，未经过现场点击验收）", "steps": [{"n": 1, "cn": "打开日报", "detail": "找到已经生成的 Skill 日报 Markdown。", "en": "Here’s a daily report about new AI skills."}, {"n": 2, "cn": "查看候选工具", "detail": "选一条推荐解释用途。", "en": "It highlights tools that might be worth trying."}, {"n": 3, "cn": "看风险或重复", "detail": "指出与已装 Skill 重叠、安全风险的分析。", "en": "It also checks for overlap and potential risks."}, {"n": 4, "cn": "说明不会自动安装", "detail": "强调安装升级由自己确认。", "en": "It never installs anything without me deciding to do it."}]}, {"id": "P036", "name": "人民币美元汇率看板 · Currency Exchange Rate Dashboard", "cat": "C", "cn": "这是一个专门查看人民币和美元汇率的小工具。我希望平时需要换汇或者关注汇率变化的时候，可以直接打开一个简单的页面，不用反复找财经网站。", "en": "I made this little dashboard to keep an eye on the exchange rate between the Chinese yuan and the US dollar. It’s useful when I’m dealing with foreign currencies or paying for overseas services. I wanted a simple way to check exchange rates without having to browse through financial websites.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "查看汇率", "detail": "用实际数据页面查看美元兑人民币。", "en": "This shows the exchange rate between US dollars and Chinese yuan."}, {"n": 2, "cn": "举例使用", "detail": "以支付海外订阅为例。", "en": "I often need this when paying for services overseas."}, {"n": 3, "cn": "对比金额", "detail": "如有换算功能则现场换算，否则口述实例。", "en": "I can quickly see roughly how much something costs in yuan."}, {"n": 4, "cn": "提醒变化", "detail": "若真实页面提供走势可展示，否则只讲关注汇率的理由。", "en": "It’s useful to keep an eye on currency movements."}]}, {"id": "P037", "name": "AI 编程训练营 · AI Coding Bootcamp", "cat": "C", "cn": "这是一个围绕 AI 编程学习的网站项目。主要是想帮助没有传统编程基础的人了解怎么使用 AI 开发软件，把自己的想法逐步做成真正能使用的产品。", "en": "This is a website project focused on learning to build software with AI. The idea is to help people who don’t have a traditional programming background understand how AI can help them turn ideas into real applications. It’s about making software development more approachable for beginners.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "介绍受众", "detail": "说明面向 AI 编程初学者。", "en": "This is aimed at beginners who want to build apps with AI."}, {"n": 2, "cn": "展示学习内容", "detail": "打开网站里真实存在的一项内容。", "en": "Here’s a topic the site covers."}, {"n": 3, "cn": "讲具体例子", "detail": "用自己完成过的应用举例。", "en": "For example, this is an app I built with AI."}, {"n": 4, "cn": "解释学习价值", "detail": "强调从想法到产品的过程。", "en": "I want people to see how an idea can become a working app."}]}, {"id": "P038", "name": "健身训练资料库 · Fitness Workout Library", "cat": "C", "cn": "这是一个整理健身训练资料的项目。因为我平时会研究不同的训练动作和方法，希望把这些资料放在一个地方，以后去健身房的时候能更方便地查找和参考。", "en": "I started this project to organize fitness and workout resources. I like learning about different exercises and training methods, so I wanted one place to keep useful information that I can easily look up whenever I need it.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "说明资料整理", "detail": "说说你收集的动作和训练资料。", "en": "I like keeping my workout resources organized."}, {"n": 2, "cn": "找一个动作", "detail": "打开确实存在的练习资料。", "en": "Let me find an exercise I’ve saved."}, {"n": 3, "cn": "看训练要点", "detail": "展示已经写下的动作注意事项。", "en": "These notes remind me what to focus on."}, {"n": 4, "cn": "健身房使用", "detail": "说明训练时如何临时查询。", "en": "It’s handy when I need a quick reminder at the gym."}]}, {"id": "P042", "name": "AIHOT · AI News and Updates", "cat": "C", "cn": "这是一个 AI 行业信息收集项目。因为现在 AI 发展太快，新模型、新功能、新编程工具几乎每天都在出现。我希望通过它把这些更新集中整理起来，快速了解哪些变化真正值得关注。", "en": "I built this project to keep up with how quickly AI is changing. New models, coding tools, and AI features seem to come out almost every day. Instead of checking dozens of websites, I wanted one place to collect and organize the important updates, especially the ones that could actually improve how I work.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "解释新闻来源", "detail": "告诉朋友每天 AI 更新很多。", "en": "There are so many AI updates coming out every day."}, {"n": 2, "cn": "浏览更新", "detail": "从真实情报页面打开一条更新。", "en": "Here’s one of the latest updates I’m following."}, {"n": 3, "cn": "挑重点", "detail": "解释为何它值得关注。", "en": "I try to focus on updates that actually matter."}, {"n": 4, "cn": "应用到工作", "detail": "举例说明某模型更新如何影响自己的软件开发。", "en": "Then I decide whether it’s useful for the apps I’m building."}]}, {"id": "P050", "name": "社交平台活动发布 · Event Publishing Tool", "cat": "C", "cn": "这是一个帮助整理和发布活动信息的项目。比如组织线下聚会、英语角或者其他社交活动时，可能需要在微信公众号和小红书分别发布内容。我希望把这件事变得更方便，减少重复编辑。", "en": "I’m working on a tool to make promoting local events easier. For example, when organizing a meetup or language exchange, you often need to post the same information on different social platforms. The idea is to simplify that process so you spend less time editing and publishing the same content repeatedly.\n\n---", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "介绍活动发布", "detail": "例如组织一场英语角。", "en": "Say I’m organizing a language exchange meetup."}, {"n": 2, "cn": "整理活动信息", "detail": "列出标题时间地点报名方式。", "en": "I put together the time, place, and event details."}, {"n": 3, "cn": "对比平台", "detail": "展示已有公众号与小红书活动文案。", "en": "I usually need to share the same information on different platforms."}, {"n": 4, "cn": "介绍开发目标", "detail": "说明希望减少重复编辑，但不冒充已经自动发布。", "en": "The idea is to avoid writing everything from scratch each time."}]}, {"id": "P054", "name": "后翻科学研究雷达 · Science Research Radar", "cat": "C", "cn": "这是我为自己做的科学研究知识库。因为网上有很多关于健康、健身和长寿的说法，但有些根本没有可靠证据。我希望系统能自动寻找新的高质量科学研究，把论文翻译成容易理解的中文，告诉我研究发现了什么、证据有多可靠，以及哪些说法还不能确定。", "en": "I built this personal research tool because I’m really interested in health, fitness, and longevity, but there’s so much conflicting information online. My system keeps track of new scientific studies, especially high-quality human research, and turns them into easy-to-understand summaries. It explains what the researchers found, how strong the evidence is, and what we still don’t know. It helps me make more informed decisions instead of just following random health advice online.", "status": "逐项讲解（按顺序边操作边说）", "steps": [{"n": 1, "cn": "浏览新研究：打开精选或全部，寻找近期研究。", "detail": "", "en": "I open the research feed to see the latest findings."}, {"n": 2, "cn": "读通俗解读：查看研究结论、证据强弱和局限性。", "detail": "", "en": "I can read a plain-language summary of the findings, evidence, and limitations."}, {"n": 3, "cn": "按专题查找：进入健身、长寿等专题继续阅读。", "detail": "", "en": "I can browse topics like fitness or longevity."}, {"n": 4, "cn": "收藏与导出：把有用内容收藏，按需导出 Markdown 或同步笔记。", "detail": "", "en": "And I can save useful articles or export them to my notes."}]}, {"id": "P058", "name": "AI 编程毕业展示 · AI Coding Showcase", "cat": "C", "cn": "这是一个集中展示 AI 编程成果的项目。我希望把学习过程中做过的软件、解决过的问题和最终作品整理成一个容易观看的展示空间，让别人了解 AI 编程可以做出哪些实际产品。", "en": "I started this project to showcase what I’ve built while learning to develop software with AI. I wanted a place where people could see the actual applications and projects, rather than just looking at code. It’s a way to share my progress and show what’s possible with AI-assisted development.", "status": "资料有限：场景讲解稿，未经过手机真机逐键验收", "steps": [{"n": 1, "cn": "展示作品集", "detail": "打开当前可访问的毕业作品展示页。", "en": "This is a showcase of the apps I’ve worked on."}, {"n": 2, "cn": "选一个作品", "detail": "挑一款最容易上手的手机软件。", "en": "Let me pick one of the projects."}, {"n": 3, "cn": "解释过程", "detail": "说明从想法到做成软件。", "en": "I started with a simple idea and worked on it with AI."}, {"n": 4, "cn": "展示实际成果", "detail": "用已经安装或上线的真实软件演示。", "en": "And here’s the actual app running on my phone."}]}], "places": [{"id": 1, "cnName": "龙兴路", "enName": "Longxing Road", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区国贸片区的龙兴路。这条不到500米的小街最近成了很火的街拍地，很多博主和年轻帅哥美女专程来拍照。咖啡馆的门头、绿植、外摆桌椅和复古小店都很上镜，下午光线好，随便走走就容易出片。", "en": "Longxing Road is in the Guomao area of Longhua District, Haikou. This short street has become one of Haikou's favorite photo spots. Influencers and stylish young locals come for the pretty storefronts, outdoor cafés, and vintage shops. It's especially photogenic in the afternoon.", "locationCn": "海口市龙华区国贸片区的龙兴路", "locationEn": "Longxing Road in the Guomao area of Longhua District, Haikou", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%BE%99%E5%85%B4%E8%B7%AF", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%BE%99%E5%85%B4%E8%B7%AF"}, {"id": 2, "cnName": "滨海新村", "enName": "Binhai Xincun Neighborhood", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区滨海大道附近的滨海新村老社区。这里的魅力不是大景区，而是老居民楼之间冒出来的小众咖啡馆和有趣店面。旧墙、窄巷和新潮门头放在一起，很适合拍一点自然的生活感照片。", "en": "You can find it at Binhai Xincun, an older neighborhood near Binhai Avenue in Haikou's Longhua District. The contrast is what makes it fun: old apartment blocks, narrow alleys, and trendy little cafés next door. It feels more like discovering a local neighborhood than visiting a tourist attraction.", "locationCn": "海口市龙华区滨海大道附近的滨海新村老社区", "locationEn": "Binhai Xincun, an older neighborhood near Binhai Avenue in Haikou's Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%BB%A8%E6%B5%B7%E6%96%B0%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%BB%A8%E6%B5%B7%E6%96%B0%E6%9D%91"}, {"id": 3, "cnName": "骑楼老街", "enName": "Qilou Old Street", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区中山路一带，靠近海口钟楼。最值得看的是两侧一整排带骑楼走廊的南洋老房子，和东南亚不少城市的老街有点像。白天适合拍建筑，边走边尝海南粉、清补凉和传统点心。", "en": "You can find it at Zhongshan Road in Longhua District, near Haikou Clock Tower. The long rows of arcaded buildings have a Southeast Asian feel you don't see everywhere in China. Look up at the old balconies, take street photos, and stop for Hainanese noodles or a sweet local dessert.", "locationCn": "海口市龙华区中山路一带，靠近海口钟楼", "locationEn": "Zhongshan Road in Longhua District, near Haikou Clock Tower", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%AA%91%E6%A5%BC%E8%80%81%E8%A1%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%AA%91%E6%A5%BC%E8%80%81%E8%A1%97"}, {"id": 4, "cnName": "云洞图书馆", "enName": "Cloud Cave Library", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区世纪广场路1号，海口湾海边。海边这栋弯弯曲曲的白色建筑就像雕塑，弧线门洞和大海放在同一张照片里特别漂亮。很多人傍晚来拍日落，想进馆阅读则要查看预约安排。", "en": "It is at No. 1 Century Square Road in Longhua District, right beside Haikou Bay. The white curved building looks almost like a sculpture beside the water. Its openings frame the sea beautifully, and sunset is a popular time for photos. Check the booking rules if you want to go inside.", "locationCn": "海口市龙华区世纪广场路1号，海口湾海边", "locationEn": "No. 1 Century Square Road in Longhua District, right beside Haikou Bay", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%BA%91%E6%B4%9E%E5%9B%BE%E4%B9%A6%E9%A6%86", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E4%BA%91%E6%B4%9E%E5%9B%BE%E4%B9%A6%E9%A6%86"}, {"id": 5, "cnName": "天空之山", "enName": "Sky Mountain", "city": "海口", "category": "城市街拍", "cn": "海口市美兰区美丽沙路附近、海甸五西路海岸。它不像普通的观海平台，更像一条能走上屋顶的白色海边艺术建筑。沿着弯曲步道慢慢走，能从不同角度拍海和建筑，顺便在附近喝咖啡。", "en": "It is near Meilisha arket alongside newer hangout spots. Come toward sunset to see the local catch and enjoy the warm evening light.", "locationCn": "海口市秀英区西秀镇荣山寮村，西海岸一带", "locationEn": "Rongshanliao Village in Xixiu Town, Xiuying District, on Haikou's west coast", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%8D%A3%E5%B1%B1%E5%AF%AE%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%8D%A3%E5%B1%B1%E5%AF%AE%E6%9D%91"}, {"id": 8, "cnName": "898艺术村", "enName": "898 Art Village", "city": "海口", "category": "城市街拍", "cn": "海口市美兰区灵山镇美庄村，靠近江东新区白驹大道。村里的老房子被画上了彩色墙绘，还聚集着画室、陶艺和黎锦等手作活动。不是千篇一律的商业街，更像走进一个有人创作、有人生活的艺术小村。", "en": "You can find it at Meizhuang Village in Lingshan Town, Meilan District, near Baiju Avenue. Colorful murals cover old village walls, and artists work with painting, pottery, and local textiles here. It feels like a working creative village rather than a polished shopping street.", "locationCn": "海口市美兰区灵山镇美庄村，靠近江东新区白驹大道", "locationEn": "Meizhuang Village in Lingshan Town, Meilan District, near Baiju Avenue", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3898%E8%89%BA%E6%9C%AF%E6%9D%91", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3898%E8%89%BA%E6%9C%AF%E6%9D%91"}, {"id": 9, "cnName": "雷琼火山口地质公园", "enName": "Haikou Volcano Park", "city": "海口", "category": "城市街拍", "cn": "海口市秀英区石山镇，靠近火山口公园景区入口。海口不只有海滩，城市西边还有古老的火山群。可以沿着山路走到火山口，看看黑色火山岩和长满植物的火山地形，和海南海边风景完全不同。", "en": "You can find it at Shishan Town in Xiuying District, at the Haikou volcano scenic area. Haikou isn't only about beaches—it also has ancient volcanic landscapes. Walk toward the crater, see the dark rock, and enjoy a very different side of the island.", "locationCn": "海口市秀英区石山镇，靠近火山口公园景区入口", "locationEn": "Shishan Town in Xiuying District, at the Haikou volcano scenic area", "mapAmap": "https:// ": "It is near the crossing of Haida Road and Haidian First East Road, on the north bank of Haidian Creek in Meilan District. This riverside street has restaurants and small bars facing Haidian Creek. Come in the evening for the relaxed drinks scene and views of the lights across the water.", "locationCn": "海口市美兰区海达路与海甸一东路交叉口以东，海甸溪北岸", "locationEn": "Near the crossing of Haida Road and Haidian First East Road, on the north bank of Haidian Creek in Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A5%BF%E6%BA%AA%E9%87%8C%E5%95%86%E4%B8%9A%E8%A1%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E8%A5%BF%E6%BA%AA%E9%87%8C%E5%95%86%E4%B8%9A%E8%A1%97"}, {"id": 17, "cnName": "华彩海口湾滨海街区", "enName": "Huacai Haikou Bay Waterfront", "city": "海口", "category": "城市街拍", "cn": "海口市美兰区海甸岛北侧，华彩海口湾商圈。这里更适合喜欢现代城市海景的人：一边是商场和餐厅，一边能看海岸和城市灯光。傍晚来吃饭，饭后沿海边走走，比正午晒太阳舒服。", "en": "You can find it at Huacai Haikou Bay on the north side of Haidian Island, Meilan District. Here you get a modern seaside city view, with restaurants and shopping close to the coast. Evening is the best time to eat, take a walk, and see the lights along the bay.", "locationCn": "海口市美兰区海甸岛北侧，华彩海口湾商圈", "locationEn": "Huacai Haikou Bay on the north side of Haidian Island, Meilan District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%8D%8E%E5%BD%A9%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BB%A8%E6%B5%B7%E8%A1%97%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%8D%8E%E5%BD%A9%E6%B5%B7%E5%8F%A3%E6%B9%BE%E6%BB%A8%E6%B5%B7%E8%A1%97%E5%8C%BA"}, {"id": 18, "cnName": "水巷口", "enName": "Shuixiangkou Food Street", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区骑楼老街水巷口一带。水巷口最出名的不是建筑，而是吃的。早上可以尝一碗辣汤饭，下午找老盐饮料、海南小吃，特别适合带朋友体验真正的海口味道。", "en": "You can find it at Shuixiangkou, beside Qilou Old Street in Longhua District. Come here for food as much as for the old streets. Try spicy breakfast rice soup, local snacks, or a salty fruit drink—the flavors are very Haikou.", "locationCn": "海口市龙华区骑楼老街水巷口一带", "locationEn": "Shuixiangkou, beside Qilou Old Street in Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B0%B4%E5%B7%B7%E5%8F%A3", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B0%B4%E5%B7%B7%E5%8F%A3"}, {"id": 19, "cnName": "得胜沙路", "enName": "Deshengsha Road", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区得胜沙路，钟楼与骑楼街区附近。这条街保留着老骑楼商贸街的感觉，店招、楼上窗户和老式门面都很有年代感。适合和骑楼老街连着逛，找一些不那么标准游客照的街景。", "en": "You can find it at Deshengsha Road in Longhua District, near Clock Tower and Qilou Old Street. The signs, balconies, and old shopfronts show another side of Haikou's trading history. Walk it together with Qilou Old Street for more interesting street photos.", "locationCn": "海口市龙华区得胜沙路，钟楼与骑楼街区附近", "locationEn": "Deshengsha Road in Longhua District, near Clock Tower and Qilou Old Street", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%BE%97%E8%83%9C%E6%B2%99%E8%B7%AF", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%BE%97%E8%83%9C%E6%B2%99%E8%B7%AF"}, {"id": 20, "cnName": "府城老街", "enName": "Fucheng Old Streets", "city": "海口", "category": "城市街拍", "cn": "海口市琼山区府城片区，忠介路和府城老街附近。这里是本地人熟悉的老城区，街巷里藏着很多小吃店和老摊位。想吃地道的海南粉、传统甜品，或者看看下班后的老城生活，可以来这里走走。", "en": "You can find it at The Fucheng area of Qiongshan District, around Zhongjie Road. This old town area is full of everyday local life and small food shops. It's a good place for Hainanese noodles, traditional sweets, and an unhurried walk through older streets.", "locationCn": "海口市琼山区府城片区，忠介路和府城老街附近", "locationEn": "The Fucheng area of Qiongshan District, around Zhongjie Road", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%BA%9C%E5%9F%8E%E8%80%81%E8%A1%97", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E5%BA%9C%E5%9F%8E%E8%80%81%E8%A1%97"}, {"id": 21, "cnName": "长堤路滨水街区", "enName": "Changdi Road Waterfront", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区长堤路，靠近海口钟楼和海甸溪。路的一边有老城区的建筑，另一边是江边夜景，白天和晚上的感觉很不同。可以从钟楼附近慢慢走，一路看船、车流和灯光。", "en": "You can find it at Changdi Road in Longhua District, near Haikou Clock Tower and Haidian Creek. This road connects the older city with a lively waterfront. Walk from the Clock Tower area toward the creek to see boats, traffic, and the city lighting up at night.", "locationCn": "海口市龙华区长堤路，靠近海口钟楼和海甸溪", "locationEn": "Changdi Road in Longhua District, near Haikou Clock Tower and Haidian Creek", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%95%BF%E5%A0%A4%E8%B7%AF%E6%BB%A8%E6%B0%B4%E8%A1%97%E5%8C%BA", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E9%95%BF%E5%A0%A4%E8%B7%AF%E6%BB%A8%E6%B0%B4%E8%A1%97%E5%8C%BA"}, {"id": 22, "cnName": "海口东坡老码头", "enName": "Dongpo Old Wharf", "city": "海口", "category": "城市街拍", "cn": "海口市美兰区碧海大道98号，海甸三西路附近。这里不是老旧码头遗址，而是有宋风元素的新休闲商业街区，有吃喝、拍照和夜间游船。晚上灯笼、古风建筑和世纪大桥一起入镜，比白天更有氛围。", "en": "It is at No. 98 Bihai Avenue in Meilan District, near Haidian Third West Road. This is a newer waterfront leisure area with Song-dynasty-inspired design, food, and evening boat trips. Lanterns and the nearby Century Bridge make it particularly atmospheric after dark.", "locationCn": "海口市美兰区碧海大道98号，海甸三西路附近", "locationEn": "No. 98 Bihai Avenue in Meilan District, near Haidian Third West Road", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%B5%B7%E5%8F%A3%E4%B8%9C%E5%9D%A1%E8%80%81%E7%A0%81%E5%A4%B4"}, {"id": 23, "cnName": "Matata Coffee（龙兴路）", "enName": "Matata Coffee (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路，柏园雅居附近。这家咖啡馆是龙兴路街拍氛围的代表之一，门口的小桌椅经常坐满来聊天的年轻人。比起喝完就走，更适合坐在室外看街景、感受这条街的热闹。", "en": "You can find it at Longxing Road in Longhua District, close to Baiyuan Yaju. This café is part of what made Longxing Road trendy. People gather at the small outdoor tables, so it's a fun stop for coffee and people-watching between photos.", "locationCn": "海口市龙华区龙兴路，柏园雅居附近", "locationEn": "Longxing Road in Longhua District, close to Baiyuan Yaju", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Matata%20Coffee%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3Matata%20Coffee%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 24, "cnName": "斑马院子（龙兴路）", "enName": "Zebra Courtyard (Longxing Road)", "city": "海口", "category": "城市街拍", "cn": "海口市龙华区龙兴路的斑马院子店铺。它是龙兴路较早受欢迎的小店之一，烘焙和有设计感的店面很受拍照的人喜欢。适合和龙兴路一起逛，不需要把它当成单独的半天景点。", "en": "You can find it at Zebra Courtyard on Longxing Road, Longhua District. One of the street's earlier popular shops, known for baked treats and a photogenic storefront. Drop in while exploring Longxing Road rather than making a separate trip.", "locationCn": "海口市龙华区龙兴路的斑马院子店铺", "locationEn": "Zebra Courtyard on Longxing Road, Longhua District", "mapAmap": "https://uri.amap.com/search?keyword=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%91%E9%A9%AC%E9%99%A2%E5%AD%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89", "mapGoogle": "https://www.google.com/maps/search/?api=1&query=%E6%B5%B7%E5%8D%97%E7%9C%81%E6%B5%B7%E5%8F%A3%E6%96%91%E9%A9%AC%E9%99%A2%E5%AD%90%EF%BC%88%E9%BE%99%E5%85%B4%E8%B7%AF%EF%BC%89"}, {"id": 25, "cnName": "席地而坐（龙兴路）", "enName": "Sitting & Drinking (Longxing Road)"
