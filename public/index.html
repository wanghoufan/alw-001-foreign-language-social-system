<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef2f7"><title>SocialMate · 本地社交知识库</title>
<script>
(function(){try{
var choice=localStorage.getItem('sm-theme');
if(choice!=='light'&&choice!=='dark'&&choice!=='forest')choice='light';
document.documentElement.dataset.theme=choice;
}catch(e){}})();
</script>
<link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><b>SocialMate</b></div><nav class="tabs" id="tabs"></nav><div class="sidebar-foot"><div class="theme-switch" id="theme-switch"></div><div class="local-status"><i></i><span>数据仅保存在本机</span></div></div></aside><main><section id="view"></section><footer>资料保存在本机 Markdown 文件中。要整理聊天内容，请使用“AI 整理”页复制提示词并交给可访问本项目文件的 AI。</footer></main></div>
<script>
/* ========== 常量 ========== */
const pages=[['Today','今日','◷'],['People','人物','☺'],['Topics','话题','▤'],['Practice','口语练习','◉'],['Review','AI 整理','✎']];
const levels=[{n:1,short:'很友好',desc:'对方特别友好，会主动提问、接话并帮你把对话聊下去。适合刚开始练习。'},{n:2,short:'正常交流',desc:'像普通真人一样有来有回，会回应也会提问，偶尔有自然停顿。适合大多数练习，建议从这里开始。'},{n:3,short:'稍微冷淡',desc:'对方偏冷，回答较短，不会总主动接话。你需要练习追问，也分享自己的内容。'},{n:4,short:'嘈杂酒吧',desc:'模拟酒吧噪声，交流内容比较零碎，可能需要重复或确认听到的信息。适合练听辨和接话。'},{n:5,short:'自由实战',desc:'自由、接近真实节奏的交流；对方不刻意放慢，也不照顾你的练习节奏。挑战最高。'}];
const THEMES=[['light','晨光'],['dark','墨夜'],['forest','松林']];
const THEME_META={light:'#eef2f7',dark:'#0f1420',forest:'#f4f1e8'};

/* ========== 主题 ========== */
function applyTheme(choice){
  document.documentElement.dataset.theme=choice;
  document.querySelector('meta[name="theme-color"]').setAttribute('content',THEME_META[choice]||THEME_META.light);
  renderThemeSwitch(choice);
}
function currentChoice(){try{const c=localStorage.getItem('sm-theme');return (c==='dark'||c==='forest')?c:'light'}catch(e){return 'light'}}
function renderThemeSwitch(choice){
  const box=document.querySelector('#theme-switch');if(!box)return;
  box.innerHTML=THEMES.map(t=>`<button data-theme-choice="${t[0]}" class="${t[0]===choice?'active':''}" title="${t[1]}主题">${t[1]}</button>`).join('');
  box.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('sm-theme',b.dataset.themeChoice)}catch(e){}applyTheme(b.dataset.themeChoice)});
}
applyTheme(currentChoice());

/* ========== 提示条与复制 ========== */
function toast(msg){
  let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
async function copyText(text){
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return}
  const f=document.createElement('textarea');f.value=text;f.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(f);f.select();
  const ok=document.execCommand('copy');f.remove();
  if(!ok)throw Error('系统拒绝复制');
}

/* ========== Markdown 渲染（标题/列表/引用/行内样式） ========== */
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inlineMd=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
function markdown(source){
  let out=[],list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const line of source.replace(/\r/g,'').split('\n')){
    let m;
    if(!line.trim()){close();continue}
    if((m=line.match(/^(#{1,3})\s+(.+)$/))){close();const n=m[1].length;out.push(`<h${n}>${inlineMd(m[2])}</h${n}>`);continue}
    if((m=line.match(/^\s*[-*]\s+(.+)$/))){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push(`<li>${inlineMd(m[1])}</li>`);continue}
    if((m=line.match(/^\s*\d+[.)]\s+(.+)$/))){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push(`<li>${inlineMd(m[1])}</li>`);continue}
    if((m=line.match(/^>\s?(.*)$/))){close();out.push(`<blockquote>${inlineMd(m[1])}</blockquote>`);continue}
    close();out.push(`<p>${inlineMd(line)}</p>`);
  }
  close();return out.join('');
}
const stripFrontMatter=s=>s.replace(/^---\n[\s\S]*?\n---\n?/,'').trim();

/* ========== 路由 ========== */
const validPages=pages.map(p=>p[0]);
const fromHash=()=>{const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));return validPages.includes(h)?h:'Today'};
let current=fromHash(), files=[];
const view=document.querySelector('#view'),tabs=document.querySelector('#tabs');
function go(page){current=page;const target='/'+page;if(location.hash!=='#'+target)history.pushState(null,'','#'+target);render()}
window.addEventListener('popstate',()=>{const p=fromHash();if(p!==current){current=p;render()}});
function nav(){
  tabs.innerHTML=pages.map(([key,label,icon])=>`<button class="${key===current?'active':''}" data-page="${key}" ${key===current?'aria-current="page"':''}><span class="tab-icon">${icon}</span><span>${label}</span></button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));
}
async function api(url,opts){const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}

/* ========== 页面渲染 ========== */
async function render(){
  nav();
  document.title=pages.find(p=>p[0]===current)[1]+' · SocialMate';
  document.querySelector('main').classList.toggle('wide-topic',current==='Topics');
  let data;
  try{data=await api('/api/files')}catch(e){view.innerHTML=`<div class="card danger">无法读取本地数据：${esc(e.message)}</div>`;return}
  files=data.files;const people=data.people;let html='';

  if(current==='Today') html=`<section class="home-page"><div class="home-intro"><h1>SocialMate 能帮你做什么？</h1><p class="muted">准备聊天、练习口语，再把真实交流整理成下次能用的资料。</p></div><div class="workflow-grid"><article class="workflow-card"><span class="workflow-number">01</span><div><h2>准备聊天话题</h2><p>浏览现成的话题包，挑一个自然的开场或追问。</p></div><button class="action" data-goto="Topics">打开话题库</button></article><article class="workflow-card"><span class="workflow-number">02</span><div><h2>练习英语对话</h2><p>选择场景和难度，生成提示词后复制到 ChatGPT Live 练习。</p></div><button class="action" data-goto="Practice">开始口语练习</button></article><article class="workflow-card"><span class="workflow-number">03</span><div><h2>整理真实交流</h2><p>把刚才聊到的情况交给 AI，让它按项目规则整理到对应档案。</p></div><button class="action" data-goto="Review">获取整理提示词</button></article><article class="workflow-card"><span class="workflow-number">04</span><div><h2>查看人物资料</h2><p>回看对方主动分享且已确认的信息，准备下一次自然续聊。</p></div><button class="action" data-goto="People">打开人物档案</button></article></div><p class="home-footnote">当前本地资料：${people.length} 个人物档案、${data.topics.length} 个话题包。所有内容保存在本机 Markdown 文件中。</p></section>`;

  if(current==='People'){html=`<h1>人物档案</h1><p class="muted">记录新认识的人，回看已确认的信息，准备下一次自然续聊。</p><div class="card"><h2>记录新认识的人</h2><div class="grid"><label>姓名<input id="new-name" placeholder="例如 Alex" required></label><label>国家 / 地区<input id="new-country"></label><label>城市<input id="new-city" value="海口"></label><label>语言（逗号分隔）<input id="new-languages" placeholder="English, 中文"></label><label>已确认兴趣（逗号分隔）<input id="new-interests" placeholder="健身, 咖啡"></label></div><p><button class="action primary" id="create-person">创建本地档案</button></p><div id="person-result"></div></div><div class="people-tools"><input id="people-search" type="search" placeholder="搜索人物姓名或路径" aria-label="搜索人物"></div><div class="grid" id="people-grid">${people.map(p=>`<article class="card person-card" data-person="${esc(p.toLowerCase())}"><h2>${esc(p.split('/')[1])}</h2><p class="muted">${esc(p)}</p><button class="action" data-read="${esc(p)}">打开档案</button><div class="profile hidden" id="${encodeURIComponent(p)}"></div></article>`).join('')||'<div class="empty-state">尚无人档案。先在上方创建第一份档案。</div>'}</div>`;}

  if(current==='Topics'){const topicTitle=p=>p.split('/').pop().replace(/\.md$/i,'').replace(/[-_]/g,' ');html=`<section class="topics-page"><div class="topics-layout"><aside class="topics-sidebar"><div class="topic-list-label">${data.topics.length} 个话题包</div><input class="topic-search" id="topic-search" type="search" placeholder="搜索话题…" aria-label="搜索话题名称"><div id="topic-list">${data.topics.map(p=>`<button class="topic-link" data-topic="${esc(p)}"><span class="topic-link-icon">▤</span><span><strong>${esc(topicTitle(p))}</strong><small>${esc(p.split('/').slice(1,-1).join(' / ')||'话题')}</small></span></button>`).join('')||'<p class="no-topics">还没有话题包。</p>'}</div></aside><article class="topic-reader" id="topic-reader"><div class="reader-empty"><div><div class="empty-icon">▤</div><p>选择左侧话题，内容会在这里展开。</p></div></div></article></div></section>`;}

  if(current==='Practice')html=`<div class="practice-page"><h1>口语练习</h1><p class="muted">选择场景和难度，复制提示词到 ChatGPT Live。练完后，AI 会按固定格式生成可下载的 Markdown 复盘文件。</p><div class="card"><div class="row"><select id="scene"><option>海口健身房</option><option>咖啡店</option><option>酒吧</option><option>第一次见面</option></select><select id="level">${levels.map(level=>`<option value="${level.n}" ${level.n===2?'selected':''}>Level ${level.n} · ${level.short}</option>`).join('')}</select></div><div class="level-help"><b id="level-summary">推荐起步：Level 2 · 正常交流</b><p id="level-selected"></p><details open><summary>5 个 Level 分别是什么意思？</summary><ol>${levels.map(level=>`<li><b>Level ${level.n} · ${level.short}：</b>${level.desc}</li>`).join('')}</ol><p><b>怎么选：</b>初次练习选 1；日常模拟选 2；想练短回答选 3；想练嘈杂环境听力选 4；准备自由实战选 5。</p></details></div><div class="practice-actions"><button class="action primary" id="prompt">生成提示词</button><button class="action" id="copy-practice" disabled>复制提示词</button></div><textarea id="practice" placeholder="点击「生成提示词」，生成后可一键复制到 GPT Live"></textarea><p class="practice-save-hint">练习记录下载后保存到项目内：<code>SocialMate-Data/Practice/Sessions/</code></p></div></div>`;

  if(current==='Review')html=`<section class="ai-organize-page"><h1>把聊天内容交给 AI 整理</h1><p class="muted">你只需要告诉 AI 刚才和谁聊了什么。复制下面的提示词，再把聊天内容一起发给一个能访问本项目文件的 AI；它会按项目里的格式整理资料。</p><div class="card ai-prompt-card"><div class="ai-prompt-heading"><div><h2>整理提示词</h2><p class="muted">提示词已经包含保存位置、文件格式和整理规则。</p></div><button class="action primary" id="copy-ai-prompt">复制完整整理提示词</button></div><div class="notice" id="copy-ai-status" aria-live="polite">复制后，把你记得的聊天内容一并发给有本项目文件访问权限的 AI。这个网页不会替你调用 AI。</div><details><summary>查看提示词内容</summary><pre id="ai-prompt-preview"></pre></details></div></section>`;
  view.innerHTML=html;

  if(current==='Review'){
    const prompt=`你是 SocialMate 本地社交知识库的整理助手。请根据我提供的聊天内容或口述，直接整理并保存到本项目规定的位置。

【项目与资料位置】
项目根目录：/Users/zzymima0000/Developer/coding/1.Active/alw-001-外语社交系统
资料根目录：/Users/zzymima0000/Developer/coding/1.Active/alw-001-外语社交系统/SocialMate-Data/
开始前先阅读 SocialMate-Data/00-README.md，并查看相关人物目录下的 00-profile.md、People/_template/00-profile.md 和 People/_template/interaction-template.md（模板实际位置以 README 为准）。遵守其中最新的目录、字段和 Markdown 格式约定。

【整理规则】
1. 只依据我提供的聊天内容、口述和已有资料记录，不得补造事实、推测对方意图或把不确定内容写成事实。区分对方明确分享的信息、我的信息、以及尚不确定的内容。
2. 如果无法确定对应哪位人物，或关键信息存在歧义，先向我提问，不要创建或修改文件。
3. 对应人物已确定后，在该人物目录中新增一份独立的互动记录 Markdown 文件，使用 Asia/Shanghai 当地日期命名，文件名和正文结构遵照 README 与模板。保留既有记录，不覆盖或重写旧互动记录。
4. 只有聊天中明确确认、且适合长期保留的信息才更新人物主档；保留已有字段和格式，不清除无关内容。新人物只有在我明确说明是新认识的人时才按模板创建档案。
5. 仅修改 SocialMate-Data/ 下与本次交流直接相关的资料。不要改应用代码、其他项目文件或口语自测学习记录。
6. 如果你能访问本机项目文件，请直接完成整理和保存；如果不能访问，不要声称已经保存，请说明访问限制，并给出建议文件路径及可直接保存的 Markdown 草稿。
7. 完成后简要列出实际新增或修改的相对路径，并说明每项记录了什么；不要输出无关的技术细节。

【聊天内容或我的口述】
（在这里补充：和谁聊、日期/地点、聊了什么、对方明确分享了什么、下次想接着聊什么。可以用自然语言，不必整理成表格。）`;
    document.querySelector('#ai-prompt-preview').textContent=prompt;
    document.querySelector('#copy-ai-prompt').onclick=async()=>{
      const status=document.querySelector('#copy-ai-status');
      try{await copyText(prompt);status.textContent='完整整理提示词已复制。把聊天内容一并发给有本项目文件访问权限的 AI。';toast('整理提示词已复制')}
      catch(e){status.textContent='复制没有成功。请展开“查看提示词内容”，手动全选并复制。'}
    };
  }

  if(current==='Topics'&&data.topics.length){
    const topicList=document.querySelector('#topic-list'),reader=document.querySelector('#topic-reader'),search=document.querySelector('#topic-search');
    const openTopic=async p=>{
      topicList.querySelectorAll('.topic-link').forEach(b=>b.classList.toggle('active',b.dataset.topic===p));
      try{sessionStorage.setItem('sm-topic',p)}catch(e){}
      reader.innerHTML='<div class="reader-empty">正在读取话题…</div>';
      try{const item=await api('/api/read?path='+encodeURIComponent(p));reader.innerHTML=`<div class="markdown-body">${markdown(item.content)}</div>`;reader.scrollTop=0}
      catch(e){reader.innerHTML=`<div class="notice danger">无法读取话题：${esc(e.message)}</div>`}
    };
    topicList.querySelectorAll('.topic-link').forEach(b=>b.onclick=()=>openTopic(b.dataset.topic));
    search.oninput=()=>{const q=search.value.trim().toLocaleLowerCase();topicList.querySelectorAll('.topic-link').forEach(b=>b.classList.toggle('hidden',!`${b.dataset.topic} ${b.innerText}`.toLocaleLowerCase().includes(q)))};
    let saved=null;try{saved=sessionStorage.getItem('sm-topic')}catch(e){}
    openTopic(saved&&data.topics.includes(saved)?saved:data.topics[0]);
  }

  view.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));

  view.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{
    const el=document.getElementById(encodeURIComponent(b.dataset.read));
    if(el.classList.contains('hidden')){
      b.disabled=true;b.textContent='读取中…';
      try{
        const item=await api('/api/read?path='+encodeURIComponent(b.dataset.read));
        const body=stripFrontMatter(item.content);
        el.innerHTML=`<div class="markdown-body">${markdown(body)}</div>`;
        el.classList.remove('hidden');b.textContent='收起档案';
      }catch(e){el.textContent='读取失败：'+e.message;el.classList.remove('hidden');b.textContent='打开档案'}
      b.disabled=false;
    }else{el.classList.add('hidden');b.textContent='打开档案'}
  });

  if(current==='People'){
    const search=document.querySelector('#people-search');
    if(search)search.oninput=()=>{
      const q=search.value.trim().toLowerCase();
      let visible=0;
      view.querySelectorAll('[data-person]').forEach(card=>{const show=!q||card.dataset.person.includes(q);card.classList.toggle('hidden',!show);if(show)visible++});
      document.querySelector('#people-empty-search')?.remove();
      if(q&&visible===0&&view.querySelectorAll('[data-person]').length){
        const empty=document.createElement('div');empty.className='empty-state';empty.id='people-empty-search';empty.textContent=`没有匹配“${search.value.trim()}”的人物。`;
        document.querySelector('#people-grid').appendChild(empty);
      }
    };
    document.querySelector('#create-person').onclick=async()=>{
      const result=document.querySelector('#person-result'),btn=document.querySelector('#create-person');
      const name=document.querySelector('#new-name').value.trim();
      if(!name){result.innerHTML=`<div class="notice danger">请先填写姓名。</div>`;document.querySelector('#new-name').focus();return}
      btn.disabled=true;btn.textContent='创建中…';
      try{
        const created=await api('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,country:document.querySelector('#new-country').value,city:document.querySelector('#new-city').value,languages:document.querySelector('#new-languages').value,interests:document.querySelector('#new-interests').value})});
        toast('档案已创建：'+created.path.split('/')[1]);
        await render();
      }catch(e){result.innerHTML=`<div class="notice danger">${esc(e.message)}</div>`;btn.disabled=false;btn.textContent='创建本地档案'}
    };
    document.querySelector('#new-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#create-person').click()});
  }

  if(current==='Practice'){
    const levelSelect=document.querySelector('#level'),summary=document.querySelector('#level-summary'),selected=document.querySelector('#level-selected');
    const updateLevel=()=>{const level=levels.find(item=>item.n===Number(levelSelect.value));summary.textContent=`当前选择：Level ${level.n} · ${level.short}`;selected.textContent=level.desc};
    updateLevel();levelSelect.onchange=updateLevel;
    const copyBtn=document.querySelector('#copy-practice'),area=document.querySelector('#practice');
    copyBtn.onclick=async()=>{try{await copyText(area.value);toast('练习提示词已复制')}catch(e){toast('复制失败，请手动全选复制')}};
    document.querySelector('#prompt').onclick=()=>{
      const level=levels.find(item=>item.n===Number(levelSelect.value));
      area.value=`场景：${document.querySelector('#scene').value}。模拟一位虚构的普通英语交流对象，不冒充我现实中认识的人，也不预测任何真实人物的反应。难度：Level ${level.n}（${level.short}）——${level.desc} 请主要用简短自然的英语交流，不要像老师；按上面的难度规则控制主动程度、回答长度和对话节奏。练习约10分钟；我说“结束练习”后，停止角色扮演，先根据本次实际交流制作一份完整、可直接使用的 Markdown 练习记录，并必须提供可下载的 .md 文件。若当前 Live 界面无法生成附件，要明确说明并输出完整正文，不得只给简短总结。

文件名固定为：口语练习 YYYY-MM-DD - {场景短名} - Level ${level.n} - {8位随机十六进制标识}.md。日期按 Asia/Shanghai 取练习当天；不得使用竖线字符，也不要套用正式归档文件命名规范。请将文件建议保存到项目目录下的 SocialMate-Data/Practice/Sessions/。你无法直接访问我本机文件系统，不要声称已保存到该路径；请生成可下载文件。如果当前界面不能生成附件，就输出完整 Markdown 正文，方便我保存为上述文件。

Markdown 必须包含以下固定结构，字段不得省略：
---
record_type: oral_practice_session
