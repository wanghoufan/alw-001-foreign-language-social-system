plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'app.socialmate.dualmic'
    compileSdk 35
    defaultConfig {
        // T1-3：不再把任何长期令牌/密钥编译进 APK（旧 ARCHIVE_TOKEN 常量已删除）。
        // 凭证改由「一次性配对码 → 设备 secret（Keystore 加密）→ ≤24h 短期令牌」获得，
        // 未配对时客户端 fail closed，服务端 401。
        applicationId 'app.socialmate.dualmic'
        minSdk 26
        targetSdk 35
        versionCode 65
        versionName '0.8.30'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
