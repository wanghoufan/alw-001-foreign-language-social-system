  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">

        <div class="topbar-actions"><span class="prototype-tag">交互演示版</span><button id="themeMobile" class="icon-btn theme-button" type="button" aria-label="切换主题"><svg><use href="#i-sun"></use></svg></button><button id="settingsButton" class="icon-btn settings-button" type="button" aria-label="显示设置：字体大小和页面间距" title="显示设置"><svg><use href="#i-settings"></use></svg></button></div>

  <script src="app.js"></script>
  <script>
  /* ALW-001 · 景点描述语言：全局一次切换（页面顶部胶囊 ⇄ 设置项联动）。
     只切描述正文，地名始终「中文 English」。app.js 不改动，
     这里在每次渲染完成后把整页卡片刷成当前全局语言。 */
  (function(){
    var KEY="socialmate-place-lang-v1";
    var DATA=window.SOCIALMATE_DATA||{places:[]};
    var lang="zh";

    function write(){try{localStorage.setItem(KEY,JSON.stringify({lang:lang}));}catch(e){}}
    // 读状态：兼容旧版 {def,map}，丢弃按卡记录，def 提升为全局 lang。
    (function load(){
      var saved=null;
      try{saved=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){saved=null;}
      if(!saved||typeof saved!=="object")return;
      if(saved.lang==="en"||saved.lang==="zh"){lang=saved.lang;return;}
      if(saved.def==="en")lang="en";
      if("def" in saved||"map" in saved)write(); // 迁移成 {lang}
    })();

    function clip(text,limit){
      var s=String(text||"").replace(/\s+/g," ").trim();
      return s.length>limit?s.slice(0,limit-1)+"…":s;
    }
    function placeOf(id){
      for(var i=0;i<(DATA.places||[]).length;i++)if(String(DATA.places[i].id)===String(id))return DATA.places[i];
      return null;
    }

    function paintCard(card){
      var btn=card.querySelector('[data-action="detail-place"]');
      if(!btn)return;
      var place=placeOf(btn.dataset.id);
      if(!place)return;
      // 地名一行：中文为主，英文浅色紧随（不随语言切换）
      var title=card.querySelector(".place-content h3"),name=card.querySelector(".english-name");
      if(title&&name&&name.parentNode!==title)title.appendChild(name);
      var desc=card.querySelector(".place-content p");
      if(!desc)return;
      desc.classList.add("place-desc");
      desc.textContent=lang==="en"?clip(place.en,160):clip(place.cn,110);
      if(lang==="en")desc.setAttribute("lang","en");else desc.removeAttribute("lang");
    }
    function paintCards(){
      Array.prototype.forEach.call(document.querySelectorAll("#workspace .place-card"),paintCard);
    }

    function ensureSwitch(){
      var bar=document.querySelector(".topbar-actions");
      if(!bar)return;
      if(bar.querySelector(".place-lang-switch"))return;
      var el=document.createElement("div");
      el.className="place-lang-switch";
      el.setAttribute("role","group");
      el.setAttribute("aria-label","景点描述语言");
      el.innerHTML='<button type="button" data-place-lang-set="zh" aria-pressed="false">中</button>'+
        '<button type="button" data-place-lang-set="en" aria-pressed="false">EN</button>';
      bar.appendChild(el);
    }
    function paintSettings(){
      var modal=document.querySelector("#modalRoot .settings-modal");
      if(!modal)return;
      if(modal.querySelector("[data-place-default-box]"))return;
      var box=document.createElement("div");
      box.className="field-group";
      box.setAttribute("data-place-default-box","");
      box.innerHTML='<label class="field-label">景点描述默认语言：中文 / English</label>'+
        '<div class="settings-options" role="group" aria-label="景点描述默认语言">'+
        '<button type="button" class="setting-choice" data-place-lang-set="zh" aria-pressed="false">中文</button>'+
        '<button type="button" class="setting-choice" data-place-lang-set="en" aria-pressed="false">English</button></div>'+
        '<p class="subtle-note">全局生效：切换后整页所有景点卡的描述同时换语言，无需刷新；地名始终保留「中文 English」。</p>';
      var anchor=modal.querySelector(".settings-preview");
      if(anchor)modal.insertBefore(box,anchor);else modal.appendChild(box);
    }
    function syncControls(){
      Array.prototype.forEach.call(document.querySelectorAll("[data-place-lang-set]"),function(b){
        var on=b.getAttribute("data-place-lang-set")===lang;
        b.setAttribute("aria-pressed",on?"true":"false");
        b.classList.toggle("active",on);
      });
    }
    function apply(){ensureSwitch();paintCards();paintSettings();syncControls();}

    document.addEventListener("click",function(e){
      var hit=e.target.closest?e.target.closest("[data-place-lang-set]"):null;
      if(!hit)return;
      var next=hit.getAttribute("data-place-lang-set")==="en"?"en":"zh";
      if(next===lang){syncControls();return;}
      lang=next;write();apply();
    });

    var io=null,queued=false;
    function paint(){
      if(io)io.disconnect();
      try{apply();}finally{
        if(io)io.observe(document.body,{childList:true,subtree:true});
      }
    }
    function schedule(){
      if(queued)return;
      queued=true;
      requestAnimationFrame(function(){queued=false;paint();});
    }
    if(window.MutationObserver){
      io=new MutationObserver(schedule);
      io.observe(document.body,{childList:true,subtree:true});
    }
    paint();
    window.addEventListener("load",paint);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)paint();});
  })();
  </script>
</body>
