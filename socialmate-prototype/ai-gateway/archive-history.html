<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>SocialMate · 会话归档历史</title>
<style>
:root{--bg:#f4f6fa;--paper:#fff;--ink:#1c293a;--muted:#6b7889;--stroke:#e4e9ed;--pine:#146f61;--soft:#e8f4ef;--sand:#e8bd87;--err:#b4362f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--stroke);padding:12px 16px calc(12px + env(safe-area-inset-bottom)*0)}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
main{padding:16px;max-width:820px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--stroke);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input{font:inherit;padding:8px 10px;border:1px solid var(--stroke);border-radius:8px;background:#fff;color:inherit;min-width:0}
input[type=password],input[type=text]{width:100%}
button{font:inherit;padding:9px 14px;border-radius:9px;border:1px solid var(--stroke);background:#fff;color:inherit;cursor:pointer}
button.primary{background:var(--pine);color:#fff;border-color:var(--pine)}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px}
.status.ok{color:var(--pine)}
.status.err{color:var(--err)}
.summary{font-size:13px;color:var(--muted);margin:0 0 10px}
.item{border:1px solid var(--stroke);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;background:#fff}
.item:hover,.item:focus{background:var(--soft);outline:none}
.item .t{font-weight:600;font-size:14px}
.item .m{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--pine);margin-left:6px;vertical-align:1px}
.badge.ai{background:#fdf1e3;color:#8a5a1b}
.seg{border-left:3px solid var(--stroke);padding:6px 0 6px 10px;margin:8px 0}
.seg .meta{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.seg .txt{white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
pre.ai{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:10px;border-radius:8px;font:inherit;font-size:13px}
a.back{font-size:13px;color:var(--pine);text-decoration:none;display:inline-block;margin-bottom:10px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>会话归档历史</h1>
  <p>只读查看 Mac mini 上已归档的会话原文 · 不在此页面修改任何文件</p>
</header>
<main>
  <section class="card" id="authCard">
    <label for="token">归档访问令牌（保存在本浏览器，不上传）</label>
    <input id="token" type="password" autocomplete="off" placeholder="从 Mac mini 的 .local/archive-token 复制">
    <div class="row" style="margin-top:10px">
      <button class="primary" id="connect">连接并读取</button>
      <button id="forget">清除本机令牌</button>
    </div>
    <div class="status" id="authStatus">尚未连接</div>
  </section>

  <section class="card" id="listCard">
    <div class="grid">
      <div><label for="from">起始日期（UTC）</label><input id="from" type="date"></div>
      <div><label for="to">结束日期（UTC）</label><input id="to" type="date"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="reload">刷新列表</button>
      <button id="export">导出该范围 (.md)</button>
      <button id="today">今天</button>
    </div>
    <div class="status" id="listStatus"></div>
  </section>

  <section id="list"></section>
  <section id="detail" class="hidden"></section>
</main>
<script>
(() => {
  const KEY = "sm-archive-token";
  const $ = (id) => document.getElementById(id);
  // 同一份页面会被两种方式提供：归档服务根路径 /history，或私有 UI 的 /v12/history。
  // 按当前路径推导前缀，保证 request 始终落在同源下的 api/archive/*。
  const PREFIX = location.pathname.replace(/history\/?$/, "");
  let token = "";
  let cache = [];

  const url = (p) => PREFIX + p;

  const fmtDur = (ms) => {
    const s = Math.round(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  const fmtTime = (iso) => {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
  };
  const setStatus = (el, text, kind) => {
    el.textContent = text;
    el.className = "status" + (kind ? " " + kind : "");
  };

  async function api(path) {
    const res = await fetch(url(path), {headers: {"x-archive-token": token}, cache: "no-store"});
    if (res.status === 401) throw new Error("令牌无效（401）");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function rangeQuery() {
    const q = new URLSearchParams();
    if ($("from").value) q.set("from", $("from").value);
    if ($("to").value) q.set("to", $("to").value);
    const s = q.toString();
    return s ? "?" + s : "";
  }

  function renderList(data) {
    const host = $("list");
    host.innerHTML = "";
    const summary = document.createElement("p");
    summary.className = "summary";
    const skipped = data.skipped ? ` · 跳过损坏 ${data.skipped}` : "";
    summary.textContent = `共 ${data.total} 个会话（扫描 ${data.scanned} 份记录${skipped}）`;
    host.appendChild(summary);
    if (!data.items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "该日期范围内没有归档会话。";
      host.appendChild(empty);
      return;
    }
    cache = data.items;
    data.items.forEach((it, i) => {
      const el = document.createElement("div");
      el.className = "item";
      el.tabIndex = 0;
      el.dataset.idx = String(i);
      const t = document.createElement("div");
      t.className = "t";
      t.textContent = fmtTime(it.startedAt);
      if (it.hasAi) {
        const b = document.createElement("span");
        b.className = "badge ai";
        b.textContent = "含 AI";
        t.appendChild(b);
      }
      const m = document.createElement("div");
      m.className = "m";
      m.textContent = `时长 ${fmtDur(it.durationMs)} · ${it.segmentCount} 段 · 说话人 ${it.speakers.join("/") || "—"} · rev ${it.revision} · ${it.sessionId.slice(0, 10)}…`;
      el.append(t, m);
      el.addEventListener("click", () => openDetail(it.sessionId));
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") openDetail(it.sessionId); });
      host.appendChild(el);
    });
  }

  async function openDetail(sessionId) {
    setStatus($("listStatus"), "读取会话原文…");
    try {
      const data = await api(`api/archive/session/${encodeURIComponent(sessionId)}`);
      renderDetail(data);
      setStatus($("listStatus"), "");
      window.scrollTo({top: 0, behavior: "smooth"});
    } catch (e) {
      setStatus($("listStatus"), "读取失败：" + e.message, "err");
    }
  }

  function renderDetail(data) {
    const s = data.session;
    const host = $("detail");
    host.classList.remove("hidden");
    host.innerHTML = "";
    const card = document.createElement("div");
    card.className = "card";

    const back = document.createElement("a");
    back.className = "back";
    back.href = "#";
    back.textContent = "← 返回列表";
    back.addEventListener("click", (e) => {
      e.preventDefault();
      host.classList.add("hidden");
      host.innerHTML = "";
      $("list").classList.remove("hidden");
    });

    const h = document.createElement("div");
    h.className = "t";
    h.style.fontWeight = "600";
    h.textContent = fmtTime(s.startedAt);

    const meta = document.createElement("div");
    meta.className = "m";
    meta.style.fontSize = "12px";
    meta.style.color = "var(--muted)";
    meta.textContent = `会话 ${s.sessionId} · 时长 ${fmtDur(Date.parse(s.endedAt) - Date.parse(s.startedAt))} · ${s.segments.length} 段 · 应用 ${s.appVersion} · 授权 录音${s.consent.recording ? "是" : "否"}/云端AI${s.consent.cloudAi ? "是" : "否"}`;

    const note = document.createElement("p");
    note.className = "summary";
    note.style.marginTop = "8px";
    note.textContent = "以下为 ASR 原始转写，逐字保留，未经 AI 改写。说话人仅为聚类编号。";

    card.append(back, h, meta, note);

    s.segments.forEach((seg) => {
      const box = document.createElement("div");
      box.className = "seg";
      const m = document.createElement("div");
      m.className = "meta";
      const p = (n) => String(n).padStart(2, "0");
      const mm = Math.floor(seg.startMs / 60000);
      const ss = Math.floor((seg.startMs % 60000) / 1000);
      m.textContent = `${p(mm)}:${p(ss)} · 说话人 ${seg.speakerId} · 轨道 ${seg.track} · ${seg.provider}${seg.mock ? " · MOCK" : ""}`;
      const tx = document.createElement("div");
      tx.className = "txt";
      tx.textContent = seg.textOriginal;
      box.append(m, tx);
      card.appendChild(box);
    });

    if (s.ai?.text) {
      const h2 = document.createElement("div");
      h2.className = "t";
      h2.style.marginTop = "14px";
      h2.textContent = "AI 建议（独立生成，不覆盖原文）";
      const pre = document.createElement("pre");
      pre.className = "ai";
      pre.textContent = s.ai.text;
      card.append(h2, pre);
    }

    host.appendChild(card);
    $("list").classList.add("hidden");
  }

  async function loadList() {
    setStatus($("listStatus"), "读取中…");
    try {
      const data = await api("api/archive/list" + rangeQuery());
      renderList(data);
      setStatus($("listStatus"), "");
      $("detail").classList.add("hidden");
      $("list").classList.remove("hidden");
      return true;
    } catch (e) {
      setStatus($("listStatus"), e.message, e.message.includes("401") ? "err" : "err");
      return false;
    }
  }

  $("connect").addEventListener("click", async () => {
    const v = $("token").value.trim();
    if (!v) return setStatus($("authStatus"), "请先填入令牌", "err");
    token = v;
    try {
      const health = await fetch(url("api/archive/health"), {cache: "no-store"}).then((r) => r.json());
      if (!health?.ok) throw new Error("服务未就绪");
    } catch (e) {
      return setStatus($("authStatus"), "无法连接归档服务：" + e.message, "err");
    }
    if (await loadList()) {
      localStorage.setItem(KEY, token);
      setStatus($("authStatus"), "已连接 · 令牌已保存在本浏览器", "ok");
      $("token").value = "";
    }
  });

  $("forget").addEventListener("click", () => {
    token = "";
    localStorage.removeItem(KEY);
    $("token").value = "";
    $("list").innerHTML = "";
    $("detail").classList.add("hidden");
    setStatus($("authStatus"), "已清除本机令牌");
    setStatus($("listStatus"), "");
  });

  $("reload").addEventListener("click", loadList);
  $("today").addEventListener("click", () => {
    const d = new Date().toISOString().slice(0, 10);
    $("from").value = d;
    $("to").value = d;
    loadList();
  });

  $("export").addEventListener("click", async () => {
    setStatus($("listStatus"), "导出中…");
    try {
      const res = await fetch(url("api/archive/export") + rangeQuery(), {
        headers: {"x-archive-token": token}, cache: "no-store",
      });
      if (res.status === 401) throw new Error("令牌无效（401）");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (!text.trim()) throw new Error("该范围没有可导出的会话");
      const blob = new Blob([text], {type: "text/markdown;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const r = rangeQuery().replace("?", "").replace(/&/g, "_") || "all";
      a.href = url;
      a.download = `SocialMate-导出-${r}.md`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setStatus($("listStatus"), `已导出（${(text.length / 1024).toFixed(1)} KB）`, "ok");
    } catch (e) {
      setStatus($("listStatus"), "导出失败：" + e.message, "err");
    }
  });

  const saved = localStorage.getItem(KEY);
  if (saved) {
    token = saved;
    loadList().then((ok) => {
      setStatus($("authStatus"), ok ? "已用本机保存的令牌连接" : "本机保存的令牌无法使用，请重新填入",
        ok ? "ok" : "err");
    });
  }
})();
</script>
</body>
</html>
