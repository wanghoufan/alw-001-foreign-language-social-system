<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>SocialMate · 会话归档历史</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f5f7f3;--paper:#fff;--ink:#1e3c54;--muted:#5c6f79;--stroke:#dde5e7;--pine:#0c7766;--soft:#e9f5f1;--sand:#e8bd87;--err:#a3342c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--stroke);padding:12px 16px calc(12px + env(safe-area-inset-bottom)*0)}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
main{padding:16px;max-width:820px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--stroke);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input{font:inherit;padding:8px 10px;border:1px solid var(--stroke);border-radius:8px;background:#fff;color:inherit;min-width:0}
input[type=password],input[type=text]{width:100%}
button{font:inherit;padding:9px 14px;border-radius:9px;border:1px solid var(--stroke);background:#fff;color:inherit;cursor:pointer}
button.primary{background:var(--pine);color:#fff;border-color:var(--pine)}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px}
.status.ok{color:var(--pine)}
.status.err{color:var(--err)}
.summary{font-size:13px;color:var(--muted);margin:0 0 10px}
.item{border:1px solid var(--stroke);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;background:#fff}
.item:hover,.item:focus{background:var(--soft);outline:none}
.item .t{font-weight:600;font-size:14px}
.item .m{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--pine);margin-left:6px;vertical-align:1px}
.badge.ai{background:#fdf1e3;color:#8a5a1b}
.seg{border-left:3px solid var(--stroke);padding:6px 0 6px 10px;margin:8px 0}
.seg .meta{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.seg .txt{white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
pre.ai{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:10px;border-radius:8px;font:inherit;font-size:13px}
a.back{font-size:13px;color:var(--pine);text-decoration:none;display:inline-block;margin-bottom:10px}
.hidden{display:none}
.review{border:1px solid var(--stroke);border-radius:10px;padding:12px;margin-top:14px;background:#fbfcfe}
.review h3{margin:0 0 6px;font-size:15px}
.review .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.cand{border:1px solid var(--stroke);border-radius:9px;padding:10px;margin-bottom:9px;background:#fff}
.cand .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cand textarea{width:100%;min-height:56px;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--stroke);border-radius:7px;margin-top:7px;resize:vertical;background:#fff;color:inherit}
.cand .src{font-size:11px;color:var(--muted);margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
.cand select{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--stroke);border-radius:7px;background:#fff;color:inherit}
.cand input.name{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--stroke);border-radius:7px;width:120px}
.engine{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--pine)}
.engine.ai{background:#fdf1e3;color:#8a5a1b}
.list-mini{font-size:13px;margin:6px 0 0;padding-left:18px}
.list-mini li{margin:2px 0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.6}
select{font:inherit;padding:8px 10px;border:1px solid var(--stroke);border-radius:8px;background:#fff;color:inherit;width:100%;min-height:40px}
.item{position:relative}
.item .meta-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.item .peep{font-size:12px;color:var(--pine);background:var(--soft);border-radius:99px;padding:1px 8px}
.item .open-hint{font-size:12px;color:var(--muted);margin-top:6px}
.excerpt{border-left:3px solid var(--pine);background:#f7faf9;border-radius:8px;padding:8px 10px;margin:8px 0 0;font-size:13px;line-height:1.6;word-break:break-word}
.excerpt .who{display:block;font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:2px}
.morebar{margin:4px 0 20px}
.morebar button{width:100%;min-height:44px}
button{min-height:40px}
.item{cursor:pointer}
.item .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item .rowbtns button{min-height:40px}
a.applink{font-size:14px;padding:9px 14px;min-height:40px;border:1px solid var(--stroke);border-radius:9px;background:var(--paper);color:var(--pine);text-decoration:none;display:inline-flex;align-items:center}
.langbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.langbar button{font-size:12px;padding:5px 12px;min-height:32px;border-radius:99px;background:transparent;color:var(--muted)}
.langbar button[aria-pressed=true]{background:var(--soft);border-color:var(--pine);color:var(--pine);font-weight:600}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){
 :root{color-scheme:dark;--bg:#0e161d;--paper:#16212b;--ink:#e6eef2;--muted:#9fb2bd;--stroke:#2a3a46;--pine:#63d6c0;--soft:#1c2f2b;--sand:#e8bd87;--err:#ff9a90}
 input,textarea,select,button,.item,.cand{background:var(--paper)}
 button.primary{background:var(--pine);color:#071410;border-color:var(--pine)}
 .review{background:#131d26}
 .excerpt{background:#152a26}
 .badge.ai,.engine.ai{background:#3a2c17;color:#f2c88e}
}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">会话归档历史</h1>
  <p id="hSub">默认只看日期 / 段数 / 归属；点开才读原文。原文只读，复盘候选须你逐条勾选确认才写入本机档案。</p>
  <div class="langbar" id="langbar" role="group" aria-label="语言">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="system" id="langSys">跟随系统</button>
  </div>
</header>
<main>
  <section class="card" id="authCard">
    <label for="token" id="tokenLabel">归档访问令牌</label>
    <input id="token" type="password" autocomplete="off" placeholder="从 Mac mini 的 .local/archive-token 复制">
    <div class="row" style="margin-top:10px">
      <button class="primary" id="connect">连接</button>
      <button id="forget">清空令牌</button>
    </div>
    <p class="hint" id="tokenHint">首次需粘贴令牌，本次会话有效；关闭页面即失效，不写入长期存储，也不进网址。</p>
    <div class="status" id="authStatus">尚未连接</div>
  </section>

  <section class="card" id="listCard">
    <label for="q" id="qLabel">关键词（在原文里搜）</label>
    <input id="q" type="search" placeholder="如 hiking / 咖啡 / 跑步" autocomplete="off">
    <div class="grid" style="margin-top:10px">
      <div><label for="person" id="personLabel">人物</label><select id="person"><option value="" id="personAll">全部</option></select></div>
      <div><label for="limit" id="limitLabel">每页</label><select id="limit"><option value="10" data-n="10">10 条</option><option value="20" data-n="20" selected>20 条</option><option value="50" data-n="50">50 条</option></select></div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div><label for="from" id="fromLabel">起始日期（UTC）</label><input id="from" type="date"></div>
      <div><label for="to" id="toLabel">结束日期（UTC）</label><input id="to" type="date"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="search">搜索</button>
      <button id="today">今天</button>
      <button id="clear">清空条件</button>
      <button id="export">导出该日期范围 (.md)</button>
    </div>
    <p class="hint" id="dateHint">日期按 UTC 归档日筛选：文件名和归档目录都用 UTC，海口是 UTC+8，本地日期可能比这里晚一天（如 UTC 16:30 已是次日 00:30）。</p>
    <div class="status" id="listStatus"></div>
  </section>

  <section id="list"></section>
  <section id="more" class="hidden"><button class="primary" id="moreBtn">加载更多</button></section>
  <section id="detail" class="hidden"></section>
</main>

  // 与主页面同一套：LANG 只由 applyLang 决定，缺 key 时回退到 zh，再回退到 key 本身。
  let LANG = 'zh';
  function t(k, vars) {
    const d = I18N[LANG] || {};
    let s = d[k] !== undefined ? d[k] : (I18N.zh[k] !== undefined ? I18N.zh[k] : k);
    if (vars) for (const p of Object.keys(vars)) s = s.split('{' + p + '}').join(String(vars[p]));
    return s;
  }

  function readLangPref() {
    try { return (JSON.parse(localStorage.getItem(LANG_KEY) || '{}') || {}).lang || 'zh'; } catch { return 'zh'; }
  }
  function writeLangPref(pref) {
    try {
      const s = JSON.parse(localStorage.getItem(LANG_KEY) || '{}') || {};
      s.lang = pref;
      localStorage.setItem(LANG_KEY, JSON.stringify(s));
    } catch {}
  }

  const url = (p) => PREFIX + p;

  const fmtDur = (ms) => {
    const s = Math.round(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  const fmtTime = (iso) => {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
  };

  // 状态文案按 key 存起来，切语言时整页重绘仍能保持当前状态与颜色。
  const STATUS = {authStatus: {key: 'hist.notConnected', kind: "", vars: null}};
  function paintStatus(id) {
    const node = $(id);
    if (!node) return;
    const st = STATUS[id];
    node.textContent = st && st.key ? t(st.key, st.vars) : "";
    node.className = "status" + (st && st.kind ? " " + st.kind : "");
  }
  const setStatus = (id, key, kind, vars) => {
    STATUS[id] = {key: key || null, kind: kind || "", vars: vars || null};
    paintStatus(id);
  };

  const fmtLocal = (iso) => {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  async function api(path) {
    const res = await fetch(url(path), {headers: {"x-archive-token": token}, cache: "no-store"});
    if (res.status === 401) {
      const err = new Error(t('hist.err401'));
      err.status = 401;
      throw err;
    }
    if (!res.ok) {
      let data = null;
      try { data = await res.json(); } catch { data = null; }
      const err = new Error((data && (data.error || data.code)) || `HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  function rangeQuery() {
    const q = new URLSearchParams();
    if ($("from").value) q.set("from", $("from").value);
    if ($("to").value) q.set("to", $("to").value);
    const s = q.toString();
    return s ? "?" + s : "";
  }

  /** 列表只渲染元数据；命中摘要折叠在卡片里，点开才展开。 */
  function itemNode(it) {
    const el = document.createElement("div");
    el.className = "item";
    el.tabIndex = 0;

    const ttl = document.createElement("div");
    ttl.className = "t";
    ttl.textContent = t('hist.itemTitle', {
      date: it.date || t('hist.unknownDate'),
      local: fmtLocal(it.startedAt),
    });
    if (it.hasFinal === false) {
      const b = document.createElement("span");
      b.className = "badge ai";
      b.textContent = t('hist.draftBadge');
      ttl.appendChild(b);
    }

    const m = document.createElement("div");
    m.className = "m";
    m.textContent = it.segments.matched
      ? t('hist.itemMetaHit', {total: it.segments.total, hit: it.segments.matched, dur: fmtDur(it.durationMs)})
      : t('hist.itemMeta', {total: it.segments.total, dur: fmtDur(it.durationMs)});

    const meta = document.createElement("div");
    meta.className = "meta-line";
    if (it.people && it.people.length) {
      it.people.forEach((p) => {
        const chip = document.createElement("span");
        chip.className = "peep";
        chip.textContent = p.name || p.slug;
        meta.appendChild(chip);
      });
    } else {
      const chip = document.createElement("span");
      chip.className = "peep";
      chip.style.background = "transparent";
      chip.style.color = "var(--muted)";
      chip.textContent = t('hist.noPerson');
      meta.appendChild(chip);
    }

    const hint = document.createElement("div");
    hint.className = "open-hint";
    const hasExcerpt = it.segments.excerpts && it.segments.excerpts.length;
    hint.textContent = hasExcerpt ? t('hist.openExcerpt') : t('hist.openPlain');

    const box = document.createElement("div");
    box.className = "hidden";
    (it.segments.excerpts || []).forEach((ex) => {
      const row = document.createElement("div");
      row.className = "excerpt";
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = t('hist.excerptWho', {i: ex.index + 1, spk: ex.speakerId});
      const txt = document.createElement("div");
      txt.textContent = ex.text;
      row.append(who, txt);
      box.appendChild(row);
    });
    const openBtn = document.createElement("button");
    openBtn.textContent = t('hist.openDetail');
    openBtn.addEventListener("click", (e) => { e.stopPropagation(); openDetail(it.sessionId); });
    const rowbtns = document.createElement("div");
    rowbtns.className = "rowbtns";
    rowbtns.appendChild(openBtn);
    box.appendChild(rowbtns);

    el.append(ttl, m, meta, hint, box);
    const toggle = () => {
      box.classList.toggle("hidden");
      const open = !box.classList.contains("hidden");
      hint.textContent = open ? t('hist.collapse') : (hasExcerpt ? t('hist.openExcerpt') : t('hist.openPlain'));
    };
    el.addEventListener("click", (e) => { if (e.target.closest("button")) return; toggle(); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") toggle(); });
    return el;
  }

  function renderList(data) {
    LAST.list = data;
    const host = $("list");
    host.innerHTML = "";
    nextCursor = data.nextCursor || null;
    const summary = document.createElement("p");
    summary.className = "summary";
    const total = typeof data.matched === "number" ? data.matched : items.length;
    summary.textContent = t('hist.summary', {
      total,
      shown: items.length,
      skipped: data.skipped ? t('hist.skipped', {n: data.skipped}) : "",
    });
    host.appendChild(summary);
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = t('hist.empty');
      host.appendChild(empty);
      $("more").classList.add("hidden");
      return;
    }
    items.forEach((it) => host.appendChild(itemNode(it)));
    $("more").classList.toggle("hidden", !nextCursor);
  }

  async function openDetail(sessionId) {
    setStatus("listStatus", 'hist.loadingDetail');
    try {
      const data = await api(`api/archive/session/${encodeURIComponent(sessionId)}`);
      renderDetail(data);
      $("more").classList.add("hidden");
      setStatus("listStatus", null);
      window.scrollTo({top: 0, behavior: "smooth"});
    } catch (e) {
      setStatus("listStatus", e.status === 404 ? 'hist.errDetail404'
        : e.status === 401 ? 'hist.errDetail401'
        : 'hist.errReadFail', "err", e.status === 404 || e.status === 401 ? null : {msg: e.message});
    }
  }

  // 详情原文按纯文本导出，不改动后端导出接口。
  function sessionMarkdown(s) {
    const lines = [];
    lines.push(`# ${fmtTime(s.startedAt)}`);
    lines.push("");
    lines.push(t('hist.detailMeta', {
      id: s.sessionId,
      dur: fmtDur(Date.parse(s.endedAt) - Date.parse(s.startedAt)),
      segs: s.segments.length,
      ver: s.appVersion,
      rec: s.consent.recording ? t('hist.yes') : t('hist.no'),
      ai: s.consent.cloudAi ? t('hist.yes') : t('hist.no'),
    }));
    lines.push("");
    lines.push(t('hist.asrNote'));
    lines.push("");
    s.segments.forEach((seg) => {
      const p = (n) => String(n).padStart(2, "0");
      const mm = Math.floor(seg.startMs / 60000);
      const ss = Math.floor((seg.startMs % 60000) / 1000);
      lines.push(t('hist.segMeta', {
        clock: `${p(mm)}:${p(ss)}`,
        spk: seg.speakerId,
        track: seg.track,
        provider: seg.provider,
      }) + (seg.mock ? " · MOCK" : ""));
      lines.push(seg.textOriginal);
      lines.push("");
    });
    if (s.ai?.text) {
      lines.push("---");
      lines.push(`## ${t('hist.aiTitle')}`);
      lines.push("");
      lines.push(s.ai.text);
      lines.push("");
    }
    return lines.join("\n");
  }

  function renderDetail(data) {
    LAST.detail = data;
    const s = data.session;
    const host = $("detail");
    host.classList.remove("hidden");
    host.innerHTML = "";
    setStatus("detailStatus", null);
    const card = document.createElement("div");
    card.className = "card";
    const back = document.createElement("a");
    back.className = "back";
    back.href = "#";
    back.textContent = t('hist.back');
    back.addEventListener("click", (e) => {
      e.preventDefault();
      LAST.detail = null;
      host.classList.add("hidden");
      host.innerHTML = "";
      $("list").classList.remove("hidden");
      $("more").classList.toggle("hidden", !nextCursor);
    });

    const h = document.createElement("div");
    h.className = "t";
    h.style.fontWeight = "600";
    h.textContent = fmtTime(s.startedAt);

    const meta = document.createElement("div");
    meta.className = "m";
    meta.style.fontSize = "12px";
    meta.style.color = "var(--muted)";
    meta.textContent = t('hist.detailMeta', {
      id: s.sessionId,
      dur: fmtDur(Date.parse(s.endedAt) - Date.parse(s.startedAt)),
      segs: s.segments.length,
      ver: s.appVersion,
      rec: s.consent.recording ? t('hist.yes') : t('hist.no'),
      ai: s.consent.cloudAi ? t('hist.yes') : t('hist.no'),
    });

    const note = document.createElement("p");
    note.className = "summary";
    note.style.marginTop = "8px";
    note.textContent = t('hist.asrNote');

    // 复制 / 下载 / 回到 App：都只用已读到的原文，不新增任何接口调用。
    const actions = document.createElement("div");
    actions.className = "row";
    actions.style.marginTop = "10px";
    const copyBtn = document.createElement("button");
    copyBtn.className = "primary";
    copyBtn.textContent = t('hist.copy');
    const dlBtn = document.createElement("button");
    dlBtn.textContent = t('hist.download');
    const backApp = document.createElement("a");
    backApp.className = "applink";
    backApp.href = "/";
    backApp.textContent = t('hist.backToApp');
    const actionStatus = document.createElement("div");
    actionStatus.className = "status";
    actionStatus.id = "detailStatus";
    actions.append(copyBtn, dlBtn, backApp);

    copyBtn.addEventListener("click", async () => {
      const plain = sessionMarkdown(s);
      if (!plain.trim()) return setStatus("detailStatus", 'hist.copyEmpty', "err");
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(plain);
        } else {
          const ta = document.createElement("textarea");
          ta.value = plain;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        setStatus("detailStatus", 'hist.copied', "ok");
      } catch {
        setStatus("detailStatus", 'hist.copyEmpty', "err");
      }
    });
    dlBtn.addEventListener("click", () => {
      const markdown = sessionMarkdown(s);
      const name = t('hist.downloadName', {id: s.sessionId});
      // App 内：走原生桥 → SAF 由用户选保存位置（WebView 对 blob: 下载通常不会触发下载器）。
      try {
        const bridge = window.SocialMateAndroid;
        if (bridge && typeof bridge.saveText === "function" && bridge.saveText(name, markdown)) {
          setStatus("detailStatus", 'hist.download', "ok");
          return;
        }
      } catch {}
      const blob = new Blob([markdown], {type: "text/markdown;charset=utf-8"});
      const href = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = href;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(href), 4000);
    });

    card.append(back, h, meta, note, actions, actionStatus);

    s.segments.forEach((seg) => {
      const box = document.createElement("div");
      box.className = "seg";
      const m = document.createElement("div");
      m.className = "meta";
      const p = (n) => String(n).padStart(2, "0");
      const mm = Math.floor(seg.startMs / 60000);
      const ss = Math.floor((seg.startMs % 60000) / 1000);
      m.textContent = t('hist.segMeta', {
        clock: `${p(mm)}:${p(ss)}`,
        spk: seg.speakerId,
        track: seg.track,
        provider: seg.provider,
      }) + (seg.mock ? " · MOCK" : "");
      const tx = document.createElement("div");
      tx.className = "txt";
      tx.textContent = seg.textOriginal;
      box.append(m, tx);
      card.appendChild(box);
    });

    if (s.ai?.text) {
      const h2 = document.createElement("div");
      h2.className = "t";
      h2.style.marginTop = "14px";
      h2.textContent = t('hist.aiTitle');
      const pre = document.createElement("pre");
      pre.className = "ai";
      pre.textContent = s.ai.text;
      card.append(h2, pre);
    }

    host.appendChild(card);
    const reviewCard = buildReviewCard(s);
    host.appendChild(reviewCard);
    $("list").classList.add("hidden");
  }

  // ── 会后复盘 ────────────────────────────────────────────────────────────
  // 只使用 /v12 同源私有 UI：复盘要读原文并调用本地服务，归档服务本身不提供 AI 与档案写入。
  const REVIEW_AVAILABLE = PREFIX.indexOf("/v12") === 0;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  async function postJson(path, body) {
    const res = await fetch(url(path), {
      method: "POST",
      headers: {"Content-Type": "application/json", "x-archive-token": token},
      body: JSON.stringify(body),
      cache: "no-store",
    });
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (!res.ok) {
      const err = new Error((data && (data.error || data.code)) || `HTTP ${res.status}`);
      err.status = res.status;
      err.payload = data;
      throw err;
    }
    return data;
  }

  // 人物归属只能从真实存在的 People/<slug>/00-profile.md 里选，不能靠显示名猜。
  let peopleCache = null;
  async function loadPeople() {
    if (peopleCache) return peopleCache;
    const res = await fetch(url("api/people"), {headers: {"x-archive-token": token}, cache: "no-store"});
    if (!res.ok) throw new Error(t('hist.peopleFail', {status: res.status}));
    const data = await res.json();
    peopleCache = Array.isArray(data.people) ? data.people : [];
    return peopleCache;
  }

  const SECTIONS = [
    ["preference", "hist.sec.preference"],
    ["interest", "hist.sec.interest"],
    ["work", "hist.sec.work"],
    ["hainan", "hist.sec.hainan"],
    ["common", "hist.sec.common"],
    ["plan", "hist.sec.plan"],
    ["topics", "hist.sec.topics"],
    ["basic", "hist.sec.basic"],
    ["avoid", "hist.sec.avoid"],
  ];

  // 已生成的复盘按 session 缓存：切语言重建卡片时不必重新生成（云端复盘会花钱）。
  const REVIEW_BY_SESSION = Object.create(null);

  function buildReviewCard(session) {
    const card = el("div", "review");
    const title = el("h3", "", t('hist.reviewTitle'));
    card.appendChild(title);
    if (!REVIEW_AVAILABLE) {
      card.appendChild(el("p", "hint", t('hist.reviewUnavailable')));
      return card;
    }
    const hint = el("p", "hint", t('hist.reviewHint'));
    card.appendChild(hint);

    const row = el("div", "row");
    const localBtn = el("button", "primary", t('hist.reviewLocal'));
    const consentWrap = el("label", "");
    consentWrap.style.cssText = "display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)";
    const consent = document.createElement("input");
    consent.type = "checkbox";
    consent.id = "reviewAiConsent";
    const consentText = document.createTextNode(t('hist.reviewConsent'));
    consentWrap.append(consent, consentText);
    const aiBtn = el("button", "", t('hist.reviewAi'));
    row.append(localBtn, aiBtn);
    const status = el("div", "status", t('hist.reviewIdle'));
    const body = el("div", "");
    card.append(row, consentWrap, status, body);

    let review = null;
    let statusKey = 'hist.reviewIdle';
    let statusVars = null;
    let statusKind = "";

    function setRevStatus(key, kind, vars) {
      statusKey = key;
      statusVars = vars || null;
      statusKind = kind || "";
      status.textContent = t(statusKey, statusVars);
      status.className = "status" + (statusKind ? " " + statusKind : "");
      REVIEW_BY_SESSION[session.sessionId] = {review, statusKey, statusVars, statusKind};
    }

    async function generate(mode) {
      localBtn.disabled = true;
      aiBtn.disabled = true;
      setRevStatus(mode === "ai" ? 'hist.reviewAiBusy' : 'hist.reviewLocalBusy');
      body.innerHTML = "";
      try {
        const data = await postJson("api/review", {
          sessionId: session.sessionId, mode,
          consent: mode === "ai" ? consent.checked : false,
        });
        review = data.review;
        let people = [];
        try { people = await loadPeople(); } catch (e) { people = []; }
        renderReview(body, review, session, setRevStatus, people);
        setRevStatus(review.aiUsed ? 'hist.reviewAiDone' : 'hist.reviewLocalDone', "ok",
          review.aiUsed ? {p: review.aiProvider} : null);
      } catch (e) {
        const code = e.payload && e.payload.code;
        if (code === "ORIGIN_REJECTED") setRevStatus('hist.errOrigin', "err");
        else if (code === "CONSENT_REQUIRED") setRevStatus('hist.errConsent', "err");
        else if (e.status === 402) setRevStatus('hist.err402', "err");
        else if (e.status === 401) setRevStatus('hist.err401', "err");
        else if (e.status === 404) setRevStatus('hist.err404', "err");
        else setRevStatus('hist.errGen', "err", {msg: e.message});
      } finally {
        localBtn.disabled = false;
        aiBtn.disabled = false;
      }
    }

    localBtn.addEventListener("click", () => generate("local"));
    aiBtn.addEventListener("click", () => generate("ai"));

    // 已生成过复盘时按缓存重建（切语言重建整张详情卡时用），不重新请求，勾选与编辑内容保留。
    const saved = REVIEW_BY_SESSION[session.sessionId];
    if (saved) {
      if (saved.review) {
        review = saved.review;
        renderReview(body, review, session, setRevStatus, peopleCache || []);
      }
      statusKey = saved.statusKey;
      statusVars = saved.statusVars;
      statusKind = saved.statusKind;
      status.textContent = t(statusKey, statusVars);
      status.className = "status" + (statusKind ? " " + statusKind : "");
    }
    return card;
  }

  function reviewRowState(host) {
    return [...host.querySelectorAll(".cand")].map((box) => ({
      checked: box.querySelector('[data-role="pick"]').checked,
      target: box.querySelector('[data-role="target"]').value,
      person: box.querySelector('[data-role="person"]').value,
      section: box.querySelector('[data-role="section"]').value,
      name: box.querySelector('[data-role="personName"]').value,
      slug: box.querySelector('[data-role="personSlug"]').value,
      text: box.querySelector('[data-role="text"]').value,
    }));
  }

  // 切语言会重建整张详情卡，勾选与手工编辑的候选先存回缓存，重建后再回填。
  function stashReviewRows() {
    const id = LAST.detail && LAST.detail.session && LAST.detail.session.sessionId;
    if (!id || !REVIEW_BY_SESSION[id]) return;
    const box = $("detail").querySelectorAll(".cand");
    if (box.length) REVIEW_BY_SESSION[id].rows = reviewRowState($("detail"));
  }

  function renderReview(host, review, session, setStatus, people = []) {
    // 重绘前先记住勾选与编辑内容，避免切语言时把用户改过的候选冲掉。
    const cached = (REVIEW_BY_SESSION[session.sessionId] || {}).rows;
    let snapshot = reviewRowState(host);
    if (!snapshot.length && Array.isArray(cached)) snapshot = cached;

    host.innerHTML = "";
    const head = el("div", "t", review.summary.headline || t('hist.reviewFallback'));
    head.style.fontSize = "14px";
    const engine = el("span", "engine" + (review.aiUsed ? " ai" : ""),
      review.aiUsed ? t('hist.engineAi', {p: review.aiProvider}) : t('hist.engineLocal'));
    head.appendChild(engine);
    const speakers = (review.summary.speakers || []).join("/") || "—";
    const meta = el("div", "src", t('hist.reviewMeta', {
      segs: review.summary.segments, spk: speakers, note: review.note,
    }));
    host.append(head, meta);

    const talked = review.summary.talkedAbout || review.summary.topicsLabel || [];
    if (talked.length) {
      const ul = el("ul", "list-mini");
      talked.forEach((t) => ul.appendChild(el("li", "", t)));
      host.append(el("div", "t", t('hist.talked')), ul);
    }
    if (review.howToReply && review.howToReply.text) {
      const p = el("div", "src",
        t(review.howToReply.template ? 'hist.howTemplate' : 'hist.howAi') + "：" + review.howToReply.text);
      host.append(p);
    }
    if (Array.isArray(review.followUps) && review.followUps.length) {
      const ul = el("ul", "list-mini");
      review.followUps.forEach((q) => ul.appendChild(el("li", "", q.text + (q.template ? t('hist.templateSuffix') : ""))));
      host.append(el("div", "t", t('hist.followUps')), ul);
    }
    if (Array.isArray(review.warnings) && review.warnings.length) {
      const ul = el("ul", "list-mini");
      review.warnings.forEach((w) => ul.appendChild(el("li", "", w)));
      host.append(el("div", "t", t('hist.warnings')), ul);
    }

    const candTitle = el("div", "t", t('hist.candTitle', {n: (review.items || []).length}));
    candTitle.style.marginTop = "10px";
    host.appendChild(candTitle);
    if (!review.items || !review.items.length) {
      host.appendChild(el("div", "empty", t('hist.candEmpty')));
      return;
    }

    const rows = [];
    review.items.forEach((item, index) => {
      const box = el("div", "cand");
      const headRow = el("div", "head");
      const check = document.createElement("input");
      check.type = "checkbox";
      check.dataset.role = "pick";
      const label = el("span", "src", t('hist.candLabel', {i: index + 1, c: item.confidence}));
      const target = document.createElement("select");
      [["self", 'hist.saveSelf'], ["person", 'hist.savePerson'], ["skip", 'hist.saveSkip']]
        .forEach(([value, key]) => {
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = t(key);
          target.appendChild(opt);
        });
      target.dataset.role = "target";
      // 人物归属：只给真实存在的人物主档，避免同名误绑或凭空建人。
      const personSelect = document.createElement("select");
      personSelect.dataset.role = "person";
      personSelect.classList.add("hidden");
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = people.length ? t('hist.pickPerson') : t('hist.noPeople');
      personSelect.appendChild(placeholder);
      people.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p.slug;
        opt.textContent = p.name === p.slug ? p.name : `${p.name}（${p.slug}）`;
        personSelect.appendChild(opt);
      });
      const newOption = document.createElement("option");
      newOption.value = "__new__";
      newOption.textContent = t('hist.newPerson');
      personSelect.appendChild(newOption);
      // 新建人物需要姓名 + 目录标识；标记只允许字母数字，避免中文路径与目录穿越。
      const newName = document.createElement("input");
      newName.className = "name";
      newName.placeholder = t('hist.personName');
      newName.dataset.role = "personName";
      newName.classList.add("hidden");
      const newSlug = document.createElement("input");
      newSlug.className = "name";
      newSlug.placeholder = t('hist.personSlug');
      newSlug.dataset.role = "personSlug";
      newSlug.classList.add("hidden");
      const sectionSelect = document.createElement("select");
      sectionSelect.dataset.role = "section";
      sectionSelect.classList.add("hidden");
      const autoOpt = document.createElement("option");
      autoOpt.value = "";
      autoOpt.textContent = LANG === "en" ? "Auto by content" : "自动分节（按内容）";
      sectionSelect.appendChild(autoOpt);
      SECTIONS.forEach(([value, key]) => {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = t('hist.sectionPrefix', {name: t(key)});
        sectionSelect.appendChild(opt);
      });
      headRow.append(check, label, target, personSelect, sectionSelect, newName, newSlug);

      const text = document.createElement("textarea");
      text.value = item.text;
      text.dataset.role = "text";
      const src = el("div", "src", t('hist.candSource', {
        seg: item.source.segmentIndex + 1,
        clock: item.source.clock,
        spk: item.source.speakerId,
        quote: item.source.quote,
      }));
      box.append(headRow, text, src);
      host.appendChild(box);
      const row = {item, check, target, personSelect, sectionSelect, newName, newSlug, text};
      rows.push(row);

      check.addEventListener("change", () => { if (check.checked && target.value === "skip") target.value = "self"; });
      const syncPersonUi = () => {
        const isPerson = target.value === "person";
        personSelect.classList.toggle("hidden", !isPerson);
        sectionSelect.classList.toggle("hidden", !isPerson);
        const isNew = isPerson && personSelect.value === "__new__";
        newName.classList.toggle("hidden", !isNew);
        newSlug.classList.toggle("hidden", !isNew);
      };
      target.addEventListener("change", syncPersonUi);
      personSelect.addEventListener("change", () => {
        syncPersonUi();
        if (personSelect.value) check.checked = true;
      });
      newName.addEventListener("input", () => { if (newName.value.trim()) check.checked = true; });
    });

    // 回填上一轮的勾选 / 编辑内容（数量一致时按位置对应）。
    if (snapshot.length === rows.length) {
      rows.forEach((r, i) => {
        const s = snapshot[i];
        if (!s) return;
        r.check.checked = s.checked;
        r.target.value = s.target;
        r.personSelect.value = s.person;
        r.sectionSelect.value = s.section;
        r.newName.value = s.name;
        r.newSlug.value = s.slug;
        r.text.value = s.text;
        r.target.dispatchEvent(new Event("change"));
      });
    }

    // 一次映射整段会话：不用逐句选人；spk → 对方/我 只需确认一次。
    const mapSpeakers = (review.summary && Array.isArray(review.summary.speakers))
      ? review.summary.speakers : [];
    const personFromUrl = new URLSearchParams(location.search).get("person")
      || (function(){try{return sessionStorage.getItem("sm-person")||""}catch{return ""}})();
    const mapping = {};
    const mapPanel = el("div", "row");
    mapPanel.style.marginTop = "10px";
    mapPanel.dataset.role = "speakerMap";
    const mapTitle = el("div", "hint",
      LANG === "en"
        ? "One-time speaker mapping: assign each cluster to the other person or to me; it applies to the whole session."
        : "说话人一次性映射：把每个聚类指给对方或我；对整段会话生效，不再逐句选人。");
    mapPanel.appendChild(mapTitle);
    mapSpeakers.forEach((spk, i) => {
      const wrap = el("span", "row");
      wrap.style.marginRight = "12px";
      const lbl = el("span", "src", (LANG === "en" ? "Speaker " : "说话人 ") + spk + " = ");
      const sel = document.createElement("select");
      sel.dataset.speaker = spk;
      const meOpt = document.createElement("option");
      meOpt.value = "self";
      meOpt.textContent = t('hist.saveSelf');
      sel.appendChild(meOpt);
      const emptyOpt = document.createElement("option");
      emptyOpt.value = "";
      emptyOpt.textContent = LANG === "en" ? "Not assigned" : "不归属";
      sel.appendChild(emptyOpt);
      people.forEach((pp) => {
        const opt = document.createElement("option");
        opt.value = pp.slug;
        opt.textContent = pp.name === pp.slug ? pp.name : `${pp.name}（${pp.slug}）`;
        sel.appendChild(opt);
      });
      const preferred = i === 0 ? (personFromUrl || "self") : "self";
      sel.value = people.some((pp) => pp.slug === preferred) ? preferred : "self";
      if (sel.value) mapping[spk] = sel.value;
      sel.addEventListener("change", () => {
        if (sel.value) mapping[spk] = sel.value; else delete mapping[spk];
      });
      wrap.append(lbl, sel);
      mapPanel.appendChild(wrap);
    });
    const applyMap = el("button", "", LANG === "en" ? "Apply mapping to candidates" : "把映射应用到候选");
    applyMap.style.marginTop = "6px";
    applyMap.addEventListener("click", () => {
      rows.forEach((r) => {
        const spk = r.item.source && r.item.source.speakerId;
        const target = mapping[spk];
        if (!target) return;
        r.target.value = target === "self" ? "self" : "person";
        if (target !== "self") r.personSelect.value = target;
        r.sectionSelect.value = "";
        r.check.checked = true;
        r.target.dispatchEvent(new Event("change"));
      });
      saveStatus.textContent = LANG === "en" ? "Mapping applied; review and save." : "映射已应用到候选；请核对后保存。";
      saveStatus.className = "status";
    });
    mapPanel.appendChild(applyMap);
    host.appendChild(mapPanel);

    const tools = el("div", "row");
    tools.style.marginTop = "10px";
    const pickAll = el("button", "", t('hist.pickAll'));
    const save = el("button", "primary", t('hist.saveAll'));
    tools.append(pickAll, save);
    host.appendChild(tools);
    const saveStatus = el("div", "status", t('hist.saveIdle'));
    host.appendChild(saveStatus);
    host.appendChild(el("p", "hint", t('hist.saveHint')));

    pickAll.addEventListener("click", () => {
      rows.forEach((r) => {
        if (r.target.value === "skip") r.target.value = "self";
        r.check.checked = true;
      });
      saveStatus.textContent = t('hist.picked', {n: rows.length});
      saveStatus.className = "status";
    });

    save.addEventListener("click", async () => {
      const items = [];
      for (const r of rows) {
        if (!r.check.checked || r.target.value === "skip") continue;
        const isNew = r.personSelect.value === "__new__";
        if (r.target.value === "person" && !r.personSelect.value) {
          saveStatus.textContent = t('hist.errNeedPerson');
          saveStatus.className = "status err";
          return;
        }
        if (isNew) {
          const name = r.newName.value.trim();
          const slug = r.newSlug.value.trim();
          if (!name) {
            saveStatus.textContent = t('hist.errNeedName');
            saveStatus.className = "status err";
            return;
          }
          if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/.test(slug)) {
            saveStatus.textContent = t('hist.errSlug');
            saveStatus.className = "status err";
            return;
          }
        }
        items.push({
          kind: r.target.value,
          // 新建人物时提交用户填的目录标识，不能把下拉里的哨兵值 "__new__" 当 slug 传上去。
          peopleSlug: r.target.value !== "person" ? undefined : (isNew ? r.newSlug.value.trim() : r.personSelect.value),
          createPerson: isNew ? true : undefined,
          personName: isNew ? r.newName.value.trim() : undefined,
          section: r.target.value === "person" && r.sectionSelect.value ? r.sectionSelect.value : undefined,
          speakerId: r.item.source.speakerId,
          text: r.text.value.trim(),
          originalText: r.item.text,
          segmentIndex: r.item.source.segmentIndex,
        });
      }
      if (!items.length) {
        saveStatus.textContent = t('hist.nothingPicked');
        saveStatus.className = "status";
        return;
      }
      save.disabled = true;
      saveStatus.textContent = t('hist.writing');
      saveStatus.className = "status";
      try {
        const result = await postJson("api/review/apply", {
          confirm: true, sessionId: session.sessionId, items,
          speakerMap: Object.keys(mapping).length ? mapping : undefined,
        });
        if (result.unchanged) {
          saveStatus.textContent = t('hist.saveUnchanged', {
            reasons: (result.skipped || []).map((x) => x.reason).join("/"),
          });
        } else {
          const parts = [];
          if (result.added.stories) parts.push(t('hist.addedStories', {n: result.added.stories}));
          if (result.added.notes) parts.push(t('hist.addedNotes', {n: result.added.notes}));
          const peopleAdded = (result.people && result.people.added) || [];
          if (peopleAdded.length) parts.push(t('hist.addedPeople', {
            n: peopleAdded.length,
            list: peopleAdded.map((p) => p.slug + ":" + p.section).join(LANG === 'en' ? ", " : "、"),
          }));
          const peopleCreated = (result.people && result.people.created) || [];
          if (peopleCreated.length) parts.push(t('hist.createdPeople', {
            list: peopleCreated.join(LANG === 'en' ? ", " : "、"),
          }));
          const dup = (result.skipped || []).filter((x) => x.reason === "DUPLICATE").length;
          saveStatus.textContent = t('hist.saved', {
            parts: parts.join(" · ") || t('hist.none'),
            time: result.updatedAt,
          }) + (dup ? t('hist.deduped', {n: dup}) : "");
        }
        const notWritten = (result.skipped || []).filter((x) => x.reason !== "DUPLICATE");
        if (notWritten.length) {
          saveStatus.textContent += t('hist.notWritten', {list: notWritten.map((x) => x.reason).join("/")});
        }
        saveStatus.className = "status ok";
      } catch (e) {
        saveStatus.textContent = e.status === 401 ? t('hist.errSave401')
          : e.status === 404 ? t('hist.errSave404')
          : e.status === 429 ? t('hist.errSave429')
          : e.status === 409 ? t('hist.errSave409')
          : t('hist.errSave', {msg: e.message});
        saveStatus.className = "status err";
      } finally {
        save.disabled = false;
      }
    });
  }

  // 人物筛选只给真实存在的人物主档；读不到时保留「全部」，不阻断搜索。
  async function loadPeopleOptions() {
    if (peopleLoaded) return;
    try {
      const res = await fetch(url("api/people"), {headers: {"x-archive-token": token}, cache: "no-store"});
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const sel = $("person");
      (Array.isArray(data.people) ? data.people : []).forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p.slug;
        opt.textContent = p.name === p.slug ? p.slug : `${p.name}（${p.slug}）`;
        sel.appendChild(opt);
      });
      peopleLoaded = true;
    } catch {
      // 静默降级：人物主档不可用时仍可按关键词与日期搜索。
    }
  }

  // reset=true 重新搜索；reset=false 用 cursor 追加下一页。
  async function search(reset = true) {
    setStatus("listStatus", reset ? 'hist.loading' : 'hist.loadingMore');
    try {
      const params = new URLSearchParams();
      const q = $("q").value.trim();
      if (q) params.set("q", q);
      if ($("person").value) params.set("person", $("person").value);
      if ($("from").value) params.set("from", $("from").value);
      if ($("to").value) params.set("to", $("to").value);
      params.set("limit", $("limit").value || "20");
      if (!reset && nextCursor) params.set("cursor", nextCursor);
      const data = await api("api/archive/sessions?" + params.toString());
      items = reset ? (data.items || []).slice() : items.concat(data.items || []);
      renderList(data);
      setStatus("listStatus", null);
      LAST.detail = null;
      $("detail").classList.add("hidden");
      $("list").classList.remove("hidden");
      return true;
    } catch (e) {
      setStatus("listStatus", e.status === 401 ? 'hist.errToken401'
        : e.status === 400 ? 'hist.errBadQuery'
        : 'hist.errRead', "err", e.status === 400 ? {msg: e.message} : {msg: e.message || ""});
      return false;
    }
  }

  // ── 语言切换 ────────────────────────────────────────────────────────────
  // 只改本页 DOM；写回 alw-preview-v1.lang，主页面与归档页读的是同一个字段。
  let LAST = {list: null, detail: null};

  function applyStaticText() {
    $("hTitle").textContent = t('hist.title');
    $("hSub").textContent = t('hist.sub');
    $("langbar").setAttribute("aria-label", t('hist.langLabel'));
    $("langSys").textContent = t('hist.langSystem');
    $("tokenLabel").textContent = t('hist.tokenLabel');
    $("token").placeholder = t('hist.tokenPlaceholder');
    $("connect").textContent = t('hist.connect');
    $("forget").textContent = t('hist.forget');
    $("tokenHint").textContent = t('hist.tokenHint');
    $("qLabel").textContent = t('hist.qLabel');
    $("q").placeholder = t('hist.qPlaceholder');
    $("personLabel").textContent = t('hist.personLabel');
    $("personAll").textContent = t('hist.allPeople');
    $("limitLabel").textContent = t('hist.limitLabel');
    document.querySelectorAll("#limit option").forEach((o) => {
      o.textContent = t('hist.limitN', {n: o.dataset.n});

    $("fromLabel").textContent = t('hist.fromLabel');

    $("search").textContent = t('hist.search');

    $("clear").textContent = t('hist.clear');
    $("export").textContent = t('hist.export');
    $("dateHint").textContent = t('hist.dateHint');
    $("moreBtn").textContent = t('hist.more');
  }

  function syncLangButtons(pref) {
    document.querySelectorAll("#langbar button").forEach((b) => {
      const on = b.dataset.lang === pref;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function applyLang(pref) {
    const p = pref || readLangPref();
    const sys = (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    LANG = p === 'system' ? sys : (p === 'en' ? 'en' : 'zh');
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
    document.title = t('hist.docTitle');
    applyStaticText();
    syncLangButtons(p);
    Object.keys(STATUS).forEach(paintStatus);
    stashReviewRows();
    if (LAST.list) renderList(LAST.list);
    if (LAST.detail) renderDetail(LAST.detail);
  }

  document.querySelectorAll("#langbar button").forEach((b) => {
    b.addEventListener("click", () => {
      const p = b.dataset.lang;
      writeLangPref(p);
      applyLang(p);
    });
  });
  // 主页面在另一个标签页改语言时，这里同步跟上。
  window.addEventListener("storage", (e) => {
    if (e.key === LANG_KEY) applyLang();
  });

  $("connect").addEventListener("click", async () => {
    const v = $("token").value.trim() || token;
    if (!v) return setStatus("authStatus", 'hist.needToken', "err");
    token = v;
    try {
      const health = await fetch(url("api/archive/health"), {cache: "no-store"}).then((r) => r.json());
      if (!health?.ok) throw new Error(t('hist.notReady'));
    } catch (e) {
      return setStatus("authStatus", 'hist.connectFail', "err", {msg: e.message});
    }
    if (await search(true)) {
      try { sessionStorage.setItem(KEY, token); } catch {}
      setStatus("authStatus", 'hist.connected', "ok");
      $("token").value = "";
      loadPeopleOptions();
      maybeDeepLink();
    } else {
      setStatus("authStatus", 'hist.tokenBad', "err");
    }
  });

  // 停止录音后 App 会带 ?session=<sessionId> 打开本页，直接落到本轮原文与复盘。
  function maybeDeepLink() {
    const wanted = new URLSearchParams(location.search).get("session");
    if (!wanted) return;
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(wanted)) {
      setStatus("listStatus", 'hist.badSessionId', "err");
      return;
    }
    openDetail(wanted);
    history.replaceState(null, "", location.pathname);
  }

  $("forget").addEventListener("click", () => {
    token = "";
    items = [];
    nextCursor = null;
    LAST.list = null;
    LAST.detail = null;
    try { sessionStorage.removeItem(KEY); } catch {}
    $("token").value = "";
    $("list").innerHTML = "";
    $("more").classList.add("hidden");
    $("detail").classList.add("hidden");
    setStatus("authStatus", 'hist.tokenCleared');
    setStatus("listStatus", null);
  });

  $("search").addEventListener("click", () => search(true));
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(true); });
  $("person").addEventListener("change", () => search(true));
  $("limit").addEventListener("change", () => search(true));
  $("moreBtn").addEventListener("click", () => search(false));
  $("clear").addEventListener("click", () => {
    $("q").value = "";
    $("person").value = "";
    $("from").value = "";
    $("to").value = "";
    search(true);
  });
  $("today").addEventListener("click", () => {
    const d = new Date().toISOString().slice(0, 10);
    $("from").value = d;
    $("to").value = d;
    search(true);
  });

  $("export").addEventListener("click", async () => {
    setStatus("listStatus", 'hist.exporting');
    try {
      const res = await fetch(url("api/archive/export") + rangeQuery(), {
        headers: {"x-archive-token": token}, cache: "no-store",
      });
      if (res.status === 401) throw new Error(t('hist.err401'));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (!text.trim()) throw new Error(t('hist.exportEmpty'));
      const blob = new Blob([text], {type: "text/markdown;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const r = rangeQuery().replace("?", "").replace(/&/g, "_") || "all";
      a.href = url;
      a.download = t('hist.exportName', {range: r});
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setStatus("listStatus", 'hist.exported', "ok", {kb: (text.length / 1024).toFixed(1)});
    } catch (e) {
      setStatus("listStatus", 'hist.exportFail', "err", {msg: e.message});
    }
  });

  // 旧版本曾把令牌长期存在 localStorage：这里只做一次清理，不再写入。
  try { localStorage.removeItem(KEY); } catch {}

  applyLang();

  // 只在本次会话里恢复：sessionStorage 关闭标签页即清空。
  let saved = "";
  try { saved = sessionStorage.getItem(KEY) || ""; } catch { saved = ""; }
  if (saved) {
    token = saved;
    search(true).then((ok) => {
      setStatus("authStatus", ok ? 'hist.restored' : 'hist.restoreExpired', ok ? "ok" : "err");
      if (ok) { loadPeopleOptions(); maybeDeepLink(); }
    });
  }
})();
</script>
</body>
</html>
