name: alw-001-foreign-language-social-system

services:
  socialmate:
    image: socialmate:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmate
    init: true
    restart: unless-stopped
    user: "${APP_UID:-501}:${APP_GID:-20}"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      SOCIALMATE_DATA_DIR: /data
    ports:
      - "127.0.0.1:${APP_PORT:-4173}:4173"
    volumes:
      - type: bind
        source: ${APP_DATA_DIR:?Set APP_DATA_DIR in .env.local}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
